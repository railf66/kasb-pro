mascot(mood){return person(mood,{
  body:`<path d="M30 150q0-26 40-26t40 26z" fill="#1e5aa8"/><path d="M50 128v22M90 128v22" stroke="#123047" stroke-width="7"/><circle cx="50" cy="134" r="3" fill="#f2c400"/><circle cx="90" cy="134" r="3" fill="#f2c400"/>`,
  hat:`<path d="M28 58q2-38 42-38t42 38z" fill="#29b0d6"/><path d="M28 56q42 -6 84 0l14 6q-56-6-98-2z" fill="#1a8fb3"/><rect x="62" y="28" width="16" height="12" rx="3" fill="#fff"/><path d="M66 34h8" stroke="#1e5aa8" stroke-width="3" stroke-linecap="round"/>`})},
scene(G){
  const P=G.panel,mods=P.src.filter(t=>t.m);const n=mods.length;const step=300/n;const y=G.panel.kind==='sewer'?96:92;
  const full=G.complete;let s='',pipes='';
  const wall=`<rect x="2" y="2" width="336" height="176" rx="12" fill="var(--box)"/><rect x="10" y="10" width="320" height="160" rx="8" fill="var(--plate)"/>`+
    [0,1,2,3].map(r=>`<path d="M10 ${50+r*36}H330" stroke="var(--box)" stroke-width="1"/>`).join('')+[0,1,2,3,4,5,6,7].map(c=>`<path d="M${30+c*40} 10V170" stroke="var(--box)" stroke-width="1" opacity=".6"/>`).join('');
  const pipeY=x=>P.kind==='sewer'?y-20+ (x-20)*0.12:y;
  const x0=20,x1=320;
  pipes=`<path d="M${x0} ${pipeY(x0)}L${x1} ${pipeY(x1)}" stroke="var(--rail)" stroke-width="12" stroke-linecap="round"/>`;
  if(full)pipes+=`<path class="flow" d="M${x0} ${pipeY(x0)}L${x1} ${pipeY(x1)}" stroke="${P.kind==='sewer'?'#8a6d3b':'#3a9be8'}" stroke-width="6" stroke-linecap="round"/>`;
  mods.forEach((t,i)=>{const cx=x0+step*(i+.5)+ (300-step*n)/2,cy=pipeY(cx);const placed=G.placed.includes(t),cur=t===G.task&&!G.complete;
    if(placed)s+=`<g${t===G.justPlaced?' class="newmod"':''}>${part(t.m.k,cx,cy)}<text x="${cx}" y="${cy+(i%2?56:44)}" font-size="${tr(t.m.s).length>9?8.5:9.5}" text-anchor="middle" fill="var(--fg)" font-family="Golos Text,system-ui" font-weight="600">${tr(t.m.s)}</text></g>`;
    else s+=`<rect${cur?' class="slot"':''} x="${cx-step/2+3}" y="${cy-30}" width="${step-6}" height="62" rx="6" fill="none" stroke="${cur?'var(--accent)':'var(--rail)'}" stroke-width="${cur?2.5:1.2}" stroke-dasharray="5 4"/>`});
  const label=P.kind==='sewer'?`<text x="318" y="24" font-size="9" text-anchor="end" fill="var(--muted)">→ ${lang==='uz'?'kanalizatsiya':'канализация'}</text>`:`<text x="22" y="164" font-size="9" fill="var(--muted)">${lang==='uz'?'suv →':'вода →'}</text>`;
  return `<svg viewBox="0 0 340 180" role="img" aria-label="${tr(P.name)}">${wall}${pipes}${s}${label}</svg>`}
};
/* plumbing parts, our own simple drawings, centred on the pipe at (x,y) */
function part(k,x,y){const B='#c9a227',BD='#8a6d1a',W='#fbfcfd',L='#8d98a4';
  const body=(w,h,c=B,d=BD)=>`<rect x="${x-w/2}" y="${y-h/2}" width="${w}" height="${h}" rx="4" fill="${c}" stroke="${d}" stroke-width="1.5"/>`;
  switch(k){
  case 'valve':return body(28,16)+`<rect x="${x-3}" y="${y-22}" width="6" height="10" fill="${BD}"/><rect x="${x-3}" y="${y-26}" width="24" height="7" rx="3" fill="#d33b2f"/>`;
  case 'filter':return body(28,16)+`<path d="M${x-4} ${y+6}l10 18h8l-10-18z" fill="${B}" stroke="${BD}" stroke-width="1.5"/><rect x="${x+4}" y="${y+22}" width="12" height="6" rx="2" fill="${BD}"/>`;
  case 'meter':return body(30,14)+`<circle cx="${x}" cy="${y-16}" r="14" fill="${W}" stroke="#1e6fd0" stroke-width="3"/><rect x="${x-9}" y="${y-21}" width="18" height="7" rx="1" fill="#14202b"/><text x="${x}" y="${y-15.5}" font-size="6" fill="#7fe07f" text-anchor="middle" font-family="monospace">0123</text><path d="M${x} ${y-10}l5-3" stroke="#d33b2f" stroke-width="1.5"/>`;
  case 'check':return body(30,18)+`<path d="M${x-9} ${y}h12M${x+1} ${y-6}l7 6-7 6" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>`;
  case 'reducer':return body(28,18)+`<rect x="${x-4}" y="${y-20}" width="8" height="10" fill="${BD}"/><circle cx="${x}" cy="${y-26}" r="10" fill="${W}" stroke="${L}" stroke-width="2.5"/><path d="M${x} ${y-26}l5-5" stroke="#d33b2f" stroke-width="2"/>`;
  case 'pp':return `<rect x="${x-18}" y="${y-8}" width="36" height="16" rx="3" fill="#f4f6f8" stroke="${L}" stroke-width="1.5"/><rect x="${x-6}" y="${y-11}" width="12" height="22" rx="3" fill="#e9edf1" stroke="${L}" stroke-width="1.5"/><path d="M${x-14} ${y+16}q4-6 0-12M${x+14} ${y+16}q4-6 0-12" fill="none" stroke="#ff8a1a" stroke-width="2" opacity=".8"/>`;
  case 'collector':return `<rect x="${x-20}" y="${y-8}" width="40" height="16" rx="4" fill="${B}" stroke="${BD}" stroke-width="1.5"/>`+[-12,0,12].map(d=>`<rect x="${x+d-3}" y="${y+8}" width="6" height="14" fill="${BD}"/><rect x="${x+d-5}" y="${y+20}" width="10" height="5" rx="2" fill="#1e6fd0"/>`).join('');
  case 'safety':return body(22,16)+`<rect x="${x-4}" y="${y-20}" width="8" height="12" rx="2" fill="${BD}"/><rect x="${x-10}" y="${y-24}" width="20" height="6" rx="3" fill="#f2c400"/><path d="M${x} ${y+8}v10" stroke="${L}" stroke-width="3"/><path class="drip" d="M${x} ${y+20}q-3 5 0 7 3-2 0-7z" fill="#3a9be8"/>`;
  case 'drain':return `<path d="M${x-8} ${y-14}h16l-5 12v18h-6v-18z" fill="#e9edf1" stroke="${L}" stroke-width="1.5"/><path class="drip" d="M${x} ${y-24}q-3 5 0 7 3-2 0-7z" fill="#3a9be8"/>`;
  case 'boiler':return `<rect x="${x-17}" y="${y-30}" width="34" height="58" rx="12" fill="${W}" stroke="${L}" stroke-width="2"/><circle cx="${x}" cy="${y-6}" r="6" fill="none" stroke="#d33b2f" stroke-width="2"/><path d="M${x} ${y-9}v4" stroke="#d33b2f" stroke-width="2"/><rect x="${x-8}" y="${y+12}" width="16" height="4" rx="2" fill="#3a9be8"/>`;
  case 'mixer':return `<rect x="${x-6}" y="${y-8}" width="12" height="18" rx="3" fill="#d6dbe0" stroke="${L}" stroke-width="1.5"/><path d="M${x} ${y-8}v-12h14v6" fill="none" stroke="${L}" stroke-width="5" stroke-linecap="round"/><rect x="${x-10}" y="${y-26}" width="16" height="5" rx="2.5" fill="${L}"/><path d="M${x-5} ${y+10}v14" stroke="#d33b2f" stroke-width="3"/><path d="M${x+5} ${y+10}v14" stroke="#1e6fd0" stroke-width="3"/>`;
  case 'hose':return `<path d="M${x-16} ${y}q4-10 8 0t8 0 8 0 8 0" fill="none" stroke="#b7bfc8" stroke-width="7" stroke-linecap="round"/><rect x="${x-20}" y="${y-6}" width="8" height="12" rx="2" fill="${B}"/><rect x="${x+12}" y="${y-6}" width="8" height="12" rx="2" fill="${B}"/>`;
  case 'loop':return `<path d="M${x-16} ${y-20}h30v8h-30v8h30v8h-30v8h30" fill="none" stroke="#e8743b" stroke-width="3.5" stroke-linejoin="round"/>`;
  case 'pipe':return `<rect x="${x-18}" y="${y-8}" width="36" height="16" rx="3" fill="#8f9aa6" stroke="#5d6b78" stroke-width="1.5"/><path d="M${x-10} ${y+18}l20 4" stroke="var(--accent)" stroke-width="2"/><text x="${x}" y="${y+3}" font-size="7" fill="#fff" text-anchor="middle">3 см/м</text>`;
  case 'toilet':return `<path d="M${x-14} ${y-30}h22v14h-22z" fill="${W}" stroke="${L}" stroke-width="1.5"/><path d="M${x-16} ${y-16}h30q0 18-12 22v8h-10v-8q-8-6-8-22z" fill="${W}" stroke="${L}" stroke-width="1.5"/>`;
  case 'siphon':return `<path d="M${x-3} ${y-24}v12" stroke="${L}" stroke-width="5"/><rect x="${x-9}" y="${y-12}" width="18" height="26" rx="8" fill="#e9edf1" stroke="${L}" stroke-width="1.5"/><rect x="${x-7}" y="${y+2}" width="14" height="10" rx="5" fill="#3a9be8" opacity=".6"/>`;
  case 'washer':return `<rect x="${x-17}" y="${y-28}" width="34" height="40" rx="4" fill="${W}" stroke="${L}" stroke-width="1.5"/><circle cx="${x}" cy="${y-5}" r="10" fill="#cfe6f7" stroke="${L}" stroke-width="2"/><rect x="${x-13}" y="${y-25}" width="10" height="4" rx="1" fill="${L}"/>`;
  }return body(24,16)}


const U=()=>CFG.UI[lang];
const PANELS=CFG.PANELS;

/* ---------- game state ---------- */
let G=null,timer=null;
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
const NP=PANELS.length,ORDER=[...Array(NP).keys()];
function newGame(){
  G={score:0,lives:3,combo:0,t:GAME_TIME,right:0,total:0,panels:0,pn:0,order:shuffle(ORDER),busy:false};
  loadPanel();render();
  clearInterval(timer);let last=Date.now();
  timer=setInterval(()=>{const now=Date.now(),dt=(now-last)/1000;last=now;if(G.busy||document.hidden)return;
    G.t-=dt;if(G.t<=0){G.t=0;end('time')}else paintTime()},200)}
function loadPanel(){
  if(G.pn>0&&G.pn%NP===0)G.order=shuffle(ORDER);
  const P=PANELS[G.order[G.pn%NP]];
  G.panel={name:P.name,kind:P.kind,src:P.tasks,tasks:shuffle(P.tasks)};G.ti=0;G.complete=false;G.placed=[];G.justPlaced=null;nextTask(true)}
function nextTask(first){
  if(!first)G.ti++;
  if(G.ti>=G.panel.tasks.length){G.complete=true;G.panels++;G.score+=300;toast(U().built);haptic('success');G.pn++;G.busy=true;
    render();setTimeout(()=>{if(!G||G.over)return;G.busy=false;loadPanel();render()},1300);return}
  G.task=G.panel.tasks[G.ti];
  G.opts=shuffle(G.task.o.map((o,i)=>({o,ok:i===0})));G.shown=Date.now()}

/* ---------- screens ---------- */
const app=document.getElementById('app');
const $=s=>document.querySelector(s);
function bar(){const L=U();return `<header class="bar"><a href="../">${L.back}</a><div class="ttl">${CFG.icon} ${L.title}</div><div class="lang" role="group" aria-label="Til"><button type="button" data-l="ru" aria-pressed="${lang==='ru'}">RU</button><button type="button" data-l="uz" aria-pressed="${lang==='uz'}">UZ</button></div></header>`}
function bindBar(){document.querySelectorAll('[data-l]').forEach(b=>b.onclick=()=>{lang=b.dataset.l;store.set('ep_lang',JSON.stringify(lang));document.documentElement.lang=lang;render()})}
let screen='start',result=null;
function render(){document.documentElement.lang=lang;
  if(screen==='start')startScr();else if(screen==='game')gameScr();else endScr();bindBar()}
function startScr(){const L=U();const best=+store.get(CFG.bestKey)||0;
  app.innerHTML=bar()+`<main class="wrap"><div class="hero">${CFG.mascot('ok')}</div><h1>${L.h1}</h1><p class="lead">${L.lead}</p>
  <div class="card"><ul class="rules">${L.r.map(r=>`<li><span>${r[0]}</span><div>${r[1]}</div></li>`).join('')}</ul></div>
  ${best?`<div class="best">${L.best}: <b>${best}</b></div>`:''}
  <button class="btn" id="play" type="button">${L.play}</button><p class="small">${L.safe}</p></main>`;
  $('#play').onclick=()=>{screen='game';newGame()}}
function gameScr(){const L=U();const t=G.task;
  const opts=G.opts.map((x,i)=>`<button class="opt" type="button" data-i="${i}"><span>${tr(x.o)}</span></button>`).join('');
  app.innerHTML=bar()+`<main class="wrap" id="gw">
  <div class="hud"><span class="sc" id="sc">${G.score}</span><span class="lv" aria-label="lives">${[0,1,2].map(i=>`<i class="${i<G.lives?'':'off'}">${CFG.life}</i>`).join('')}</span><span class="tm" id="tm"></span></div>
  <div class="tbar"><i id="tb"></i></div>
  <div class="pname"><span>${L.panel(G.complete?G.panels:G.panels+1,tr(G.panel.name))}</span>${G.combo>1?`<span class="combo">${L.combo(Math.min(G.combo,5))}</span>`:''}</div>
  <div class="panel">${CFG.scene(G)}</div>
  ${G.complete?'':`<p class="q">${tr(t.q)}</p><div class="opts">${opts}</div>`}</main>`;
  G.justPlaced=null;paintTime();
  document.querySelectorAll('[data-i]').forEach(b=>b.onclick=()=>answer(+b.dataset.i,b))}
function paintTime(){const tm=$('#tm'),tb=$('#tb');if(!tm)return;const s=Math.ceil(G.t);
  tm.textContent=`${Math.floor(s/60)}:${String(s%60).padStart(2,'0')}`;tm.classList.toggle('low',s<=15);
  tb.style.width=(G.t/GAME_TIME*100)+'%';tb.classList.toggle('low',s<=15)}
function answer(i,btn){if(G.busy)return;const x=G.opts[i],t=G.task;G.total++;
  if(x.ok){G.right++;G.combo++;const fast=(Date.now()-G.shown)<5000;
    const pts=100+25*Math.min(G.combo-1,4)+(fast?50:0);G.score+=pts;
    if(t.m){G.placed.push(t);G.justPlaced=t}
    btn.classList.add('right');floatTxt('+'+pts);haptic('light');G.busy=true;
    setTimeout(()=>{if(G.over)return;G.busy=false;nextTask();if(!G.complete)render()},380)}
  else{G.combo=0;G.lives--;G.busy=true;G.panel.tasks.push(t); // wrong task comes back later in this panel
    haptic('error');failFx(t)}}
function failFx(t){const L=U();const F=CFG.FX[t.fx]||CFG.FX[Object.keys(CFG.FX)[0]];
  const f=document.createElement('div');f.className='flash'+(F.strobe?' strobe':'');f.style.setProperty('--fc',F.color);document.body.appendChild(f);setTimeout(()=>f.remove(),1000);
  const gw=$('#gw');if(gw){gw.classList.add('shake')}
  const titles=F[lang]||F.ru;const title=titles[Math.random()*titles.length|0];
  const ov=document.createElement('div');ov.className='ov';
  ov.innerHTML=`<div class="sheet" role="alertdialog" aria-live="assertive"><div class="who">${CFG.mascot(F.mood)}<h2>${title}</h2></div>
  <p class="ans">${L.right} <b>${tr(t.o[0])}</b></p><p class="why">${tr(t.e)}</p><button class="btn" type="button" id="ovn">${L.next}</button></div>`;
  setTimeout(()=>{document.body.appendChild(ov);$('#ovn').focus()},350);
  ov.querySelector('#ovn').onclick=()=>{ov.remove();G.busy=false;if(G.lives<=0){end('lives');return}nextTask();if(!G.complete)render()}}
function floatTxt(s){const d=document.createElement('div');d.className='float';d.textContent=s;document.body.appendChild(d);setTimeout(()=>d.remove(),800)}
function toast(s){const d=document.createElement('div');d.className='toast';d.textContent=s;document.body.appendChild(d);setTimeout(()=>d.remove(),1200)}
function haptic(k){try{const h=tg&&tg.HapticFeedback;if(!h)return;if(k==='light')h.impactOccurred('light');else h.notificationOccurred(k)}catch(e){}}
function end(why){if(!G||G.over)return;G.over=true;clearInterval(timer);
  document.querySelectorAll('.ov').forEach(o=>o.remove());
  const prev=+store.get(CFG.bestKey)||0;const rec=G.score>prev;if(rec)store.set(CFG.bestKey,G.score);
  result={score:G.score,panels:G.panels,right:G.right,total:G.total,why,rec,best:Math.max(prev,G.score)};
  screen='end';render()}
function rankOf(s){return s<1200?0:s<2400?1:s<3600?2:3}
function endScr(){const L=U(),r=result;const acc=r.total?Math.round(r.right/r.total*100):0;
  app.innerHTML=bar()+`<main class="wrap"><div class="hero">${CFG.mascot(r.why==='lives'?CFG.FX[Object.keys(CFG.FX)[0]].mood:'ok')}</div>
  <h1>${r.why==='lives'?L.overLives:L.over}</h1>
  <div class="big">${r.score}</div><div class="center"><span class="rank">${L.ranks[rankOf(r.score)]}</span></div>
  ${r.rec&&r.score>0?`<p class="lead"><b>🏆 ${L.rec}</b></p>`:`<div class="best">${L.best}: <b>${r.best}</b></div>`}
  <div class="stats"><div><b>${r.score}</b><span>${L.score}</span></div><div><b>${r.panels}</b><span>${L.panels}</span></div><div><b>${acc}%</b><span>${L.acc}</span></div></div>
  <button class="btn tg" id="share" type="button">📤 ${L.share}</button>
  <button class="btn" id="again" type="button">${L.again}</button>
  <a class="btn ghost" href="../">📘 ${L.learn}</a></main>`;
  $('#again').onclick=()=>{screen='game';newGame()};
  $('#share').onclick=share}
function share(){const r=result;const url=`https://t.me/${BOT}?start=${CFG.start}`;
  const link=`https://t.me/share/url?url=${encodeURIComponent(url)}&text=${encodeURIComponent(U().shareText(r.score,r.panels))}`;
  try{if(tg&&tg.initData&&tg.openTelegramLink){tg.openTelegramLink(link);return}}catch(e){}
  window.open(link,'_blank','noopener')}
render();
</script>
</body>

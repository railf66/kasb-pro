 steps:{ru:["Найдите краны на вводе в квартиру: обычно в санузле у стояка или в нише за унитазом. Их два: холодная и горячая вода.","Закройте оба: рычаг шарового крана <b>поперёк трубы</b> значит «закрыто».","Откройте смеситель. Вода немного потечёт и остановится: давление ушло, можно работать.","Подставьте ведро и тряпку под место работы: в трубах всегда остаётся вода.","Если кран на вводе не закрывается или течёт, не крутите силой. Звоните в управляющую компанию, чтобы перекрыли стояк."],
       uz:["Kvartiraga kirishdagi jo'mraklarni toping: odatda hojatxonada stoyak yonida yoki unitaz orqasidagi tokchada. Ular ikkita: sovuq va issiq suv.","Ikkalasini yoping: sharli jo'mrak dastasi <b>quvurga ko'ndalang</b> bo'lsa, «yopiq».","Smesitelni oching. Suv biroz oqib to'xtaydi: bosim tushdi, ishlash mumkin.","Ish joyi ostiga chelak va latta qo'ying: quvurlarda doim suv qoladi.","Kirish jo'mragi yopilmasa yoki oqsa, kuch bilan buramang. Stoyakni yopish uchun boshqaruv kompaniyasiga qo'ng'iroq qiling."]},
 tip:{ru:"Старые вентили (с «барашком») годами не крутили. Закрывайте плавно. Если капает из-под штока, подтяните гайку штока на пол-оборота.",uz:"Eski ventillar («barashka»li) yillab buralmagan. Asta yoping. Shtok ostidan tomsa, shtok gaykasini yarim aylanishga torting."},
 quiz:[
  {a:1,ru:{q:"Рычаг шарового крана поперёк трубы. Кран…",o:["Открыт","Закрыт","Наполовину открыт"],e:"Поперёк значит закрыт, вдоль трубы значит открыт."},uz:{q:"Sharli jo'mrak dastasi quvurga ko'ndalang. Jo'mrak…",o:["Ochiq","Yopiq","Yarim ochiq"],e:"Ko'ndalang — yopiq, quvur bo'ylab — ochiq."}},
  {a:2,ru:{q:"Зачем открывать смеситель после закрытия кранов?",o:["Чтобы проверить напор","Так красивее","Чтобы сбросить давление и остаток воды"],e:"Без давления гайки откручиваются без фонтана."},uz:{q:"Jo'mraklarni yopgandan keyin smesitel nima uchun ochiladi?",o:["Bosimni tekshirish uchun","Shunchaki","Bosim va qolgan suvni tushirish uchun"],e:"Bosimsiz gaykalar favvorasiz buraladi."}},
  {a:0,ru:{q:"Кран на вводе не закрывается. Что делать?",o:["Звонить в управляющую компанию, перекрыть стояк","Бить молотком","Работать под давлением"],e:"Стояк перекрывают только через управляющую компанию."},uz:{q:"Kirish jo'mragi yopilmayapti. Nima qilish kerak?",o:["Boshqaruv kompaniyasiga qo'ng'iroq qilib, stoyakni yopish","Bolg'a bilan urish","Bosim ostida ishlash"],e:"Stoyakni faqat boshqaruv kompaniyasi orqali yopishadi."}},
  {a:1,ru:{q:"Сколько кранов обычно на вводе в квартиру?",o:["Один","Два: холодная и горячая","Ни одного"],e:"Отдельно на холодную и на горячую воду."},uz:{q:"Kvartiraga kirishda odatda nechta jo'mrak bor?",o:["Bitta","Ikkita: sovuq va issiq","Birorta ham yo'q"],e:"Sovuq va issiq suvga alohida."}}]},

 t:{ru:"Замена смесителя",uz:"Smesitelni almashtirish"},s:{ru:"Кухонный смеситель на гибких подводках",uz:"Egiluvchan shlangli oshxona smesiteli"},legend:['H','C'],

  R(l,'Смеситель на мойке, две гибкие подводки идут вниз к кранам: горячая слева, холодная справа','Moykadagi smesitel, ikki shlang pastga jo\'mraklarga boradi: issiq chapda, sovuq o\'ngda'),270),
 steps:{ru:["Перекройте воду (урок 2). Под мойкой закройте краны подводок, если они есть.","Открутите гайки подводок от кранов. Снимите крепёжную гайку или шпильку снизу и выньте старый смеситель.","В новый смеситель вкрутите подводки <b>рукой</b> (резьба M10, тонкая: ключом сорвёте). Проденьте их в отверстие мойки.","Поставьте прокладку, закрепите смеситель снизу шпилькой с полукольцом. Носик ровно по центру мойки.","Подключите подводки: горячую слева, холодную справа. Рукой и ключом на ¼ оборота.","Откройте воду медленно. Подержите под гайками сухую салфетку 10 минут: она покажет даже каплю."],
       uz:["Suvni yoping (2-dars). Moyka ostida shlang jo'mraklari bo'lsa, ularni ham yoping.","Shlang gaykalarini jo'mraklardan bo'shating. Pastdan mahkamlash gaykasi yoki shpilkani yechib, eski smesitelni oling.","Yangi smesitelga shlanglarni <b>qo'l bilan</b> buring (M10 rezba, ingichka: kalit bilan buzasiz). Ularni moyka teshigidan o'tkazing.","Prokladka qo'yib, smesitelni pastdan yarim halqali shpilka bilan mahkamlang. Jo'mrak burni moyka markazida.","Shlanglarni ulang: issiqni chapga, sovuqni o'ngga. Qo'l bilan va kalit bilan ¼ aylanish.","Suvni asta oching. Gaykalar ostida 10 daqiqa quruq salfetka tuting: u bir tomchini ham ko'rsatadi."]},
 tip:{ru:"Подводки не должны быть натянуты струной или перекручены. Если не хватает длины, купите длиннее. Удлинять переходниками нельзя.",uz:"Shlanglar tarang tortilgan yoki buralgan bo'lmasligi kerak. Uzunligi yetmasa, uzunrog'ini oling. Perexodniklar bilan uzaytirish mumkin emas."},
 quiz:[
  {a:0,ru:{q:"С какой стороны подключают горячую воду?",o:["Слева","Справа","Без разницы"],e:"Стандарт: горячая слева, холодная справа."},uz:{q:"Issiq suv qaysi tomondan ulanadi?",o:["Chapdan","O'ngdan","Farqi yo'q"],e:"Standart: issiq chapda, sovuq o'ngda."}},
  {a:1,ru:{q:"Как вкручивать подводки в корпус смесителя?",o:["Газовым ключом","Рукой, резьба тонкая","Молотком"],e:"Резьба M10 мягкая, ключом её легко сорвать."},uz:{q:"Shlanglar smesitel korpusiga qanday buraladi?",o:["Gaz kaliti bilan","Qo'l bilan, rezba ingichka","Bolg'a bilan"],e:"M10 rezba yumshoq, kalit bilan oson buziladi."}},
  {a:2,ru:{q:"Подводки не достают до кранов. Что делать?",o:["Натянуть посильнее","Нарастить переходником","Купить подводки длиннее"],e:"Натяжение и лишние соединения — частые причины потопа."},uz:{q:"Shlanglar jo'mraklarga yetmayapti. Nima qilish kerak?",o:["Qattiqroq tortish","Perexodnik bilan uzaytirish","Uzunroq shlang olish"],e:"Taranglik va ortiqcha ulanishlar suv toshqinining tez-tez sababi."}},
  {a:1,ru:{q:"Как проверить, что ничего не течёт?",o:["Посмотреть через день","Сухой салфеткой под гайками","Не проверять"],e:"Салфетка за 10 минут покажет даже маленькую течь."},uz:{q:"Hech narsa oqmayotganini qanday tekshirish mumkin?",o:["Bir kundan keyin qarash","Gaykalar ostida quruq salfetka bilan","Tekshirmaslik"],e:"Salfetka 10 daqiqada kichik oqishni ham ko'rsatadi."}}]},

{id:'b4',lv:0,min:6,
 t:{ru:"Протечки",uz:"Oqishlar"},s:{ru:"Капает кран, течёт гайка, бежит бачок",uz:"Jo'mrak tomadi, gayka oqadi, bachok oqadi"},
 table:{head:{ru:["Что течёт","Причина","Что делать"],uz:["Nima oqadi","Sabab","Nima qilish kerak"]},rows:{
  ru:[["Капает из носика (рычаг)","Износ картриджа","Заменить картридж того же диаметра (35 или 40 мм)"],["Капает из носика (вентили)","Износ кран-буксы или прокладки","Заменить кран-буксу или резинку"],["Течёт гайка подводки","Слабо затянута или лопнула прокладка","Подтянуть на ¼ оборота; не помогло — новая подводка"],["Течёт резьба трубы","Мало или неверно намотан лён/ФУМ","Разобрать, намотать заново по ходу резьбы"],["Вода бежит в унитаз","Сбит поплавок или износ клапана","Отрегулировать поплавок, заменить прокладку клапана"]],
  uz:[["Jo'mrak burnidan tomadi (dastali)","Kartrij yeyilgan","Shu diametrdagi kartrijni almashtirish (35 yoki 40 mm)"],["Burnidan tomadi (ventilli)","Kran-buksa yoki prokladka yeyilgan","Kran-buksa yoki rezinani almashtirish"],["Shlang gaykasi oqadi","Kam tortilgan yoki prokladka yorilgan","¼ aylanish torting; foyda bermasa — yangi shlang"],["Quvur rezbasi oqadi","Zig'ir/FUM kam yoki noto'g'ri o'ralgan","Ochib, rezba yo'nalishida qaytadan o'rash"],["Unitazga suv oqib turadi","Poplavok joyidan siljigan yoki klapan yeyilgan","Poplavokni sozlash, klapan prokladkasini almashtirish"]]}},
 steps:{ru:["Сначала найдите, <b>откуда именно</b> течёт: вытрите всё насухо и смотрите, где появится первая капля.","Перекройте воду и сбросьте давление.","Снимите старую деталь (картридж, кран-буксу) и возьмите её с собой в магазин: так не ошибётесь с размером.","Поставьте новую, затяните без фанатизма, откройте воду медленно и проверьте салфеткой."],
       uz:["Avval <b>aynan qayerdan</b> oqayotganini toping: hammasini quruq arting va birinchi tomchi qayerda chiqishini kuzating.","Suvni yopib, bosimni tushiring.","Eski detalni (kartrij, kran-buksa) yechib, do'konga o'zingiz bilan oling: o'lchamda adashmaysiz.","Yangisini qo'ying, me'yorida qotiring, suvni asta oching va salfetka bilan tekshiring."]},
 tip:{ru:"Течь в бачке незаметна, но за месяц уходит несколько кубов воды. Проверка: капните в бачок немного краски или марганцовки. Если через 15 минут цветная вода в унитазе — клапан пропускает.",uz:"Bachokdagi oqish ko'rinmaydi, lekin bir oyda bir necha kub suv ketadi. Tekshirish: bachokka ozgina bo'yoq yoki margansovka tomizing. 15 daqiqadan keyin unitazda rangli suv bo'lsa — klapan o'tkazyapti."},
 quiz:[
  {a:1,ru:{q:"Однорычажный смеситель капает из носика. Что менять?",o:["Подводки","Картридж","Весь смеситель сразу"],e:"В рычажном смесителе за закрытие отвечает картридж."},uz:{q:"Bir dastali smesitel burnidan tomyapti. Nimani almashtirish kerak?",o:["Shlanglarni","Kartrijni","Butun smesitelni"],e:"Dastali smesitelda yopilish uchun kartrij javob beradi."}},
  {a:0,ru:{q:"Как не ошибиться с размером картриджа?",o:["Взять старый с собой в магазин","Купить самый большой","Спросить соседа"],e:"Картриджи бывают 35 и 40 мм и разной высоты."},uz:{q:"Kartrij o'lchamida qanday adashmaslik mumkin?",o:["Eskisini do'konga olib borish","Eng kattasini olish","Qo'shnidan so'rash"],e:"Kartrijlar 35 va 40 mm va turli balandlikda bo'ladi."}},
  {a:2,ru:{q:"Как проверить, пропускает ли клапан бачка?",o:["Послушать","Нажать кнопку 10 раз","Капнуть краску в бачок и подождать"],e:"Цветная вода в унитазе покажет течь клапана."},uz:{q:"Bachok klapani o'tkazayotganini qanday tekshirish mumkin?",o:["Quloq solish","Tugmani 10 marta bosish","Bachokka bo'yoq tomizib kutish"],e:"Unitazdagi rangli suv klapan oqishini ko'rsatadi."}},
  {a:1,ru:{q:"С чего начать поиск протечки?",o:["Сразу менять всё подряд","Вытереть насухо и найти первую каплю","Позвать соседей"],e:"Вода стекает вниз, и мокрое место часто ниже настоящей течи."},uz:{q:"Oqishni qidirishni nimadan boshlash kerak?",o:["Hammasini birdan almashtirish","Quruq artib, birinchi tomchini topish","Qo'shnilarni chaqirish"],e:"Suv pastga oqadi, ho'l joy ko'pincha haqiqiy oqishdan pastda."}}]},

 t:{ru:"Засор и сифон",uz:"Tiqilish va sifon"},s:{ru:"Прочистить раковину без химии",uz:"Rakovinani kimyosiz tozalash"},legend:['S'],

  tx(150,86,R(l,'выпуск','chiqish'),{a:'end',s:10})+tx(270,118,R(l,'в канализацию','kanalizatsiyaga'),{s:10,c:'var(--muted)'})+

 steps:{ru:["Начните с вантуза: налейте немного воды, закройте мокрой тряпкой перелив (отверстие сверху раковины) и сделайте 10–15 резких качков.","Не помогло — поставьте ведро и открутите колбу сифона рукой. Выньте грязь, промойте колбу.","Проверьте прокладки колбы и закрутите её обратно рукой, без ключа.","Засор дальше, в трубе — нужен сантехнический трос: вращайте его по часовой и проталкивайте.","Откройте горячую воду на 2–3 минуты и проверьте, нет ли капель под сифоном."],
       uz:["Vantuzdan boshlang: ozgina suv quying, perelivni (rakovina tepasidagi teshik) ho'l latta bilan yoping va 10–15 marta keskin bosing.","Yordam bermasa — chelak qo'yib, sifon kolbasini qo'l bilan bo'shating. Kirni oling, kolbani yuving.","Kolba prokladkalarini tekshirib, qaytadan qo'l bilan, kalitsiz buring.","Tiqilish quvurning ichkarisida bo'lsa — santexnik tros kerak: uni soat mili bo'yicha aylantirib, ichkariga suring.","Issiq suvni 2–3 daqiqa oching va sifon ostida tomchi yo'qligini tekshiring."]},
 tip:{ru:"Не смешивайте разные химические средства для труб: может быть опасная реакция. И не лейте химию, если потом будете разбирать сифон руками.",uz:"Quvurlar uchun turli kimyoviy vositalarni aralashtirmang: xavfli reaksiya bo'lishi mumkin. Keyin sifonni qo'l bilan ochmoqchi bo'lsangiz, kimyo quymang."},
 quiz:[
  {a:2,ru:{q:"Зачем закрывать перелив при работе вантузом?",o:["Чтобы не брызгало","Так положено","Иначе давление уходит через перелив"],e:"Открытый перелив «съедает» удар вантуза."},uz:{q:"Vantuz bilan ishlaganda pereliv nima uchun yopiladi?",o:["Sachramasligi uchun","Shunday qoida","Aks holda bosim perelivdan chiqib ketadi"],e:"Ochiq pereliv vantuz zarbasini «yeb qo'yadi»."}},
  {a:0,ru:{q:"Где в бутылочном сифоне собирается грязь?",o:["В колбе внизу","В смесителе","В стояке"],e:"Колба специально сделана отстойником, её легко открутить."},uz:{q:"Shishasimon sifonda kir qayerda yig'iladi?",o:["Pastdagi kolbada","Smesitelda","Stoyakda"],e:"Kolba maxsus cho'kma idishi qilib yasalgan, uni oson burab olish mumkin."}},
  {a:1,ru:{q:"Зачем в сифоне всегда стоит вода?",o:["Чтобы мыть посуду","Не пускает запах из канализации","Для давления"],e:"Это гидрозатвор. Сухой сифон — запах в квартире."},uz:{q:"Sifonda nima uchun doim suv turadi?",o:["Idish yuvish uchun","Kanalizatsiya hidini o'tkazmaydi","Bosim uchun"],e:"Bu gidrozatvor. Quruq sifon — kvartirada hid."}},
  {a:1,ru:{q:"Можно ли смешивать разные средства для прочистки?",o:["Да, так сильнее","Нет, может быть опасная реакция","Только с кипятком"],e:"Разная химия при смешивании может дать вредный газ."},uz:{q:"Tozalash uchun turli vositalarni aralashtirish mumkinmi?",o:["Ha, kuchliroq bo'ladi","Yo'q, xavfli reaksiya bo'lishi mumkin","Faqat qaynoq suv bilan"],e:"Turli kimyo aralashganda zararli gaz chiqishi mumkin."}}]},

 t:{ru:"Установка унитаза",uz:"Unitaz o'rnatish"},s:{ru:"Гофра, крепление, подводка, бачок",uz:"Gofra, mahkamlash, shlang, bachok"},legend:['C','S'],

 steps:{ru:["Заткните трубу канализации тряпкой, чтобы не шёл запах и ничего не упало. Тряпку потом не забудьте!","Наденьте гофру на выпуск унитаза, примерьте унитаз на место и наметьте карандашом отверстия под крепёж.","Отодвиньте унитаз, просверлите пол (по плитке — сначала сверлом по стеклу/плитке, без удара), вставьте дюбели.","Вставьте гофру в канализацию на всю глубину манжеты, поставьте унитаз и прикрутите винтами через пластиковые шайбы. Не перетягивайте: фаянс лопнет.","Подключите гибкую подводку к бачку и крану, откройте воду, слейте 5–6 раз и проверьте все стыки салфеткой.","Пройдите силиконом шов между унитазом и полом."],
       uz:["Hid kelmasligi va hech narsa tushmasligi uchun kanalizatsiya quvurini latta bilan berkiting. Keyin lattani unutmang!","Gofrani unitaz chiqishiga kiydiring, unitazni joyiga qo'yib ko'ring va mahkamlash teshiklarini qalam bilan belgilang.","Unitazni suring, polni teshing (kafelda — avval shisha/kafel parmasi bilan, zarbasiz), dyubellarni kiriting.","Gofrani kanalizatsiyaga manjetaning butun chuqurligigacha kiriting, unitazni qo'yib, plastik shaybalar orqali vintlar bilan mahkamlang. Ortiqcha tortmang: fayans yoriladi.","Egiluvchan shlangni bachok va jo'mrakka ulang, suvni oching, 5–6 marta suv tushiring va barcha ulanishlarni salfetka bilan tekshiring.","Unitaz va pol orasidagi chokni silikon bilan yuring."]},
 tip:{ru:"Гофра должна идти с небольшим уклоном вниз к канализации, без провисания посередине. Если унитаз стоит близко к трубе, лучше жёсткий пластиковый отвод вместо гофры.",uz:"Gofra kanalizatsiyaga qarab biroz pastga qiyalikda, o'rtasida osilmasdan ketishi kerak. Unitaz quvurga yaqin tursa, gofra o'rniga qattiq plastik otvod yaxshiroq."},
 quiz:[
  {a:1,ru:{q:"Какой диаметр канализации у унитаза?",o:["50 мм","110 мм","32 мм"],e:"Унитаз всегда подключают к трубе 110 мм."},uz:{q:"Unitaz kanalizatsiyasining diametri qancha?",o:["50 mm","110 mm","32 mm"],e:"Unitaz doim 110 mm quvurga ulanadi."}},
  {a:0,ru:{q:"Как сверлить плитку под крепёж?",o:["Сверлом по плитке, без удара","Перфоратором с ударом сразу","Гвоздём"],e:"Удар колет плитку. Сначала плитку без удара, потом бетон."},uz:{q:"Mahkamlash uchun kafelni qanday teshish kerak?",o:["Kafel parmasi bilan, zarbasiz","Darhol zarbali perforator bilan","Mix bilan"],e:"Zarba kafelni yoradi. Avval kafelni zarbasiz, keyin betonni."}},
  {a:2,ru:{q:"Почему нельзя сильно перетягивать винты унитаза?",o:["Винты дорогие","Неважно","Фаянс может треснуть"],e:"Используйте пластиковые шайбы и затягивайте умеренно."},uz:{q:"Unitaz vintlarini nima uchun qattiq tortib bo'lmaydi?",o:["Vintlar qimmat","Farqi yo'q","Fayans yorilishi mumkin"],e:"Plastik shaybalardan foydalaning va me'yorida torting."}},
  {a:1,ru:{q:"Как должна лежать гофра?",o:["С провисом посередине","С уклоном к канализации, без провиса","Вверх к трубе"],e:"В провисе застаивается вода и грязь."},uz:{q:"Gofra qanday yotishi kerak?",o:["O'rtasida osilib","Kanalizatsiyaga qiyalikda, osilmasdan","Quvurga qarab yuqoriga"],e:"Osilgan joyda suv va kir turib qoladi."}}]},

 steps:{ru:["Трубы ставят <b>раструбом против течения</b>: вода втекает в раструб, а не вытекает из него.","Уклон проверяйте уровнем на каждом метре. Слишком маленький — грязь застаивается. Слишком большой (больше 15 см на метр) — вода убегает, а грязь остаётся.","Повороты делайте двумя отводами по 45°, а не одним 90°: так меньше засоров.","Трубу крепите хомутами примерно через каждые 10 диаметров (для Ø50 — около 50 см).","Перед подключением в раструбы ставят резиновые кольца и смазывают силиконовой смазкой или мылом."],
       uz:["Quvurlar <b>rastrub oqimga qarshi</b> qo'yiladi: suv rastrubga kiradi, undan chiqmaydi.","Qiyalikni har metrda daraja (uroven) bilan tekshiring. Juda kam — kir to'xtaydi. Juda katta (1 m ga 15 sm dan ortiq) — suv qochadi, kir qoladi.","Burilishlarni bitta 90° emas, ikkita 45° otvod bilan qiling: tiqilish kamroq.","Quvurni taxminan har 10 diametrda xomut bilan mahkamlang (Ø50 uchun — taxminan 50 sm).","Ulashdan oldin rastrublarga rezina halqa qo'yiladi va silikon moy yoki sovun bilan moylanadi."]},
 tip:{ru:"Труба от прибора к стояку не должна быть уже, чем выход прибора. И нельзя подключать трубу 50 мм так, чтобы в неё сливался унитаз.",uz:"Asbobdan stoyakkacha quvur asbob chiqishidan tor bo'lmasligi kerak. Unitaz quyiladigan qilib 50 mm quvur ulash mumkin emas."},
 quiz:[
  {a:1,ru:{q:"Какой уклон у трубы 50 мм?",o:["0,5 см на метр","3 см на метр","20 см на метр"],e:"Для 40–50 мм норма около 3 см на метр."},uz:{q:"50 mm quvurning qiyaligi qancha?",o:["1 m ga 0,5 sm","1 m ga 3 sm","1 m ga 20 sm"],e:"40–50 mm uchun me'yor 1 m ga taxminan 3 sm."}},
  {a:0,ru:{q:"Куда смотрит раструб трубы?",o:["Против течения, навстречу воде","По течению","Вверх"],e:"Вода должна втекать в раструб, иначе стык будет течь."},uz:{q:"Quvur rastrubi qayerga qaraydi?",o:["Oqimga qarshi, suvga qarab","Oqim bo'yicha","Yuqoriga"],e:"Suv rastrubga oqib kirishi kerak, aks holda ulanish oqadi."}},
  {a:2,ru:{q:"Почему плохо делать уклон слишком большим?",o:["Дорого","Шумно, и всё","Вода убегает, а грязь остаётся"],e:"Уклон больше 15 см/м — частая причина засоров."},uz:{q:"Nima uchun qiyalikni juda katta qilish yomon?",o:["Qimmat","Faqat shovqinli","Suv qochadi, kir qoladi"],e:"1 m ga 15 sm dan ortiq qiyalik — tiqilishning tez-tez sababi."}},
  {a:1,ru:{q:"Как лучше сделать поворот на 90°?",o:["Одним отводом 90°","Двумя отводами по 45°","Согнуть трубу"],e:"Плавный поворот меньше засоряется."},uz:{q:"90° burilishni qanday qilish yaxshiroq?",o:["Bitta 90° otvod bilan","Ikkita 45° otvod bilan","Quvurni egish"],e:"Silliq burilish kamroq tiqiladi."}}]},

 steps:{ru:["Включите паяльник и подождите 10–15 минут после того, как погаснет лампа: насадки должны прогреться до 260 °C.","Для горячей воды берите трубу PN20/PN25 <b>с армированием</b> (алюминий или стекловолокно). Без армирования её поведёт от тепла.","Наденьте трубу и фитинг на насадки одновременно, без поворота. Считайте секунды по таблице.","Снимите и сразу соедините до метки, тоже без поворота. Несколько секунд можно поправить угол, потом не трогайте.","Давайте остыть по таблице. Воду подавайте не раньше чем через 1 час после последней пайки."],
       uz:["Payvandlagichni yoqing va chiroq o'chgandan keyin 10–15 daqiqa kuting: nasadkalar 260 °C gacha qizishi kerak.","Issiq suv uchun <b>armaturali</b> PN20/PN25 quvur oling (alyuminiy yoki shisha tola). Armaturasiz quvur issiqdan qiyshayadi.","Quvur va fitingni nasadkalarga bir vaqtda, burmasdan kiydiring. Soniyalarni jadval bo'yicha sanang.","Yechib, darhol belgigacha ulang, burmasdan. Bir necha soniya burchakni to'g'rilash mumkin, keyin tegmang.","Jadval bo'yicha sovishini kuting. Oxirgi payvanddan kamida 1 soat o'tib suv bering."]},
 tip:{ru:"Перегрев так же плох, как недогрев: пластик наплывает внутрь и сужает трубу. Держите время по таблице, а не «на глаз».",uz:"Ortiqcha qizdirish ham kam qizdirish kabi yomon: plastik ichkariga oqib, quvurni toraytiradi. Vaqtni «ko'z bilan» emas, jadval bo'yicha tuting."},
 quiz:[
  {a:1,ru:{q:"Какая температура паяльника для ПП-труб?",o:["100 °C","260 °C","500 °C"],e:"Рабочая температура около 260 °C."},uz:{q:"PP quvurlar uchun payvandlagich harorati qancha?",o:["100 °C","260 °C","500 °C"],e:"Ish harorati taxminan 260 °C."}},
  {a:0,ru:{q:"Можно ли поворачивать трубу при соединении?",o:["Нет, только прямо","Да, на пол-оборота","Да, чем больше, тем лучше"],e:"Поворот рвёт расплавленный слой, стык будет течь."},uz:{q:"Ulashda quvurni burash mumkinmi?",o:["Yo'q, faqat to'g'ri","Ha, yarim aylanish","Ha, qancha ko'p bo'lsa shuncha yaxshi"],e:"Burash erigan qatlamni buzadi, ulanish oqadi."}},
  {a:2,ru:{q:"Какую трубу брать на горячую воду?",o:["Любую тонкую","PN10 без армирования","Армированную PN20/PN25"],e:"Армирование не даёт трубе удлиняться и провисать от тепла."},uz:{q:"Issiq suvga qaysi quvur olinadi?",o:["Istalgan ingichka","Armaturasiz PN10","Armaturali PN20/PN25"],e:"Armatura quvurni issiqdan uzayib, osilishdan saqlaydi."}},
  {a:1,ru:{q:"Сколько греть трубу 20 мм?",o:["1 секунду","6 секунд","1 минуту"],e:"По таблице: 20 мм — 6 секунд."},uz:{q:"20 mm quvur qancha qizdiriladi?",o:["1 soniya","6 soniya","1 daqiqa"],e:"Jadval bo'yicha: 20 mm — 6 soniya."}}]},

 steps:{ru:["Холодную воду берите от <b>отдельного крана</b> для машины: уезжаете — закрываете.","Шланг набора вкрутите рукой. Он с прокладкой, ничего не мотайте.","Слив: в сифон раковины со штуцером или в отдельный сифон в стене. Шланг поднимите петлёй на высоту, указанную в инструкции (обычно 60–90 см).","Если слив ниже этой высоты, ставьте обратный клапан, иначе вода из канализации будет затекать в машину.","Выставьте машину по уровню, выкрутив ножки. Снимите <b>транспортировочные болты</b> сзади, иначе машина разобьётся на отжиме."],
       uz:["Sovuq suvni mashina uchun <b>alohida jo'mrakdan</b> oling: ketayotganda — yopasiz.","Suv olish shlangini qo'l bilan buring. U prokladkali, hech narsa o'ramang.","To'kish: shtutserli rakovina sifoniga yoki devordagi alohida sifonga. Shlangni yo'riqnomada ko'rsatilgan balandlikka (odatda 60–90 sm) halqa qilib ko'taring.","To'kish bu balandlikdan past bo'lsa, qaytarish klapani qo'ying, aks holda kanalizatsiyadan suv mashinaga oqib kiradi.","Oyoqlarini burab, mashinani daraja bo'yicha to'g'rilang. Orqadagi <b>transport boltlarini</b> yeching, aks holda siqishda mashina buziladi."]},
 tip:{ru:"Розетка для машины — с заземлением и через УЗО 30 мА, не ближе 60 см от воды. Это работа электрика, если сами не умеете.",uz:"Mashina rozetkasi — yerga ulangan va 30 mA UZO orqali, suvdan 60 sm dan yaqin emas. O'zingiz bilmasangiz, bu elektrik ishi."},
 quiz:[
  {a:2,ru:{q:"Зачем снимать транспортировочные болты?",o:["Для красоты","Чтобы не было течи","Иначе машина разобьётся на отжиме"],e:"Болты держат барабан при перевозке, в работе они ломают машину."},uz:{q:"Transport boltlari nima uchun yechiladi?",o:["Chiroyli bo'lishi uchun","Oqmasligi uchun","Aks holda siqishda mashina buziladi"],e:"Boltlar tashishda barabanni ushlaydi, ishlaganda mashinani buzadi."}},
  {a:0,ru:{q:"Зачем поднимать шланг слива петлёй?",o:["Чтобы вода из канализации не затекала обратно","Так короче","Для напора"],e:"Петля на нужной высоте работает как затвор."},uz:{q:"To'kish shlangi nima uchun halqa qilib ko'tariladi?",o:["Kanalizatsiyadan suv qaytib kirmasligi uchun","Qisqaroq bo'ladi","Bosim uchun"],e:"Kerakli balandlikdagi halqa zatvor vazifasini bajaradi."}},
  {a:1,ru:{q:"Слив подключён низко. Что поставить?",o:["Ещё один шланг","Обратный клапан","Ничего"],e:"Обратный клапан не даст стокам вернуться в машину."},uz:{q:"To'kish past ulangan. Nima qo'yish kerak?",o:["Yana bitta shlang","Qaytarish klapani","Hech narsa"],e:"Qaytarish klapani oqova suvni mashinaga qaytarmaydi."}},
  {a:1,ru:{q:"Какой должна быть розетка для машины?",o:["Любая с удлинителем","С заземлением и через УЗО","Без заземления"],e:"Вода и ток рядом: заземление и УЗО обязательны."},uz:{q:"Mashina rozetkasi qanday bo'lishi kerak?",o:["Uzaytirgichli istalgani","Yerga ulangan va UZO orqali","Yerga ulanmagan"],e:"Suv va tok yonma-yon: yerga ulash va UZO majburiy."}}]},

 table:{head:{ru:["","Тройниковая","Коллекторная"],uz:["","Troynikli","Kollektorli"]},rows:{
  ru:[["Цена","Дешевле","Дороже: больше трубы"],["Напор","Падает, если открыто несколько кранов","Ровный на всех точках"],["Ремонт","Перекрывают всю квартиру","Перекрывают одну точку"],["Где","Маленькая квартира, 1 санузел","2 санузла, дом"]],
  uz:[["Narx","Arzonroq","Qimmatroq: quvur ko'p"],["Bosim","Bir nechta jo'mrak ochilsa tushadi","Barcha nuqtalarda bir xil"],["Ta'mir","Butun kvartira yopiladi","Bitta nuqta yopiladi"],["Qayerda","Kichik kvartira, 1 hojatxona","2 hojatxona, uy"]]}},
 steps:{ru:["Нарисуйте план: где стоят все приборы и где ввод воды. Посчитайте точки отдельно для холодной и горячей.","Магистраль до коллектора делайте трубой на размер больше, чем отводы к приборам (например, 25 мм, а к приборам 20 мм).","Трубы в стене прячьте целиком, без резьбовых соединений: резьбу в стене не замуровывают.","Каждый выход подпишите: «кухня», «ванна». Через год вы забудете, где что.","Перед тем как закрыть стену, сделайте опрессовку: дайте давление и оставьте на сутки."],
       uz:["Reja chizing: barcha asboblar va suv kirishi qayerda. Sovuq va issiq uchun nuqtalarni alohida sanang.","Kollektorgacha magistralni asbob tarmoqlaridan bir o'lcham katta quvur bilan qiling (masalan, 25 mm, asboblarga 20 mm).","Devordagi quvurlarni rezbali ulanishsiz, butunlay yashiring: rezba devorga suvalmaydi.","Har bir chiqishga yozing: «oshxona», «vanna». Bir yildan keyin nima qayerdaligini unutasiz.","Devorni yopishdan oldin opressovka qiling: bosim bering va bir sutkaga qoldiring."]},
 tip:{ru:"Опрессовку делают давлением в 1,5 раза выше рабочего. Упало давление на манометре — ищите течь, пока стена открыта.",uz:"Opressovka ishchi bosimdan 1,5 baravar yuqori bosim bilan qilinadi. Manometrda bosim tushsa — devor ochiqligida oqishni qidiring."},
 quiz:[
  {a:1,ru:{q:"Главный плюс коллекторной разводки?",o:["Дешевле","Ровный напор и свой кран у каждой точки","Меньше труб"],e:"Каждый прибор получает свою трубу от коллектора."},uz:{q:"Kollektorli tarmoqning asosiy afzalligi?",o:["Arzonroq","Bir xil bosim va har nuqtada o'z jo'mragi","Quvur kamroq"],e:"Har bir asbob kollektordan o'z quvurini oladi."}},
  {a:0,ru:{q:"Можно ли замуровать резьбовое соединение в стену?",o:["Нет","Да, если с ФУМ","Да, всегда"],e:"Резьба со временем может потечь. В стене только цельная труба или пайка."},uz:{q:"Rezbali ulanishni devorga suvash mumkinmi?",o:["Yo'q","Ha, FUM bilan bo'lsa","Ha, doim"],e:"Rezba vaqt o'tib oqishi mumkin. Devorda faqat butun quvur yoki payvand."}},
  {a:2,ru:{q:"Когда делают опрессовку?",o:["Через год","Не делают","До того, как закрыть стену"],e:"Течь легко найти и исправить, пока трубы открыты."},uz:{q:"Opressovka qachon qilinadi?",o:["Bir yildan keyin","Qilinmaydi","Devor yopilishidan oldin"],e:"Quvurlar ochiqligida oqishni topish va tuzatish oson."}},
  {a:1,ru:{q:"Какой трубой делать магистраль до коллектора?",o:["Тоньше отводов","На размер больше отводов","Любой"],e:"Магистраль несёт воду на все точки сразу."},uz:{q:"Kollektorgacha magistral qaysi quvur bilan qilinadi?",o:["Tarmoqlardan ingichka","Tarmoqlardan bir o'lcham katta","Istalgan"],e:"Magistral barcha nuqtalarga birdaniga suv olib boradi."}}]},

 steps:{ru:["Повесьте бойлер на анкеры в капитальную стену. Полный бойлер на 80 л весит больше 100 кг.","На вход холодной воды (синее кольцо) поставьте <b>предохранительный клапан</b> стрелкой к бойлеру. Между клапаном и бойлером не должно быть кранов.","Перед клапаном поставьте кран. Если давление в доме выше 4–5 бар, добавьте редуктор давления.","Выход горячей (красное кольцо) ведите к смесителям.","Откройте горячий кран на смесителе и откройте воду. Когда из крана пойдёт ровная струя без воздуха, бойлер полный. Только теперь включайте в розетку."],
       uz:["Boylerni kapital devorga ankerlar bilan osing. To'la 80 l boyler 100 kg dan og'ir.","Sovuq suv kirishiga (ko'k halqa) <b>saqlash klapanini</b> strelkasi boylerga qarab qo'ying. Klapan va boyler orasida jo'mrak bo'lmasligi kerak.","Klapandan oldin jo'mrak qo'ying. Uydagi bosim 4–5 bar dan yuqori bo'lsa, bosim reduktorini qo'shing.","Issiq suv chiqishini (qizil halqa) smesitellarga olib boring.","Smesitelda issiq jo'mrakni oching va suvni oching. Jo'mrakdan havosiz tekis oqim kelsa, boyler to'ldi. Faqat endi rozetkaga ulang."]},
 tip:{ru:"Из предохранительного клапана при нагреве капает вода: это нормально, вода расширяется. Отведите трубку в канализацию. Затыкать клапан нельзя — бак может разорвать.",uz:"Qizdirishda saqlash klapanidan suv tomadi: bu normal, suv kengayadi. Trubkani kanalizatsiyaga olib boring. Klapanni berkitish mumkin emas — bak yorilishi mumkin."},
 quiz:[
  {a:2,ru:{q:"Что нельзя ставить между предохранительным клапаном и бойлером?",o:["Трубу","Прокладку","Кран"],e:"Закрытый кран отрежет клапан, и бак может разорвать давлением."},uz:{q:"Saqlash klapani va boyler orasiga nima qo'yib bo'lmaydi?",o:["Quvur","Prokladka","Jo'mrak"],e:"Yopiq jo'mrak klapanni uzib qo'yadi va bak bosimdan yorilishi mumkin."}},
  {a:0,ru:{q:"Из клапана капает вода при нагреве. Это…",o:["Нормально, вода расширяется","Поломка, менять бойлер","Надо заткнуть клапан"],e:"Капли — работа клапана. Отведите их в канализацию."},uz:{q:"Qizdirishda klapandan suv tomyapti. Bu…",o:["Normal, suv kengayadi","Buzilish, boylerni almashtirish kerak","Klapanni berkitish kerak"],e:"Tomchilar — klapan ishi. Ularni kanalizatsiyaga olib boring."}},
  {a:1,ru:{q:"Когда можно включать бойлер в розетку?",o:["Сразу после монтажа","Когда он полностью заполнен водой","До подключения воды"],e:"Без воды ТЭН перегревается и сгорает за минуты."},uz:{q:"Boylerni rozetkaga qachon ulash mumkin?",o:["O'rnatgandan darhol","U suvga to'liq to'lganda","Suv ulanishidan oldin"],e:"Suvsiz TEN bir necha daqiqada qizib kuyadi."}},
  {a:1,ru:{q:"Давление в доме 6 бар. Что добавить?",o:["Ещё один бойлер","Редуктор давления","Ничего"],e:"Редуктор снизит давление и защитит бойлер и подводки."},uz:{q:"Uydagi bosim 6 bar. Nima qo'shish kerak?",o:["Yana bitta boyler","Bosim reduktori","Hech narsa"],e:"Reduktor bosimni pasaytirib, boyler va shlanglarni himoya qiladi."}}]},

 svg:l=>svg(
  `<rect x="10" y="20" width="56" height="28" rx="5" fill="var(--surface)" stroke="var(--fg)" stroke-width="1.5"/>`+tx(38,14,R(l,'коллектор','kollektor'),{s:10,c:'var(--muted)'})+

  arrow(250,103,250,127)+tx(244,119,R(l,'шаг 15–20 см','qadam 15–20 sm'),{a:'end',s:10,w:600})+
  tx(200,252,R(l,'обратка → назад в коллектор · петля до 80 м','qaytish → kollektorga · halqa 80 m gacha'),{s:10,c:'var(--muted)'}),
  R(l,'Одна петля тёплого пола змейкой от коллектора и обратно','Kollektordan ilon izi bo\'lib chiqib qaytadigan bitta issiq pol halqasi'),262),
 steps:{ru:["Узнайте, можно ли: в многоэтажке подключать тёплый пол к центральному отоплению или стояку горячей воды часто <b>запрещено</b>. От своего котла — можно.","Слои снизу вверх: ровное основание → утеплитель (ЭППС 3–5 см) → демпферная лента по стенам → сетка → труба 16 мм → стяжка.","Одна петля — не длиннее 80 м трубы 16 мм. Большую комнату делите на 2 петли одинаковой длины.","Трубу укладывайте целым куском, без соединений под стяжкой. Шаг 15–20 см, у холодной стены (окна) чаще.","Перед стяжкой опрессовка: давление 6 бар на сутки. Стяжку заливают, когда трубы под давлением.","Стяжка над трубой минимум 3 см. Включать пол можно только когда стяжка высохнет (около 28 дней), плавно поднимая температуру."],
       uz:["Mumkinligini bilib oling: ko'p qavatli uyda issiq polni markaziy isitish yoki issiq suv stoyagiga ulash ko'pincha <b>taqiqlangan</b>. O'z qozoningizdan — mumkin.","Qatlamlar pastdan yuqoriga: tekis asos → issiqlik izolyatsiyasi (EPPS 3–5 sm) → devorlar bo'ylab dempfer lenta → setka → 16 mm quvur → styajka.","Bitta halqa — 16 mm quvurdan 80 m dan uzun emas. Katta xonani bir xil uzunlikdagi 2 halqaga bo'ling.","Quvurni bir butun bo'lak qilib, styajka ostida ulanishsiz yotqizing. Qadam 15–20 sm, sovuq devor (deraza) yonida zichroq.","Styajkadan oldin opressovka: bir sutka 6 bar bosim. Styajka quvurlar bosim ostida bo'lganda quyiladi.","Quvur ustidagi styajka kamida 3 sm. Polni faqat styajka qurigandan keyin (taxminan 28 kun), haroratni asta ko'tarib yoqish mumkin."]},
 tip:{ru:"Подача в пол 35–45 °C, а не 70–80 °C, как в радиаторы. Нужен смесительный узел. Горячий пол без узла трескает стяжку и неприятен для ног.",uz:"Polga berish 35–45 °C, radiatorlardagidek 70–80 °C emas. Aralashtirish uzeli kerak. Uzelsiz issiq pol styajkani yoradi va oyoqqa noqulay."},
 quiz:[
  {a:1,ru:{q:"Максимальная длина одной петли трубы 16 мм?",o:["20 м","Около 80 м","300 м"],e:"Длиннее — вода остывает и насос не продавит петлю."},uz:{q:"16 mm quvurdan bitta halqaning eng katta uzunligi?",o:["20 m","Taxminan 80 m","300 m"],e:"Uzunroq bo'lsa — suv soviydi va nasos halqani o'tkaza olmaydi."}},
  {a:0,ru:{q:"Какая температура подачи в тёплый пол?",o:["35–45 °C","70–80 °C","100 °C"],e:"Пол греют низкой температурой через смесительный узел."},uz:{q:"Issiq polga berish harorati qancha?",o:["35–45 °C","70–80 °C","100 °C"],e:"Pol aralashtirish uzeli orqali past harorat bilan isitiladi."}},
  {a:2,ru:{q:"Можно ли делать соединения трубы под стяжкой?",o:["Да, любые","Да, на резьбе","Нет, только целая труба"],e:"Течь под стяжкой — это вскрывать пол."},uz:{q:"Styajka ostida quvur ulanishlari qilish mumkinmi?",o:["Ha, istalgan","Ha, rezbali","Yo'q, faqat butun quvur"],e:"Styajka ostidagi oqish — polni buzish degani."}},
  {a:1,ru:{q:"Когда можно включать пол после заливки стяжки?",o:["На следующий день","Когда стяжка высохнет, около 28 дней","Сразу, чтобы быстрее сохла"],e:"Ранний нагрев трескает стяжку."},uz:{q:"Styajka quyilgandan keyin polni qachon yoqish mumkin?",o:["Ertasi kuni","Styajka qurigandan keyin, taxminan 28 kun","Darhol, tezroq qurishi uchun"],e:"Erta qizdirish styajkani yoradi."}}]},

 steps:{ru:["Порядок по ходу воды: <b>кран → фильтр → счётчик → обратный клапан → редуктор</b> (если нужен), дальше разводка.","Счётчик ставят строго по стрелке на корпусе. Холодный и горячий отличаются (синий и красный), не путайте.","Фильтр грубой очистки — отстойником вниз или вбок, чтобы его можно было промыть.","Замена или новый счётчик — это пломба водоканала. Узнайте порядок у своей управляющей компании до работы.","Оставьте доступ к узлу: не замуровывайте его, сделайте лючок."],
       uz:["Suv oqimi bo'yicha tartib: <b>jo'mrak → filtr → hisoblagich → qaytarish klapani → reduktor</b> (kerak bo'lsa), keyin tarmoq.","Hisoblagich korpusdagi strelka bo'yicha qat'iy qo'yiladi. Sovuq va issiq farq qiladi (ko'k va qizil), adashtirmang.","Dag'al tozalash filtri — yuvish mumkin bo'lishi uchun cho'kmasi pastga yoki yonga.","Hisoblagichni almashtirish yoki yangisi — bu vodokanal plombasi. Ishdan oldin boshqaruv kompaniyangizdan tartibni bilib oling.","Uzelga kirish joyini qoldiring: suvamang, lyuk qiling."]},
 tip:{ru:"Фильтр стоит до счётчика, чтобы ржавчина и песок из стояка не забили и не испортили счётчик.",uz:"Filtr hisoblagichdan oldin turadi, shunda stoyakdagi zang va qum hisoblagichni tiqib, buzmaydi."},
 quiz:[
  {a:0,ru:{q:"Что идёт сразу после крана на вводе?",o:["Фильтр грубой очистки","Счётчик","Редуктор"],e:"Фильтр защищает счётчик от песка и ржавчины."},uz:{q:"Kirish jo'mragidan keyin darhol nima turadi?",o:["Dag'al tozalash filtri","Hisoblagich","Reduktor"],e:"Filtr hisoblagichni qum va zangdan himoya qiladi."}},
  {a:2,ru:{q:"Как ставить счётчик?",o:["Как удобно","Стрелкой против воды","Стрелкой по ходу воды"],e:"Иначе счётчик не будет считать или будет считать неверно."},uz:{q:"Hisoblagich qanday qo'yiladi?",o:["Qulay bo'lganidek","Strelkasi suvga qarshi","Strelkasi suv oqimi bo'yicha"],e:"Aks holda hisoblagich sanamaydi yoki noto'g'ri sanaydi."}},
  {a:1,ru:{q:"Когда нужен редуктор давления?",o:["Всегда, на каждом кране","Если давление выше 4–5 бар","Никогда"],e:"Высокое давление разрушает подводки и бойлер."},uz:{q:"Bosim reduktori qachon kerak?",o:["Doim, har bir jo'mrakda","Bosim 4–5 bar dan yuqori bo'lsa","Hech qachon"],e:"Yuqori bosim shlanglar va boylerni buzadi."}},
  {a:1,ru:{q:"Что нужно сделать перед заменой счётчика?",o:["Ничего","Узнать порядок опломбировки у управляющей компании","Снять пломбу самому"],e:"Счётчик без пломбы не примут к расчёту."},uz:{q:"Hisoblagichni almashtirishdan oldin nima qilish kerak?",o:["Hech narsa","Boshqaruv kompaniyasidan plombalash tartibini bilish","Plombani o'zi olib tashlash"],e:"Plombasiz hisoblagich hisobga qabul qilinmaydi."}}]}
];

// UI for Сантехник Pro. Needs LESSONS from lessons.js.
const PAYWALL=false; // true = intermediate and advanced levels need payment
const UI={
ru:{brand:'Сантехник Pro',tag:'От новичка до мастера · 13 уроков со схемами',prog:'Ваш прогресс',of:(d,t)=>`${d} из ${t} уроков`,
 lv:['Начальный','Средний','Продвинутый'],free:'Бесплатно',pro:'Pro',lockedHint:'Пройдите предыдущий урок',locked:'Закрыто',done:'Пройдено',
 tabs:['Уроки','Калькулятор'],all:'‹ Все уроки',lvl:(lv,n,m)=>`${lv} уровень · урок ${n} · ~${m} мин`,
 leg:{H:'Горячая вода',C:'Холодная вода',S:'Канализация',F:'Подача в тёплый пол',R:'Обратка (остывшая вода)'},
 warnB:'Сначала перекройте воду.',warn:'Закройте краны и откройте смеситель, чтобы ушло давление. Подставьте ведро и тряпку.',
 stepsT:'Пошагово',tipT:'Важно',start:n=>`Пройти тест · ${n} вопроса`,openCalc:'Открыть калькулятор',toL:'‹ К уроку',qt:'Тест',qsub:(k,n)=>`Ответьте верно на ${k} из ${n}, чтобы открыть следующий урок`,
 qn:(i,n)=>`Вопрос ${i} из ${n}`,ok:s=>`Верно: ${s}`,right:'Верно.',wrong:'Неверно.',next:'Дальше',res:'Результат',
 passT:'Урок пройден!',failT:'Почти получилось',passNext:t=>`Открыт следующий урок: «${t}».`,passLast:'Вы прошли все уроки этого уровня.',fail:(k,n)=>`Нужно ${k} правильных ответа из ${n}. Перечитайте урок и попробуйте ещё раз.`,retry:'Пройти тест ещё раз',home:'К списку уроков',nextL:'Следующий урок',
 calcT:'Калькулятор',slT:'Уклон канализации',slSub:'На сколько сантиметров опустить трубу',dia:'Диаметр трубы',len:'Длина трубы, м',slope:'Уклон',drop:'Перепад',cmm:'см/м',cm:'см',slNote:'Не делайте уклон больше 15 см на метр: вода убежит, а грязь останется.',
 blT:'Нагрев бойлера',blSub:'Сколько ждать горячую воду',vol:'Объём бака, л',pkw:'Мощность ТЭНа, кВт',tin:'Вода из крана, °C',tout:'Нагреть до, °C',time:'Время нагрева',hr:'ч',mn:'мин',kwh:'Расход',kwhU:'кВт·ч',blNote:'Без учёта потерь тепла: на практике на 10–15% дольше.',
 reset:'Сбросить прогресс',paid:'Доступно в версии Pro'},
uz:{brand:'Santexnik Pro',tag:'Yangi boshlovchidan ustagacha · sxemali 13 ta dars',prog:'Sizning natijangiz',of:(d,t)=>`${t} tadan ${d} ta dars`,
 lv:['Boshlang\'ich','O\'rta','Yuqori'],free:'Bepul',pro:'Pro',lockedHint:'Oldingi darsni o\'ting',locked:'Yopiq',done:'O\'tildi',
 tabs:['Darslar','Kalkulyator'],all:'‹ Barcha darslar',lvl:(lv,n,m)=>`${lv} daraja · ${n}-dars · ~${m} daq`,
 leg:{H:'Issiq suv',C:'Sovuq suv',S:'Kanalizatsiya',F:'Issiq polga berish',R:'Qaytish (sovigan suv)'},
 warnB:'Avval suvni yoping.',warn:'Jo\'mraklarni yoping va bosim tushishi uchun smesitelni oching. Chelak va latta qo\'ying.',
 stepsT:'Bosqichma-bosqich',tipT:'Muhim',start:n=>`Testdan o\'tish · ${n} ta savol`,openCalc:'Kalkulyatorni ochish',toL:'‹ Darsga qaytish',qt:'Test',qsub:(k,n)=>`Keyingi darsni ochish uchun ${n} tadan ${k} tasiga to\'g\'ri javob bering`,
 qn:(i,n)=>`Savol ${i} / ${n}`,ok:s=>`To\'g\'ri: ${s}`,right:'To\'g\'ri.',wrong:'Noto\'g\'ri.',next:'Keyingisi',res:'Natija',
 passT:'Dars o\'tildi!',failT:'Sal qoldi',passNext:t=>`Keyingi dars ochildi: «${t}».`,passLast:'Siz bu darajadagi barcha darslarni o\'tdingiz.',fail:(k,n)=>`${n} tadan ${k} ta to\'g\'ri javob kerak. Darsni qayta o\'qing va yana urinib ko\'ring.`,retry:'Testni qayta topshirish',home:'Darslar ro\'yxatiga',nextL:'Keyingi dars',
 calcT:'Kalkulyator',slT:'Kanalizatsiya qiyaligi',slSub:'Quvurni necha santimetr pastlatish kerak',dia:'Quvur diametri',len:'Quvur uzunligi, m',slope:'Qiyalik',drop:'Farq',cmm:'sm/m',cm:'sm',slNote:'Qiyalikni 1 m ga 15 sm dan oshirmang: suv qochadi, kir qoladi.',
 blT:'Boyler qizishi',blSub:'Issiq suvni qancha kutish kerak',vol:'Bak hajmi, l',pkw:'TEN quvvati, kVt',tin:'Jo\'mrakdagi suv, °C',tout:'Qizdirish, °C gacha',time:'Qizish vaqti',hr:'soat',mn:'daq',kwh:'Sarf',kwhU:'kVt·soat',blNote:'Issiqlik yo\'qotilishisiz: amalda 10–15% uzoqroq.',
 reset:'Natijani tozalash',paid:'Pro versiyada mavjud'}};

// language is shared with the Kasb Pro hub and Электрик Pro (ep_lang); progress is ours (sp_)
const pk=k=>(k==='lang'?'ep_':'sp_')+k;
const store={get(k,d){try{const v=localStorage.getItem(pk(k));return v?JSON.parse(v):d}catch(e){return d}},set(k,v){try{localStorage.setItem(pk(k),JSON.stringify(v))}catch(e){}}};
let lang=store.get('lang','ru');
let done=new Set(store.get('done',[]));
let S={screen:'home',tab:0,id:null,qi:0,score:0,picked:null,calc:{d:50,len:3,v:80,p:2,t1:15,t2:60}};
const $=s=>document.querySelector(s);
const app=$('#app');
const U=()=>UI[lang];
const tr=o=>o&&(o[lang]??o.ru);
const tg=window.Telegram&&window.Telegram.WebApp;if(tg){try{tg.ready();tg.expand()}catch(e){}}

const byLv=lv=>LESSONS.filter(x=>x.lv===lv);
const isPaid=x=>PAYWALL&&x.lv>0;
function isOpen(x){if(isPaid(x))return false;const list=byLv(x.lv);const i=list.indexOf(x);return i===0||done.has(list[i-1].id)}
const need=n=>Math.ceil(n*0.75);

const bolt='<svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2.5c3.2 4.3 6.5 8 6.5 11.8a6.5 6.5 0 0 1-13 0C5.5 10.5 8.8 6.8 12 2.5z" fill="var(--accent-ink)"/></svg>';
const lockI=()=>`<svg class="ic" width="18" height="18" viewBox="0 0 24 24" aria-label="${U().locked}"><rect x="5" y="11" width="14" height="10" rx="2" fill="none" stroke="currentColor" stroke-width="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3" fill="none" stroke="currentColor" stroke-width="2"/></svg>`;
const langSw=()=>`<div class="lang" role="group" aria-label="Til / Язык"><button type="button" data-l="ru" aria-pressed="${lang==='ru'}">RU</button><button type="button" data-l="uz" aria-pressed="${lang==='uz'}">UZ</button></div>`;
const swatch={H:'var(--wH)',C:'var(--wC)',S:'var(--wS)',F:'var(--wF)',R:'var(--wC)'};

function header(inner){return `<header class="bar">${inner}</header>`}
function tabs(){const L=U();return `<nav class="tabs" role="tablist">${L.tabs.map((t,i)=>`<button type="button" role="tab" aria-selected="${S.tab===i}" data-tab="${i}">${t}</button>`).join('')}</nav>`}

function home(){
  const L=U();const total=LESSONS.length;const d=LESSONS.filter(x=>done.has(x.id)).length;
  let h=header(`${window.KASB_HUB?`<a class="hub" href="${window.KASB_HUB}">‹ Kasb Pro</a>`:''}<div class="row"><div class="brand"><div class="logo">${bolt}</div><div><h1>${L.brand}</h1><p>${L.tag}</p></div></div>${langSw()}</div>`)+tabs();
  if(S.tab===1){app.innerHTML=h+`<main class="wrap">${calcBlock()}</main>`;bindCalc();return}
  h+=`<main class="wrap"><div class="progress"><div class="t"><span>${L.prog}</span><b>${L.of(d,total)}</b></div><div class="meter"><i style="width:${d/total*100}%"></i></div></div><a class="game" href="igra/"><span class="gi">🔧</span><span class="tx"><b>${lang==='uz'?'O\'yin «Uzelni yig\'»':'Игра «Собери узел»'}</b><span class="s">${lang==='uz'?'2 daqiqa: uzelni yig\', qo\'shnilarni suv bosmasin':'2 минуты: собери узел и не затопи соседей'}</span></span><span class="go">›</span></a>`;
  [0,1,2].forEach(lv=>{
    const chip=lv===0||!PAYWALL?'':`<span class="chip pro">${L.pro}</span>`;
    h+=`<section class="level"><h2>${L.lv[lv]} ${lv===0&&PAYWALL?`<span class="chip free">${L.free}</span>`:chip}</h2><div class="list">`;
    byLv(lv).forEach((x,i)=>{
      const open=isOpen(x),isDone=done.has(x.id);
      const cls=isDone?'done open':open?'open':'locked';
      const right=isDone?`<span class="go" aria-label="${L.done}">✓</span>`:open?'<span class="go">›</span>':lockI();
      const sub=!open&&!isDone?(isPaid(x)?L.paid:tr(x.s)):tr(x.s);
      h+=open||isDone?`<button class="item ${cls}" type="button" data-id="${x.id}">`:`<div class="item ${cls}">`;
      h+=`<span class="n">${i+1}</span><span class="tx"><b>${tr(x.t)}</b><span>${sub}</span></span>${right}${open||isDone?'</button>':'</div>'}`;
    });
    h+='</div></section>';
  });
  h+=`<button class="link" id="reset" type="button">${L.reset}</button></main>`;
  app.innerHTML=h;
  document.querySelectorAll('[data-id]').forEach(b=>b.onclick=()=>{S.id=b.dataset.id;go('lesson')});
  const r=$('#reset');r.onclick=()=>{if(r.dataset.c){done=new Set();store.set('done',[]);render()}else{r.dataset.c=1;r.textContent=lang==='ru'?'Нажмите ещё раз, чтобы сбросить':'Tozalash uchun yana bosing'}};
}

function lesson(){
  const L=U();const x=LESSONS.find(y=>y.id===S.id);const list=byLv(x.lv);const n=list.indexOf(x)+1;
  let h=header(`<div class="row"><button class="back" id="back" type="button">${L.all}</button>${langSw()}</div><h1 class="ttl">${tr(x.t)}</h1><p>${L.lvl(L.lv[x.lv],n,x.min)}</p>`)+'<main class="wrap">';
  if(x.svg){h+=`<div class="card diagram"><div class="sv">${x.svg(lang)}</div>`;
    if(x.legend)h+=`<div class="legend">${x.legend.map(k=>`<span><i class="sw" style="background:${swatch[k]}"></i>${L.leg[k]}</span>`).join('')}</div>`;h+='</div>'}
  if(!x.nowarn)h+=`<div class="warn"><span aria-hidden="true">⚠</span><div><b>${x.warn?(lang==='ru'?'Опасно: вода и ток.':'Xavfli: suv va tok.'):L.warnB}</b> ${x.warn?tr(x.warn):L.warn}</div></div>`;
  if(x.table){h+=`<div class="card tbl"><table><thead><tr>${tr(x.table.head).map(c=>`<th>${c}</th>`).join('')}</tr></thead><tbody>${tr(x.table.rows).map(r=>`<tr>${r.map(c=>`<td>${c}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`}
  h+=`<div class="card stack"><h3>${L.stepsT}</h3><ol class="steps">${tr(x.steps).map(s=>`<li><span>${s}</span></li>`).join('')}</ol><p class="tip"><b>${L.tipT}:</b> ${tr(x.tip)}</p></div>`;
  if(x.calc)h+=`<button class="btn ghost" id="calc" type="button">${L.openCalc}</button>`;
  h+=`<button class="btn" id="start" type="button">${L.start(x.quiz.length)}</button></main>`;
  app.innerHTML=h;
  $('#back').onclick=()=>go('home');
  $('#start').onclick=()=>{S.qi=0;S.score=0;S.picked=null;go('quiz')};
  const c=$('#calc');if(c)c.onclick=()=>{S.tab=1;go('home')};
}

function quiz(){
  const L=U();const x=LESSONS.find(y=>y.id===S.id);const QZ=x.quiz;const item=QZ[S.qi];const Q=tr(item);const p=S.picked;
  const opts=Q.o.map((o,i)=>{let c='opt';if(p!==null){if(i===item.a)c+=' right';else if(i===p)c+=' wrong'}return `<button class="${c}" data-i="${i}" type="button" ${p!==null?'disabled':''}>${o}</button>`}).join('');
  app.innerHTML=header(`<div class="row"><button class="back" id="back" type="button">${L.toL}</button>${langSw()}</div><h1 class="ttl">${L.qt}: ${tr(x.t)}</h1><p>${L.qsub(need(QZ.length),QZ.length)}</p>`)+`<main class="wrap">
   <div class="progress"><div class="q-top"><span>${L.qn(S.qi+1,QZ.length)}</span><span>${L.ok(S.score)}</span></div><div class="meter"><i style="width:${(S.qi+(p!==null?1:0))/QZ.length*100}%"></i></div></div>
   <p class="q">${Q.q}</p><div class="opts">${opts}</div>
   ${p!==null?`<p class="expl">${p===item.a?`<b class="okc">${L.right}</b> `:`<b class="badc">${L.wrong}</b> `}${Q.e}</p><button class="btn" id="next" type="button">${S.qi<QZ.length-1?L.next:L.res}</button>`:''}
  </main>`;
  $('#back').onclick=()=>go('lesson');
  document.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{S.picked=+b.dataset.i;if(S.picked===item.a)S.score++;render()});
  const n=$('#next');if(n)n.onclick=()=>{if(S.qi<QZ.length-1){S.qi++;S.picked=null;go('quiz')}else{const pass=S.score>=need(QZ.length);if(pass){done.add(x.id);store.set('done',[...done])}go('result')}};
}

function result(){
  const L=U();const x=LESSONS.find(y=>y.id===S.id);const n=x.quiz.length;const pass=S.score>=need(n);
  const list=byLv(x.lv);const nx=list[list.indexOf(x)+1];
  app.innerHTML=header(`<div class="row"><div><h1>${L.res}</h1><p>${tr(x.t)}</p></div>${langSw()}</div>`)+`<main class="wrap"><div class="card result">
   <div class="score">${S.score} / ${n}</div><h3>${pass?L.passT:L.failT}</h3>
   <p class="expl">${pass?(nx?L.passNext(tr(nx.t)):L.passLast):L.fail(need(n),n)}</p></div>
   ${pass&&nx?`<button class="btn" id="nextL" type="button">${L.nextL}</button>`:''}
   ${pass?'':`<button class="btn" id="retry" type="button">${L.retry}</button>`}
   <button class="btn ghost" id="home" type="button">${L.home}</button></main>`;
  $('#home').onclick=()=>go('home');
  const r=$('#retry');if(r)r.onclick=()=>{S.qi=0;S.score=0;S.picked=null;go('quiz')};
  const nl=$('#nextL');if(nl)nl.onclick=()=>{S.id=nx.id;go('lesson')};
}

/* calculators: sewer slope and boiler heating */
const fmt=(n,d=0)=>n.toFixed(d).replace('.',',');
const numv=v=>+String(v).replace(',','.')||0;
function calcBlock(){const L=U();const c=S.calc;const mm=lang==='ru'?'мм':'mm';
  return `<div class="card stack"><div><h3>${L.slT}</h3><p class="expl">${L.slSub}</p></div>
  <div class="fld"><span>${L.dia}</span><div class="seg" role="group"><button type="button" data-d="50" aria-pressed="${c.d===50}">40–50 ${mm}</button><button type="button" data-d="110" aria-pressed="${c.d===110}">110 ${mm}</button></div></div>
  <label class="fld" for="cl">${L.len}<input id="cl" type="number" inputmode="decimal" min="0" step="0.5" value="${c.len}"></label>
  <div class="out two" id="out1"></div><p class="expl">${L.slNote}</p></div>
  <div class="card stack"><div><h3>${L.blT}</h3><p class="expl">${L.blSub}</p></div>
  <label class="fld" for="bv">${L.vol}<input id="bv" type="number" inputmode="numeric" min="0" step="10" value="${c.v}"></label>
  <label class="fld" for="bp">${L.pkw}<input id="bp" type="number" inputmode="decimal" min="0" step="0.5" value="${c.p}"></label>
  <div class="pair"><label class="fld" for="b1">${L.tin}<input id="b1" type="number" inputmode="numeric" step="1" value="${c.t1}"></label>
  <label class="fld" for="b2">${L.tout}<input id="b2" type="number" inputmode="numeric" step="1" value="${c.t2}"></label></div>
  <div class="out two" id="out2"></div><p class="expl">${L.blNote}</p></div>`}
function paintCalc(){const L=U();const c=S.calc;
  const k=c.d===110?2:3;const len=Math.max(0,numv(c.len));const dr=len*k;
  $('#out1').innerHTML=`<div><span>${L.slope}</span><b>${k} ${L.cmm}</b></div><div><span>${L.drop}</span><b>${fmt(dr,dr%1?1:0)} ${L.cm}</b></div>`;
  const V=numv(c.v),P=numv(c.p),dT=Math.max(0,numv(c.t2)-numv(c.t1));
  const e=V*1.163*dT/1000; // kWh to heat V litres by dT degrees
  let t='—';if(P>0&&e>0){const m=Math.round(e/P*60);t=m>=60?`${Math.floor(m/60)} ${L.hr} ${m%60} ${L.mn}`:`${m} ${L.mn}`}
  $('#out2').innerHTML=`<div><span>${L.time}</span><b>${t}</b></div><div><span>${L.kwh}</span><b>${fmt(e,1)} ${L.kwhU}</b></div>`}
function bindCalc(){
  const on=(id,k)=>{$(id).oninput=e=>{S.calc[k]=e.target.value;paintCalc()}};
  on('#cl','len');on('#bv','v');on('#bp','p');on('#b1','t1');on('#b2','t2');
  document.querySelectorAll('[data-d]').forEach(b=>b.onclick=()=>{S.calc.d=+b.dataset.d;document.querySelectorAll('[data-d]').forEach(x=>x.setAttribute('aria-pressed',x===b));paintCalc()});
  paintCalc()}

function bindCommon(){
  document.querySelectorAll('.lang button').forEach(b=>b.onclick=()=>{lang=b.dataset.l;store.set('lang',lang);document.documentElement.lang=lang;render()});
  document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{S.tab=+b.dataset.tab;render()});
}
function render(){({home,lesson,quiz,result})[S.screen]();bindCommon()}
function go(s){S.screen=s;render();window.scrollTo(0,0)}
document.documentElement.lang=lang;
go('home');

</script>
</body>

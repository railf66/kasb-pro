<style>
body{margin:0}

/* Layout: one-column phone app, screens swapped in place; panel-blueprint feel with a lime "battery" accent */
:root{
  --bg:#eef1f4; --surface:#ffffff; --fg:#14202b; --muted:#5b6876; --line:#d5dbe2;
  --accent:#9bcf2f; --accent-ink:#172400; --navy:#1d2530; --navy-fg:#f4f7fa;
  --ok:#1f8a4c; --bad:#c4392f; --lock:#9aa5b1;
  --wH:#d23b2f; --wC:#1e6fd0; --wS:#7d8790; --wF:#e07a1f; --wW:#9ed6f0;
  --display:"Unbounded","Golos Text",system-ui,sans-serif;
  --body:"Golos Text",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0d151d; --surface:#16212c; --fg:#e7edf3; --muted:#9aa8b6; --line:#273543;
  --accent:#b2e04a; --accent-ink:#172400; --navy:#0a1118; --navy-fg:#e7edf3;
  --ok:#3dbb72; --bad:#ef6a5f; --lock:#5f6d7a; --wH:#ef5a4e; --wC:#4a90e8; --wS:#8f99a3; --wF:#f0913a; --wW:#2c6f8f; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0d151d; --surface:#16212c; --fg:#e7edf3; --muted:#9aa8b6; --line:#273543;
  --accent:#b2e04a; --accent-ink:#172400; --navy:#0a1118; --navy-fg:#e7edf3;
  --ok:#3dbb72; --bad:#ef6a5f; --lock:#5f6d7a; --wH:#ef5a4e; --wC:#4a90e8; --wS:#8f99a3; --wF:#f0913a; --wW:#2c6f8f; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:16px;line-height:1.5}
.app{max-width:480px;margin:0 auto;min-height:100%}
.bar{background:var(--navy);color:var(--navy-fg);padding-block:18px 22px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.bar .row{display:flex;align-items:center;gap:12px}
.logo{width:40px;height:40px;border-radius:10px;background:var(--accent);display:grid;place-items:center;flex:none}
.bar h1{font-family:var(--display);font-size:20px;margin:0;letter-spacing:.01em}
.bar p{margin:2px 0 0;font-size:13px;opacity:.75}
.back{background:none;border:0;color:var(--navy-fg);font:inherit;font-size:15px;padding:6px 0;cursor:pointer;display:flex;gap:6px;align-items:center}
.wrap{padding-block:18px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:18px}
.progress{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px;display:flex;flex-direction:column;gap:8px}
.progress .t{display:flex;justify-content:space-between;font-size:14px;color:var(--muted)}
.progress b{color:var(--fg);font-variant-numeric:tabular-nums}
.meter{height:8px;border-radius:99px;background:var(--line);overflow:hidden}
.meter i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .4s}
.level h2{font-family:var(--display);font-size:15px;margin:0 0 8px;display:flex;align-items:center;gap:8px;text-transform:uppercase;letter-spacing:.06em}
.chip{font-family:var(--body);font-size:11px;font-weight:600;padding:2px 8px;border-radius:99px;letter-spacing:.02em;text-transform:none}
.chip.free{background:color-mix(in srgb,var(--ok) 15%,transparent);color:var(--ok)}
.chip.pro{background:color-mix(in srgb,var(--accent) 22%,transparent);color:var(--fg)}
.list{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.item{display:flex;align-items:center;gap:12px;padding:13px 14px;border-top:1px solid var(--line);width:100%;background:none;border-left:0;border-right:0;border-bottom:0;color:inherit;font:inherit;text-align:left}
.item:first-child{border-top:0}
.item .n{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;font-weight:700;font-size:14px;flex:none;background:var(--bg);color:var(--muted);font-variant-numeric:tabular-nums}
.item .tx{flex:1;min-width:0}
.item .tx b{display:block;font-weight:600;font-size:15px}
.item .tx span{font-size:13px;color:var(--muted)}
.item.open{cursor:pointer}
.item.open .n{background:var(--accent);color:var(--accent-ink)}
.item.done .n{background:var(--ok);color:#fff}
.item.locked{color:var(--muted)}
.item.locked b{color:var(--muted)}
.item:focus-visible,.btn:focus-visible,.opt:focus-visible,.back:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.ic{flex:none;color:var(--lock)}
.go{flex:none;color:var(--accent);font-weight:700}
.note{font-size:13px;color:var(--muted);text-align:center;margin:0}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px}
.diagram{padding:10px 6px 6px}
.diagram svg{width:100%;height:auto;display:block}
.legend{display:flex;flex-wrap:wrap;gap:10px 16px;padding:10px 10px 4px;font-size:13px}
.legend span{display:flex;align-items:center;gap:6px}
.sw{width:22px;height:6px;border-radius:3px;display:inline-block}
.warn{background:color-mix(in srgb,var(--bad) 10%,var(--surface));border:1px solid color-mix(in srgb,var(--bad) 35%,transparent);border-radius:14px;padding:12px 14px;font-size:14px;display:flex;gap:10px}
.warn b{color:var(--bad)}
h3{font-family:var(--display);font-size:16px;margin:0}
.steps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:12px;counter-reset:s}
.steps li{display:flex;gap:12px;counter-increment:s}
.steps li::before{content:counter(s);flex:none;width:26px;height:26px;border-radius:50%;border:2px solid var(--accent);display:grid;place-items:center;font-weight:700;font-size:13px}
.tip{font-size:14px;color:var(--muted);border-left:3px solid var(--accent);padding-left:12px;margin:0}
.btn{appearance:none;border:0;border-radius:12px;background:var(--accent);color:var(--accent-ink);font:inherit;font-weight:700;font-size:16px;padding:15px;width:100%;cursor:pointer}
.btn.ghost{background:var(--surface);color:var(--fg);border:1px solid var(--line)}
.q-top{display:flex;justify-content:space-between;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.q{font-size:18px;font-weight:600;margin:6px 0 0;text-wrap:balance}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{appearance:none;text-align:left;font:inherit;font-size:15px;padding:14px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);color:var(--fg);cursor:pointer}
.opt.right{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 12%,var(--surface))}
.opt.wrong{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 10%,var(--surface))}
.expl{font-size:14px;color:var(--muted);margin:0}
.result{text-align:center;display:flex;flex-direction:column;gap:10px;align-items:center;padding-block:10px}
.score{font-family:var(--display);font-size:44px;font-variant-numeric:tabular-nums}
.badge{font-size:13px;color:var(--muted)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>


<style>
.bar .row{justify-content:space-between}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.ttl{margin-top:6px!important;text-wrap:balance}
.lang{display:flex;border:1.5px solid color-mix(in srgb,var(--navy-fg) 35%,transparent);border-radius:10px;overflow:hidden;flex:none}

.lang button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.tabs{display:flex;gap:4px;background:var(--navy);padding-block:0 12px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.tabs button{flex:1;appearance:none;border:0;border-radius:10px;padding:10px;font:inherit;font-weight:600;font-size:14px;background:color-mix(in srgb,var(--navy-fg) 10%,transparent);color:var(--navy-fg);cursor:pointer}
.tabs button[aria-selected="true"]{background:var(--bg);color:var(--fg)}
.stack{display:flex;flex-direction:column;gap:14px}
.sv{overflow-x:auto}
.tbl{padding:0;overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{text-align:left;padding:10px 12px;border-top:1px solid var(--line);vertical-align:top}
th{border-top:0;font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);background:color-mix(in srgb,var(--accent) 10%,var(--surface))}
td:first-child{font-weight:600;white-space:nowrap}
.okc{color:var(--ok)}.badc{color:var(--bad)}
.link{appearance:none;background:none;border:0;color:var(--muted);font:inherit;font-size:13px;text-decoration:underline;cursor:pointer;align-self:center;padding:8px}
.fld{display:flex;flex-direction:column;gap:6px;font-size:14px;color:var(--muted)}
.fld input{font:inherit;font-size:18px;padding:12px;border-radius:10px;border:1.5px solid var(--line);background:var(--bg);color:var(--fg);width:100%}
.fld select{font:inherit;font-size:16px;padding:12px;border-radius:10px;border:1.5px solid var(--line);background:var(--bg);color:var(--fg);width:100%}
.fld select:focus,.fld input:focus{outline:3px solid var(--accent);outline-offset:1px}
.seg{display:flex;gap:6px}
.seg button{flex:1;appearance:none;font:inherit;font-size:14px;padding:10px;border-radius:10px;border:1.5px solid var(--line);background:var(--surface);color:var(--fg);cursor:pointer}
.seg button[aria-pressed="true"]{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 18%,var(--surface));font-weight:700}
.out{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.out div{background:var(--navy);color:var(--navy-fg);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:2px;min-width:0}
.out span{font-size:12px;opacity:.75}
.out b{font-family:var(--display);font-size:18px;font-variant-numeric:tabular-nums}
.out.two{grid-template-columns:repeat(2,1fr)}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.out .wide{grid-column:1/-1;background:var(--surface);border:1px solid var(--line)}
.tip b{color:var(--fg)}
.hub{display:inline-block;color:var(--navy-fg);opacity:.8;font-size:13px;text-decoration:none;margin-bottom:10px}
.hub:hover{opacity:1}
</style>

  R(l,"Мультиметр в режиме постоянного напряжения: чёрный щуп на минус, красный на плюс, на экране 12,6 вольта","Multimetr doimiy kuchlanish rejimida: qora shchup minusga, qizil plyusga, ekranda 12,6 volt"),258),
 table:{head:{ru:["Режим","Что меряем","Норма"],uz:["Rejim","Nimani o'lchaymiz","Me'yor"]},rows:{
  ru:[["V ⎓ (20 V)","Напряжение АКБ, питание датчика","12,4–12,7 В без нагрузки"],["Ω","Сопротивление катушки, датчика","По справочнику"],["Прозвонка 🔊","Целый ли провод","Пищит = провод цел"],["A (10 A)","Ток утечки, потребление","Только последовательно!"]],
  uz:[["V ⎓ (20 V)","AKB kuchlanishi, datchik ta'minoti","Yuklamasiz 12,4–12,7 V"],["Ω","G'altak, datchik qarshiligi","Ma'lumotnoma bo'yicha"],["Uzluksizlik 🔊","Sim butunmi","Chiyillasa = sim butun"],["A (10 A)","Oqish toki, iste'mol","Faqat ketma-ket!"]]}},
 steps:{ru:["Чёрный щуп всегда в гнездо <b>COM</b>. Красный — в гнездо <b>VΩ</b> для напряжения и сопротивления.","Напряжение меряют <b>параллельно</b>: щупы на два контакта, цепь не разрывают. Можно мерить при включённом зажигании.","Сопротивление и прозвонку меряют только <b>без питания</b>. Отключите разъём или снимите минус АКБ.","Ток меряют <b>последовательно</b>: разрывают цепь и ставят тестер в разрыв, красный щуп в гнездо 10A. Никогда не ставьте щупы в режиме A на клеммы АКБ — сгорит предохранитель тестера.","Контрольная лампа (пробник) показывает, тянет ли цепь нагрузку. Тестер может показать 12 В на гнилом проводе, а лампа не загорится."],
       uz:["Qora shchup doim <b>COM</b> uyasiga. Qizil — kuchlanish va qarshilik uchun <b>VΩ</b> uyasiga.","Kuchlanish <b>parallel</b> o'lchanadi: shchuplar ikki kontaktga, zanjir uzilmaydi. O't oldirish yoqilgan holda o'lchash mumkin.","Qarshilik va uzluksizlik faqat <b>ta'minotsiz</b> o'lchanadi. Razyomni uzing yoki AKB minusini yeching.","Tok <b>ketma-ket</b> o'lchanadi: zanjir uziladi va tester uzilgan joyga qo'yiladi, qizil shchup 10A uyasiga. Hech qachon A rejimida shchuplarni AKB klemmalariga qo'ymang — tester saqlagichi kuyadi.","Nazorat lampasi (probnik) zanjir yuklamani tortadimi, ko'rsatadi. Tester chirigan simda 12 V ko'rsatishi mumkin, lampa esa yonmaydi."]},
 tip:{ru:"Для работы с блоками управления берите светодиодный пробник или тестер. Обычная лампа 21 Вт на сигнальном проводе датчика может сжечь выход блока.",uz:"Boshqaruv bloklari bilan ishlash uchun svetodiodli probnik yoki tester oling. Datchikning signal simidagi oddiy 21 Vt lampa blok chiqishini kuydirishi mumkin."},
 quiz:[
  {a:0,ru:{q:"Как подключают мультиметр для измерения напряжения?",o:["Параллельно, на два контакта","В разрыв цепи","Только к одному проводу"],e:"Напряжение — параллельно, ток — последовательно."},uz:{q:"Kuchlanishni o'lchash uchun multimetr qanday ulanadi?",o:["Parallel, ikki kontaktga","Zanjir uzilgan joyiga","Faqat bitta simga"],e:"Kuchlanish — parallel, tok — ketma-ket."}},
  {a:2,ru:{q:"Когда можно мерить сопротивление?",o:["При работающем моторе","При включённом зажигании","Только без питания"],e:"С питанием тестер покажет ерунду или сгорит."},uz:{q:"Qarshilikni qachon o'lchash mumkin?",o:["Motor ishlab turganda","O't oldirish yoqilganda","Faqat ta'minotsiz"],e:"Ta'minot bilan tester noto'g'ri ko'rsatadi yoki kuyadi."}},
  {a:1,ru:{q:"Что будет, если в режиме 10A поставить щупы на клеммы АКБ?",o:["Покажет 12 В","Короткое замыкание, сгорит предохранитель тестера","Ничего"],e:"В режиме тока у тестера почти нулевое сопротивление."},uz:{q:"10A rejimida shchuplarni AKB klemmalariga qo'ysa nima bo'ladi?",o:["12 V ko'rsatadi","Qisqa tutashuv, tester saqlagichi kuyadi","Hech narsa"],e:"Tok rejimida testerning qarshiligi deyarli nol."}},
  {a:1,ru:{q:"Почему иногда лучше проверить цепь лампой, а не тестером?",o:["Лампа точнее","Лампа даёт нагрузку и выявляет плохой контакт","Лампа дешевле"],e:"Тестер почти не берёт ток, поэтому «видит» 12 В даже на гнилом проводе."},uz:{q:"Nega ba'zan zanjirni tester emas, lampa bilan tekshirgan yaxshi?",o:["Lampa aniqroq","Lampa yuklama beradi va yomon kontaktni aniqlaydi","Lampa arzonroq"],e:"Tester deyarli tok olmaydi, shuning uchun chirigan simda ham 12 V «ko'radi»."}}]},

{id:'b3',lv:0,min:7,nowarn:true,calc:true,
 t:{ru:"Аккумулятор: проверка и зарядка",uz:"Akkumulyator: tekshirish va zaryadlash"},s:{ru:"Заряд по напряжению, прикуривание",uz:"Kuchlanish bo'yicha zaryad, prikurivaniye"},
 table:{head:{ru:["Напряжение в покое","Заряд","Что делать"],uz:["Tinch holatdagi kuchlanish","Zaryad","Nima qilish kerak"]},rows:{
  ru:[["12,7 В и выше","100 %","Норма"],["12,5 В","~75 %","Можно ездить"],["12,3 В","~50 %","Зарядить"],["12,1 В","~25 %","Срочно зарядить"],["11,9 В и ниже","0 %","Глубокий разряд, проверить АКБ"]],
  uz:[["12,7 V va undan yuqori","100 %","Me'yor"],["12,5 V","~75 %","Yurish mumkin"],["12,3 V","~50 %","Zaryadlash kerak"],["12,1 V","~25 %","Zudlik bilan zaryadlang"],["11,9 V va past","0 %","Chuqur razryad, AKB ni tekshiring"]]}},
 steps:{ru:["Мерьте напряжение через 2–3 часа после поездки, когда АКБ «отдохнул». Сразу после поездки покажет завышено.","Проверка под нагрузкой: попросите крутить стартер и смотрите на тестер. Если падает <b>ниже 9,6–10 В</b> — АКБ слабый или стартер тянет много.","Снимать АКБ: сначала <b>минус</b>, потом плюс. Ставить: сначала <b>плюс</b>, потом минус. Клеммы зачистить и смазать.","Зарядка: ток примерно 1/10 от ёмкости. Для АКБ 60 А·ч это 6 А, около 10–12 часов. Зарядка окончена, когда напряжение на зарядке держится 14,4–14,8 В и ток упал.","Прикуривание: плюс донора к плюсу, минус донора к <b>массе мотора</b> разряженной машины, подальше от АКБ. Отключать в обратном порядке."],
       uz:["Kuchlanishni safardan 2–3 soat keyin, AKB «dam olganda» o'lchang. Safardan keyin darhol oshirib ko'rsatadi.","Yuklama ostida tekshirish: starterni aylantirishni so'rang va testerga qarang. <b>9,6–10 V dan pastga</b> tushsa — AKB kuchsiz yoki starter ko'p tortadi.","AKB ni yechish: avval <b>minus</b>, keyin plyus. O'rnatish: avval <b>plyus</b>, keyin minus. Klemmalarni tozalang va moylang.","Zaryadlash: tok taxminan sig'imning 1/10 qismi. 60 A·soat AKB uchun bu 6 A, taxminan 10–12 soat. Zaryadlashda kuchlanish 14,4–14,8 V da tursa va tok tushsa, zaryad tugagan.","Prikurivaniye: donor plyusi plyusga, donor minusi zaryadsiz mashinaning <b>motor massasiga</b>, AKB dan uzoqroq. Teskari tartibda uzing."]},
 tip:{ru:"Если АКБ разрядился за ночь, а сам он новый — ищите утечку тока (урок «Утечка тока»). Менять аккумулятор в этом случае бесполезно.",uz:"AKB bir kechada zaryadsizlansa, o'zi esa yangi bo'lsa — tok oqishini qidiring («Tok oqishi» darsi). Bu holda akkumulyatorni almashtirish foydasiz."},
 quiz:[
  {a:2,ru:{q:"Сколько показывает полностью заряженный АКБ в покое?",o:["11,8 В","12,2 В","12,7 В и выше"],e:"12,7 В — 100 %, 12,3 В — около половины."},uz:{q:"To'liq zaryadlangan AKB tinch holatda qancha ko'rsatadi?",o:["11,8 V","12,2 V","12,7 V va undan yuqori"],e:"12,7 V — 100 %, 12,3 V — taxminan yarmi."}},
  {a:0,ru:{q:"При прокрутке стартером напряжение упало до 8,5 В. Что это значит?",o:["АКБ слабый или стартер тянет много","Всё в норме","Генератор перезаряжает"],e:"Норма при прокрутке — не ниже 9,6–10 В."},uz:{q:"Starter bilan aylantirganda kuchlanish 8,5 V gacha tushdi. Bu nimani anglatadi?",o:["AKB kuchsiz yoki starter ko'p tortadi","Hammasi joyida","Generator ortiqcha zaryadlayapti"],e:"Aylantirganda me'yor — 9,6–10 V dan past emas."}},
  {a:1,ru:{q:"Каким током заряжать АКБ 60 А·ч?",o:["30 А","Около 6 А","0,5 А"],e:"Примерно 1/10 от ёмкости."},uz:{q:"60 A·soat AKB ni qanday tok bilan zaryadlash kerak?",o:["30 A","Taxminan 6 A","0,5 A"],e:"Taxminan sig'imning 1/10 qismi."}},
  {a:1,ru:{q:"Куда подключать минус донора при прикуривании?",o:["На минус разряженного АКБ","На массу мотора, подальше от АКБ","На плюс"],e:"Так искра будет далеко от водорода над аккумулятором."},uz:{q:"Prikurivaniyeda donor minusi qayerga ulanadi?",o:["Zaryadsiz AKB minusiga","Motor massasiga, AKB dan uzoqroq","Plyusga"],e:"Shunda uchqun akkumulyator ustidagi vodoroddan uzoqda bo'ladi."}}]},

 table:{head:{ru:["Контакт","Что подключают"],uz:["Kontakt","Nima ulanadi"]},rows:{
  ru:[["30","Плюс от АКБ через предохранитель"],["87","Выход на нагрузку (вентилятор, фары, сигнал)"],["87a","Выход, который замкнут, пока реле выключено"],["86","Управление катушкой (плюс от кнопки или блока)"],["85","Катушка на массу"]],

 steps:{ru:["Предохранитель защищает <b>провод</b>, а не прибор. Номинал подбирают по сечению провода (смотрите калькулятор).","Проверка предохранителя: на включённой цепи щуп тестера на оба «пятачка» сверху. 12 В на одном и 0 на другом — сгорел. 12 В на обоих — цел.","Реле позволяет слабой кнопкой включать большой ток. Через кнопку идёт 0,1–0,2 А, через контакты реле — 20–40 А.","Проверка реле: на столе подайте +12 В на 86 и массу на 85. Должен быть щелчок, а 30 и 87 должны прозваниваться.","Катушка реле прозванивается обычно на 60–90 Ом. Обрыв (бесконечность) — реле на замену."],
       uz:["Saqlagich asbobni emas, <b>simni</b> himoya qiladi. Nominal sim kesimi bo'yicha tanlanadi (kalkulyatorga qarang).","Saqlagichni tekshirish: yoqilgan zanjirda tester shchupini ustidagi ikkala «nuqta»ga tekkizing. Birida 12 V, boshqasida 0 — kuygan. Ikkalasida 12 V — butun.","Rele kuchsiz tugma bilan katta tokni yoqishga imkon beradi. Tugma orqali 0,1–0,2 A, rele kontaktlari orqali 20–40 A o'tadi.","Releni tekshirish: stolda 86 ga +12 V, 85 ga massa bering. Chiqillash bo'lishi kerak, 30 va 87 esa ulanishi kerak.","Rele g'altagi odatda 60–90 Om ko'rsatadi. Uzilish (cheksizlik) — releni almashtirish kerak."]},
 tip:{ru:"Если новый предохранитель сразу горит снова — в цепи короткое замыкание. Ищите перетёртый провод, а не ставьте предохранитель больше.",uz:"Yangi saqlagich darhol yana kuysa — zanjirda qisqa tutashuv bor. Kattaroq saqlagich qo'ymang, ishqalanib ketgan simni qidiring."},
 quiz:[
  {a:1,ru:{q:"Что защищает предохранитель?",o:["Аккумулятор","Провод от перегрева","Лампу"],e:"Номинал выбирают по сечению провода."},uz:{q:"Saqlagich nimani himoya qiladi?",o:["Akkumulyatorni","Simni qizib ketishdan","Lampani"],e:"Nominal sim kesimi bo'yicha tanlanadi."}},
  {a:0,ru:{q:"Какой контакт реле — выход на нагрузку?",o:["87","85","86"],e:"30 — вход питания, 87 — выход, 85 и 86 — катушка."},uz:{q:"Relening qaysi kontakti yuklamaga chiqish?",o:["87","85","86"],e:"30 — ta'minot kirishi, 87 — chiqish, 85 va 86 — g'altak."}},
  {a:2,ru:{q:"Новый предохранитель сразу сгорел. Что делать?",o:["Поставить на 10 А больше","Поставить «жучок»","Искать короткое замыкание"],e:"Больший номинал — и сгорит проводка."},uz:{q:"Yangi saqlagich darhol kuydi. Nima qilish kerak?",o:["10 A kattasini qo'yish","«Jujik» qo'yish","Qisqa tutashuvni qidirish"],e:"Katta nominal — va simlar kuyadi."}},
  {a:1,ru:{q:"Зачем ставят реле?",o:["Чтобы светило ярче","Чтобы слабая кнопка включала большой ток","Вместо предохранителя"],e:"Через кнопку идёт маленький ток катушки."},uz:{q:"Rele nima uchun qo'yiladi?",o:["Yorqinroq yonishi uchun","Kuchsiz tugma katta tokni yoqishi uchun","Saqlagich o'rniga"],e:"Tugma orqali g'altakning kichik toki o'tadi."}}]},

{id:'b5',lv:0,min:7,calc:true,
 t:{ru:"Провода, разъёмы, соединения",uz:"Simlar, razyomlar, ulanishlar"},s:{ru:"Сечение, обжим, пайка, термоусадка",uz:"Kesim, siqish, kavsharlash, termousadka"},
 table:{head:{ru:["Сечение","Длительно до","Где обычно"],uz:["Kesim","Uzoq muddat","Odatda qayerda"]},rows:{
  ru:[["0,5 мм²","8 А","Датчики, сигналы"],["0,75 мм²","11 А","Габариты, поворотники"],["1,0 мм²","15 А","Фары, магнитола"],["1,5 мм²","20 А","Вентилятор печки"],["2,5 мм²","30 А","Вентилятор радиатора"],["4–6 мм²","40–55 А","Питание усилителя"],["16–25 мм²","100–135 А","Стартер, генератор, масса"]],
  uz:[["0,5 mm²","8 A","Datchiklar, signallar"],["0,75 mm²","11 A","Gabaritlar, burilish chiroqlari"],["1,0 mm²","15 A","Faralar, magnitola"],["1,5 mm²","20 A","Pech ventilyatori"],["2,5 mm²","30 A","Radiator ventilyatori"],["4–6 mm²","40–55 A","Kuchaytirgich ta'minoti"],["16–25 mm²","100–135 A","Starter, generator, massa"]]}},
 steps:{ru:["Цвета проводов у каждой марки свои. Не угадывайте — смотрите <b>электросхему</b> именно этой модели и года.","Обозначения на схемах: <b>30</b> — постоянный плюс, <b>15</b> — плюс после замка зажигания, <b>31</b> — масса, <b>50</b> — стартер.","Лучшее соединение — <b>обжим</b> гильзой правильным инструментом, сверху термоусадка с клеем. Пайка тоже хороша, но место пайки надо закрепить: от вибрации провод ломается рядом.","Никаких скруток с изолентой под капотом. Через полгода там окисление, нагрев и «плавающая» неисправность.","Новый провод ведите вдоль штатного жгута, крепите хомутами, через металл — только через резиновую втулку."],
       uz:["Simlarning ranglari har bir markada o'zgacha. Taxmin qilmang — aynan shu model va yilning <b>elektr sxemasiga</b> qarang.","Sxemalardagi belgilar: <b>30</b> — doimiy plyus, <b>15</b> — o't oldirish qulfidan keyingi plyus, <b>31</b> — massa, <b>50</b> — starter.","Eng yaxshi ulanish — to'g'ri asbob bilan gilza orqali <b>siqish</b>, ustidan yelimli termousadka. Kavsharlash ham yaxshi, lekin kavshar joyini mahkamlash kerak: tebranishdan sim uning yonida sinadi.","Kapot ostida izolentali burama ulanish yo'q. Yarim yildan keyin u yerda oksidlanish, qizish va «suzib yuruvchi» nosozlik bo'ladi.","Yangi simni shtat jgut bo'ylab olib boring, xomutlar bilan mahkamlang, metall orqali — faqat rezina vtulka orqali."]},
 warnB:{ru:"Снимите минус АКБ.",uz:"AKB minusini yeching."},warn:{ru:"Перед врезкой в проводку отключите аккумулятор, чтобы не замкнуть плюс на кузов.",uz:"Simlarga ulanishdan oldin akkumulyatorni uzing, plyusni kuzovga tutashtirib qo'ymaslik uchun."},
 tip:{ru:"Чем длиннее провод, тем толще он нужен: на длинном тонком проводе теряется напряжение, и фары светят тускло. Посчитайте в калькуляторе.",uz:"Sim qancha uzun bo'lsa, shuncha yo'g'on bo'lishi kerak: uzun ingichka simda kuchlanish yo'qoladi va faralar xira yonadi. Kalkulyatorda hisoblang."},
 quiz:[
  {a:1,ru:{q:"Что означает обозначение 15 на схеме?",o:["Масса","Плюс после замка зажигания","Постоянный плюс"],e:"30 — постоянный плюс, 15 — после замка, 31 — масса."},uz:{q:"Sxemadagi 15 belgisi nimani anglatadi?",o:["Massa","O't oldirish qulfidan keyingi plyus","Doimiy plyus"],e:"30 — doimiy plyus, 15 — qulfdan keyin, 31 — massa."}},

  ru:[["Тишина, лампы гаснут","Разряжен АКБ или окислены клеммы"],["Одиночный щелчок","Подгорели контакты тягового реле, плохая масса"],["Частые щелчки «тр-р-р»","Слабый АКБ, тяговое реле не держит"],["Крутит медленно","Слабый АКБ, плохая масса, износ втулок"],["Воет, но не цепляет","Бендикс (обгонная муфта)"]],
  uz:[["Jimlik, lampalar o'chadi","AKB zaryadsiz yoki klemmalar oksidlangan"],["Bitta chiqillash","Tortish relesi kontaktlari kuygan, yomon massa"],["Tez-tez chiqillash «tr-r-r»","AKB kuchsiz, tortish relesi ushlamaydi"],["Sekin aylantiradi","AKB kuchsiz, yomon massa, vtulkalar yeyilgan"],["Uvillaydi, lekin ilmaydi","Bendiks (quvib o'tuvchi mufta)"]]}},
 steps:{ru:["Сначала АКБ: в покое не ниже 12,4 В, при прокрутке не ниже 9,6–10 В.","Проверьте <b>массу</b>: провод АКБ → кузов и кузов → двигатель. Окисленная масса — самая частая причина «щелчка».","<b>Падение напряжения</b>: один щуп на минус АКБ, другой на корпус стартера, крутите стартер. Больше 0,3–0,5 В — плохая масса. Так же проверьте плюс: клемма АКБ → контакт 30.","Проверьте управление: при повороте ключа на контакте <b>50</b> должно быть больше 10 В. Нет — ищите реле стартера, замок, датчик нейтрали (АКПП).","Если на 50 и 30 напряжение есть, массы в норме, а стартер молчит — снимайте стартер: тяговое реле или щётки."],
       uz:["Avval AKB: tinch holatda 12,4 V dan past emas, aylantirganda 9,6–10 V dan past emas.","<b>Massani</b> tekshiring: AKB → kuzov va kuzov → dvigatel simi. Oksidlangan massa — «chiqillash»ning eng ko'p uchraydigan sababi.","<b>Kuchlanish tushishi</b>: bitta shchup AKB minusiga, ikkinchisi starter korpusiga, starterni aylantiring. 0,3–0,5 V dan ko'p — yomon massa. Plyusni ham shunday tekshiring: AKB klemmasi → 30 kontakt.","Boshqaruvni tekshiring: kalit burilganda <b>50</b> kontaktda 10 V dan ko'p bo'lishi kerak. Yo'q — starter relesi, qulf, neytral datchigini (AKPP) qidiring.","50 va 30 da kuchlanish bo'lsa, massalar joyida, starter esa jim bo'lsa — starterni yeching: tortish relesi yoki cho'tkalar."]},
 tip:{ru:"Проверка падением напряжения — главный приём автоэлектрика. Мерьте не «есть ли 12 В», а сколько вольт теряется на проводе под нагрузкой.",uz:"Kuchlanish tushishi bilan tekshirish — avtoelektrikning asosiy usuli. «12 V bormi» emas, yuklama ostida simda necha volt yo'qolishini o'lchang."},
 quiz:[
  {a:1,ru:{q:"Одиночный щелчок, стартер не крутит. Что проверить первым?",o:["Бендикс","АКБ и массу","Свечи"],e:"Чаще всего виноваты слабый АКБ или окисленная масса."},uz:{q:"Bitta chiqillash, starter aylantirmaydi. Birinchi navbatda nimani tekshirish kerak?",o:["Bendiksni","AKB va massani","Svechalarni"],e:"Ko'pincha kuchsiz AKB yoki oksidlangan massa aybdor."}},
  {a:0,ru:{q:"Падение напряжения на массе при прокрутке 1,2 В. Это…",o:["Плохая масса","Норма","Слабый генератор"],e:"Норма — до 0,3–0,5 В."},uz:{q:"Aylantirganda massada kuchlanish tushishi 1,2 V. Bu…",o:["Yomon massa","Me'yor","Kuchsiz generator"],e:"Me'yor — 0,3–0,5 V gacha."}},
  {a:2,ru:{q:"За что отвечает контакт 50 стартера?",o:["Массу","Постоянный плюс","Управление тяговым реле"],e:"На 50 приходит плюс от замка через реле."},uz:{q:"Starterning 50 kontakti nima uchun javob beradi?",o:["Massa","Doimiy plyus","Tortish relesini boshqarish"],e:"50 ga qulfdan rele orqali plyus keladi."}},
  {a:1,ru:{q:"Стартер воет, но мотор не крутит. Причина?",o:["Разряжен АКБ","Бендикс","Сгорел предохранитель"],e:"Мотор стартера крутится, но шестерня не входит в маховик."},uz:{q:"Starter uvillaydi, lekin motorni aylantirmaydi. Sabab?",o:["AKB zaryadsiz","Bendiks","Saqlagich kuygan"],e:"Starter motori aylanadi, lekin shesternya maxovikka kirmaydi."}}]},

 table:{head:{ru:["Напряжение на АКБ (мотор работает)","Вывод"],uz:["AKB dagi kuchlanish (motor ishlaydi)","Xulosa"]},rows:{
  ru:[["13,8–14,7 В","Норма"],["Ниже 13,5 В","Недозаряд: ремень, щётки, регулятор, диод"],["Выше 14,8–15 В","Перезаряд: регулятор. АКБ «кипит»"],["Пульсации больше 0,5 В~","Пробит диодный мост"]],
  uz:[["13,8–14,7 V","Me'yor"],["13,5 V dan past","Kam zaryad: tasma, cho'tkalar, regulyator, diod"],["14,8–15 V dan yuqori","Ortiqcha zaryad: regulyator. AKB «qaynaydi»"],["0,5 V~ dan ko'p pulsatsiya","Diod ko'prigi teshilgan"]]}},
 steps:{ru:["Заведите мотор, тестер на клеммы АКБ. На холостых должно быть <b>13,8–14,7 В</b>.","Включите нагрузку: фары, печку на максимум, обогрев стекла. Напряжение может просесть, но не ниже 13,3–13,5 В. Поднимите обороты до 2000 — должно вернуться.","Проверьте ремень: натяжение, трещины, свист при включении нагрузки.","Лампа зарядки горит при работающем моторе — генератор не заряжает. Не горит при включённом зажигании до запуска — обрыв цепи лампы или щётки.","Переключите тестер на переменное напряжение (V~) на клеммах АКБ. Больше 0,5 В — пробит диод, генератор на ремонт."],
       uz:["Motorni o'tkazing, testerni AKB klemmalariga qo'ying. Salt yurishda <b>13,8–14,7 V</b> bo'lishi kerak.","Yuklamani yoqing: faralar, pechni maksimumga, oyna isitgichini. Kuchlanish tushishi mumkin, lekin 13,3–13,5 V dan past emas. Aylanishni 2000 gacha ko'taring — qaytishi kerak.","Tasmani tekshiring: tarangligi, yoriqlar, yuklama yoqilganda hushtak.","Motor ishlab turganda zaryad lampasi yonsa — generator zaryadlamayapti. O't oldirish yoqilganda, o't oldirishdan oldin yonmasa — lampa zanjirida uzilish yoki cho'tkalar.","Testerni o'zgaruvchan kuchlanishga (V~) o'tkazing, AKB klemmalarida. 0,5 V dan ko'p — diod teshilgan, generatorni ta'mirlash kerak."]},
 tip:{ru:"Никогда не снимайте клемму АКБ на работающем моторе, чтобы «проверить генератор». Скачок напряжения сжигает блоки управления.",uz:"«Generatorni tekshirish» uchun ishlab turgan motorda hech qachon AKB klemmasini yechmang. Kuchlanish sakrashi boshqaruv bloklarini kuydiradi."},
 quiz:[
  {a:1,ru:{q:"Нормальное напряжение зарядки на работающем моторе?",o:["12,0–12,6 В","13,8–14,7 В","15,5–16 В"],e:"Меньше — недозаряд, больше — перезаряд."},uz:{q:"Ishlab turgan motorda zaryadlashning me'yoriy kuchlanishi?",o:["12,0–12,6 V","13,8–14,7 V","15,5–16 V"],e:"Kamroq — kam zaryad, ko'proq — ortiqcha zaryad."}},
  {a:2,ru:{q:"На АКБ 15,3 В на работающем моторе. Что неисправно?",o:["Ремень","Аккумулятор","Регулятор напряжения"],e:"Регулятор не ограничивает напряжение, АКБ закипит."},uz:{q:"Ishlab turgan motorda AKB da 15,3 V. Nima nosoz?",o:["Tasma","Akkumulyator","Kuchlanish regulyatori"],e:"Regulyator kuchlanishni cheklamayapti, AKB qaynab ketadi."}},
  {a:0,ru:{q:"Как проверить диодный мост тестером на машине?",o:["Переменное напряжение на АКБ, больше 0,5 В — плохо","Сопротивление ремня","Снять клемму на ходу"],e:"Пробитый диод даёт пульсации."},uz:{q:"Mashinada diod ko'prigini tester bilan qanday tekshirish mumkin?",o:["AKB da o'zgaruvchan kuchlanish, 0,5 V dan ko'p — yomon","Tasma qarshiligi","Yurib turganda klemmani yechish"],e:"Teshilgan diod pulsatsiya beradi."}},
  {a:1,ru:{q:"Можно ли снять клемму на работающем моторе для проверки генератора?",o:["Да, это старый способ","Нет, сгорят блоки управления","Только минус"],e:"Скачок напряжения опасен для электроники."},uz:{q:"Generatorni tekshirish uchun ishlab turgan motorda klemmani yechish mumkinmi?",o:["Ha, bu eski usul","Yo'q, boshqaruv bloklari kuyadi","Faqat minusni"],e:"Kuchlanish sakrashi elektronika uchun xavfli."}}]},

{id:'m3',lv:1,min:7,
 t:{ru:"Свет и поиск обрыва по схеме",uz:"Chiroqlar va sxema bo'yicha uzilishni qidirish"},s:{ru:"Чтение электросхемы, масса, разъёмы",uz:"Elektr sxemasini o'qish, massa, razyomlar"},
 table:{head:{ru:["Признак","Где искать"],uz:["Belgi","Qayerdan qidirish"]},rows:{
  ru:[["Не горит одна фара","Лампа, разъём фары, масса фары"],["Не горят обе","Предохранитель, реле, переключатель"],["Светит тускло","Плохая масса, окисленный разъём (падение напряжения)"],["Горят «не те» лампы вместе","Пропала общая масса фонаря"],["Поворотники мигают быстро","Сгорела лампа на этой стороне"]],
  uz:[["Bitta fara yonmaydi","Lampa, fara razyomi, fara massasi"],["Ikkalasi yonmaydi","Saqlagich, rele, o'chirgich"],["Xira yonadi","Yomon massa, oksidlangan razyom (kuchlanish tushishi)"],["«Boshqa» lampalar birga yonadi","Fonarning umumiy massasi yo'qolgan"],["Burilish chiroqlari tez miltillaydi","Shu tarafdagi lampa kuygan"]]}},
 steps:{ru:["Найдите схему этой модели. Проследите путь тока: <b>предохранитель → реле → переключатель → разъём → лампа → масса</b>.","Начинайте с середины цепи. Проверьте, есть ли плюс на разъёме фары при включённом свете. Есть — проблема ближе к лампе. Нет — ищите выше.","Проверьте массу: щуп на плюс АКБ, второй на контакт массы в разъёме. Тестер показывает 12 В — масса есть. Ноль — обрыв массы.","Под нагрузкой проверьте <b>падение напряжения</b> на массе: от минуса АКБ до массы лампы. Больше 0,2–0,3 В — плохая точка массы. Зачистите болт массы до металла.","Разъёмы осматривайте на зелень и следы оплавления. Окисленные контакты чистите, проблемный разъём меняйте."],
       uz:["Shu modelning sxemasini toping. Tok yo'lini kuzating: <b>saqlagich → rele → o'chirgich → razyom → lampa → massa</b>.","Zanjirning o'rtasidan boshlang. Chiroq yoqilganda fara razyomida plyus bormi, tekshiring. Bor — muammo lampaga yaqinroq. Yo'q — yuqoridan qidiring.","Massani tekshiring: shchup AKB plyusiga, ikkinchisi razyomdagi massa kontaktiga. Tester 12 V ko'rsatsa — massa bor. Nol — massa uzilgan.","Yuklama ostida massadagi <b>kuchlanish tushishini</b> tekshiring: AKB minusidan lampa massasigacha. 0,2–0,3 V dan ko'p — massa nuqtasi yomon. Massa boltini metallgacha tozalang.","Razyomlarni ko'kish va erish izlariga qarab ko'zdan kechiring. Oksidlangan kontaktlarni tozalang, muammoli razyomni almashtiring."]},
 tip:{ru:"«Плавающая» неисправность часто в разъёме или массе. Пошевелите жгут при включённой цепи и смотрите на тестер — скачок покажет место.",uz:"«Suzib yuruvchi» nosozlik ko'pincha razyom yoki massada bo'ladi. Zanjir yoqilganda jgutni qimirlating va testerga qarang — sakrash joyni ko'rsatadi."},
 quiz:[
  {a:1,ru:{q:"Не горят обе фары. Что проверить первым?",o:["Лампы обеих фар","Предохранитель и реле","Генератор"],e:"Общее для двух фар — предохранитель, реле, переключатель."},uz:{q:"Ikkala fara yonmaydi. Birinchi navbatda nimani tekshirish kerak?",o:["Ikkala faraning lampalarini","Saqlagich va releni","Generatorni"],e:"Ikkala fara uchun umumiy — saqlagich, rele, o'chirgich."}},
  {a:0,ru:{q:"Как быстро проверить массу на разъёме?",o:["Щуп на плюс АКБ, второй на массу разъёма — должно быть 12 В","Прозвонить на кузов при включённой цепи","Посмотреть цвет провода"],e:"Если масса есть, тестер покажет напряжение АКБ."},uz:{q:"Razyomdagi massani qanday tez tekshirish mumkin?",o:["Shchup AKB plyusiga, ikkinchisi razyom massasiga — 12 V bo'lishi kerak","Zanjir yoqilganda kuzovga tekshirish","Sim rangiga qarash"],e:"Massa bo'lsa, tester AKB kuchlanishini ko'rsatadi."}},
  {a:2,ru:{q:"Фара светит тускло. Вероятная причина?",o:["Слишком мощная лампа","Перезаряд","Плохая масса или окисленный разъём"],e:"На плохом контакте теряется напряжение."},uz:{q:"Fara xira yonadi. Ehtimoliy sabab?",o:["Juda kuchli lampa","Ortiqcha zaryad","Yomon massa yoki oksidlangan razyom"],e:"Yomon kontaktda kuchlanish yo'qoladi."}},
  {a:1,ru:{q:"Поворотник слева мигает в 2 раза быстрее. Что это?",o:["Сломалось реле","Сгорела лампа слева","Разряжен АКБ"],e:"Реле поворотов чувствует меньший ток и мигает быстрее."},uz:{q:"Chap burilish chirog'i 2 marta tezroq miltillaydi. Bu nima?",o:["Rele buzilgan","Chapdagi lampa kuygan","AKB zaryadsiz"],e:"Burilish relesi kamroq tokni sezadi va tezroq miltillaydi."}}]},

  ru:[["До 30–50 мА","Норма для современной машины"],["50–100 мА","Многовато, АКБ сядет за 2–3 недели"],["Больше 100 мА","Утечка, ищите потребителя"],["Больше 0,5–1 А","Серьёзная утечка: реле залипло, лампа багажника, сигнализация"]],
  uz:[["30–50 mA gacha","Zamonaviy mashina uchun me'yor"],["50–100 mA","Ko'proq, AKB 2–3 haftada o'tiradi"],["100 mA dan ko'p","Oqish bor, iste'molchini qidiring"],["0,5–1 A dan ko'p","Jiddiy oqish: rele yopishib qolgan, yukxona lampasi, signalizatsiya"]]}},
 steps:{ru:["Зажигание выключено, двери закрыты (замок капота и двери можно «обмануть», защёлкнув отвёрткой). Ключ уберите подальше.","Тестер в режим <b>10 A</b>, красный щуп в гнездо 10A. Снимите минусовую клемму и поставьте тестер <b>в разрыв</b>: между минусом АКБ и клеммой.","Подождите <b>20–40 минут</b>: блоки управления «засыпают» не сразу. Сначала ток может быть 0,3–1 А, потом должен упасть.","Если ток не падает — вынимайте предохранители <b>по одному</b>. Ток резко упал — нашли цепь. По схеме смотрите, что на ней: магнитола, сигнализация, плафон, блок комфорта.","Без разрыва цепи: мерьте милливольты на каждом предохранителе (щупы на «пятачки» сверху). Где есть падение — там идёт ток."],
       uz:["O't oldirish o'chiq, eshiklar yopiq (kapot va eshik qulfini otvyortka bilan qulflab «aldash» mumkin). Kalitni uzoqroqqa qo'ying.","Tester <b>10 A</b> rejimida, qizil shchup 10A uyasida. Minus klemmasini yeching va testerni <b>uzilgan joyga</b> qo'ying: AKB minusi va klemma orasiga.","<b>20–40 daqiqa</b> kuting: boshqaruv bloklari darhol «uxlamaydi». Avval tok 0,3–1 A bo'lishi mumkin, keyin tushishi kerak.","Tok tushmasa — saqlagichlarni <b>bittadan</b> chiqaring. Tok keskin tushdi — zanjir topildi. Sxemadan unda nima borligini qarang: magnitola, signalizatsiya, plafon, komfort bloki.","Zanjirni uzmasdan: har bir saqlagichda millivoltlarni o'lchang (shchuplar ustidagi «nuqtalar»ga). Qayerda tushish bo'lsa — o'sha yerdan tok o'tyapti."]},
 tip:{ru:"Частые виновники: дешёвая сигнализация, неправильно подключённая магнитола (на постоянный плюс вместо 15), залипшее реле, генератор с пробитым диодом.",uz:"Ko'p uchraydigan aybdorlar: arzon signalizatsiya, noto'g'ri ulangan magnitola (15 o'rniga doimiy plyusga), yopishib qolgan rele, diodi teshilgan generator."},
 quiz:[
  {a:0,ru:{q:"Какой ток покоя — норма?",o:["До 30–50 мА","500 мА","2 А"],e:"Больше 100 мА — уже утечка."},uz:{q:"Qanday tinchlik toki me'yor?",o:["30–50 mA gacha","500 mA","2 A"],e:"100 mA dan ko'p — bu oqish."}},
  {a:1,ru:{q:"Как подключить тестер для замера утечки?",o:["Параллельно на клеммы АКБ","В разрыв между минусом АКБ и клеммой","На плюс и кузов"],e:"Ток меряют последовательно."},uz:{q:"Oqishni o'lchash uchun tester qanday ulanadi?",o:["AKB klemmalariga parallel","AKB minusi va klemma orasiga, uzilgan joyga","Plyus va kuzovga"],e:"Tok ketma-ket o'lchanadi."}},
  {a:2,ru:{q:"Почему нужно ждать 20–40 минут?",o:["Остынет мотор","Зарядится АКБ","Блоки управления засыпают не сразу"],e:"Сразу после выключения ток всегда больше."},uz:{q:"Nega 20–40 daqiqa kutish kerak?",o:["Motor soviydi","AKB zaryadlanadi","Boshqaruv bloklari darhol uxlamaydi"],e:"O'chirilgandan keyin darhol tok doim ko'proq bo'ladi."}},
  {a:1,ru:{q:"Как найти цепь с утечкой?",o:["Поменять АКБ","Вынимать предохранители по одному и смотреть ток","Снять генератор"],e:"Где ток упал — та цепь и виновата."},uz:{q:"Oqish bor zanjirni qanday topish mumkin?",o:["AKB ni almashtirish","Saqlagichlarni bittadan chiqarib, tokka qarash","Generatorni yechish"],e:"Tok qayerda tushsa — o'sha zanjir aybdor."}}]},

{id:'a1',lv:2,min:9,nowarn:true,legend:['P','M','H','L'],
 t:{ru:"Компьютерная диагностика OBD-II",uz:"OBD-II kompyuter diagnostikasi"},s:{ru:"Разъём, сканер, коды ошибок",uz:"Razyom, skaner, xato kodlari"},
 svg:l=>{const pins={4:M,5:M,16:P,6:CH,14:CLo,7:'var(--accent)'};let b='<path d="M40 60H320L300 170H60Z" fill="var(--surface)" stroke="var(--fg)" stroke-width="2"/>';
  for(let i=0;i<8;i++){const x=72+i*31;[[1+i,92],[9+i,140]].forEach(([n,y])=>{const c=pins[n];b+=`<rect x="${x-11}" y="${y-13}" width="22" height="26" rx="4" fill="${c||'var(--bg)'}" stroke="var(--fg)" stroke-width="1.2"/>`+tx(x,y+4,n,{w:700,s:11,c:n===7?'var(--accent-ink)':c?'#fff':'var(--muted)'})})}
  return svg(b+tx(180,46,R(l,'Разъём OBD-II под рулём (вид на гнёзда)','Rul ostidagi OBD-II razyomi (uyalar tomondan)'),{w:600,s:11})+
   tx(20,200,R(l,'4, 5 — масса · 16 — +12 В','4, 5 — massa · 16 — +12 V'),{s:11,a:'start'})+tx(20,220,R(l,'6 — CAN-H · 14 — CAN-L · 7 — K-line','6 — CAN-H · 14 — CAN-L · 7 — K-line'),{s:11,a:'start'}),
   R(l,"Разъём OBD-II, 16 контактов: 4 и 5 масса, 16 плюс 12 вольт, 6 CAN-H, 14 CAN-L, 7 K-line","OBD-II razyomi, 16 kontakt: 4 va 5 massa, 16 plyus 12 volt, 6 CAN-H, 14 CAN-L, 7 K-line"),236)},
 table:{head:{ru:["Код","Что значит"],uz:["Kod","Ma'nosi"]},rows:{
  ru:[["P0300–P0304","Пропуски зажигания (0 — случайные, 1–4 — в цилиндре)"],["P0171","Бедная смесь: подсос воздуха, ДМРВ, давление топлива"],["P0335","Нет сигнала датчика коленвала"],["P0115–P0118","Датчик температуры охлаждающей жидкости"],["P0130–P0141","Датчик кислорода (лямбда)"],["P0420","Катализатор работает плохо"],["P0562","Низкое напряжение бортсети"],["U0100","Нет связи с блоком двигателя"]],
  uz:[["P0300–P0304","O't oldirishdagi uzilishlar (0 — tasodifiy, 1–4 — silindrda)"],["P0171","Kambag'al aralashma: havo so'rilishi, DMRV, yoqilg'i bosimi"],["P0335","Tirsakli val datchigidan signal yo'q"],["P0115–P0118","Sovutish suyuqligi harorati datchigi"],["P0130–P0141","Kislorod datchigi (lyambda)"],["P0420","Katalizator yomon ishlaydi"],["P0562","Bort tarmog'ida past kuchlanish"],["U0100","Dvigatel bloki bilan aloqa yo'q"]]}},
 steps:{ru:["Разъём OBD-II стоит у всех машин примерно с 2000-х, обычно под рулём слева. Подключите сканер (например, адаптер ELM327 + приложение на телефоне) и включите зажигание.","Первая буква кода: <b>P</b> — двигатель и коробка, <b>B</b> — кузов, <b>C</b> — шасси (ABS), <b>U</b> — связь между блоками. P0… — общие коды, P1… — коды производителя.","Запишите все коды и <b>стоп-кадр</b> (freeze frame): обороты, температура, скорость в момент ошибки. Это подсказка, при каких условиях проблема.","Код показывает, <b>что заметил блок</b>, а не какую деталь менять. P0171 — это не «замените ДМРВ», а «смесь бедная»: сначала ищите подсос воздуха.","После ремонта сотрите коды и проедьте. Вернулся код — причина не устранена."],
       uz:["OBD-II razyomi taxminan 2000-yillardan beri barcha mashinalarda bor, odatda rulning chap tomonida pastda. Skanerni ulang (masalan, ELM327 adapteri + telefondagi ilova) va o't oldirishni yoqing.","Kodning birinchi harfi: <b>P</b> — dvigatel va uzatmalar qutisi, <b>B</b> — kuzov, <b>C</b> — shassi (ABS), <b>U</b> — bloklar orasidagi aloqa. P0… — umumiy kodlar, P1… — ishlab chiqaruvchi kodlari.","Barcha kodlarni va <b>stop-kadrni</b> (freeze frame) yozib oling: xato paytidagi aylanish, harorat, tezlik. Bu muammo qanday sharoitda bo'lishiga ishora.","Kod qaysi detalni almashtirishni emas, <b>blok nimani sezganini</b> ko'rsatadi. P0171 — bu «DMRV ni almashtiring» emas, «aralashma kambag'al»: avval havo so'rilishini qidiring.","Ta'mirdan keyin kodlarni o'chiring va yurib ko'ring. Kod qaytsa — sabab bartaraf etilmagan."]},
 tip:{ru:"Не подключайте дешёвый адаптер ELM327 и не оставляйте его в разъёме на ночь: некоторые не «засыпают» и разряжают АКБ.",uz:"Arzon ELM327 adapterini razyomda bir kechaga qoldirmang: ba'zilari «uxlamaydi» va AKB ni zaryadsizlantiradi."},
 quiz:[
  {a:1,ru:{q:"Что значит буква U в коде ошибки?",o:["Двигатель","Связь между блоками","Подушки безопасности"],e:"P — двигатель, B — кузов, C — шасси, U — сеть."},uz:{q:"Xato kodidagi U harfi nimani anglatadi?",o:["Dvigatel","Bloklar orasidagi aloqa","Xavfsizlik yostiqlari"],e:"P — dvigatel, B — kuzov, C — shassi, U — tarmoq."}},
  {a:2,ru:{q:"Сканер показал P0171. Что делать первым?",o:["Сразу менять ДМРВ","Менять лямбду","Искать подсос воздуха"],e:"Код говорит «смесь бедная», а не какую деталь менять."},uz:{q:"Skaner P0171 ko'rsatdi. Birinchi navbatda nima qilish kerak?",o:["Darhol DMRV ni almashtirish","Lyambdani almashtirish","Havo so'rilishini qidirish"],e:"Kod qaysi detalni almashtirishni emas, «aralashma kambag'al»ligini aytadi."}},
  {a:0,ru:{q:"На каком контакте OBD-II плюс 12 В?",o:["16","4","7"],e:"4 и 5 — масса, 16 — плюс."},uz:{q:"OBD-II ning qaysi kontaktida plyus 12 V?",o:["16","4","7"],e:"4 va 5 — massa, 16 — plyus."}},
  {a:1,ru:{q:"Зачем смотреть стоп-кадр (freeze frame)?",o:["Чтобы стереть ошибку","Узнать условия, при которых появилась ошибка","Это фото двигателя"],e:"Обороты, температура и скорость в момент ошибки помогают найти причину."},uz:{q:"Stop-kadrga (freeze frame) nima uchun qaraladi?",o:["Xatoni o'chirish uchun","Xato qanday sharoitda paydo bo'lganini bilish uchun","Bu dvigatel surati"],e:"Xato paytidagi aylanish, harorat va tezlik sababni topishga yordam beradi."}}]},

{id:'a2',lv:2,min:9,
 t:{ru:"Датчики двигателя",uz:"Dvigatel datchiklari"},s:{ru:"ДПКВ, ДТОЖ, ДПДЗ, ДМРВ, лямбда",uz:"DPKV, DTOJ, DPDZ, DMRV, lyambda"},
 warnB:{ru:"Отключайте разъём только при выключенном зажигании.",uz:"Razyomni faqat o't oldirish o'chiq paytda uzing."},warn:{ru:"Отключение датчика на включённом зажигании добавит лишние ошибки, а иногда повредит блок.",uz:"O't oldirish yoqilganda datchikni uzish ortiqcha xatolar qo'shadi, ba'zan esa blokka zarar yetkazadi."},
 table:{head:{ru:["Датчик","Если неисправен","Как проверить"],uz:["Datchik","Nosoz bo'lsa","Qanday tekshirish"]},rows:{
  ru:[["ДПКВ (коленвал)","Мотор не заводится или глохнет горячим","Сопротивление (индуктивный), сигнал при прокрутке"],["ДТОЖ (температура)","Тяжёлый пуск, не включается вентилятор, расход","Холодный ~2–4 кОм, горячий ~200–300 Ом (по марке)"],["ДПДЗ (дроссель)","Провалы при нажатии газа","Питание 5 В, сигнал плавно 0,5→4,5 В"],["ДМРВ (расход воздуха)","Плохая тяга, бедная/богатая смесь","Показания в сканере на холостых и при газе"],["Лямбда (кислород)","Расход, P0130–P0141","Сигнал прыгает 0,1–0,9 В на прогретом моторе"]],
  uz:[["DPKV (tirsakli val)","Motor o't olmaydi yoki issiqda o'chadi","Qarshilik (induktiv), aylantirganda signal"],["DTOJ (harorat)","Qiyin o't olish, ventilyator yonmaydi, sarf","Sovuq ~2–4 kOm, issiq ~200–300 Om (marka bo'yicha)"],["DPDZ (drossel)","Gaz bosilganda uzilishlar","Ta'minot 5 V, signal ravon 0,5→4,5 V"],["DMRV (havo sarfi)","Tortish yomon, kambag'al/boy aralashma","Salt yurishda va gazda skanerdagi ko'rsatkichlar"],["Lyambda (kislorod)","Sarf, P0130–P0141","Qizigan motorda signal 0,1–0,9 V oralig'ida sakraydi"]]}},
 steps:{ru:["У большинства датчиков три провода: <b>питание 5 В</b> от блока, <b>масса</b> датчика и <b>сигнал</b>. Сначала проверьте, что 5 В и масса приходят к разъёму.","Нет 5 В на одном датчике — обрыв провода. Нет 5 В на нескольких сразу — один из датчиков замкнул общую линию питания. Отключайте по одному.","Смотрите «живые данные» в сканере. Температура −40 °C на тёплом моторе — обрыв цепи ДТОЖ. +130 °C — замыкание.","ДПДЗ проверяйте плавным нажатием педали: сигнал должен расти без провалов. Провал на графике = стёртая дорожка.","Перед заменой лямбды проверьте подсос воздуха и выпуск: трещина в выпуске до датчика обманывает его."],
       uz:["Ko'pchilik datchiklarda uchta sim bor: blokdan <b>5 V ta'minot</b>, datchik <b>massasi</b> va <b>signal</b>. Avval razyomga 5 V va massa kelishini tekshiring.","Bitta datchikda 5 V yo'q — sim uzilgan. Bir nechtasida birdaniga 5 V yo'q — datchiklardan biri umumiy ta'minot liniyasini tutashtirgan. Bittadan uzing.","Skanerda «jonli ma'lumotlar»ga qarang. Issiq motorda −40 °C harorat — DTOJ zanjiri uzilgan. +130 °C — tutashuv.","DPDZ ni pedalni ravon bosib tekshiring: signal uzilishlarsiz o'sishi kerak. Grafikdagi uzilish = yeyilgan yo'lak.","Lyambdani almashtirishdan oldin havo so'rilishi va chiqindi quvurini tekshiring: datchikdan oldingi chiqindi quvuridagi yoriq uni aldaydi."]},
 tip:{ru:"Не меряйте сигнал датчика лампой-пробником — только тестером или осциллографом. Лампа нагружает линию 5 В и может сжечь выход блока.",uz:"Datchik signalini lampa-probnik bilan o'lchamang — faqat tester yoki ossillograf bilan. Lampa 5 V liniyasini yuklaydi va blok chiqishini kuydirishi mumkin."},
 quiz:[
  {a:0,ru:{q:"Без какого датчика мотор обычно не заведётся?",o:["ДПКВ (коленвал)","Лямбда","ДТОЖ"],e:"Без сигнала коленвала блок не знает, когда давать искру и топливо."},uz:{q:"Qaysi datchiksiz motor odatda o't olmaydi?",o:["DPKV (tirsakli val)","Lyambda","DTOJ"],e:"Tirsakli val signalisiz blok qachon uchqun va yoqilg'i berishni bilmaydi."}},
  {a:2,ru:{q:"Сканер показывает −40 °C на тёплом моторе. Это…",o:["Норма зимой","Замыкание датчика","Обрыв цепи ДТОЖ"],e:"Обрыв = бесконечное сопротивление = очень холодно для блока."},uz:{q:"Skaner issiq motorda −40 °C ko'rsatyapti. Bu…",o:["Qishda me'yor","Datchik tutashuvi","DTOJ zanjiri uzilgan"],e:"Uzilish = cheksiz qarshilik = blok uchun juda sovuq."}},
  {a:1,ru:{q:"Какое питание обычно у датчиков от блока?",o:["12 В","5 В","220 В"],e:"Блок даёт датчикам опорные 5 В."},uz:{q:"Blokdan datchiklarga odatda qanday ta'minot beriladi?",o:["12 V","5 V","220 V"],e:"Blok datchiklarga tayanch 5 V beradi."}},
  {a:1,ru:{q:"Как ведёт себя исправная узкополосная лямбда на прогретом моторе?",o:["Стоит на 0,45 В","Прыгает 0,1–0,9 В","Всегда 0 В"],e:"Блок постоянно корректирует смесь, и сигнал «качается»."},uz:{q:"Qizigan motorda soz tor polosali lyambda o'zini qanday tutadi?",o:["0,45 V da turadi","0,1–0,9 V oralig'ida sakraydi","Doim 0 V"],e:"Blok aralashmani doim tuzatib turadi va signal «tebranadi»."}}]},

 steps:{ru:["CAN — это два перевитых провода, по которым блоки обмениваются данными. Если шина «легла», на панели загораются сразу много ламп, а сканер не видит блоки (коды U0…).","Без питания мерьте сопротивление между контактами <b>6 и 14</b> разъёма OBD. Норма около <b>60 Ом</b>: два резистора по 120 Ом параллельно.","С включённым зажиганием мерьте напряжение относительно массы: CAN-H около <b>2,5–3,5 В</b>, CAN-L около <b>1,5–2,5 В</b>. Оба по 0 или по 12 В — замыкание на массу или плюс.","Ищите виновника, отключая блоки <b>по одному</b>. Шина «ожила» после отключения блока — неисправен он или его провод.","Частые места: разъёмы в дверях и под ковриком (вода), неправильно врезанная сигнализация, повреждённый жгут после ДТП."],

 tip:{ru:"Не подключайте ничего к CAN-проводам «на скрутку». Для доп. оборудования используйте штатный разъём или CAN-модуль по инструкции.",uz:"CAN simlariga hech narsani «burab» ulamang. Qo'shimcha uskunalar uchun shtat razyomi yoki yo'riqnoma bo'yicha CAN-moduldan foydalaning."},

// language is shared with the Kasb Pro hub and Электрик Pro (ep_lang); progress is ours (ae_)
const pk=k=>(k==='lang'?'ep_':'ae_')+k;
const store={get(k,d){try{const v=localStorage.getItem(pk(k));return v?JSON.parse(v):d}catch(e){return d}},set(k,v){try{localStorage.setItem(pk(k),JSON.stringify(v))}catch(e){}}};
let lang=store.get('lang','ru');
let done=new Set(store.get('done',[]));
let S={screen:'home',tab:0,id:null,qi:0,score:0,picked:null,calc:{mode:0,w:120,i:10,v:0,len:3,dr:0,rest:12.6,run:14.2}};
const $=s=>document.querySelector(s);
const app=$('#app');
const U=()=>UI[lang];
const tr=o=>o&&(o[lang]??o.ru);
const tg=window.Telegram&&window.Telegram.WebApp;if(tg){try{tg.ready();tg.expand()}catch(e){}}

const byLv=lv=>LESSONS.filter(x=>x.lv===lv);
const isPaid=x=>PAYWALL&&x.lv>0;
function isOpen(x){if(isPaid(x))return false;const list=byLv(x.lv);const i=list.indexOf(x);return i===0||done.has(list[i-1].id)}
const need=n=>Math.ceil(n*0.75);

const bolt='<svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true"><rect x="2.5" y="7" width="19" height="13" rx="2" fill="none" stroke="var(--accent-ink)" stroke-width="2"/><path d="M6 7V4.5h3V7M15 7V4.5h3V7M6 13.5h4M8 11.5v4M14 13.5h4" fill="none" stroke="var(--accent-ink)" stroke-width="2" stroke-linecap="round"/></svg>';
const lockI=()=>`<svg class="ic" width="18" height="18" viewBox="0 0 24 24" aria-label="${U().locked}"><rect x="5" y="11" width="14" height="10" rx="2" fill="none" stroke="currentColor" stroke-width="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3" fill="none" stroke="currentColor" stroke-width="2"/></svg>`;
const langSw=()=>`<div class="lang" role="group" aria-label="Til / Язык"><button type="button" data-l="ru" aria-pressed="${lang==='ru'}">RU</button><button type="button" data-l="uz" aria-pressed="${lang==='uz'}">UZ</button></div>`;
const swatch={P:'var(--wH)',M:'var(--wS)',S:'var(--wF)',H:'var(--wF)',L:'var(--wC)'};

function header(inner){return `<header class="bar">${inner}</header>`}
function tabs(){const L=U();return `<nav class="tabs" role="tablist">${L.tabs.map((t,i)=>`<button type="button" role="tab" aria-selected="${S.tab===i}" data-tab="${i}">${t}</button>`).join('')}</nav>`}

function home(){
  const L=U();const total=LESSONS.length;const d=LESSONS.filter(x=>done.has(x.id)).length;
  let h=header(`${window.KASB_HUB?`<a class="hub" href="${window.KASB_HUB}">‹ Kasb Pro</a>`:''}<div class="row"><div class="brand"><div class="logo">${bolt}</div><div><h1>${L.brand}</h1><p>${L.tag}</p></div></div>${langSw()}</div>`)+tabs();
  if(S.tab===1){app.innerHTML=h+`<main class="wrap">${calcBlock()}</main>`;bindCalc();return}
  h+=`<main class="wrap"><div class="progress"><div class="t"><span>${L.prog}</span><b>${L.of(d,total)}</b></div><div class="meter"><i style="width:${d/total*100}%"></i></div></div>`;
  [0,1,2].forEach(lv=>{
    const chip=lv===0||!PAYWALL?'':`<span class="chip pro">${L.pro}</span>`;
    h+=`<section class="level"><h2>${L.lv[lv]} ${lv===0&&PAYWALL?`<span class="chip free">${L.free}</span>`:chip}</h2><div class="list">`;
    byLv(lv).forEach((x,i)=>{
      const open=isOpen(x),isDone=done.has(x.id);
      const cls=isDone?'done open':open?'open':'locked';
      const right=isDone?`<span class="go" aria-label="${L.done}">✓</span>`:open?'<span class="go">›</span>':lockI();
      const sub=!open&&!isDone?(isPaid(x)?L.paid:tr(x.s)):tr(x.s);
      h+=open||isDone?`<button class="item ${cls}" type="button" data-id="${x.id}">`:`<div class="item ${cls}">`;
      h+=`<span class="n">${i+1}</span><span class="tx"><b>${tr(x.t)}</b><span>${sub}</span></span>${right}${open||isDone?'</button>':'</div>'}`;
    });
    h+='</div></section>';
  });
  h+=`<button class="link" id="reset" type="button">${L.reset}</button></main>`;
  app.innerHTML=h;
  document.querySelectorAll('[data-id]').forEach(b=>b.onclick=()=>{S.id=b.dataset.id;go('lesson')});
  const r=$('#reset');r.onclick=()=>{if(r.dataset.c){done=new Set();store.set('done',[]);render()}else{r.dataset.c=1;r.textContent=lang==='ru'?'Нажмите ещё раз, чтобы сбросить':'Tozalash uchun yana bosing'}};
}

function lesson(){
  const L=U();const x=LESSONS.find(y=>y.id===S.id);const list=byLv(x.lv);const n=list.indexOf(x)+1;
  let h=header(`<div class="row"><button class="back" id="back" type="button">${L.all}</button>${langSw()}</div><h1 class="ttl">${tr(x.t)}</h1><p>${L.lvl(L.lv[x.lv],n,x.min)}</p>`)+'<main class="wrap">';
  if(x.svg){h+=`<div class="card diagram"><div class="sv">${x.svg(lang)}</div>`;
    if(x.legend)h+=`<div class="legend">${x.legend.map(k=>`<span><i class="sw" style="background:${swatch[k]}"></i>${L.leg[k]}</span>`).join('')}</div>`;h+='</div>'}
  if(!x.nowarn)h+=`<div class="warn"><span aria-hidden="true">⚠</span><div><b>${x.warnB?tr(x.warnB):L.warnB}</b> ${x.warn?tr(x.warn):L.warn}</div></div>`;
  if(x.table){h+=`<div class="card tbl"><table><thead><tr>${tr(x.table.head).map(c=>`<th>${c}</th>`).join('')}</tr></thead><tbody>${tr(x.table.rows).map(r=>`<tr>${r.map(c=>`<td>${c}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`}
  h+=`<div class="card stack"><h3>${L.stepsT}</h3><ol class="steps">${tr(x.steps).map(s=>`<li><span>${s}</span></li>`).join('')}</ol><p class="tip"><b>${L.tipT}:</b> ${tr(x.tip)}</p></div>`;
  if(x.calc)h+=`<button class="btn ghost" id="calc" type="button">${L.openCalc}</button>`;
  h+=`<button class="btn" id="start" type="button">${L.start(x.quiz.length)}</button></main>`;
  app.innerHTML=h;
  $('#back').onclick=()=>go('home');
  $('#start').onclick=()=>{S.qi=0;S.score=0;S.picked=null;go('quiz')};
  const c=$('#calc');if(c)c.onclick=()=>{S.tab=1;go('home')};
}

function quiz(){
  const L=U();const x=LESSONS.find(y=>y.id===S.id);const QZ=x.quiz;const item=QZ[S.qi];const Q=tr(item);const p=S.picked;
  const opts=Q.o.map((o,i)=>{let c='opt';if(p!==null){if(i===item.a)c+=' right';else if(i===p)c+=' wrong'}return `<button class="${c}" data-i="${i}" type="button" ${p!==null?'disabled':''}>${o}</button>`}).join('');
  app.innerHTML=header(`<div class="row"><button class="back" id="back" type="button">${L.toL}</button>${langSw()}</div><h1 class="ttl">${L.qt}: ${tr(x.t)}</h1><p>${L.qsub(need(QZ.length),QZ.length)}</p>`)+`<main class="wrap">
   <div class="progress"><div class="q-top"><span>${L.qn(S.qi+1,QZ.length)}</span><span>${L.ok(S.score)}</span></div><div class="meter"><i style="width:${(S.qi+(p!==null?1:0))/QZ.length*100}%"></i></div></div>
   <p class="q">${Q.q}</p><div class="opts">${opts}</div>
   ${p!==null?`<p class="expl">${p===item.a?`<b class="okc">${L.right}</b> `:`<b class="badc">${L.wrong}</b> `}${Q.e}</p><button class="btn" id="next" type="button">${S.qi<QZ.length-1?L.next:L.res}</button>`:''}
  </main>`;
  $('#back').onclick=()=>go('lesson');
  document.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{S.picked=+b.dataset.i;if(S.picked===item.a)S.score++;render()});
  const n=$('#next');if(n)n.onclick=()=>{if(S.qi<QZ.length-1){S.qi++;S.picked=null;go('quiz')}else{const pass=S.score>=need(QZ.length);if(pass){done.add(x.id);store.set('done',[...done])}go('result')}};
}

function result(){
  const L=U();const x=LESSONS.find(y=>y.id===S.id);const n=x.quiz.length;const pass=S.score>=need(n);
  const list=byLv(x.lv);const nx=list[list.indexOf(x)+1];
  app.innerHTML=header(`<div class="row"><div><h1>${L.res}</h1><p>${tr(x.t)}</p></div>${langSw()}</div>`)+`<main class="wrap"><div class="card result">
   <div class="score">${S.score} / ${n}</div><h3>${pass?L.passT:L.failT}</h3>
   <p class="expl">${pass?(nx?L.passNext(tr(nx.t)):L.passLast):L.fail(need(n),n)}</p></div>
   ${pass&&nx?`<button class="btn" id="nextL" type="button">${L.nextL}</button>`:''}
   ${pass?'':`<button class="btn" id="retry" type="button">${L.retry}</button>`}
   <button class="btn ghost" id="home" type="button">${L.home}</button></main>`;
  $('#home').onclick=()=>go('home');
  const r=$('#retry');if(r)r.onclick=()=>{S.qi=0;S.score=0;S.picked=null;go('quiz')};
  const nl=$('#nextL');if(nl)nl.onclick=()=>{S.id=nx.id;go('lesson')};
}

/* calculators: wire gauge + fuse for a 12/24 V load, battery state of charge + charging voltage */
const fmt=(n,d=0)=>n.toFixed(d).replace('.',',').replace('-','−');
const numv=v=>+String(v).replace(',','.')||0;
const WIRES=[[0.5,8],[0.75,11],[1,15],[1.5,20],[2.5,30],[4,40],[6,55],[10,75],[16,100],[25,135],[35,170],[50,210]];
const FUSES=[1,2,3,5,7.5,10,15,20,25,30,40,50,60,70,80,100,125,150,175,200];
const seg=(k,opts)=>`<div class="seg" role="group">${opts.map((o,i)=>`<button type="button" data-seg="${k}" data-v="${i}" aria-pressed="${S.calc[k]===i}">${o}</button>`).join('')}</div>`;
function calcBlock(){const L=U();const c=S.calc;
  return `<div class="card stack"><div><h3>${L.wT}</h3><p class="expl">${L.wSub}</p></div>
  <div class="fld">${L.inp}${seg('mode',L.inpO)}</div>
  <div class="pair"><label class="fld" for="cw" id="lw">${c.mode?L.cur:L.pw}<input id="cw" type="number" inputmode="decimal" min="0" step="1" value="${c.mode?c.i:c.w}"></label>
  <div class="fld">${L.sys}${seg('v',['12 V','24 V'])}</div></div>
  <div class="pair"><label class="fld" for="cl">${L.len}<input id="cl" type="number" inputmode="decimal" min="0" step="0.5" value="${c.len}"></label>
  <div class="fld">${L.drop}${seg('dr',L.dropO)}</div></div>
  <div class="out" id="out1"></div><p class="expl" id="verd"></p><p class="expl">${L.wNote}</p></div>
  <div class="card stack"><div><h3>${L.bT}</h3><p class="expl">${L.bSub}</p></div>
  <div class="pair"><label class="fld" for="cr">${L.rest}<input id="cr" type="number" inputmode="decimal" min="0" step="0.05" value="${c.rest}"></label>
  <label class="fld" for="cu">${L.run}<input id="cu" type="number" inputmode="decimal" min="0" step="0.05" value="${c.run}"></label></div>
  <div class="out two" id="out2"></div><p class="expl" id="v1"></p><p class="expl" id="v2"></p><p class="expl">${L.bNote}</p></div>`}
function wireCalc(c){
  const U0=c.v?24:12;const I=c.mode?Math.max(0,numv(c.i)):Math.max(0,numv(c.w))/U0;
  const dU=U0*(c.dr?0.05:0.03);const sDrop=Math.max(0,numv(c.len))*I*0.0175/dU;
  let wi=WIRES.findIndex(w=>w[0]>=sDrop&&w[1]>=I);if(wi<0)return {I,big:true};
  let f=FUSES.find(x=>x>=I*1.25);
  while(wi<WIRES.length&&f&&f>WIRES[wi][1])wi++;
  if(wi>=WIRES.length||!f)return {I,big:true};
  return {I,s:WIRES[wi][0],f,sDrop}}
function paintCalc(){const L=U();const c=S.calc;const r=wireCalc(c);const ru=lang==='ru';
  $('#out1').innerHTML=`<div><span>${L.iT}</span><b>${fmt(r.I,1)} ${L.a}</b></div><div><span>${L.wire}</span><b>${r.big?'—':fmt(r.s,r.s<1?2:r.s%1?1:0)} ${L.mm}</b></div><div><span>${L.fuse}</span><b>${r.big?'—':fmt(r.f,r.f%1?1:0)} ${L.a}</b></div>`;
  const v=$('#verd');
  if(r.big){v.textContent=ru?'Слишком большой ток для одного провода: разделите нагрузку или ставьте силовой кабель по расчёту.':'Bitta sim uchun tok juda katta: yuklamani bo\'ling yoki hisob bo\'yicha kuch kabelini qo\'ying.';v.className='expl badc'}
  else{v.textContent=r.I>=15?(ru?`Ток ${fmt(r.I,1)} А — подключайте через реле, а не напрямую через кнопку.`:`Tok ${fmt(r.I,1)} A — tugma orqali to\'g\'ridan-to\'g\'ri emas, rele orqali ulang.`):(ru?`Провод ${fmt(r.s,r.s<1?2:1)} мм², предохранитель ставьте рядом с АКБ.`:`Sim ${fmt(r.s,r.s<1?2:1)} mm², saqlagichni AKB yoniga qo\'ying.`);v.className='expl okc'}
  const rest=numv(c.rest),run=numv(c.run);
  const soc=Math.max(0,Math.min(100,(rest-11.9)/(12.7-11.9)*100));
  $('#out2').innerHTML=`<div><span>${L.soc}</span><b>${rest>0?'~'+fmt(Math.round(soc/5)*5)+' %':'—'}</b></div><div><span>${L.chg}</span><b>${run>0?fmt(run,2)+' V':'—'}</b></div>`;
  const v1=$('#v1'),v2=$('#v2');
  if(rest>0){const ok=rest>=12.5;v1.textContent=rest>13.0?(ru?'Выше 13 В в покое — АКБ ещё не «отдохнул» после поездки или зарядки. Перемерьте позже.':'Tinch holatda 13 V dan yuqori — AKB safar yoki zaryaddan keyin hali «dam olmagan». Keyinroq qayta o\'lchang.'):ok?(ru?'Аккумулятор заряжен.':'Akkumulyator zaryadlangan.'):rest>=12.2?(ru?'АКБ разряжен наполовину — зарядите.':'AKB yarmigacha zaryadsizlangan — zaryadlang.'):(ru?'Сильный разряд — зарядите и проверьте АКБ под нагрузкой, ищите утечку тока.':'Kuchli razryad — zaryadlang, AKB ni yuklama ostida tekshiring, tok oqishini qidiring.');v1.className='expl '+(ok||rest>13?'okc':'badc')}else v1.textContent='';
  if(run>0){const ok=run>=13.5&&run<=14.8;v2.textContent=ok?(ru?'Генератор заряжает нормально.':'Generator me\'yorida zaryadlayapti.'):run<13.5?(ru?'Недозаряд: проверьте ремень, щётки, регулятор, диодный мост.':'Kam zaryad: tasma, cho\'tkalar, regulyator, diod ko\'prigini tekshiring.'):(ru?'Перезаряд: скорее всего регулятор напряжения. АКБ может закипеть.':'Ortiqcha zaryad: katta ehtimol kuchlanish regulyatori. AKB qaynab ketishi mumkin.');v2.className='expl '+(ok?'okc':'badc')}else v2.textContent='';
}
function bindCalc(){
  const on=(id,k)=>{$(id).oninput=e=>{S.calc[k]=e.target.value;paintCalc()}};
  $('#cw').oninput=e=>{S.calc[S.calc.mode?'i':'w']=e.target.value;paintCalc()};
  on('#cl','len');on('#cr','rest');on('#cu','run');
  document.querySelectorAll('[data-seg]').forEach(b=>b.onclick=()=>{const k=b.dataset.seg;S.calc[k]=+b.dataset.v;
    if(k==='mode'){render();return}
    document.querySelectorAll(`[data-seg="${k}"]`).forEach(x=>x.setAttribute('aria-pressed',x===b));paintCalc()});
  paintCalc()}

function bindCommon(){
  document.querySelectorAll('.lang button').forEach(b=>b.onclick=()=>{lang=b.dataset.l;store.set('lang',lang);document.documentElement.lang=lang;render()});
  document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{S.tab=+b.dataset.tab;render()});
}
function render(){({home,lesson,quiz,result})[S.screen]();bindCommon()}
function go(s){S.screen=s;render();window.scrollTo(0,0)}
document.documentElement.lang=lang;
go('home');

</script>
</body>
</html>

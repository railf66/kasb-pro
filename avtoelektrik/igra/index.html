function badge(x,y,label,isNew,lp){
  const [dx,dy]=lp||[0,19];
  return `<g${isNew?' class="newmod"':''}><circle cx="${x}" cy="${y}" r="9" fill="var(--ok)" stroke="#fff" stroke-width="2"/><path d="M${x-4} ${y}l3 3 5-6" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>${TX(x+dx,y+dy,label,{s:8.5,a:dx>0?'start':dx<0?'end':'middle'})}</g>`}
function ring(x,y){return `<g class="slot"><circle cx="${x}" cy="${y}" r="13" fill="color-mix(in srgb,var(--accent) 22%,transparent)" stroke="var(--accent)" stroke-width="2.5" stroke-dasharray="5 3"/><text x="${x}" y="${y+4.5}" font-size="13" font-weight="800" text-anchor="middle" fill="var(--accent-ink)" stroke="var(--accent)" stroke-width="3" paint-order="stroke">?</text></g>`}
function marks(G,POS,nolabel){let s='';
  G.panel.src.forEach(t=>{if(!t.m)return;const p=POS[t.m.p];if(!p)return;
    if(G.placed.includes(t))s+=badge(p[0],p[1],nolabel?'':tr(t.m.s),t===G.justPlaced,p[2]);
    else if(t===G.task&&!G.complete)s+=ring(p[0],p[1]);
    else s+=`<circle cx="${p[0]}" cy="${p[1]}" r="6" fill="none" stroke="var(--rail)" stroke-width="1.5" stroke-dasharray="3 3" opacity=".8"/>`});
  return s}
const doneShare=G=>{const n=G.panel.src.filter(t=>t.m).length;return n?G.placed.length/n:0};
/* work-order chips under the picture: done items show their label, the rest stay hidden */
function chips(G){const all=G.panel.src.filter(t=>t.m);

  const wheel=x=>`<g><circle cx="${x}" cy="160" r="22" fill="#1d232b"/><circle cx="${x}" cy="160" r="10" fill="#9aa3ad"/><circle cx="${x}" cy="160" r="3" fill="#1d232b"/></g>`;

  return `<svg viewBox="0 0 340 200" role="img" aria-label="car" style="overflow:hidden">
  <rect x="2" y="2" width="336" height="196" rx="12" fill="var(--box)"/><rect x="10" y="10" width="320" height="182" rx="8" fill="var(--plate)"/>
  <rect x="10" y="182" width="320" height="10" fill="var(--rail)" opacity=".5"/>
  <g class="${done?'drive':''}">
  ${beam}
  <path d="M18 152V120q2-14 16-16l42-4 36-34q6-6 16-6h78q10 0 18 8l26 32 64 6q14 2 14 16v26z" fill="var(--accent)" stroke="var(--accent-ink)" stroke-width="1.5" opacity=".95"/>

  <circle cx="196" cy="88" r="9" fill="none" stroke="var(--accent-ink)" stroke-width="2.5"/>
  <rect x="238" y="102" width="88" height="48" rx="6" fill="#2b3640" stroke="#fff" stroke-width="1.2" stroke-dasharray="4 3"/>
  <rect x="246" y="122" width="40" height="24" rx="3" fill="#5d6b78"/><rect x="302" y="106" width="20" height="16" rx="2" fill="#14202b" stroke="#9aa3ad"/><path d="M306 104v3M318 104v3" stroke="#9aa3ad" stroke-width="2"/>
  <circle cx="272" cy="112" r="6" fill="#9aa3ad"/>
  <rect x="320" y="110" width="8" height="10" rx="2" fill="${done?'#ffd75e':'#e8eef3'}"/><rect x="18" y="114" width="6" height="10" rx="2" fill="#c4392f"/>
  ${wheel(84)}${wheel(262)}
  ${marks(G,CAR_POS,true)}

  <g transform="translate(22 150)"><rect width="28" height="40" rx="5" fill="#f2c400" stroke="#2a1c00" stroke-width="1.2"/><rect x="4" y="5" width="20" height="10" rx="2" fill="#cfe3a8"/><circle cx="14" cy="27" r="6" fill="#2b3640"/></g>
  ${marks(G,METER_POS,true)}
  </svg>`}

const BOT='kasbpro_uz_bot';

let lang='ru';

const store={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};
const BEST_KEY='kp_igra_'+GAME.key+'_best';

/* ---------- mascot: our usta in a work cap; mood = ok | shock | fire | frost | gas | water | thief ---------- */
function usta(mood){
  const H=GAME.hat,ink='#2a1c00';
  const face={fire:'#6b5a4e',frost:'#bfe0f2',gas:'#cfe0a6'}[mood]||'#f2c79b';
  let eyes=`<circle cx="57" cy="67" r="4.5" fill="${ink}"/><circle cx="83" cy="67" r="4.5" fill="${ink}"/><circle cx="58.5" cy="65.5" r="1.4" fill="#fff"/><circle cx="84.5" cy="65.5" r="1.4" fill="#fff"/>`;
  let mouth=`<path d="M56 90q14 12 28 0" fill="none" stroke="${ink}" stroke-width="3.5" stroke-linecap="round"/>`;
  let extra='',hair='',hy=0,cls='';
  if(mood==='shock'){cls='zap';hy=-14;
    eyes=`<path d="M52 62l10 10M62 62l-10 10M78 62l10 10M88 62l-10 10" stroke="${ink}" stroke-width="4" stroke-linecap="round"/>`;
    mouth=`<path d="M56 96l6-6 6 6 6-6 6 6 6-6" fill="none" stroke="${ink}" stroke-width="3.5" stroke-linejoin="round"/>`;
    hair=`<path d="M30 52l-12-10 14 2-10-14 16 8-2-16 12 14M110 52l12-10-14 2 10-14-16 8 2-16-12 14" fill="none" stroke="${ink}" stroke-width="3" stroke-linejoin="round"/>`;
    extra=`<g class="bolt" fill="#ffd75e" stroke="${ink}" stroke-width="2" stroke-linejoin="round"><path d="M8 80l14-4-6 10 14-3"/><path d="M132 80l-14-4 6 10-14-3"/><path d="M20 120l12-6-3 9 11-5"/></g>`}
  else if(mood==='fire'){
    eyes=`<circle cx="57" cy="67" r="6" fill="#fff"/><circle cx="83" cy="67" r="6" fill="#fff"/><circle cx="57" cy="68" r="2.5" fill="${ink}"/><circle cx="83" cy="68" r="2.5" fill="${ink}"/>`;
    mouth=`<ellipse cx="70" cy="95" rx="7" ry="5" fill="${ink}"/>`;
    extra=`<g fill="#9aa3ad" opacity=".85"><circle class="puff" cx="40" cy="18" r="9"/><circle cx="52" cy="10" r="7"/><circle class="puff" cx="96" cy="16" r="8"/><circle cx="106" cy="6" r="6"/></g>`}
  else if(mood==='frost'){cls='shiver';
    eyes=`<circle cx="57" cy="67" r="6" fill="#fff"/><circle cx="83" cy="67" r="6" fill="#fff"/><circle cx="57" cy="66" r="2.5" fill="${ink}"/><circle cx="83" cy="66" r="2.5" fill="${ink}"/>`;
    mouth=`<rect x="56" y="88" width="28" height="11" rx="3" fill="#fff" stroke="${ink}" stroke-width="2.5"/><path d="M63 88v11M70 88v11M77 88v11" stroke="${ink}" stroke-width="1.5"/>`;
    extra=`<g fill="#e8f6ff" stroke="#7cc0ff" stroke-width="1.5"><path d="M30 61l4 12 4-12z"/><path d="M48 61l3 9 3-9z"/><path d="M90 61l3 10 3-10z"/><path d="M104 61l4 12 4-12z"/></g><g stroke="#7cc0ff" stroke-width="2.5" stroke-linecap="round"><path d="M14 40v16M6 48h16M8 42l12 12M20 42L8 54"/><path d="M124 96v14M117 103h14M119 98l10 10M129 98l-10 10"/></g>`}
  else if(mood==='gas'){
    eyes=`<path d="M51 64l10 4-10 4M89 64l-10 4 10 4" fill="none" stroke="${ink}" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>`;
    mouth=`<path d="M56 94q4-5 7 0t7 0 7 0 7 0" fill="none" stroke="${ink}" stroke-width="3.5" stroke-linecap="round"/>`;
    extra=`<g fill="#b9c9a3" opacity=".9"><circle class="puff" cx="22" cy="96" r="12"/><circle cx="14" cy="76" r="8"/><circle class="puff" cx="118" cy="104" r="13"/><circle cx="128" cy="82" r="8"/><circle class="puff" cx="70" cy="132" r="10"/></g>`}
  else if(mood==='water'){
    eyes=`<path d="M51 68q6-6 12 0M77 68q6-6 12 0" fill="none" stroke="${ink}" stroke-width="3.5" stroke-linecap="round"/>`;
    mouth=`<ellipse cx="70" cy="94" rx="6" ry="7" fill="${ink}"/>`;
    extra=`<g class="drops" fill="#4a90e8"><path d="M30 8q5 8 0 12q-5-4 0-12z"/><path d="M58 0q5 8 0 12q-5-4 0-12z"/><path d="M84 6q5 8 0 12q-5-4 0-12z"/><path d="M110 2q5 8 0 12q-5-4 0-12z"/><path d="M18 50q5 8 0 12q-5-4 0-12z"/><path d="M124 46q5 8 0 12q-5-4 0-12z"/></g>`}
  else if(mood==='thief'){
    eyes=`<circle cx="57" cy="67" r="6.5" fill="#fff"/><circle cx="83" cy="67" r="6.5" fill="#fff"/><circle cx="61" cy="67" r="3" fill="${ink}"/><circle cx="87" cy="67" r="3" fill="${ink}"/>`;
    mouth=`<ellipse cx="70" cy="95" rx="6" ry="6" fill="${ink}"/>`;
    extra=`<text x="118" y="44" font-size="34" font-weight="900" fill="#c4392f" font-family="system-ui">!</text><text x="8" y="44" font-size="30" font-weight="900" fill="#c4392f" font-family="system-ui">?</text>`}
  return `<svg viewBox="0 0 140 150" role="img" aria-label="usta" class="${cls}">${extra}<g class="body">
  <path d="M30 150q0-26 40-26t40 26z" fill="${H.shirt}"/><path d="M58 124h24l-12 14z" fill="${H.cap}"/>
  ${hair}<ellipse cx="70" cy="76" rx="40" ry="38" fill="${face}"/>
  <ellipse cx="30" cy="78" rx="6" ry="9" fill="${face}"/><ellipse cx="110" cy="78" rx="6" ry="9" fill="${face}"/>
  ${eyes}<path d="M50 84q10-6 20 0 10-6 20 0q-10 6-20 1-10 5-20-1z" fill="${mood==='fire'?'#2a2a2a':'#4a2e1a'}"/>${mouth}
  <g transform="translate(0 ${hy})"><path d="M28 58q2-36 42-36t42 36z" fill="${H.cap}"/><path d="M24 54h92q8 0 8 6v2H20v-2q0-6 4-6z" fill="${H.dark}"/><g transform="translate(58 28)">${H.logo}</g></g>
  </g>${mood==='frost'?`<g fill="#e8f6ff" stroke="#7cc0ff" stroke-width="1.5" transform="translate(0 ${hy})"><path d="M30 62l4 12 4-12z"/><path d="M104 62l4 12 4-12z"/></g>`:''}</svg>`}
const THIEF=`<svg viewBox="0 0 120 110" aria-hidden="true"><ellipse cx="60" cy="104" rx="34" ry="5" fill="rgba(0,0,0,.25)"/>
 <path d="M38 98l10-30M76 98l-8-30" stroke="#1d232b" stroke-width="10" stroke-linecap="round"/><rect x="40" y="40" width="40" height="34" rx="12" fill="#2b323b"/>
 <path d="M42 50h36M42 60h36" stroke="#e7edf3" stroke-width="4"/><circle cx="60" cy="26" r="17" fill="#f2c79b"/><path d="M43 22h34v8H43z" fill="#1d232b"/>
 <circle cx="53" cy="26" r="3" fill="#fff"/><circle cx="67" cy="26" r="3" fill="#fff"/><path d="M44 14q16-14 32 0z" fill="#1d232b"/>
 <path d="M80 48l18 8" stroke="#2b323b" stroke-width="8" stroke-linecap="round"/><path d="M96 46q16 4 14 22q-2 14-16 12q-12-2-10-18q2-16 12-16z" fill="#c9a26a"/><text x="99" y="70" font-size="14" font-weight="800" text-anchor="middle" fill="#6b4a1f">$</text></svg>`;

/* ---------- game state ---------- */
let G=null,timer=null;
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
const NP=PANELS.length,IDX=PANELS.map((_,i)=>i);
function newGame(){
  G={score:0,lives:3,combo:0,t:GAME_TIME,right:0,total:0,panels:0,pn:0,order:shuffle(IDX),busy:false};
  loadPanel();render();
  clearInterval(timer);let last=Date.now();
  timer=setInterval(()=>{const now=Date.now(),dt=(now-last)/1000;last=now;if(G.busy||document.hidden)return;
    G.t-=dt;if(G.t<=0){G.t=0;end('time')}else paintTime()},200)}
function loadPanel(){
  if(G.pn>0&&G.pn%NP===0)G.order=shuffle(IDX);
  const P=PANELS[G.order[G.pn%NP]];
  G.panel={P,name:P.name,src:P.tasks,tasks:shuffle(P.tasks)};G.ti=0;G.complete=false;G.placed=[];G.justPlaced=null;nextTask(true)}
function nextTask(first){
  if(!first)G.ti++;
  if(G.ti>=G.panel.tasks.length){G.complete=true;G.panels++;G.score+=300;render();toast(tr(G.panel.P.done)||U().built);haptic('success');G.pn++;G.busy=true;
    setTimeout(()=>{if(!G||G.over)return;G.busy=false;loadPanel();render()},1600);return}
  G.task=G.panel.tasks[G.ti];
  G.opts=shuffle(G.task.o.map((o,i)=>({o,ok:i===0})));G.shown=Date.now()}

/* ---------- screens ---------- */
const app=document.getElementById('app');
const $=s=>document.querySelector(s);
function bar(){const L=U();return `<header class="bar"><a href="../">${L.back}</a><div class="ttl">${GAME.icon} ${L.title}</div><div class="lang" role="group" aria-label="Til"><button type="button" data-l="ru" aria-pressed="${lang==='ru'}">RU</button><button type="button" data-l="uz" aria-pressed="${lang==='uz'}">UZ</button></div></header>`}
function bindBar(){document.querySelectorAll('[data-l]').forEach(b=>b.onclick=()=>{lang=b.dataset.l;store.set('ep_lang',JSON.stringify(lang));document.documentElement.lang=lang;render()})}
let screen='start',result=null;
function render(){document.documentElement.lang=lang;
  if(screen==='start')startScr();else if(screen==='game')gameScr();else endScr();bindBar()}
function startScr(){const L=U();const best=+store.get(BEST_KEY)||0;
  app.innerHTML=bar()+`<main class="wrap"><div class="hero">${usta('ok')}</div><h1>${L.h1}</h1><p class="lead">${L.lead}</p>
  <div class="card"><ul class="rules">${L.r.map(r=>`<li><span>${r[0]}</span><div>${r[1]}</div></li>`).join('')}</ul></div>
  ${best?`<div class="best">${L.best}: <b>${best}</b></div>`:''}
  <button class="btn" id="play" type="button">${L.play}</button><p class="small">${L.safe}</p></main>`;
  $('#play').onclick=()=>{screen='game';newGame()}}
function gameScr(){const L=U();const t=G.task;
  const opts=G.opts.map((x,i)=>`<button class="opt" type="button" data-i="${i}"><span>${tr(x.o)}</span></button>`).join('');
  app.innerHTML=bar()+`<main class="wrap" id="gw">
  <div class="hud"><span class="sc" id="sc">${G.score}</span><span class="lv" aria-label="lives">${[0,1,2].map(i=>`<i class="${i<G.lives?'':'off'}">${GAME.life}</i>`).join('')}</span><span class="tm" id="tm"></span></div>
  <div class="tbar"><i id="tb"></i></div>
  <div class="pname"><span>${L.panel(G.panels+1,tr(G.panel.name))}</span>${G.combo>1?`<span class="combo">${L.combo(Math.min(G.combo,5))}</span>`:''}</div>
  <div class="panel">${GAME.board(G)}</div>
  ${G.complete?'':`<p class="q">${tr(t.q)}</p><div class="opts">${opts}</div>`}</main>`;
  G.justPlaced=null;paintTime();
  document.querySelectorAll('[data-i]').forEach(b=>b.onclick=()=>answer(+b.dataset.i,b))}
function paintTime(){const tm=$('#tm'),tb=$('#tb');if(!tm)return;const s=Math.ceil(G.t);
  tm.textContent=`${Math.floor(s/60)}:${String(s%60).padStart(2,'0')}`;tm.classList.toggle('low',s<=15);
  tb.style.width=(G.t/GAME_TIME*100)+'%';tb.classList.toggle('low',s<=15)}
function answer(i,btn){if(G.busy)return;const x=G.opts[i],t=G.task;G.total++;
  if(x.ok){G.right++;G.combo++;const fast=(Date.now()-G.shown)<5000;
    const pts=100+25*Math.min(G.combo-1,4)+(fast?50:0);G.score+=pts;
    if(t.m){G.placed.push(t);G.justPlaced=t}
    btn.classList.add('right');floatTxt('+'+pts);haptic('light');G.busy=true;
    setTimeout(()=>{if(G.over)return;G.busy=false;nextTask();render()},380)}
  else{G.combo=0;G.lives--;G.busy=true;G.panel.tasks.push(t); // wrong task comes back later in this panel
    haptic('error');failFx(t)}}
function failFx(t){const L=U();const fx=t.fx||'shock',mood=fx==='angry'?'thief':fx;
  const f=document.createElement('div');f.className='flash'+(fx==='shock'?'':' '+(fx==='angry'?'thief':fx));document.body.appendChild(f);setTimeout(()=>f.remove(),1000);
  if(fx==='thief'){const r=document.createElement('div');r.className='runner';r.innerHTML=THIEF;document.body.appendChild(r);setTimeout(()=>r.remove(),1200)}
  const gw=$('#gw');if(gw)gw.classList.add('shake');
  const titles=t.ft?[tr(t.ft)]:L.fails[fx];const title=titles[Math.random()*titles.length|0];
  const ov=document.createElement('div');ov.className='ov';
  ov.innerHTML=`<div class="sheet" role="alertdialog" aria-live="assertive"><div class="who">${usta(mood)}<h2>${title}</h2></div>
  <p class="ans">${L.right} <b>${tr(t.o[0])}</b></p><p class="why">${tr(t.e)}</p><button class="btn" type="button" id="ovn">${L.next}</button></div>`;
  setTimeout(()=>{document.body.appendChild(ov);$('#ovn').focus()},fx==='thief'?700:350);
  ov.querySelector('#ovn').onclick=()=>{ov.remove();G.busy=false;if(G.lives<=0){end('lives');return}nextTask();render()}}
function floatTxt(s){const d=document.createElement('div');d.className='float';d.textContent=s;document.body.appendChild(d);setTimeout(()=>d.remove(),800)}
function toast(s){const d=document.createElement('div');d.className='toast';d.textContent=s;document.body.appendChild(d);setTimeout(()=>d.remove(),1500)}
function haptic(k){try{const h=tg&&tg.HapticFeedback;if(!h)return;if(k==='light')h.impactOccurred('light');else h.notificationOccurred(k)}catch(e){}}
function end(why){if(!G||G.over)return;G.over=true;clearInterval(timer);
  document.querySelectorAll('.ov').forEach(o=>o.remove());
  const prev=+store.get(BEST_KEY)||0;const rec=G.score>prev;if(rec)store.set(BEST_KEY,G.score);
  result={score:G.score,panels:G.panels,right:G.right,total:G.total,why,rec,best:Math.max(prev,G.score)};
  screen='end';render()}
function rankOf(s){const r=GAME.ranks||[1200,2400,3600];return s<r[0]?0:s<r[1]?1:s<r[2]?2:3}
function endScr(){const L=U(),r=result;const acc=r.total?Math.round(r.right/r.total*100):0;
  app.innerHTML=bar()+`<main class="wrap"><div class="hero">${usta(r.why==='lives'?GAME.loseMood:'ok')}</div>
  <h1>${r.why==='lives'?L.overLives:L.over}</h1>
  <div class="big">${r.score}</div><div class="center"><span class="rank">${L.ranks[rankOf(r.score)]}</span></div>
  ${r.rec&&r.score>0?`<p class="lead"><b>🏆 ${L.rec}</b></p>`:`<div class="best">${L.best}: <b>${r.best}</b></div>`}
  <div class="stats"><div><b>${r.score}</b><span>${L.score}</span></div><div><b>${r.panels}</b><span>${L.panels}</span></div><div><b>${acc}%</b><span>${L.acc}</span></div></div>
  <button class="btn tg" id="share" type="button">📤 ${L.share}</button>
  <button class="btn" id="again" type="button">${L.again}</button>
  <a class="btn ghost" href="../">📘 ${L.learn}</a></main>`;
  $('#again').onclick=()=>{screen='game';newGame()};
  $('#share').onclick=share}
function share(){const r=result;const url=`https://t.me/${BOT}?start=${GAME.start}`;
  const link=`https://t.me/share/url?url=${encodeURIComponent(url)}&text=${encodeURIComponent(U().shareText(r.score,r.panels))}`;
  try{if(tg&&tg.initData&&tg.openTelegramLink){tg.openTelegramLink(link);return}}catch(e){}
  window.open(link,'_blank','noopener')}
render();

</script>
</body>
</html>

    :fire?`<circle cx="57" cy="67" r="6" fill="#fff"/><circle cx="83" cy="67" r="6" fill="#fff"/><circle cx="57" cy="68" r="2.5" fill="${ink}"/><circle cx="83" cy="68" r="2.5" fill="${ink}"/>`
    :`<circle cx="57" cy="67" r="4.5" fill="${ink}"/><circle cx="83" cy="67" r="4.5" fill="${ink}"/><circle cx="58.5" cy="65.5" r="1.4" fill="#fff"/><circle cx="84.5" cy="65.5" r="1.4" fill="#fff"/>`;
  const mouth=shock?`<path d="M56 96l6-6 6 6 6-6 6 6 6-6" fill="none" stroke="${ink}" stroke-width="3.5" stroke-linejoin="round"/>`
    :fire?`<ellipse cx="70" cy="95" rx="7" ry="5" fill="${ink}"/>`
    :`<path d="M56 90q14 12 28 0" fill="none" stroke="${ink}" stroke-width="3.5" stroke-linecap="round"/>`;
  const hair=shock?`<path d="M30 52l-12-10 14 2-10-14 16 8-2-16 12 14M110 52l12-10-14 2 10-14-16 8 2-16-12 14" fill="none" stroke="${ink}" stroke-width="3" stroke-linejoin="round"/>`:'';
  const hy=shock?-14:0;

  </g></svg>`}

/* ---------- panel drawing ---------- */
const MW={'1':34,'in':56,'3':80,'d':56,'r':56,'lamp':32};
function modSVG(m,x,isNew){
  const w=MW[m.k],y=30,h=82;let g=`<g${isNew?' class="newmod"':''}>`;
  g+=`<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="3" fill="var(--mod)" stroke="var(--modline)"/>`;
  g+=`<rect x="${x}" y="${y}" width="${w}" height="9" rx="2" fill="#dfe4e9"/><rect x="${x}" y="${y+h-9}" width="${w}" height="9" rx="2" fill="#dfe4e9"/>`;
  const poles=m.k==='3'?3:(m.k==='in'||m.k==='d'||m.k==='r')?2:1;
  for(let i=0;i<poles;i++){const cx=x+w/poles*(i+.5);g+=`<circle cx="${cx}" cy="${y+4.5}" r="2.6" fill="#8d969f"/><circle cx="${cx}" cy="${y+h-4.5}" r="2.6" fill="#8d969f"/>`}
  if(m.k==='lamp'){['#c4392f','#2a2a2a','#8d969f'].forEach((c,i)=>g+=`<circle cx="${x+w/2}" cy="${y+22+i*14}" r="4.5" fill="#ffd75e" stroke="${c}" stroke-width="2"/>`)}
  else{const lw=Math.min(w-10,poles>1?w-12:16);g+=`<rect x="${x+(w-lw)/2}" y="${y+22}" width="${lw}" height="18" rx="3" fill="#2b3640"/><rect x="${x+(w-lw)/2+2}" y="${y+24}" width="${lw-4}" height="7" rx="2" fill="#5d6b78"/>`}
  if(m.k==='d'||m.k==='r')g+=`<rect x="${x+w-14}" y="${y+46}" width="9" height="9" rx="2" fill="#f2c400"/><text x="${x+w-9.5}" y="${y+53.5}" font-size="7" font-weight="700" text-anchor="middle" fill="#2a1c00">T</text>`;
  g+=`<text x="${x+(m.k==='d'||m.k==='r'?w/2-6:w/2)}" y="${y+56}" font-size="${m.a.length>4?8:10}" font-weight="700" text-anchor="middle" fill="#14202b" font-family="Golos Text,system-ui">${m.a}</text>`;
  if(m.k==='d')g+=`<text x="${x+w/2-6}" y="${y+65}" font-size="7" text-anchor="middle" fill="#5b6876">30mA</text>`;
  const s=tr(m.s);g+=`<text x="${x+w/2}" y="${y+h+13}" font-size="${s.length>7?7.5:9}" text-anchor="middle" fill="var(--fg)" font-family="Golos Text,system-ui">${s}</text>`;
  return g+'</g>'}
function panelSVG(){
  const P=G.panel,mods=[];let w=0;
  P.src.forEach(t=>{if(t.m){mods.push(t);w+=MW[t.m.k]+3}});
  let x=(340-w)/2,s='';
  mods.forEach(t=>{const placed=G.placed.includes(t),cur=t===G.task&&!G.complete;
    if(placed)s+=modSVG(t.m,x,t===G.justPlaced);
    else s+=`<rect${cur?' class="slot"':''} x="${x+1}" y="31" width="${MW[t.m.k]-2}" height="80" rx="3" fill="none" stroke="${cur?'var(--accent)':'var(--rail)'}" stroke-width="${cur?2.5:1.2}" stroke-dasharray="5 4" opacity="${cur?1:.7}"/>`;
    x+=MW[t.m.k]+3});
  const nOn=G.bus.N,peOn=G.bus.PE;
  const bus=(y,on,fill,label)=>{let b=`<rect x="70" y="${y}" width="200" height="10" rx="3" fill="${on?fill:'var(--rail)'}" opacity="${on?1:.45}"/>`;
    for(let i=0;i<8;i++)b+=`<circle cx="${86+i*24}" cy="${y+5}" r="2.6" fill="${on?'#fff':'var(--plate)'}" opacity=".9"/>`;
    return b+`<text x="62" y="${y+8.5}" font-size="10" font-weight="700" text-anchor="end" fill="var(--fg)">${label}</text>`};
  const wire=(y,c,on)=>on?`<path d="M318 ${y-30} C 300 ${y-30}, 300 ${y+5}, 272 ${y+5}" fill="none" stroke="${c}" stroke-width="5" stroke-linecap="round"/>`:'';
  return `<svg viewBox="0 0 340 196" role="img" aria-label="${tr(P.name)}">
  <defs><pattern id="pe" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="10" height="10" fill="#2f9e44"/><rect width="5" height="10" fill="#e3c400"/></pattern></defs>
  <rect x="2" y="2" width="336" height="192" rx="12" fill="var(--box)"/><rect x="12" y="12" width="316" height="172" rx="8" fill="var(--plate)"/>
  <rect x="14" y="62" width="312" height="18" rx="2" fill="var(--rail)"/><rect x="14" y="66" width="312" height="10" fill="var(--box)" opacity=".5"/>
  ${s}${bus(150,nOn,'#1e6fd0','N')}${bus(168,peOn,'url(#pe)','PE')}${wire(150,'#1e6fd0',nOn)}${wire(168,'url(#pe)',peOn)}
  </svg>`}

/* ---------- game state ---------- */
let G=null,timer=null;
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
function newGame(){
  G={score:0,lives:3,combo:0,t:GAME_TIME,right:0,total:0,panels:0,pn:0,order:shuffle([0,1,2]),busy:false};
  loadPanel();render();
  clearInterval(timer);let last=Date.now();
  timer=setInterval(()=>{const now=Date.now(),dt=(now-last)/1000;last=now;if(G.busy||document.hidden)return;
    G.t-=dt;if(G.t<=0){G.t=0;end('time')}else paintTime()},200)}
function loadPanel(){
  if(G.pn>0&&G.pn%3===0)G.order=shuffle([0,1,2]);
  const P=PANELS[G.order[G.pn%3]];
  G.panel={name:P.name,src:P.tasks,tasks:shuffle(P.tasks)};G.ti=0;G.complete=false;G.placed=[];G.bus={N:false,PE:false};G.justPlaced=null;nextTask(true)}
function nextTask(first){
  if(!first)G.ti++;
  if(G.ti>=G.panel.tasks.length){G.complete=true;G.panels++;G.score+=300;toast(U().built);haptic('success');G.pn++;G.busy=true;
    setTimeout(()=>{if(!G||G.over)return;G.busy=false;loadPanel();render()},1100);return}
  G.task=G.panel.tasks[G.ti];
  G.opts=shuffle(G.task.o.map((o,i)=>({o,ok:i===0})));G.shown=Date.now()}

const app=document.getElementById('app');
const $=s=>document.querySelector(s);
function bar(){const L=U();return `<header class="bar"><a href="../">${L.back}</a><div class="ttl">⚡ ${L.title}</div><div class="lang" role="group" aria-label="Til"><button type="button" data-l="ru" aria-pressed="${lang==='ru'}">RU</button><button type="button" data-l="uz" aria-pressed="${lang==='uz'}">UZ</button></div></header>`}
function bindBar(){document.querySelectorAll('[data-l]').forEach(b=>b.onclick=()=>{lang=b.dataset.l;store.set('ep_lang',JSON.stringify(lang));document.documentElement.lang=lang;render()})}
let screen='start',result=null;
function render(){document.documentElement.lang=lang;
  if(screen==='start')startScr();else if(screen==='game')gameScr();else endScr();bindBar()}
function startScr(){const L=U();const best=+store.get('kp_igra_best')||0;
  app.innerHTML=bar()+`<main class="wrap"><div class="hero">${usta('ok')}</div><h1>${L.h1}</h1><p class="lead">${L.lead}</p>
  <div class="card"><ul class="rules">${L.r.map(r=>`<li><span>${r[0]}</span><div>${r[1]}</div></li>`).join('')}</ul></div>
  ${best?`<div class="best">${L.best}: <b>${best}</b></div>`:''}
  <button class="btn" id="play" type="button">${L.play}</button><p class="small">${L.safe}</p></main>`;
  $('#play').onclick=()=>{screen='game';newGame()}}
function gameScr(){const L=U();const t=G.task;
  let opts='';
  G.opts.forEach((x,i)=>{let sw='';
    if(t.wire&&x.o===TO.N)sw=`<span class="w" style="background:var(--wN)"></span>`;
    else if(t.wire&&x.o===TO.PE)sw=`<span class="w" style="background:repeating-linear-gradient(45deg,#e3c400 0 5px,#2f9e44 5px 10px)"></span>`;
    else if(t.wire&&x.o===TO.brk)sw=`<span class="w" style="background:#2b3640"></span>`;
    opts+=`<button class="opt" type="button" data-i="${i}">${sw}<span>${tr(x.o)}</span></button>`});
  const wireTag=t.wire?`<div class="small" style="text-align:left;display:flex;align-items:center;gap:8px"><span class="w" style="display:inline-block;width:40px;height:10px;border-radius:5px;background:${W[t.wire].c==='pe'?'repeating-linear-gradient(45deg,#e3c400 0 5px,#2f9e44 5px 10px)':W[t.wire].c}"></span>${tr(W[t.wire])}</div>`:'';
  app.innerHTML=bar()+`<main class="wrap" id="gw">
  <div class="hud"><span class="sc" id="sc">${G.score}</span><span class="lv" aria-label="lives">${[0,1,2].map(i=>`<i class="${i<G.lives?'':'off'}">⚡</i>`).join('')}</span><span class="tm" id="tm"></span></div>
  <div class="tbar"><i id="tb"></i></div>
  <div class="pname"><span>${L.panel(G.panels+1,tr(G.panel.name))}</span>${G.combo>1?`<span class="combo">${L.combo(Math.min(G.combo,5))}</span>`:''}</div>
  <div class="panel">${panelSVG()}</div>
  ${G.complete?'':`${wireTag}<p class="q">${tr(t.q)}</p><div class="opts">${opts}</div>`}</main>`;
  G.justPlaced=null;paintTime();
  document.querySelectorAll('[data-i]').forEach(b=>b.onclick=()=>answer(+b.dataset.i,b))}
function paintTime(){const tm=$('#tm'),tb=$('#tb');if(!tm)return;const s=Math.ceil(G.t);
  tm.textContent=`${Math.floor(s/60)}:${String(s%60).padStart(2,'0')}`;tm.classList.toggle('low',s<=15);
  tb.style.width=(G.t/GAME_TIME*100)+'%';tb.classList.toggle('low',s<=15)}
function answer(i,btn){if(G.busy)return;const x=G.opts[i],t=G.task;G.total++;
  if(x.ok){G.right++;G.combo++;const fast=(Date.now()-G.shown)<5000;
    const pts=100+25*Math.min(G.combo-1,4)+(fast?50:0);G.score+=pts;
    if(t.m){G.placed.push(t);G.justPlaced=t}
    if(t.bus){if(t.bus.includes('N'))G.bus.N=true;if(t.bus.includes('PE'))G.bus.PE=true}
    btn.classList.add('right');floatTxt('+'+pts);haptic('light');G.busy=true;
    setTimeout(()=>{if(G.over)return;G.busy=false;nextTask();render()},380)}
  else{G.combo=0;G.lives--;G.busy=true;G.panel.tasks.push(t); // wrong task comes back later in this panel
haptic('error');shockFx(t)}}
function shockFx(t){const L=U();const fire=t.fx==='fire';
  const f=document.createElement('div');f.className='flash'+(fire?' fire':'');document.body.appendChild(f);setTimeout(()=>f.remove(),900);
  const gw=$('#gw');if(gw){gw.classList.add('shake')}
  const titles=fire?L.fire:L.shock;const title=titles[Math.random()*titles.length|0];
  const ov=document.createElement('div');ov.className='ov';
  ov.innerHTML=`<div class="sheet" role="alertdialog" aria-live="assertive"><div class="who">${usta(fire?'fire':'shock')}<h2>${title}</h2></div>
  <p class="ans">${L.right} <b>${tr(t.o[0])}</b></p><p class="why">${tr(t.e)}</p><button class="btn" type="button" id="ovn">${L.next}</button></div>`;
  setTimeout(()=>{document.body.appendChild(ov);$('#ovn').focus()},350);
  ov.querySelector('#ovn').onclick=()=>{ov.remove();G.busy=false;if(G.lives<=0){end('lives');return}nextTask();render()}}
function floatTxt(s){const d=document.createElement('div');d.className='float';d.textContent=s;document.body.appendChild(d);setTimeout(()=>d.remove(),800)}
function toast(s){const d=document.createElement('div');d.className='toast';d.textContent=s;document.body.appendChild(d);setTimeout(()=>d.remove(),1100)}
function haptic(k){try{const h=tg&&tg.HapticFeedback;if(!h)return;if(k==='light')h.impactOccurred('light');else h.notificationOccurred(k)}catch(e){}}
function end(why){if(!G||G.over)return;G.over=true;clearInterval(timer);
  document.querySelectorAll('.ov').forEach(o=>o.remove());
  const prev=+store.get('kp_igra_best')||0;const rec=G.score>prev;if(rec)store.set('kp_igra_best',G.score);
  result={score:G.score,panels:G.panels,right:G.right,total:G.total,why,rec,best:Math.max(prev,G.score)};
  screen='end';render()}
function rankOf(s){return s<1200?0:s<2400?1:s<3600?2:3}
function endScr(){const L=U(),r=result;const acc=r.total?Math.round(r.right/r.total*100):0;
  app.innerHTML=bar()+`<main class="wrap"><div class="hero">${usta(r.why==='lives'?'shock':'ok')}</div>
  <h1>${r.why==='lives'?L.overLives:L.over}</h1>
  <div class="big">${r.score}</div><div class="center"><span class="rank">${L.ranks[rankOf(r.score)]}</span></div>
  ${r.rec&&r.score>0?`<p class="lead"><b>🏆 ${L.rec}</b></p>`:`<div class="best">${L.best}: <b>${r.best}</b></div>`}
  <div class="stats"><div><b>${r.score}</b><span>${L.score}</span></div><div><b>${r.panels}</b><span>${L.panels}</span></div><div><b>${acc}%</b><span>${L.acc}</span></div></div>
  <button class="btn tg" id="share" type="button">📤 ${L.share}</button>
  <button class="btn" id="again" type="button">${L.again}</button>
  <a class="btn ghost" href="../">📘 ${L.learn}</a></main>`;
  $('#again').onclick=()=>{screen='game';newGame()};
  $('#share').onclick=share}
function share(){const r=result;const url=`https://t.me/${BOT}?start=igra`;
  const link=`https://t.me/share/url?url=${encodeURIComponent(url)}&text=${encodeURIComponent(U().shareText(r.score,r.panels))}`;
  try{if(tg&&tg.initData&&tg.openTelegramLink){tg.openTelegramLink(link);return}}catch(e){}
  window.open(link,'_blank','noopener')}
render();
</script>
</body>

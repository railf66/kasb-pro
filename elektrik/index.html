 quiz:[
  {a:1,ru:{q:'Чем проверить, что напряжения нет?',o:['Пальцем, быстро','Индикаторной отвёрткой или тестером','Достаточно выключить свет'],e:'Только прибором: индикатором или мультиметром. И на каждом проводе.'},uz:{q:'Kuchlanish yo\'qligini nima bilan tekshirish kerak?',o:['Barmoq bilan, tezda','Indikator otvyortka yoki tester bilan','Chiroqni o\'chirish yetarli'],e:'Faqat asbob bilan: indikator yoki multimetr. Va har bir simda.'}},
  {a:0,ru:{q:'Индикатор загорелся на проводе. Это…',o:['Фаза','Ноль','Заземление'],e:'Индикатор светится на фазе. На ноле и заземлении он не горит.'},uz:{q:'Indikator simda yondi. Bu…',o:['Faza','Nol','Yerga ulash'],e:'Indikator fazada yonadi. Nol va yerga ulashda yonmaydi.'}},
  {a:2,ru:{q:'Что сделать, чтобы никто не включил автомат во время работы?',o:['Ничего, все и так знают','Работать быстрее','Повесить табличку или заклеить автомат'],e:'Табличка «Не включать» спасает жизни. Лучше ещё и заклеить автомат.'},uz:{q:'Ish vaqtida avtomatni hech kim yoqmasligi uchun nima qilish kerak?',o:['Hech narsa, hamma biladi','Tezroq ishlash','Yozuv osish yoki avtomatni yopishtirish'],e:'«Yoqmang» yozuvi hayotni saqlaydi. Avtomatni yopishtirib qo\'ygan ham ma\'qul.'}},
  {a:1,ru:{q:'Какой инструмент нужен электрику?',o:['Любой из гаража','С изолированными ручками до 1000 В','Металлический без ручек'],e:'Инструмент с изоляцией до 1000 В защищает, если вы ошиблись с линией.'},uz:{q:'Elektrikka qanday asbob kerak?',o:['Garajdagi istalgani','Dastasi 1000 V gacha izolyatsiyalangan','Dastasiz metall asbob'],e:'1000 V gacha izolyatsiyali asbob liniyada xato qilsangiz ham himoya qiladi.'}}]},

{id:'b2',lv:0,min:5,
 t:{ru:'Инструменты',uz:'Asboblar'},s:{ru:'Индикатор, мультиметр, клещи',uz:'Indikator, multimetr, ombir'},
 table:{head:{ru:['Инструмент','Зачем нужен'],uz:['Asbob','Nima uchun kerak']},rows:{
  ru:[['Индикаторная отвёртка','Найти фазу, проверить, что напряжения нет'],['Мультиметр','Измерить напряжение (V), сопротивление (Ω), прозвонить провод'],['Стриппер','Аккуратно снять изоляцию, не повредив жилу'],['Бокорезы','Откусить провод нужной длины'],['Пассатижи','Скрутить, согнуть, держать'],['Отвёртки PH2 и плоская','Затянуть клеммы розеток, автоматов'],['Перфоратор и коронка 68 мм','Сделать отверстие под подрозетник']],
  uz:[['Indikator otvyortka','Fazani topish, kuchlanish yo\'qligini tekshirish'],['Multimetr','Kuchlanish (V), qarshilik (Ω) o\'lchash, simni tekshirish'],['Stripper','Tomirga zarar yetkazmay izolyatsiyani tozalash'],['Kusachka (bokorez)','Simni kerakli uzunlikda kesish'],['Passatij (ombir)','Burash, egish, ushlab turish'],['PH2 va yassi otvyortka','Rozetka, avtomat klemmalarini qotirish'],['Perforator va 68 mm koronka','Podrozetnik uchun teshik ochish']]}},
 steps:{ru:['Мультиметр для 220 В ставьте на режим <b>V~ 750</b> (переменное напряжение).','Щупы: чёрный в гнездо COM, красный в гнездо V.','В розетке между фазой и нолём должно быть 220–230 В. Между нолём и землёй около 0 В.','Прозвонка (значок динамика): отключите питание, коснитесь щупами концов провода. Писк означает, что провод целый.'],
       uz:['220 V uchun multimetrni <b>V~ 750</b> rejimiga qo\'ying (o\'zgaruvchan kuchlanish).','Shchuplar: qorasi COM uyasiga, qizili V uyasiga.','Rozetkada faza va nol orasida 220–230 V bo\'lishi kerak. Nol va yer orasida 0 V atrofida.','Prozvonka (dinamik belgisi): tokni o\'chiring, shchuplarni sim uchlariga tekkizing. Chiyillash sim butunligini bildiradi.']},
 tip:{ru:'Дешёвая индикаторная отвёртка иногда «врёт». Перед работой проверьте её на розетке, где точно есть напряжение.',uz:'Arzon indikator otvyortka ba\'zan «aldaydi». Ishdan oldin uni kuchlanish aniq bor rozetkada tekshiring.'},
 quiz:[
  {a:2,ru:{q:'Какой режим мультиметра для проверки розетки?',o:['Ω (сопротивление)','A (ток)','V~ (переменное напряжение)'],e:'В розетке переменное напряжение, режим V~ с пределом 750 В.'},uz:{q:'Rozetkani tekshirish uchun multimetrning qaysi rejimi?',o:['Ω (qarshilik)','A (tok)','V~ (o\'zgaruvchan kuchlanish)'],e:'Rozetkada o\'zgaruvchan kuchlanish, 750 V chegarali V~ rejimi.'}},
  {a:0,ru:{q:'Сколько вольт между фазой и нолём в квартире?',o:['220–230 В','12 В','380 В'],e:'В обычной квартире 220–230 В. 380 В бывает между двумя фазами.'},uz:{q:'Xonadonda faza va nol orasida necha volt?',o:['220–230 V','12 V','380 V'],e:'Oddiy xonadonda 220–230 V. 380 V ikki faza orasida bo\'ladi.'}},
  {a:1,ru:{q:'Прозвонку провода делают…',o:['Под напряжением','При отключённом питании','Только на улице'],e:'Прозвонка только без напряжения, иначе сгорит прибор.'},uz:{q:'Simni prozvonka qilish…',o:['Kuchlanish ostida','Tok o\'chirilganda','Faqat ko\'chada'],e:'Prozvonka faqat kuchlanishsiz, aks holda asbob kuyadi.'}},
  {a:1,ru:{q:'Чем лучше снимать изоляцию?',o:['Ножом по кругу','Стриппером','Зубами'],e:'Стриппер не режет медь. Надрезанная жила потом ломается и греется.'},uz:{q:'Izolyatsiyani nima bilan tozalagan yaxshi?',o:['Pichoq bilan aylantirib','Stripper bilan','Tish bilan'],e:'Stripper misni kesmaydi. Kesilgan tomir keyin sinadi va qiziydi.'}}]},

{id:'b3',lv:0,min:7,
 t:{ru:'Подключение розетки',uz:'Rozetkani ulash'},s:{ru:'Фаза, ноль и заземление',uz:'Faza, nol va yerga ulash'},
 svg:l=>svg(panel(l=='ru'?'ЩИТОК':'SHIT')+breaker(40,56,l=='ru'?'Автомат 16 А':'Avtomat 16 A')+nbus(150,l=='ru'?'Шина N':'N shinasi')+`<rect x="22" y="190" width="72" height="10" rx="3" fill="url(#pe)"/>`+tx(58,214,l=='ru'?'Шина PE':'PE shinasi')+
  wire('M76 80H180V100H244',W.L)+wire('M94 155H190V150H244',W.N)+wire('M94 195H210V200H290V176',W.PE)+
  tx(150,74,'L',{w:700,s:13,c:'var(--wL)'})+tx(150,148,'N',{w:700,s:13,c:'var(--wN)'})+tx(140,188,'PE',{w:700,s:13})+
  `<circle cx="290" cy="125" r="62" fill="var(--surface)" stroke="var(--fg)" stroke-width="2"/><circle cx="290" cy="125" r="46" fill="none" stroke="var(--line)" stroke-width="2"/><rect x="284" y="75" width="12" height="14" rx="2" fill="url(#pe)" stroke="var(--fg)"/><rect x="284" y="161" width="12" height="14" rx="2" fill="url(#pe)" stroke="var(--fg)"/><circle cx="270" cy="125" r="7" fill="var(--bg)" stroke="var(--fg)" stroke-width="1.5"/><circle cx="310" cy="125" r="7" fill="var(--bg)" stroke="var(--fg)" stroke-width="1.5"/><circle cx="250" cy="100" r="6" fill="var(--wL)"/><circle cx="250" cy="150" r="6" fill="var(--wN)"/><path d="M250 100 L270 120 M250 150 L270 130" stroke="var(--fg)" stroke-width="1.5"/>`+
  tx(290,242,l=='ru'?'РОЗЕТКА (вид сзади)':'ROZETKA (orqa tomoni)',{w:700,s:12,c:'var(--muted)'}),
  l=='ru'?'Схема подключения розетки: от автомата в щитке три провода — фаза, ноль и заземление — к клеммам розетки':'Rozetkani ulash sxemasi: shitdagi avtomatdan rozetka klemmalariga uchta sim'),
 legend:['L','N','PE'],
 steps:{ru:['Отключите автомат этой линии в щитке и проверьте индикаторной отвёрткой, что на проводах нет напряжения.','Зачистите концы проводов на <b>8–10 мм</b>. Медная жила не должна быть надрезана.','<b>Фазу L</b> (коричневый) и <b>ноль N</b> (синий) подключите к двум боковым клеммам. В бытовой розетке их порядок не важен.','<b>Землю PE</b> (жёлто-зелёный) подключите к центральной клемме, она соединена с металлическими «усами» розетки.','Затяните винты и подёргайте каждый провод. Уложите провода в подрозетник, закрепите розетку, включите автомат и проверьте тестером: должно быть 220–230 В.'],
       uz:['Shitda shu liniya avtomatini o\'chiring va indikator otvyortka bilan simlarda kuchlanish yo\'qligini tekshiring.','Sim uchlarini <b>8–10 mm</b> tozalang. Mis tomir kesilmagan bo\'lishi kerak.','<b>Faza L</b> (jigarrang) va <b>nol N</b> (ko\'k) simlarini ikki yon klemmaga ulang. Maishiy rozetkada ularning tartibi muhim emas.','<b>Yerga ulash PE</b> (sariq-yashil) simini o\'rtadagi klemmaga ulang, u rozetkaning metall «mo\'ylov»lariga ulangan.','Vintlarni qotiring va har bir simni tortib ko\'ring. Simlarni podrozetnikka joylang, rozetkani mahkamlang, avtomatni yoqing va tester bilan tekshiring: 220–230 V bo\'lishi kerak.']},
 tip:{ru:'В старых домах часто всего два провода, без земли. Тогда центральную клемму оставляют свободной. Перемычку между нолём и землёй делать нельзя.',uz:'Eski uylarda ko\'pincha faqat ikkita sim bo\'ladi, yerga ulash yo\'q. Bunda o\'rtadagi klemma bo\'sh qoladi. Nol va yerga ulash orasiga peremichka qo\'yish mumkin emas.'},
 quiz:[
  {a:1,ru:{q:'Что нужно сделать в самом начале?',o:['Снять старую розетку','Отключить автомат и проверить, что напряжения нет','Зачистить провода'],e:'Сначала всегда отключаем автомат и проверяем индикатором.'},uz:{q:'Eng avval nima qilish kerak?',o:['Eski rozetkani yechish','Avtomatni o\'chirish va kuchlanish yo\'qligini tekshirish','Simlarni tozalash'],e:'Avval doim avtomatni o\'chiramiz va indikator bilan tekshiramiz.'}},
  {a:2,ru:{q:'Какого цвета провод заземления (PE)?',o:['Синий','Коричневый','Жёлто-зелёный'],e:'Заземление всегда жёлто-зелёное. Синий — ноль, коричневый — фаза.'},uz:{q:'Yerga ulash simi (PE) qanday rangda?',o:['Ko\'k','Jigarrang','Sariq-yashil'],e:'Yerga ulash simi doim sariq-yashil. Ko\'k — nol, jigarrang — faza.'}},
  {a:1,ru:{q:'На сколько зачищать изоляцию для винтовой клеммы?',o:['2–3 мм','8–10 мм','25–30 мм'],e:'8–10 мм: меньше — плохой контакт, больше — голая жила торчит из клеммы.'},uz:{q:'Vintli klemma uchun izolyatsiya qancha tozalanadi?',o:['2–3 mm','8–10 mm','25–30 mm'],e:'8–10 mm: kamroq bo\'lsa kontakt yomon, ko\'proq bo\'lsa yalang\'och tomir chiqib turadi.'}},
  {a:1,ru:{q:'Куда подключают жёлто-зелёный провод?',o:['К любой боковой клемме','К центральной клемме заземления','Никуда, его изолируют'],e:'PE идёт на центральную клемму, соединённую с «усами» розетки.'},uz:{q:'Sariq-yashil sim qayerga ulanadi?',o:['Istalgan yon klemmaga','O\'rtadagi yerga ulash klemmasiga','Hech qayerga, u izolyatsiyalanadi'],e:'PE rozetka «mo\'ylov»lari bilan bog\'langan o\'rta klemmaga ulanadi.'}}]},

{id:'b4',lv:0,min:6,
 t:{ru:'Одноклавишный выключатель',uz:'Bir klavishli o\'chirgich'},s:{ru:'Разрывает фазу, а не ноль',uz:'Nol emas, faza uziladi'},
 svg:l=>svg(panel(l=='ru'?'ЩИТОК':'SHIT')+breaker(40,56,l=='ru'?'Автомат 10 А':'Avtomat 10 A')+nbus(170,l=='ru'?'Шина N':'N shinasi')+
  wire('M76 80H160',W.L)+`<circle cx="160" cy="80" r="5" fill="var(--fg)"/><circle cx="204" cy="80" r="5" fill="var(--fg)"/><path d="M160 80L200 62" stroke="var(--fg)" stroke-width="3" stroke-linecap="round"/>`+
  wire('M204 80H300V106',W.L)+wire('M94 175H300V134',W.N)+lamp(300,120,false)+
  tx(182,108,l=='ru'?'Выключатель':'O\'chirgich',{w:600})+tx(280,124,l=='ru'?'Лампа':'Lampa',{a:'end',s:10,c:'var(--muted)'})+
  tx(130,72,'L',{w:700,s:13,c:'var(--wL)'})+tx(250,72,'L′',{w:700,s:13,c:'var(--wL)'})+tx(200,168,'N',{w:700,s:13,c:'var(--wN)'})+
  tx(200,226,l=='ru'?'Ноль идёт к лампе напрямую':'Nol lampaga to\'g\'ridan-to\'g\'ri boradi',{c:'var(--muted)'}),
  l=='ru'?'Схема выключателя: фаза идёт через выключатель к лампе, ноль идёт к лампе напрямую':'O\'chirgich sxemasi: faza o\'chirgich orqali lampaga, nol to\'g\'ridan-to\'g\'ri'),
 legend:['L','N'],
 steps:{ru:['Отключите автомат освещения и проверьте отсутствие напряжения.','В распредкоробке найдите фазу (L) от щитка и ноль (N).','Фазу подключите к выключателю. Второй провод от выключателя (L′) ведите к лампе.','Ноль от щитка соедините с нулевым проводом лампы напрямую, через клемму Wago.','Включите автомат. При выключенной клавише на патроне лампы индикатор гореть не должен.'],
       uz:['Yoritish avtomatini o\'chiring va kuchlanish yo\'qligini tekshiring.','Taqsimlash qutisida shitdan kelgan faza (L) va nolni (N) toping.','Fazani o\'chirgichga ulang. O\'chirgichdan chiqqan ikkinchi simni (L′) lampaga olib boring.','Shitdan kelgan nolni lampaning nol simi bilan to\'g\'ridan-to\'g\'ri, Wago klemmasi orqali ulang.','Avtomatni yoqing. Klavisha o\'chiq bo\'lganda lampa patronida indikator yonmasligi kerak.']},
 tip:{ru:'Если выключатель разрывает ноль, лампа гаснет, но на патроне остаётся фаза. Менять лампу в таком патроне опасно.',uz:'Agar o\'chirgich nolni uzsa, lampa o\'chadi, lekin patronda faza qoladi. Bunday patronda lampani almashtirish xavfli.'},
 quiz:[
  {a:0,ru:{q:'Какой провод должен разрывать выключатель?',o:['Фазу L','Ноль N','Заземление PE'],e:'Выключатель всегда ставят в разрыв фазы.'},uz:{q:'O\'chirgich qaysi simni uzishi kerak?',o:['Faza L','Nol N','Yerga ulash PE'],e:'O\'chirgich doim faza uzilishiga qo\'yiladi.'}},
  {a:2,ru:{q:'Как ноль приходит к лампе?',o:['Через выключатель','Через автомат 10 А отдельно','Напрямую из распредкоробки'],e:'Ноль идёт к лампе напрямую, без выключателя.'},uz:{q:'Nol lampaga qanday keladi?',o:['O\'chirgich orqali','Alohida 10 A avtomat orqali','Taqsimlash qutisidan to\'g\'ridan-to\'g\'ri'],e:'Nol lampaga o\'chirgichsiz to\'g\'ridan-to\'g\'ri boradi.'}},
  {a:1,ru:{q:'Лампа выключена, а индикатор на патроне горит. Почему?',o:['Так и должно быть','Выключатель разрывает ноль, а не фазу','Сгорела лампа'],e:'Это ошибка подключения: перепутали фазу и ноль на выключателе.'},uz:{q:'Lampa o\'chiq, lekin patronda indikator yonyapti. Nega?',o:['Shunday bo\'lishi kerak','O\'chirgich fazani emas, nolni uzyapti','Lampa kuygan'],e:'Bu ulash xatosi: o\'chirgichda faza va nol almashib ketgan.'}},
  {a:0,ru:{q:'Какой автомат обычно ставят на освещение?',o:['10 А','32 А','63 А'],e:'На свет с кабелем 1,5 мм² ставят автомат 10 А.'},uz:{q:'Yoritishga odatda qanday avtomat qo\'yiladi?',o:['10 A','32 A','63 A'],e:'1,5 mm² kabelli yoritishga 10 A avtomat qo\'yiladi.'}}]},

{id:'b5',lv:0,min:6,
 t:{ru:'Подключение люстры',uz:'Qandilni ulash'},s:{ru:'Двухклавишный выключатель, две группы ламп',uz:'Ikki klavishli o\'chirgich, ikki guruh lampa'},
 svg:l=>svg(panel(l=='ru'?'ЩИТОК':'SHIT')+breaker(40,56,l=='ru'?'Автомат 10 А':'Avtomat 10 A')+nbus(190,'N')+
  wire('M76 80H150',W.L)+box(150,52,52,64)+tx(176,132,l=='ru'?'2-клавишный':'2 klavishli',{s:10,w:600})+
  `<circle cx="160" cy="80" r="4" fill="var(--fg)"/><path d="M160 80L194 66M160 80L194 98" stroke="var(--fg)" stroke-width="2"/>`+
  wire('M202 66H320V126',W.L)+wire('M202 98H260V126',W.L)+wire('M94 195H320V154',W.N)+wire('M260 195V154',W.N)+
  lamp(260,140)+lamp(320,140)+tx(260,214,l=='ru'?'Группа 1':'1-guruh',{s:10})+tx(320,214,l=='ru'?'Группа 2':'2-guruh',{s:10})+
  tx(240,92,'L1',{w:700,c:'var(--wL)'})+tx(290,60,'L2',{w:700,c:'var(--wL)'})+tx(180,188,'N',{w:700,c:'var(--wN)'}),
  l=='ru'?'Двухклавишный выключатель: фаза приходит на общую клемму, две клавиши подают фазу на две группы ламп, ноль общий':'Ikki klavishli o\'chirgich: faza umumiy klemmaga, ikki klavisha ikki guruh lampaga faza beradi, nol umumiy'),
 legend:['L','N'],
 steps:{ru:['Отключите автомат и проверьте отсутствие напряжения.','У люстры обычно 3 провода: две фазы групп (L1, L2) и общий ноль (N). Плюс PE на корпус, если есть.','Фазу из щитка подключите на <b>общую</b> клемму выключателя (обычно отмечена L или стрелкой).','Два выхода выключателя соедините с L1 и L2 люстры.','Ноль люстры соедините с нолём из щитка. Проверьте каждую клавишу.'],
       uz:['Avtomatni o\'chiring va kuchlanish yo\'qligini tekshiring.','Qandilda odatda 3 ta sim bor: guruhlarning ikki fazasi (L1, L2) va umumiy nol (N). Agar bo\'lsa, korpusga PE.','Shitdan kelgan fazani o\'chirgichning <b>umumiy</b> klemmasiga ulang (odatda L yoki strelka bilan belgilangan).','O\'chirgichning ikki chiqishini qandilning L1 va L2 simlariga ulang.','Qandil nolini shitdan kelgan nolga ulang. Har bir klavishani tekshiring.']},
 tip:{ru:'Если у люстры провода одного цвета, найдите общий ноль прозвонкой: он соединён со всеми патронами.',uz:'Agar qandil simlari bir xil rangda bo\'lsa, umumiy nolni prozvonka bilan toping: u barcha patronlarga ulangan.'},
 quiz:[
  {a:1,ru:{q:'Куда подключают фазу на двухклавишном выключателе?',o:['На любой выход','На общую клемму','Не подключают'],e:'Фаза приходит на общую клемму, а выходы идут к группам ламп.'},uz:{q:'Ikki klavishli o\'chirgichda faza qayerga ulanadi?',o:['Istalgan chiqishga','Umumiy klemmaga','Ulanmaydi'],e:'Faza umumiy klemmaga keladi, chiqishlar lampa guruhlariga boradi.'}},
  {a:0,ru:{q:'Сколько проводов обычно у люстры на две группы (без PE)?',o:['3','2','5'],e:'L1, L2 и общий ноль N.'},uz:{q:'Ikki guruhli qandilda odatda nechta sim bor (PE siz)?',o:['3','2','5'],e:'L1, L2 va umumiy nol N.'}},
  {a:2,ru:{q:'Ноль для обеих групп…',o:['Разный, через клавиши','Не нужен','Общий'],e:'Ноль общий для всех ламп и идёт напрямую.'},uz:{q:'Ikkala guruh uchun nol…',o:['Har xil, klavishalar orqali','Kerak emas','Umumiy'],e:'Nol barcha lampalar uchun umumiy va to\'g\'ridan-to\'g\'ri boradi.'}},

       uz:['Ikkita <b>o\'tish</b> o\'chirgichi kerak. Har birida 3 ta klemma: umumiy (L) va ikkita chiqish.','Shitdan kelgan fazani 1-o\'chirgichning umumiy klemmasiga ulang.','1-o\'chirgichning chiqish klemmalarini 2-o\'chirgichning chiqish klemmalari bilan ikki sim (peremichka) orqali ulang. 3×1,5 kabel kerak.','2-o\'chirgichning umumiy klemmasidan lampaga sim torting.','Nol lampaga to\'g\'ridan-to\'g\'ri boradi. Tekshiring: har bir o\'chirgich chiroqni yoqib-o\'chirishi kerak.']},

  {a:2,ru:{q:'Сколько клемм у проходного выключателя?',o:['2','4','3'],e:'Общая и две выходные.'},uz:{q:'O\'tish o\'chirgichida nechta klemma bor?',o:['2','4','3'],e:'Umumiy va ikkita chiqish.'}},

  {a:1,ru:{q:'Куда приходит фаза из щитка?',o:['На выходную клемму','На общую клемму выключателя 1','Сразу на лампу'],e:'Фаза на общую клемму первого, а с общей клеммы второго к лампе.'},uz:{q:'Shitdan faza qayerga keladi?',o:['Chiqish klemmasiga','1-o\'chirgichning umumiy klemmasiga','To\'g\'ri lampaga'],e:'Faza birinchisining umumiy klemmasiga, ikkinchisining umumiy klemmasidan lampaga.'}},
  {a:1,ru:{q:'Нужно управлять светом из трёх мест. Что добавить?',o:['Ещё один проходной','Перекрёстный выключатель','Обычный выключатель'],e:'Перекрёстный ставят между двумя проходными.'},uz:{q:'Chiroqni uch joydan boshqarish kerak. Nima qo\'shish kerak?',o:['Yana bitta o\'tish o\'chirgichi','Kesishuvchi o\'chirgich','Oddiy o\'chirgich'],e:'Kesishuvchi o\'chirgich ikki o\'tish o\'chirgichi orasiga qo\'yiladi.'}}]},

       uz:['Avtomat kabel kesimiga qarab tanlanadi: 1,5 mm² → 10 A, 2,5 mm² → 16 A, 4 mm² → 25 A, 6 mm² → 32 A.','Xonadon uchun <b>C</b> xarakteristikali avtomatlar oling (korpusda C16, C10).','Odamlar uchun UZO <b>30 mA</b> sizish tokiga olinadi. Vannaxona uchun 10 mA bo\'lishi mumkin.','UZO nominali kirish avtomatidan kam bo\'lmasligi kerak (32 A avtomat → 40 A UZO).','Oyda bir marta UZOdagi «Test» tugmasini bosing: u o\'chishi kerak.']},
 tip:{ru:'Нельзя ставить автомат больше, чем выдерживает провод. Автомат 25 А на кабеле 1,5 мм² не спасёт от пожара.',uz:'Sim ko\'tara oladiganidan katta avtomat qo\'yish mumkin emas. 1,5 mm² kabelga 25 A avtomat yong\'indan saqlamaydi.'},

  {a:0,ru:{q:'Какой ток утечки у УЗО для защиты людей?',o:['30 мА','300 мА','3 А'],e:'30 мА: такой ток утечки отключает УЗО до опасного момента.'},uz:{q:'Odamlarni himoya qilish uchun UZO sizish toki qancha?',o:['30 mA','300 mA','3 A'],e:'30 mA: UZO xavfli holatdan oldin o\'chadi.'}},
  {a:2,ru:{q:'Кабель 2,5 мм² для розеток. Какой автомат?',o:['32 А','25 А','16 А'],e:'2,5 мм² → 16 А.'},uz:{q:'Rozetkalar uchun 2,5 mm² kabel. Qanday avtomat?',o:['32 A','25 A','16 A'],e:'2,5 mm² → 16 A.'}},

 steps:{ru:['Порядок: ввод → вводной автомат → счётчик → УЗО → автоматы групп.','Делите квартиру на группы: свет, розетки комнат, розетки кухни, кондиционер, мощные приборы (плита, бойлер) отдельно.','Ноль каждой группы ставьте на шину N, заземление на шину PE. Ноль и землю в щитке квартиры не соединяют.','Подпишите каждый автомат: «Свет зал», «Розетки кухня».','Оставьте 2–3 свободных места в щитке на будущее.'],
       uz:['Tartib: kirish → kirish avtomati → hisoblagich → UZO → guruh avtomatlari.','Xonadonni guruhlarga bo\'ling: yorug\'lik, xona rozetkalari, oshxona rozetkalari, konditsioner, quvvatli asboblar (plita, boyler) alohida.','Har bir guruhning nolini N shinasiga, yerga ulashni PE shinasiga qo\'ying. Xonadon shitida nol va yer ulanmaydi.','Har bir avtomatni yozib qo\'ying: «Zal yorug\'i», «Oshxona rozetkasi».','Kelajak uchun shitda 2–3 ta bo\'sh joy qoldiring.']},

  {a:2,ru:{q:'Какую технику ставят на отдельную линию?',o:['Лампы','Зарядку телефона','Плиту и кондиционер'],e:'Мощные приборы всегда на своей линии.'},uz:{q:'Qaysi texnika alohida liniyaga qo\'yiladi?',o:['Lampalar','Telefon zaryadkasi','Plita va konditsioner'],e:'Quvvatli asboblar doim o\'z liniyasida.'}},

{id:'m4',lv:1,min:6,
 t:{ru:'Сечение кабеля',uz:'Kabel kesimi'},s:{ru:'Расчёт по мощности',uz:'Quvvat bo\'yicha hisoblash'},
 table:{head:{ru:['Медь, мм²','Автомат','Мощность до'],uz:['Mis, mm²','Avtomat','Quvvat']},rows:{
  ru:[['1,5','10 А','2,2 кВт'],['2,5','16 А','3,5 кВт'],['4','25 А','5,5 кВт'],['6','32 А','7 кВт'],['10','50 А','11 кВт'],['16','63 А','14 кВт']],
  uz:[['1,5','10 A','2,2 kVt'],['2,5','16 A','3,5 kVt'],['4','25 A','5,5 kVt'],['6','32 A','7 kVt'],['10','50 A','11 kVt'],['16','63 A','14 kVt']]}},
 calc:true,
 steps:{ru:['Сложите мощность всех приборов на линии (в ваттах). Мощность написана на наклейке прибора.','Ток считают так: <b>I = P ÷ 220</b>. Например, 3000 Вт ÷ 220 = 13,6 А.','Подберите автомат ближе всего к току, но не меньше: 13,6 А → 16 А.','По таблице подберите кабель под автомат: 16 А → 2,5 мм².','Используйте только медь (ВВГнг, NYM). Алюминий для квартиры не подходит.'],
       uz:['Liniyadagi barcha asboblar quvvatini qo\'shing (vattda). Quvvat asbob yorlig\'ida yozilgan.','Tok shunday hisoblanadi: <b>I = P ÷ 220</b>. Masalan, 3000 Vt ÷ 220 = 13,6 A.','Tokka eng yaqin, lekin kam bo\'lmagan avtomatni tanlang: 13,6 A → 16 A.','Jadvaldan avtomatga mos kabelni tanlang: 16 A → 2,5 mm².','Faqat mis kabel ishlating (VVGng, NYM). Alyuminiy xonadon uchun mos emas.']},
 tip:{ru:'Если линия длиннее 30 метров, берите кабель на один размер больше: на длинном проводе теряется напряжение.',uz:'Liniya 30 metrdan uzun bo\'lsa, bir o\'lcham katta kabel oling: uzun simda kuchlanish yo\'qoladi.'},
 quiz:[
  {a:1,ru:{q:'Чайник 2200 Вт. Какой ток?',o:['22 А','10 А','2,2 А'],e:'2200 ÷ 220 = 10 А.'},uz:{q:'Choynak 2200 Vt. Tok qancha?',o:['22 A','10 A','2,2 A'],e:'2200 ÷ 220 = 10 A.'}},
  {a:0,ru:{q:'Ток линии 20 А. Какой кабель?',o:['4 мм² с автоматом 25 А','1,5 мм²','2,5 мм² с автоматом 32 А'],e:'20 А → автомат 25 А → кабель 4 мм².'},uz:{q:'Liniya toki 20 A. Qanday kabel?',o:['4 mm², 25 A avtomat bilan','1,5 mm²','2,5 mm², 32 A avtomat bilan'],e:'20 A → 25 A avtomat → 4 mm² kabel.'}},
  {a:2,ru:{q:'Какой металл кабеля для квартиры?',o:['Алюминий','Сталь','Медь'],e:'Медь надёжнее и меньше греется.'},uz:{q:'Xonadon uchun kabel qaysi metalldan?',o:['Alyuminiy','Po\'lat','Mis'],e:'Mis ishonchliroq va kamroq qiziydi.'}},
  {a:1,ru:{q:'Линия 40 метров. Что сделать?',o:['Ничего','Взять кабель на размер больше','Поставить автомат больше'],e:'На длинной линии падает напряжение, поэтому кабель берут толще.'},uz:{q:'Liniya 40 metr. Nima qilish kerak?',o:['Hech narsa','Bir o\'lcham katta kabel olish','Kattaroq avtomat qo\'yish'],e:'Uzun liniyada kuchlanish tushadi, shuning uchun kabel yo\'g\'onroq olinadi.'}}]},

 svg:l=>{const term=(ox,star)=>{let s=`<rect x="${ox}" y="40" width="160" height="130" rx="10" fill="var(--bg)" stroke="var(--line)" stroke-width="2"/>`;

  else xs.forEach(x=>s+=`<path d="M${x} 80V130" stroke="var(--accent)" stroke-width="7" stroke-linecap="round"/>`);

 legend:['L','K','G'],
 steps:{ru:['Посмотрите на табличку двигателя: там написано, например, <b>Δ/Y 220/380 В</b>.','Если сеть 380 В, а на табличке 220/380 В, соединяйте <b>звездой</b>: одна перемычка на верхние клеммы W2–U2–V2.','Если на табличке 380/660 В, в сети 380 В соединяйте <b>треугольником</b>: три вертикальные перемычки.','Фазы L1, L2, L3 подключите к нижним клеммам U1, V1, W1. Корпус двигателя заземлите.','Двигатель крутится не в ту сторону? Поменяйте местами любые две фазы.'],
       uz:['Dvigatel jadvalchasiga qarang: unda, masalan, <b>Δ/Y 220/380 V</b> deb yozilgan.','Tarmoq 380 V, jadvalchada 220/380 V bo\'lsa, <b>yulduz</b> qilib ulang: yuqori klemmalarga W2–U2–V2 bitta peremichka.','Jadvalchada 380/660 V bo\'lsa, 380 V tarmoqda <b>uchburchak</b> qilib ulang: uchta vertikal peremichka.','L1, L2, L3 fazalarni pastki U1, V1, W1 klemmalariga ulang. Dvigatel korpusini yerga ulang.','Dvigatel teskari aylanyaptimi? Istalgan ikki fazaning o\'rnini almashtiring.']},

 steps:{ru:['Кнопка <b>СТОП</b> нормально замкнутая (NC), кнопка <b>ПУСК</b> нормально разомкнутая (NO).','Фаза идёт: СТОП → ПУСК → катушка пускателя A1, с A2 через тепловое реле (95–96) на ноль.','Блок-контакт пускателя <b>13–14</b> ставят параллельно кнопке ПУСК. Это самоподхват: двигатель работает после отпускания кнопки.','Силовые контакты пускателя (1-2, 3-4, 5-6) подают три фазы на двигатель через тепловое реле.','Катушка бывает на 220 В или 380 В. Смотрите надпись на пускателе.'],

 tip:{ru:'Без самоподхвата двигатель будет работать только пока держишь кнопку ПУСК.',uz:'O\'zini ushlab turishsiz dvigatel faqat PUSK tugmasini bosib turganda ishlaydi.'},

 steps:{ru:['Ввод от опоры делают кабелем <b>СИП</b>: для 3 фаз 4×16 мм², для 1 фазы 2×16 мм².','Порядок в щите: вводной автомат → счётчик → реле напряжения → противопожарное УЗО 100–300 мА → группы.','Делайте контур заземления: 3 стальных штыря по 2–3 м, забитых треугольником на расстоянии 2–3 м, соединённых полосой.','Сопротивление заземления должно быть не больше <b>30 Ом</b>, лучше до 10 Ом. Меряют специальным прибором.','Баню, гараж, насос, уличное освещение выводите отдельными группами со своим УЗО 30 мА.'],
       uz:['Ustundan kirish <b>SIP</b> kabeli bilan qilinadi: 3 faza uchun 4×16 mm², 1 faza uchun 2×16 mm².','Shitdagi tartib: kirish avtomati → hisoblagich → kuchlanish relesi → yong\'inga qarshi UZO 100–300 mA → guruhlar.','Yerga ulash konturi qiling: 2–3 m li 3 ta po\'lat qoziq, uchburchak shaklida 2–3 m oraliqda qoqilgan va polosa bilan ulangan.','Yerga ulash qarshiligi <b>30 Om</b> dan oshmasligi kerak, yaxshisi 10 Om gacha. Maxsus asbob bilan o\'lchanadi.','Hammom, garaj, nasos, ko\'cha yoritgichini o\'z 30 mA UZOsi bilan alohida guruhlarga chiqaring.']},
 tip:{ru:'В частном доме ноль и землю разделяют на вводе (система TN-C-S). После точки разделения их нельзя соединять обратно.',uz:'Xususiy uyda nol va yer kirishda ajratiladi (TN-C-S tizimi). Ajratish nuqtasidan keyin ularni qayta ulash mumkin emas.'},

  {a:0,ru:{q:'Каким кабелем делают ввод от опоры?',o:['СИП','ПВС','Телефонным'],e:'СИП самонесущий, он выдерживает натяжение и погоду.'},uz:{q:'Ustundan kirish qaysi kabel bilan qilinadi?',o:['SIP','PVS','Telefon kabeli'],e:'SIP o\'zini ko\'taruvchi, tortilish va ob-havoga chidaydi.'}},

  uz:[["WAGO klemmalari","Tarqatish qutilari, qandillar. Tez va ishonchli"],["Gilza + presslash","Devordagi kabelni uzaytirish, kuch liniyalari"],["Burash + kavsharlash","Misni mis bilan, klemma bo'lmaganda. Kavshar izolyatsiya qilinadi"],["Boltli ulash","Mis bilan alyuminiy faqat po'lat shayba yoki maxsus klemma orqali"],["Yalang'och burash","Mumkin emas: qiziydi va vaqt o'tib yonadi"]]}},
 steps:{ru:["Отключите автомат и проверьте отсутствие напряжения на каждом проводе.","Снимите изоляцию стриппером на длину, указанную на клемме (обычно 10–12 мм). Не надрезайте жилу.","Для WAGO вставьте жилу до упора и закройте рычажок. Потяните провод: он не должен выходить.","Для гильзы подберите её по сечению, вставьте жилы с двух сторон и обожмите пресс-клещами.","Изолируйте соединение термоусадкой или изолентой в 2–3 слоя. Голого металла остаться не должно."],
       uz:["Avtomatni o'chiring va har bir simda kuchlanish yo'qligini tekshiring.","Izolyatsiyani stripper bilan klemmada ko'rsatilgan uzunlikda tozalang (odatda 10–12 mm). Tomirni kesib qo'ymang.","WAGO uchun tomirni oxirigacha kiriting va dastachani yoping. Simni torting: u chiqmasligi kerak.","Gilzani kesim bo'yicha tanlang, tomirlarni ikki tomondan kiriting va press-ombir bilan qising.","Ulanishni termousadka yoki izolenta bilan 2–3 qavat izolyatsiya qiling. Ochiq metall qolmasligi kerak."]},
 tip:{ru:"Медь и алюминий напрямую не соединяют: в месте контакта они окисляются, соединение греется и горит.",uz:"Mis va alyuminiy to'g'ridan-to'g'ri ulanmaydi: tegish joyida ular oksidlanadi, ulanish qiziydi va yonadi."},
 quiz:[
  {a:1,ru:{q:"Можно ли оставить в коробке простую скрутку без пайки и клемм?",o:["Да, если туго скручено","Нет, она греется и может загореться","Можно только на люстре"],e:"Голая скрутка со временем ослабевает, греется и горит. Нужны клеммы, гильза или пайка."},uz:{q:"Qutida kavsharsiz va klemmasiz oddiy burashni qoldirish mumkinmi?",o:["Ha, qattiq buralgan bo'lsa","Yo'q, u qiziydi va yonishi mumkin","Faqat qandilda mumkin"],e:"Yalang'och burash vaqt o'tib bo'shaydi, qiziydi va yonadi. Klemma, gilza yoki kavshar kerak."}},
  {a:2,ru:{q:"Как соединить медный провод с алюминиевым?",o:["Простой скруткой","Пайкой","Через специальную клемму или болт со стальной шайбой"],e:"Медь и алюминий напрямую окисляются. Нужна прослойка: специальная клемма или стальная шайба."},uz:{q:"Mis simni alyuminiy sim bilan qanday ulash kerak?",o:["Oddiy burash bilan","Kavsharlash bilan","Maxsus klemma yoki po'lat shaybali bolt orqali"],e:"Mis va alyuminiy to'g'ridan-to'g'ri oksidlanadi. Oraliq kerak: maxsus klemma yoki po'lat shayba."}},
  {a:0,ru:{q:"Как проверить, что провод хорошо сидит в клемме WAGO?",o:["Потянуть за провод","Включить свет","Постучать по коробке"],e:"После установки слегка потяните провод. Если вышел, жила вставлена не до конца."},uz:{q:"Sim WAGO klemmasida yaxshi o'rnashganini qanday tekshirish mumkin?",o:["Simni tortib ko'rish","Chiroqni yoqish","Qutini taqillatish"],e:"O'rnatgandan keyin simni sal torting. Chiqib ketsa, tomir oxirigacha kiritilmagan."}},
  {a:1,ru:{q:"Чем снимать изоляцию с жилы?",o:["Ножом по кругу","Стриппером, не повреждая жилу","Зубами"],e:"Нож часто надрезает медь, и в этом месте провод потом ломается. Стриппер снимает аккуратно."},uz:{q:"Tomirdan izolyatsiyani nima bilan tozalash kerak?",o:["Pichoq bilan aylantirib","Stripper bilan, tomirga zarar yetkazmay","Tish bilan"],e:"Pichoq ko'pincha misni kesib qo'yadi va sim keyin o'sha joyda sinadi. Stripper ehtiyotkorlik bilan tozalaydi."}}]},

{id:"n2",lv:0,min:6,nowarn:true,
 t:{ru:"Первая помощь при ударе током",uz:"Tok urganda birinchi yordam"},s:{ru:"Что делать в первую минуту",uz:"Birinchi daqiqada nima qilish kerak"},
 steps:{ru:["Не трогайте человека голыми руками, пока он под током: ударит и вас.","Отключите автомат или рубильник. Если нельзя, отбросьте провод сухой палкой, стоя на сухой доске или резине.","Позвоните 103 (скорая). Попросите кого-то рядом встретить врачей.","Проверьте дыхание: 10 секунд смотрите на грудь и слушайте у рта. Если дышит, уложите на бок и не оставляйте одного.","Если не дышит, начинайте непрямой массаж сердца: 30 нажатий в центр груди на 5–6 см, затем 2 вдоха. Продолжайте до приезда скорой."],
       uz:["Odam tok ostida bo'lsa, unga yalang'och qo'l bilan tegmang: sizni ham uradi.","Avtomat yoki rubilnikni o'chiring. Iloji bo'lmasa, quruq taxta yoki rezina ustida turib, simni quruq tayoq bilan uloqtiring.","103 ga qo'ng'iroq qiling (tez yordam). Yoningizdagi kimdandir shifokorlarni kutib olishni so'rang.","Nafasni tekshiring: 10 soniya ko'krakka qarang va og'iz yonida tinglang. Nafas olsa, yonboshiga yotqizing va yolg'iz qoldirmang.","Nafas olmasa, yurakni bilvosita massaj qiling: ko'krak markaziga 5–6 sm chuqurlikda 30 marta bosing, keyin 2 marta nafas bering. Tez yordam kelguncha davom eting."]},
 tip:{ru:"Даже если человек пришёл в себя и чувствует себя хорошо, после удара током обязательно нужен врач: сбои сердца бывают через несколько часов. Закапывать в землю нельзя, это миф.",uz:"Odam o'ziga kelib, o'zini yaxshi his qilsa ham, tok urgandan keyin albatta shifokor kerak: yurak ishidagi buzilishlar bir necha soatdan keyin ham bo'ladi. Yerga ko'mish mumkin emas, bu afsona."},
 quiz:[
  {a:2,ru:{q:"Человек держится за провод под током. Что делать первым?",o:["Схватить его за руку и оттащить","Облить водой","Отключить автомат или отбросить провод сухой палкой"],e:"Сначала освободить от тока, не касаясь человека. Иначе пострадавших станет двое."},uz:{q:"Odam tok ostidagi simni ushlab turibdi. Birinchi nima qilish kerak?",o:["Qo'lidan ushlab tortib olish","Suv sepish","Avtomatni o'chirish yoki simni quruq tayoq bilan uloqtirish"],e:"Avval odamga tegmasdan tokdan ozod qilish kerak. Aks holda jabrlanuvchi ikkita bo'ladi."}},
  {a:0,ru:{q:"Какой номер скорой помощи в Узбекистане?",o:["103","101","102"],e:"103 — скорая помощь. 101 — пожарные, 102 — милиция."},uz:{q:"O'zbekistonda tez yordam raqami qaysi?",o:["103","101","102"],e:"103 — tez yordam. 101 — o't o'chiruvchilar, 102 — militsiya."}},
  {a:1,ru:{q:"Пострадавший не дышит. Как делать массаж сердца?",o:["5 нажатий и 5 вдохов","30 нажатий в центр груди, затем 2 вдоха","Только хлопать по щекам"],e:"Схема 30:2, глубина 5–6 см, около 100 нажатий в минуту."},uz:{q:"Jabrlanuvchi nafas olmayapti. Yurak massaji qanday qilinadi?",o:["5 marta bosish va 5 marta nafas","Ko'krak markaziga 30 marta bosish, keyin 2 nafas","Faqat yuziga urish"],e:"30:2 sxemasi, chuqurligi 5–6 sm, daqiqasiga taxminan 100 marta bosish."}},
  {a:1,ru:{q:"Человек пришёл в себя и говорит, что всё хорошо. Нужен ли врач?",o:["Нет, раз всё хорошо","Да, сбои сердца бывают через несколько часов","Только если есть ожог"],e:"После удара током врач нужен всегда, даже если человек чувствует себя нормально."},uz:{q:"Odam o'ziga keldi va hammasi yaxshi deyapti. Shifokor kerakmi?",o:["Yo'q, hammasi yaxshi bo'lsa","Ha, yurak buzilishlari bir necha soatdan keyin bo'ladi","Faqat kuyish bo'lsa"],e:"Tok urgandan keyin shifokor doim kerak, odam o'zini yaxshi his qilsa ham."}}]},

/* ---------- 3-й разряд ---------- */
{id:"n3",lv:1,min:8,
 t:{ru:"Прокладка проводки",uz:"Elektr simlarini yotqizish"},s:{ru:"Трассы, штробы, гофра, высоты",uz:"Trassalar, shtrobalar, gofra, balandliklar"},
 table:{head:{ru:["Что","Обычная высота"],uz:["Nima","Odatdagi balandlik"]},rows:{
  ru:[["Горизонтальная трасса","15–20 см от потолка"],["Выключатель","80–100 см от пола, у двери со стороны ручки"],["Розетка в комнате","30 см от пола"],["Розетка на кухне над столом","100–110 см от пола"],["От угла, двери, окна","не ближе 10 см"]],
  uz:[["Gorizontal trassa","shiftdan 15–20 sm"],["O'chirgich","poldan 80–100 sm, eshik yonida tutqich tomonda"],["Xonadagi rozetka","poldan 30 sm"],["Oshxonada stol ustidagi rozetka","poldan 100–110 sm"],["Burchak, eshik, derazadan","10 sm dan yaqin emas"]]}},
 steps:{ru:["Нарисуйте трассы на стене. Провода ведут только по прямым: вертикально и горизонтально, без диагоналей.","Сделайте фото трасс с рулеткой. Потом никто не просверлит провод при вешании полки.","Штробу делают штроборезом с пылесосом. В несущих стенах панельного дома горизонтальные штробы делать нельзя.","В бетоне и кирпиче кабель можно класть прямо в штробу. По гипсокартону и дереву — только в негорючей гофре.","Кабель крепят каждые 30–50 см, а штробу заделывают гипсом. Запас в коробке — 10–15 см."],
       uz:["Devorga trassalarni chizing. Simlar faqat to'g'ri chiziq bo'ylab: vertikal va gorizontal, diagonalsiz yotqiziladi.","Trassalarni ruletka bilan suratga oling. Keyin javon osayotganda hech kim simni teshib qo'ymaydi.","Shtroba shtrobarez va changyutgich bilan qilinadi. Panel uyning yuk ko'taruvchi devorlarida gorizontal shtroba qilish mumkin emas.","Beton va g'ishtda kabelni to'g'ridan-to'g'ri shtrobaga qo'yish mumkin. Gipsokarton va yog'och bo'ylab — faqat yonmaydigan gofrada.","Kabel har 30–50 sm da mahkamlanadi, shtroba gips bilan yopiladi. Qutida zaxira — 10–15 sm."]},
 tip:{ru:"Для квартиры берите кабель ВВГнг-LS или NYM: он не распространяет горение и мало дымит. Алюминий в новой проводке не используют.",uz:"Xonadon uchun VVGng-LS yoki NYM kabelini oling: u yonishni tarqatmaydi va kam tutun chiqaradi. Yangi simlarda alyuminiy ishlatilmaydi."},
 quiz:[
  {a:1,ru:{q:"Как правильно вести провод по стене?",o:["Наискосок, так короче","Только вертикально и горизонтально","Как удобнее"],e:"Прямые трассы легко найти потом. Диагональный провод легко пробить сверлом."},uz:{q:"Simni devor bo'ylab qanday to'g'ri yotqizish kerak?",o:["Qiyshiq, chunki qisqaroq","Faqat vertikal va gorizontal","Qanday qulay bo'lsa"],e:"To'g'ri trassalarni keyin topish oson. Diagonal simni parma bilan teshib qo'yish oson."}},
  {a:2,ru:{q:"Как прокладывать кабель по гипсокартону или дереву?",o:["Прямо без защиты","В пластиковом пакете","В негорючей гофре"],e:"На горючем основании кабель всегда в негорючей гофре или трубе."},uz:{q:"Gipsokarton yoki yog'och bo'ylab kabelni qanday yotqizish kerak?",o:["Himoyasiz to'g'ridan-to'g'ri","Plastik paketda","Yonmaydigan gofrada"],e:"Yonuvchan asosda kabel doim yonmaydigan gofra yoki quvurda bo'ladi."}},
  {a:0,ru:{q:"Зачем фотографировать трассы до штукатурки?",o:["Чтобы потом не просверлить провод","Для отчёта в соцсетях","Это не нужно"],e:"Фото с рулеткой показывает, где идут провода, когда стены уже закрыты."},uz:{q:"Nima uchun trassalarni suvoqdan oldin suratga olish kerak?",o:["Keyin simni teshib qo'ymaslik uchun","Ijtimoiy tarmoqlar uchun","Bu shart emas"],e:"Ruletka bilan surat devorlar yopilgandan keyin simlar qayerdan o'tganini ko'rsatadi."}},
  {a:1,ru:{q:"На какой высоте обычно ставят розетку в комнате?",o:["150 см","30 см от пола","У самого потолка"],e:"Обычная высота — 30 см от пола. На кухне над столом — 100–110 см."},uz:{q:"Xonada rozetka odatda qanday balandlikda o'rnatiladi?",o:["150 sm","Poldan 30 sm","Shiftning o'zida"],e:"Odatdagi balandlik — poldan 30 sm. Oshxonada stol ustida — 100–110 sm."}}]},

{id:"n4",lv:1,min:8,
 t:{ru:"Поиск неисправности мультиметром",uz:"Multimetr bilan nosozlikni topish"},s:{ru:"Нет света: ищем обрыв по шагам",uz:"Chiroq yo'q: uzilishni bosqichma-bosqich izlaymiz"},
 table:{head:{ru:["Режим","Что показывает"],uz:["Rejim","Nimani ko'rsatadi"]},rows:{
  ru:[["V~ (750 В)","Напряжение в розетке: норма 220 В ±10%"],["Ω / прозвонка (пищит)","Целость провода, только без напряжения"],["Фаза–ноль 220 В, фаза–земля 220 В","Всё в порядке"],["Фаза–ноль 0 В, фаза–земля 220 В","Обрыв ноля"],["Везде 0 В","Нет фазы: смотрите автомат и соединения"]],
  uz:[["V~ (750 V)","Rozetkadagi kuchlanish: me'yor 220 V ±10%"],["Ω / prozvonka (chiyillaydi)","Simning butunligi, faqat kuchlanishsiz"],["Faza–nol 220 V, faza–yer 220 V","Hammasi joyida"],["Faza–nol 0 V, faza–yer 220 V","Nol uzilgan"],["Hamma joyda 0 V","Faza yo'q: avtomat va ulanishlarni ko'ring"]]}},
 steps:{ru:["Спросите, что случилось: пропал свет только в одной розетке, в комнате или во всей квартире.","Посмотрите щиток: не выбит ли автомат или УЗО. Если выбивает сразу снова — ищите замыкание, не включайте силой.","Мультиметром в режиме V~ измерьте фаза–ноль и фаза–земля в розетке. По таблице поймёте, что оборвано.","Идите от рабочей розетки к нерабочей: обрыв обычно в распаечной коробке или в последней рабочей розетке.","Прозвонку делайте только при отключённом автомате. Найденное соединение переделайте на клемму."],
       uz:["Nima bo'lganini so'rang: chiroq faqat bitta rozetkada, xonada yoki butun xonadonda o'chganmi.","Shitga qarang: avtomat yoki UZO tushib ketmaganmi. Darhol yana tushsa — qisqa tutashuvni qidiring, kuch bilan yoqmang.","Multimetrni V~ rejimida rozetkada faza–nol va faza–yerni o'lchang. Jadval bo'yicha nima uzilganini tushunasiz.","Ishlaydigan rozetkadan ishlamaydiganiga qarab boring: uzilish odatda tarqatish qutisida yoki oxirgi ishlaydigan rozetkada bo'ladi.","Prozvonkani faqat avtomat o'chirilganda qiling. Topilgan ulanishni klemmaga qayta qiling."]},
 tip:{ru:"Никогда не включайте режим Ω или прозвонку на проводах под напряжением: сгорит мультиметр, а может и вас ударить.",uz:"Hech qachon kuchlanish ostidagi simlarda Ω yoki prozvonka rejimini yoqmang: multimetr kuyadi, sizni ham urishi mumkin."},
 quiz:[
  {a:1,ru:{q:"В розетке фаза–ноль 0 В, а фаза–земля 220 В. Что случилось?",o:["Нет фазы","Обрыв ноля","Всё нормально"],e:"Фаза есть (до земли 220 В), а до ноля нет. Значит, оборван ноль."},uz:{q:"Rozetkada faza–nol 0 V, faza–yer esa 220 V. Nima bo'ldi?",o:["Faza yo'q","Nol uzilgan","Hammasi normal"],e:"Faza bor (yergacha 220 V), nolgacha esa yo'q. Demak, nol uzilgan."}},
  {a:2,ru:{q:"Когда можно делать прозвонку провода?",o:["В любое время","Когда свет включён","Только при отключённом автомате"],e:"Прозвонка и режим Ω только без напряжения."},uz:{q:"Simni qachon prozvonka qilish mumkin?",o:["Istalgan vaqtda","Chiroq yoqilganda","Faqat avtomat o'chirilganda"],e:"Prozvonka va Ω rejimi faqat kuchlanishsiz."}},
  {a:0,ru:{q:"Автомат выбивает сразу после включения. Что делать?",o:["Искать замыкание, не включать силой","Держать рычаг рукой","Поставить автомат побольше"],e:"Автомат защищает от замыкания. Пока причину не нашли, включать нельзя."},uz:{q:"Avtomat yoqilishi bilan tushib ketadi. Nima qilish kerak?",o:["Qisqa tutashuvni qidirish, kuch bilan yoqmaslik","Dastakni qo'l bilan ushlab turish","Kattaroq avtomat qo'yish"],e:"Avtomat qisqa tutashuvdan himoya qiladi. Sabab topilmaguncha yoqish mumkin emas."}},
  {a:1,ru:{q:"Где чаще всего обрыв, если не работают несколько розеток подряд?",o:["В самой нерабочей розетке","В распаечной коробке или последней рабочей розетке","В счётчике"],e:"Розетки часто подключены шлейфом. Обрыв обычно там, где цепочка прерывается."},uz:{q:"Ketma-ket bir nechta rozetka ishlamasa, uzilish ko'pincha qayerda?",o:["Ishlamaydigan rozetkaning o'zida","Tarqatish qutisida yoki oxirgi ishlaydigan rozetkada","Hisoblagichda"],e:"Rozetkalar ko'pincha shleyf bilan ulanadi. Uzilish odatda zanjir uzilgan joyda bo'ladi."}}]},

/* ---------- 4-й разряд ---------- */
{id:"n5",lv:2,min:8,
 t:{ru:"Проверка изоляции мегаомметром",uz:"Megaommetr bilan izolyatsiyani tekshirish"},s:{ru:"Замеры перед сдачей проводки",uz:"Simlarni topshirishdan oldin o'lchovlar"},
 table:{head:{ru:["Что проверяем","Норма"],uz:["Nimani tekshiramiz","Me'yor"]},rows:{
  ru:[["Напряжение мегаомметра для сети 220/380 В","1000 В (для слаботочки — 500 В и ниже)"],["Сопротивление изоляции проводки","не меньше 0,5 МОм"],["Новая проводка обычно показывает","сотни МОм и больше"],["Между чем мерить","L–N, L–PE, N–PE, в 3 фазах ещё L1–L2, L2–L3, L1–L3"]],
  uz:[["220/380 V tarmoq uchun megaommetr kuchlanishi","1000 V (past tokli tizimlar uchun — 500 V va kam)"],["Simlar izolyatsiyasi qarshiligi","kamida 0,5 MOm"],["Yangi simlar odatda ko'rsatadi","yuzlab MOm va undan ko'p"],["Nima orasida o'lchash","L–N, L–PE, N–PE, 3 fazada yana L1–L2, L2–L3, L1–L3"]]}},
 steps:{ru:["Отключите линию автоматом и проверьте отсутствие напряжения.","Выньте из розеток все вилки, выкрутите лампы или отключите их. Иначе прибор покажет «плохую» изоляцию через нагрузку, а электронику можно сжечь.","Подключите щупы мегаомметра между проводами по таблице и нажмите кнопку измерения на 60 секунд.","Запишите результат. Меньше 0,5 МОм — ищите повреждение: делите линию на части и мерьте каждую.","После каждого замера разрядите провод на землю: на нём остаётся опасный заряд."],
       uz:["Liniyani avtomat bilan o'chiring va kuchlanish yo'qligini tekshiring.","Rozetkalardan barcha vilkalarni chiqaring, lampalarni burab oling yoki uzing. Aks holda asbob yuklama orqali «yomon» izolyatsiyani ko'rsatadi, elektronika esa kuyishi mumkin.","Megaommetr shchuplarini jadval bo'yicha simlar orasiga ulang va o'lchash tugmasini 60 soniya bosing.","Natijani yozing. 0,5 MOm dan kam bo'lsa — shikastlanishni qidiring: liniyani qismlarga bo'ling va har birini o'lchang.","Har bir o'lchovdan keyin simni yerga razryad qiling: unda xavfli zaryad qoladi."]},
 tip:{ru:"Мегаомметр сам выдаёт 1000 В. Во время замера никто не должен касаться проводов на всей линии, предупредите людей.",uz:"Megaommetrning o'zi 1000 V chiqaradi. O'lchov paytida butun liniyada hech kim simlarga tegmasligi kerak, odamlarni ogohlantiring."},
 quiz:[
  {a:1,ru:{q:"Какое минимальное сопротивление изоляции проводки?",o:["0,05 МОм","0,5 МОм","5 Ом"],e:"Норма для проводки до 1000 В — не меньше 0,5 МОм."},uz:{q:"Simlar izolyatsiyasining minimal qarshiligi qancha?",o:["0,05 MOm","0,5 MOm","5 Om"],e:"1000 V gacha simlar uchun me'yor — kamida 0,5 MOm."}},
  {a:0,ru:{q:"Что сделать перед замером мегаомметром?",o:["Отключить линию и вынуть все вилки","Включить все приборы","Ничего"],e:"Без напряжения и без нагрузки. Иначе замер неверный, а техника может сгореть."},uz:{q:"Megaommetr bilan o'lchashdan oldin nima qilish kerak?",o:["Liniyani o'chirish va barcha vilkalarni chiqarish","Barcha asboblarni yoqish","Hech narsa"],e:"Kuchlanishsiz va yuklamasiz. Aks holda o'lchov noto'g'ri, texnika esa kuyishi mumkin."}},
  {a:2,ru:{q:"Зачем разряжать провод после замера?",o:["Чтобы прибор не сломался","Так красивее","На проводе остаётся опасный заряд"],e:"Длинный кабель работает как конденсатор и может ударить после замера."},uz:{q:"Nima uchun o'lchovdan keyin simni razryad qilish kerak?",o:["Asbob buzilmasligi uchun","Shunday chiroyliroq","Simda xavfli zaryad qoladi"],e:"Uzun kabel kondensator kabi ishlaydi va o'lchovdan keyin urishi mumkin."}},
  {a:1,ru:{q:"Каким напряжением мерить изоляцию сети 220/380 В?",o:["9 В","1000 В","10 000 В"],e:"Для сетей 220/380 В используют мегаомметр на 1000 В."},uz:{q:"220/380 V tarmoq izolyatsiyasini qanday kuchlanishda o'lchash kerak?",o:["9 V","1000 V","10 000 V"],e:"220/380 V tarmoqlar uchun 1000 V li megaommetr ishlatiladi."}}]},

/* ---------- 5-й разряд ---------- */
{id:"n6",lv:3,min:9,
 t:{ru:"Реверс двигателя",uz:"Dvigatel reversi"},s:{ru:"Два пускателя и блокировка",uz:"Ikki puskatel va blokirovka"},
 steps:{ru:["Чтобы трёхфазный двигатель крутился в другую сторону, меняют местами любые две фазы.","Для реверса ставят два пускателя: КМ1 «Вперёд» и КМ2 «Назад». КМ2 подаёт фазы с перестановкой (L1 и L3 меняются).","Обязательна блокировка: нормально закрытый контакт КМ1 стоит в цепи катушки КМ2, а контакт КМ2 — в цепи КМ1. Включиться оба сразу не смогут.","Лучше ещё и механическая блокировка: пару пускателей ставят с механической приставкой.","Кнопки: «Стоп» общая, «Вперёд» и «Назад» свои. Переключать направление — только через «Стоп», пока двигатель не остановится."],
       uz:["Uch fazali dvigatel boshqa tomonga aylanishi uchun istalgan ikki faza o'rni almashtiriladi.","Revers uchun ikkita puskatel qo'yiladi: KM1 «Oldinga» va KM2 «Orqaga». KM2 fazalarni almashtirib beradi (L1 va L3 almashadi).","Blokirovka shart: KM1 ning normal yopiq kontakti KM2 g'altagi zanjirida, KM2 niki esa KM1 zanjirida turadi. Ikkalasi bir vaqtda yoqila olmaydi.","Mexanik blokirovka ham bo'lsa yaxshi: puskatellar jufti mexanik qo'shimcha bilan qo'yiladi.","Tugmalar: «Stop» umumiy, «Oldinga» va «Orqaga» alohida. Yo'nalishni faqat «Stop» orqali, dvigatel to'xtagandan keyin almashtirish kerak."]},
 tip:{ru:"Если оба пускателя включатся одновременно, будет межфазное замыкание: сгорят контакты и выбьет автомат. Поэтому без блокировки реверс не собирают.",uz:"Ikkala puskatel bir vaqtda yoqilsa, fazalararo qisqa tutashuv bo'ladi: kontaktlar kuyadi va avtomat tushadi. Shuning uchun reversni blokirovkasiz yig'ishmaydi."},
 quiz:[
  {a:0,ru:{q:"Как изменить направление вращения трёхфазного двигателя?",o:["Поменять местами две любые фазы","Поменять фазу и ноль","Перевернуть двигатель"],e:"Перестановка двух фаз меняет направление вращения поля, а с ним и вала."},uz:{q:"Uch fazali dvigatel aylanish yo'nalishini qanday o'zgartirish mumkin?",o:["Istalgan ikki faza o'rnini almashtirish","Faza va nolni almashtirish","Dvigatelni ag'darish"],e:"Ikki faza o'rnini almashtirish maydon, u bilan birga val aylanish yo'nalishini o'zgartiradi."}},
  {a:2,ru:{q:"Зачем блокировка в схеме реверса?",o:["Для красоты","Чтобы экономить ток","Чтобы два пускателя не включились сразу"],e:"Одновременное включение = межфазное замыкание."},uz:{q:"Revers sxemasida blokirovka nima uchun kerak?",o:["Chiroyli bo'lishi uchun","Tokni tejash uchun","Ikki puskatel birdan yoqilmasligi uchun"],e:"Bir vaqtda yoqilish = fazalararo qisqa tutashuv."}},
  {a:1,ru:{q:"Какой контакт КМ1 ставят в цепь катушки КМ2?",o:["Нормально открытый","Нормально закрытый","Никакой"],e:"Нормально закрытый контакт размыкается, когда КМ1 включён, и не даёт включить КМ2."},uz:{q:"KM2 g'altagi zanjiriga KM1 ning qaysi kontakti qo'yiladi?",o:["Normal ochiq","Normal yopiq","Hech qaysi"],e:"Normal yopiq kontakt KM1 yoqilganda ochiladi va KM2 ni yoqishga yo'l qo'ymaydi."}},
  {a:0,ru:{q:"Как правильно переключить направление?",o:["Нажать «Стоп», дождаться остановки, потом другую кнопку","Сразу нажать другую кнопку","Выключить автомат на ходу"],e:"Реверс на ходу даёт огромный ток и удар по механике."},uz:{q:"Yo'nalishni qanday to'g'ri almashtirish kerak?",o:["«Stop» ni bosish, to'xtashini kutish, keyin boshqa tugma","Darhol boshqa tugmani bosish","Ishlab turganda avtomatni o'chirish"],e:"Ishlab turganda revers juda katta tok va mexanikaga zarba beradi."}}]},

{id:"n7",lv:3,min:8,
 t:{ru:"Чтение электросхем",uz:"Elektr sxemalarini o'qish"},s:{ru:"Буквы и значки на схеме",uz:"Sxemadagi harflar va belgilar"},
 table:{head:{ru:["Буква","Что это"],uz:["Harf","Bu nima"]},rows:{
  ru:[["QF","Автоматический выключатель"],["FU","Предохранитель"],["KM","Контактор, магнитный пускатель"],["KK","Тепловое реле"],["KL / K","Промежуточное реле"],["SB","Кнопка"],["SA","Переключатель"],["HL","Сигнальная лампа"],["M","Двигатель"],["XT","Клеммник"]],
  uz:[["QF","Avtomatik o'chirgich"],["FU","Saqlagich (predoxranitel)"],["KM","Kontaktor, magnit puskatel"],["KK","Issiqlik relesi"],["KL / K","Oraliq rele"],["SB","Tugma"],["SA","Almashtirgich"],["HL","Signal lampasi"],["M","Dvigatel"],["XT","Klemmalar bloki"]]}},
 steps:{ru:["Схема делится на силовую часть (толстые линии, ток двигателя) и цепи управления (катушки, кнопки, лампы).","Все контакты на схеме нарисованы в положении «всё выключено, кнопки не нажаты».","У каждого контакта есть подпись того аппарата, к которому он относится: контакт KM1 срабатывает, когда включена катушка KM1.","Цепь управления читайте слева направо, как строку: от фазы через кнопки и контакты к катушке и на ноль.","Номера проводов на схеме совпадают с бирками на проводах в шкафу. По ним легко найти провод."],
       uz:["Sxema kuch qismiga (qalin chiziqlar, dvigatel toki) va boshqaruv zanjirlariga (g'altaklar, tugmalar, lampalar) bo'linadi.","Sxemadagi barcha kontaktlar «hammasi o'chirilgan, tugmalar bosilmagan» holatda chizilgan.","Har bir kontaktda u tegishli apparat nomi yozilgan: KM1 kontakti KM1 g'altagi yoqilganda ishlaydi.","Boshqaruv zanjirini satr kabi chapdan o'ngga o'qing: fazadan tugma va kontaktlar orqali g'altakka va nolga.","Sxemadagi sim raqamlari shkafdagi simlardagi birkalar bilan bir xil. Ular bo'yicha simni topish oson."]},
 tip:{ru:"Перед работой в чужом шкафу найдите его схему. Если схемы нет, нарисуйте её сами, прежде чем что-то отключать.",uz:"Begona shkafda ishlashdan oldin uning sxemasini toping. Sxema bo'lmasa, biror narsani uzishdan oldin uni o'zingiz chizing."},
 quiz:[
  {a:1,ru:{q:"Что обозначает KM на схеме?",o:["Кнопку","Контактор или пускатель","Двигатель"],e:"K — реле и контакторы, KM — контактор (магнитный пускатель)."},uz:{q:"Sxemada KM nimani bildiradi?",o:["Tugmani","Kontaktor yoki puskatelni","Dvigatelni"],e:"K — rele va kontaktorlar, KM — kontaktor (magnit puskatel)."}},
  {a:0,ru:{q:"В каком положении нарисованы контакты на схеме?",o:["Всё выключено, кнопки не нажаты","Всё включено","Как удобно автору"],e:"Это правило для всех схем: нормальное (обесточенное) состояние."},uz:{q:"Sxemada kontaktlar qaysi holatda chizilgan?",o:["Hammasi o'chirilgan, tugmalar bosilmagan","Hammasi yoqilgan","Muallifga qanday qulay bo'lsa"],e:"Bu barcha sxemalar uchun qoida: normal (tokdan uzilgan) holat."}},
  {a:2,ru:{q:"Что обозначает SB?",o:["Сигнальную лампу","Предохранитель","Кнопку"],e:"SB — кнопка, SA — переключатель, HL — лампа."},uz:{q:"SB nimani bildiradi?",o:["Signal lampasini","Saqlagichni","Tugmani"],e:"SB — tugma, SA — almashtirgich, HL — lampa."}},
  {a:1,ru:{q:"Зачем номера проводов на схеме?",o:["Для красоты","Чтобы найти провод в шкафу по бирке","Это цена провода"],e:"Номер на схеме = бирка на проводе. Так быстро находят нужный провод."},uz:{q:"Sxemadagi sim raqamlari nima uchun?",o:["Chiroyli bo'lishi uchun","Shkafda simni birka bo'yicha topish uchun","Bu simning narxi"],e:"Sxemadagi raqam = simdagi birka. Shunday kerakli sim tez topiladi."}}]},

{id:"n8",lv:4,min:9,
 t:{ru:"Частотный преобразователь",uz:"Chastota o'zgartirgich"},s:{ru:"Подключение и первая настройка",uz:"Ulash va birinchi sozlash"},
 table:{head:{ru:["Клеммы","Куда"],uz:["Klemmalar","Qayerga"]},rows:{
  ru:[["L1 L2 L3 (или L N)","Сеть, через автомат"],["U V W","Двигатель, экранированным кабелем"],["PE","Земля: и частотника, и двигателя"],["DI1, DI2, COM","Кнопки пуск, реверс"],["AI1 (0–10 В)","Потенциометр скорости"]],
  uz:[["L1 L2 L3 (yoki L N)","Tarmoq, avtomat orqali"],["U V W","Dvigatel, ekranlangan kabel bilan"],["PE","Yer: ham chastotnik, ham dvigatel"],["DI1, DI2, COM","Pusk, revers tugmalari"],["AI1 (0–10 V)","Tezlik potensiometri"]]}},
 steps:{ru:["Подберите частотник по току двигателя (с табличкой на двигателе), а не только по мощности.","Если частотник на входе 220 В, а двигатель 220/380 В — двигатель соединяют треугольником.","Сеть подают на L-клеммы, двигатель — на U V W. Между частотником и двигателем пускатель не ставят.","Введите данные с таблички двигателя: напряжение, ток, частоту, обороты. Задайте время разгона и торможения (обычно 5–10 с).","Первый пуск — на низкой частоте, проверьте направление. Направление меняют параметром, а не перестановкой проводов на входе."],
       uz:["Chastotnikni faqat quvvat bo'yicha emas, dvigatel toki bo'yicha tanlang (dvigateldagi jadvalchadan).","Agar chastotnik kirishi 220 V, dvigatel 220/380 V bo'lsa — dvigatel uchburchak qilib ulanadi.","Tarmoq L-klemmalarga, dvigatel U V W ga beriladi. Chastotnik va dvigatel orasiga puskatel qo'yilmaydi.","Dvigatel jadvalchasidagi ma'lumotlarni kiriting: kuchlanish, tok, chastota, aylanishlar. Tezlanish va tormozlash vaqtini bering (odatda 5–10 s).","Birinchi pusk — past chastotada, yo'nalishni tekshiring. Yo'nalish kirishdagi simlarni almashtirish bilan emas, parametr bilan o'zgartiriladi."]},
 tip:{ru:"После отключения на конденсаторах частотника ещё несколько минут опасное напряжение. Подождите время, написанное на корпусе (обычно 5–10 минут), и только потом открывайте.",uz:"O'chirilgandan keyin chastotnik kondensatorlarida yana bir necha daqiqa xavfli kuchlanish bo'ladi. Korpusda yozilgan vaqtni kuting (odatda 5–10 daqiqa), shundan keyingina oching."},
 quiz:[
  {a:2,ru:{q:"Куда подключают двигатель?",o:["L1 L2 L3","AI1","U V W"],e:"U V W — выход частотника на двигатель. L-клеммы — вход сети."},uz:{q:"Dvigatel qayerga ulanadi?",o:["L1 L2 L3","AI1","U V W"],e:"U V W — chastotnikdan dvigatelga chiqish. L-klemmalar — tarmoq kirishi."}},
  {a:1,ru:{q:"Частотник с входом 220 В, двигатель 220/380 В. Как соединить обмотки?",o:["Звездой","Треугольником","Не важно"],e:"На выходе такого частотника 3 фазы по 220 В между собой, поэтому — треугольник."},uz:{q:"Kirishi 220 V chastotnik, dvigatel 220/380 V. Chulg'amlarni qanday ulash kerak?",o:["Yulduz","Uchburchak","Farqi yo'q"],e:"Bunday chastotnik chiqishida o'zaro 220 V li 3 faza bo'ladi, shuning uchun — uchburchak."}},
  {a:0,ru:{q:"Можно ли ставить пускатель между частотником и двигателем?",o:["Нет, частотник сам управляет пуском","Да, обязательно","Только два пускателя"],e:"Размыкание выхода на ходу может сжечь частотник. Пуск и стоп делает сам частотник."},uz:{q:"Chastotnik va dvigatel orasiga puskatel qo'yish mumkinmi?",o:["Yo'q, chastotnikning o'zi puskni boshqaradi","Ha, albatta","Faqat ikkita puskatel"],e:"Ishlab turganda chiqishni uzish chastotnikni kuydirishi mumkin. Pusk va stopni chastotnikning o'zi qiladi."}},
  {a:1,ru:{q:"Почему нельзя сразу открывать частотник после отключения?",o:["Он горячий","На конденсаторах остаётся опасное напряжение","Слетят настройки"],e:"Конденсаторы разряжаются несколько минут. Время указано на корпусе."},uz:{q:"Nima uchun o'chirilgandan keyin chastotnikni darhol ochish mumkin emas?",o:["U issiq","Kondensatorlarda xavfli kuchlanish qoladi","Sozlamalar o'chib ketadi"],e:"Kondensatorlar bir necha daqiqa razryad bo'ladi. Vaqt korpusda ko'rsatilgan."}}]},

{id:"n9",lv:4,min:9,
 t:{ru:"Наладка схем управления",uz:"Boshqaruv sxemalarini sozlash"},s:{ru:"Проверка шкафа перед пуском",uz:"Puskdan oldin shkafni tekshirish"},
 steps:{ru:["Сверьте монтаж со схемой: каждый провод, бирку и затяжку клемм. Протяните винты: в новом шкафу они часто ослаблены.","Проверьте изоляцию силовых цепей мегаомметром при отключённом двигателе и электронике.","Отключите силовые предохранители или автомат двигателя и подайте питание только на цепи управления. Проверьте каждую кнопку, реле, блокировку и лампу.","Выставьте тепловое реле на номинальный ток двигателя с таблички.","Пробный пуск: измерьте ток в каждой фазе клещами. Разница между фазами больше 10% — ищите причину. Запишите все замеры в протокол."],
       uz:["Montajni sxema bilan solishtiring: har bir sim, birka va klemmalar mahkamligi. Vintlarni torting: yangi shkafda ular ko'pincha bo'sh bo'ladi.","Dvigatel va elektronika uzilgan holda kuch zanjirlari izolyatsiyasini megaommetr bilan tekshiring.","Kuch saqlagichlari yoki dvigatel avtomatini o'chiring va faqat boshqaruv zanjirlariga quvvat bering. Har bir tugma, rele, blokirovka va lampani tekshiring.","Issiqlik relesini jadvalchadagi dvigatel nominal tokiga o'rnating.","Sinov pusk: har bir fazadagi tokni ombir bilan o'lchang. Fazalar orasidagi farq 10% dan ko'p bo'lsa — sababini qidiring. Barcha o'lchovlarni bayonnomaga yozing."]},
 tip:{ru:"Наладчик отвечает за то, что сдал. Пока нет протокола замеров и подписанного акта, считайте, что работа не закончена.",uz:"Sozlovchi topshirgan ishi uchun javob beradi. O'lchovlar bayonnomasi va imzolangan dalolatnoma bo'lmaguncha, ish tugamagan deb hisoblang."},
 quiz:[
  {a:1,ru:{q:"Как проверить схему управления без риска для двигателя?",o:["Сразу запустить всё","Отключить силовую часть и подать питание только на цепи управления","Проверять не нужно"],e:"Так проверяют логику кнопок и реле, а двигатель не крутится."},uz:{q:"Boshqaruv sxemasini dvigatelga xavfsiz qanday tekshirish mumkin?",o:["Darhol hammasini ishga tushirish","Kuch qismini o'chirib, faqat boshqaruv zanjirlariga quvvat berish","Tekshirish shart emas"],e:"Shunday tugma va relelar mantiqi tekshiriladi, dvigatel esa aylanmaydi."}},
  {a:0,ru:{q:"На какой ток ставят тепловое реле?",o:["На номинальный ток двигателя","В 2 раза больше","На ток автомата"],e:"Тепловое реле защищает двигатель от перегрузки, поэтому настраивается по его номиналу."},uz:{q:"Issiqlik relesi qanday tokka o'rnatiladi?",o:["Dvigatelning nominal tokiga","2 baravar ko'proq","Avtomat tokiga"],e:"Issiqlik relesi dvigatelni ortiqcha yuklanishdan himoya qiladi, shuning uchun uning nominali bo'yicha sozlanadi."}},
  {a:2,ru:{q:"Токи в фазах двигателя отличаются на 25%. Что делать?",o:["Ничего, норма","Поставить автомат больше","Искать причину: плохой контакт, обмотка, перекос сети"],e:"Нормальная разница — до 10%. Больше — признак неисправности."},uz:{q:"Dvigatel fazalaridagi toklar 25% ga farq qiladi. Nima qilish kerak?",o:["Hech narsa, normal","Kattaroq avtomat qo'yish","Sababini qidirish: yomon kontakt, chulg'am, tarmoq nosimmetriyasi"],e:"Normal farq — 10% gacha. Ko'proq bo'lsa — nosozlik belgisi."}},

  h+=`<button class="link" id="reset" type="button">${L.reset}</button></main>`;
  app.innerHTML=h;
  document.querySelectorAll('[data-id]').forEach(b=>b.onclick=()=>{S.id=b.dataset.id;go('lesson')});
  document.querySelectorAll('[data-exam]').forEach(b=>b.onclick=()=>startExam(+b.dataset.exam));
  const ce=$('#cert');if(ce)ce.onclick=openCert;
  const r=$('#reset');r.onclick=()=>{if(r.dataset.c){done=new Set();store.set('done',[]);grades=new Set();store.set('grades',[]);render()}else{r.dataset.c=1;r.textContent=lang==='ru'?'Нажмите ещё раз, чтобы сбросить':'Tozalash uchun yana bosing'}};
}

function lesson(){
  const L=U();const x=LESSONS.find(y=>y.id===S.id);const list=byLv(x.lv);const n=list.indexOf(x)+1;
  let h=header(`<div class="row"><button class="back" id="back" type="button">${L.all}</button>${langSw()}</div><h1 class="ttl">${tr(x.t)}</h1><p>${L.lvl(L.lv[x.lv],n,x.min)}</p>`)+'<main class="wrap">';
  if(x.svg){h+=`<div class="card diagram"><div class="sv">${x.svg(lang)}</div>`;
    if(x.legend)h+=`<div class="legend">${x.legend.map(k=>`<span><i class="sw" style="background:${swatch[k]}"></i>${L.leg[k]}</span>`).join('')}</div>`;h+='</div>'}
  if(x.id!=='b2'&&!x.nowarn)h+=`<div class="warn"><span aria-hidden="true">⚠</span><div><b>${L.warnB}</b> ${L.warn}</div></div>`;
  if(x.table){h+=`<div class="card tbl"><table><thead><tr>${tr(x.table.head).map(c=>`<th>${c}</th>`).join('')}</tr></thead><tbody>${tr(x.table.rows).map(r=>`<tr>${r.map(c=>`<td>${c}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`}
  h+=`<div class="card stack"><h3>${L.stepsT}</h3><ol class="steps">${tr(x.steps).map(s=>`<li><span>${s}</span></li>`).join('')}</ol><p class="tip"><b>${L.tipT}:</b> ${tr(x.tip)}</p></div>`;
  if(x.calc)h+=`<button class="btn ghost" id="calc" type="button">${L.openCalc}</button>`;
  h+=`<button class="btn" id="start" type="button">${L.start(x.quiz.length)}</button></main>`;
  app.innerHTML=h;
  $('#back').onclick=()=>go('home');
  $('#start').onclick=()=>{S.qi=0;S.score=0;S.picked=null;go('quiz')};
  const c=$('#calc');if(c)c.onclick=()=>{S.tab=1;go('home')};
}

function quiz(){
  const L=U();const x=LESSONS.find(y=>y.id===S.id);const QZ=x.quiz;const item=QZ[S.qi];const Q=tr(item);const p=S.picked;
  const opts=Q.o.map((o,i)=>{let c='opt';if(p!==null){if(i===item.a)c+=' right';else if(i===p)c+=' wrong'}return `<button class="${c}" data-i="${i}" type="button" ${p!==null?'disabled':''}>${o}</button>`}).join('');
  app.innerHTML=header(`<div class="row"><button class="back" id="back" type="button">${L.toL}</button>${langSw()}</div><h1 class="ttl">${L.qt}: ${tr(x.t)}</h1><p>${L.qsub(need(QZ.length),QZ.length)}</p>`)+`<main class="wrap">
   <div class="progress"><div class="q-top"><span>${L.qn(S.qi+1,QZ.length)}</span><span>${L.ok(S.score)}</span></div><div class="meter"><i style="width:${(S.qi+(p!==null?1:0))/QZ.length*100}%"></i></div></div>
   <p class="q">${Q.q}</p><div class="opts">${opts}</div>
   ${p!==null?`<p class="expl">${p===item.a?`<b class="okc">${L.right}</b> `:`<b class="badc">${L.wrong}</b> `}${Q.e}</p><button class="btn" id="next" type="button">${S.qi<QZ.length-1?L.next:L.res}</button>`:''}
  </main>`;
  $('#back').onclick=()=>go('lesson');
  document.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{S.picked=+b.dataset.i;if(S.picked===item.a)S.score++;render()});
  const n=$('#next');if(n)n.onclick=()=>{if(S.qi<QZ.length-1){S.qi++;S.picked=null;go('quiz')}else{const pass=S.score>=need(QZ.length);if(pass){done.add(x.id);store.set('done',[...done])}go('result')}};
}

function result(){
  const L=U();const x=LESSONS.find(y=>y.id===S.id);const n=x.quiz.length;const pass=S.score>=need(n);
  const list=byLv(x.lv);const nx=list[list.indexOf(x)+1];
  app.innerHTML=header(`<div class="row"><div><h1>${L.res}</h1><p>${tr(x.t)}</p></div>${langSw()}</div>`)+`<main class="wrap"><div class="card result">
   <div class="score">${S.score} / ${n}</div><h3>${pass?L.passT:L.failT}</h3>
   <p class="expl">${pass?(nx?L.passNext(tr(nx.t)):L.passLast):L.fail(need(n),n)}</p></div>
   ${pass&&nx?`<button class="btn" id="nextL" type="button">${L.nextL}</button>`:''}
   ${pass&&!nx&&gradeDone(x.lv)?`<button class="btn" id="toEx" type="button">${G().toExam}</button>`:''}
   ${pass?'':`<button class="btn" id="retry" type="button">${L.retry}</button>`}
   <button class="btn ghost" id="home" type="button">${L.home}</button></main>`;
  $('#home').onclick=()=>go('home');
  const r=$('#retry');if(r)r.onclick=()=>{S.qi=0;S.score=0;S.picked=null;go('quiz')};
  const nl=$('#nextL');if(nl)nl.onclick=()=>{S.id=nx.id;go('lesson')};
  const te=$('#toEx');if(te)te.onclick=()=>startExam(x.lv);
}

/* grade exam: 2 random questions from every lesson of the grade, pass = 80% */
const needEx=n=>Math.ceil(n*0.8);
const shuf=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
function startExam(g){const qs=[];byLv(g).forEach(x=>shuf(x.quiz.map((_,i)=>i)).slice(0,2).forEach(i=>qs.push({l:x.id,i})));
  S.ex={g,qs:shuf(qs),qi:0,score:0,picked:null,miss:new Set()};go('exam')}
function exam(){
  const L=U(),Gx=G();const E=S.ex;const it=E.qs[E.qi];const x=LESSONS.find(y=>y.id===it.l);const item=x.quiz[it.i];const Q=tr(item);const p=E.picked;const N=E.qs.length;
  const opts=Q.o.map((o,i)=>{let c='opt';if(p!==null){if(i===item.a)c+=' right';else if(i===p)c+=' wrong'}return `<button class="${c}" data-i="${i}" type="button" ${p!==null?'disabled':''}>${o}</button>`}).join('');
  app.innerHTML=header(`<div class="row"><button class="back" id="back" type="button">${L.all}</button>${langSw()}</div><h1 class="ttl">${Gx.exT(GRADE_NUM[E.g])}</h1><p>${Gx.exSub(needEx(N),N)}</p>`)+`<main class="wrap">
   <div class="progress"><div class="q-top"><span>${L.qn(E.qi+1,N)}</span><span>${L.ok(E.score)}</span></div><div class="meter"><i style="width:${(E.qi+(p!==null?1:0))/N*100}%"></i></div></div>
   <p class="exfrom">${tr(x.t)}</p><p class="q">${Q.q}</p><div class="opts">${opts}</div>
   ${p!==null?`<p class="expl">${p===item.a?`<b class="okc">${L.right}</b> `:`<b class="badc">${L.wrong}</b> `}${Q.e}</p><button class="btn" id="next" type="button">${E.qi<N-1?L.next:L.res}</button>`:''}
  </main>`;
  $('#back').onclick=()=>go('home');
  document.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{E.picked=+b.dataset.i;if(E.picked===item.a)E.score++;else E.miss.add(x.id);render()});
  const n=$('#next');if(n)n.onclick=()=>{if(E.qi<N-1){E.qi++;E.picked=null;go('exam')}else{if(E.score>=needEx(N)){grades.add(E.g);store.set('grades',[...grades])}go('examRes')}};
}
function examRes(){
  const L=U(),Gx=G();const E=S.ex;const N=E.qs.length;const pass=E.score>=needEx(N);const num=GRADE_NUM[E.g];const ng=E.g+1<GRADE_NUM.length?E.g+1:null;
  const miss=LESSONS.filter(x=>E.miss.has(x.id));
  app.innerHTML=header(`<div class="row"><div><h1>${L.res}</h1><p>${Gx.exT(num)}</p></div>${langSw()}</div>`)+`<main class="wrap"><div class="card result">
   ${pass?`<div class="bigmedal">${medal(num,96)}</div>`:''}<div class="score">${E.score} / ${N}</div><h3>${pass?Gx.exPass(num):L.failT}</h3>
   ${pass?`<p class="expl">${Gx.disc}</p>`:`<p class="expl">${Gx.exFail(needEx(N),N)}</p>`}
   ${miss.length?`<p class="expl"><b>${Gx.reread}</b></p><div class="list">${miss.map(x=>`<button class="item open" type="button" data-id="${x.id}"><span class="tx"><b>${tr(x.t)}</b></span><span class="go">›</span></button>`).join('')}</div>`:''}</div>
   ${pass?`<button class="btn" id="cert" type="button">${Gx.getCert}</button>`:`<button class="btn" id="retry" type="button">${L.retry}</button>`}
   ${pass&&ng!==null?`<button class="btn ghost" id="ng" type="button">${Gx.nextG(GRADE_NUM[ng])}</button>`:''}
   <button class="btn ghost" id="home" type="button">${L.home}</button></main>`;
  $('#home').onclick=()=>go('home');
  document.querySelectorAll('[data-id]').forEach(b=>b.onclick=()=>{S.id=b.dataset.id;go('lesson')});
  const r=$('#retry');if(r)r.onclick=()=>startExam(E.g);
  const c=$('#cert');if(c)c.onclick=openCert;
  const g=$('#ng');if(g)g.onclick=()=>{S.id=byLv(ng)[0].id;go('lesson')};
}

/* calculator */
const BRK=[6,10,16,20,25,32,40,50,63];
const CAB={6:'1,5',10:'1,5',16:'2,5',20:'4',25:'4',32:'6',40:'10',50:'10',63:'16'};
function calcVals(){const c=S.calc;const P=+c.p||0;const I=c.ph===3?P/(Math.sqrt(3)*380*0.9):P/220;
  const b=BRK.find(v=>v>=I);let cab=b?CAB[b]:null;
  if(cab&&+c.len>30){const sizes=['1,5','2,5','4','6','10','16','25'];cab=sizes[Math.min(sizes.indexOf(cab)+1,sizes.length-1)]}
  return {I,b,cab}}
function calcBlock(){const L=U();const c=S.calc;
  return `<div class="card stack"><div><h3>${L.calcT}</h3><p class="expl">${L.calcSub}</p></div>
  <label class="fld" for="cp">${L.pw}<input id="cp" type="number" inputmode="numeric" min="0" step="100" value="${c.p}"></label>
  <div class="fld"><span>${L.net}</span><div class="seg" role="group"><button type="button" data-ph="1" aria-pressed="${c.ph===1}">${L.ph1}</button><button type="button" data-ph="3" aria-pressed="${c.ph===3}">${L.ph3}</button></div></div>
  <label class="fld" for="cl">${L.len}<input id="cl" type="number" inputmode="numeric" min="0" step="1" value="${c.len}"></label>
  <div class="out" id="out"></div><p class="expl">${L.calcNote}</p></div>`}
function paintCalc(){const L=U();const v=calcVals();const o=$('#out');if(!o)return;
  o.innerHTML=`<div><span>${L.cur}</span><b>${v.I.toFixed(1).replace('.',',')} ${lang==='ru'?'А':'A'}</b></div>`+(v.b?`<div><span>${L.brk}</span><b>C${v.b}</b></div><div><span>${L.cab}</span><b>${v.cab} ${lang==='ru'?'мм²':'mm²'}</b></div>`:`<div class="wide"><b class="badc">${L.tooBig}</b></div>`)}
function bindCalc(){
  $('#cp').oninput=e=>{S.calc.p=e.target.value;paintCalc()};
  $('#cl').oninput=e=>{S.calc.len=e.target.value;paintCalc()};
  document.querySelectorAll('[data-ph]').forEach(b=>b.onclick=()=>{S.calc.ph=+b.dataset.ph;document.querySelectorAll('[data-ph]').forEach(x=>x.setAttribute('aria-pressed',x===b));paintCalc()});
  paintCalc()}

function bindCommon(){
  document.querySelectorAll('.lang button').forEach(b=>b.onclick=()=>{lang=b.dataset.l;store.set('lang',lang);document.documentElement.lang=lang;render()});
  document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{S.tab=+b.dataset.tab;render()});
}
function render(){({home,lesson,quiz,result,exam,examRes})[S.screen]();bindCommon()}
function go(s){S.screen=s;render();window.scrollTo(0,0)}
document.documentElement.lang=lang;
go('home');

</script>
</body>

 steps:{ru:["Узнайте у мастера декор (цвет и код, например Egger H1145), толщину и куда пойдут детали.","Проверьте лист: нет сколов на углах, царапин на ламинате, разнотона между листами одного декора.","Посмотрите направление текстуры: у «дерева» рисунок идёт вдоль длинной стороны листа (2800 мм).","Для кухни у мойки берите влагостойкую ЛДСП или хотя бы кромку 2 мм на все торцы.","Храните листы лёжа на ровном поддоне, а не боком у стены: лист выгнется.","Обрезки больше 300 × 300 мм подпишите и сохраните — пойдут на мелкие полки и вставки."],
       uz:["Ustadan dekorni (rang va kod, masalan Egger H1145), qalinlikni va detallar qayerga ketishini bilib oling.","Listni tekshiring: burchaklarida o'yiq, laminatda tirnalish, bir dekordagi listlar orasida ton farqi yo'q.","Tekstura yo'nalishiga qarang: «yog'och»da rasm listning uzun tomoni (2800 mm) bo'ylab ketadi.","Oshxonada rakovina yonida namga chidamli LDSP yoki hech bo'lmaganda barcha toretsga 2 mm kromka oling.","Listlarni devor yonida yonboshlab emas, tekis poddonda yotqizib saqlang: list egilib qoladi.","300 × 300 mm dan katta qoldiqlarni yozib saqlang — mayda tokcha va qo'shimchalarga ketadi."]},
 tip:{ru:"Полка из ЛДСП 16 мм без опоры не должна быть длиннее 800 мм, иначе через полгода прогнётся. Длиннее — берите 22 мм, ставьте среднюю стойку или металлический уголок снизу.",uz:"Tayanchsiz 16 mm LDSP tokcha 800 mm dan uzun bo'lmasligi kerak, aks holda yarim yilda egiladi. Uzunroq bo'lsa — 22 mm oling, o'rtaga tirgak yoki pastdan metall burchak qo'ying."},

 steps:{ru:["Найдите на чертеже габарит изделия: высота × ширина × глубина, например 2100 × 1200 × 600.","Разберите изделие на детали: 2 боковины, крыша, дно, полки, задняя стенка, фасады.","Для каждой детали запишите длину, ширину, количество, материал и кромку — это деталировка.","Помните: дно и крыша, стоящие между боковинами, короче габарита на 2 толщины ЛДСП (1200 − 32 = 1168).","Отметьте направление текстуры у видимых деталей, чтобы рисунок шёл одинаково.","Отдайте деталировку на раскрой и посчитайте листы в калькуляторе."],

 steps:{ru:["Получите карту раскроя (из программы или калькулятора) и проверьте декор и толщину листа.","Обрежьте заводской край листа с двух сторон (10–15 мм), чтобы получить чистый прямой угол.","Сначала распустите лист продольными резами на полосы нужной ширины.","Каждую полосу режьте поперёк на детали. Первую деталь проверьте рулеткой и угольником.","Следите за сколами снизу: если есть — подрезной диск сбит или затупился.","Подпишите каждую деталь карандашом или наклейкой: заказ, название, где кромка."],
       uz:["Kesish xaritasini (dasturdan yoki kalkulyatordan) oling va list dekori va qalinligini tekshiring.","To'g'ri burchak olish uchun list zavod chetini ikki tomondan (10–15 mm) kesing.","Avval listni bo'ylama kesib, kerakli enda polosalarga ajrating.","Har bir polosani ko'ndalang kesib detallarga bo'ling. Birinchi detalni ruletka va burchaklik bilan tekshiring.","Pastdagi o'yiqlarni kuzating: bo'lsa — podrezka disk siljigan yoki o'tmaslashgan.","Har bir detalga qalam yoki yorliq bilan yozing: buyurtma, nomi, kromka qayerda."]},
 tip:{ru:"Режьте сначала самые большие детали, а мелочь (полки, царги) — из остатков полос. Так отход меньше. Текстуру не крутите у видимых деталей.",uz:"Avval eng katta detallarni kesing, maydalarini (tokcha, sarg'a) polosa qoldiqlaridan. Shunda chiqindi kam bo'ladi. Ko'rinadigan detallarda teksturani burmang."},
 quiz:[
  {a:1,ru:{q:"Зачем обрезать заводской край листа?",o:["Чтобы лист стал легче","Край со сколами и не всегда под 90°","Так быстрее"],e:"10–15 мм срезают, чтобы получить чистую базу."},uz:{q:"Nega list zavod chetini kesish kerak?",o:["List yengilroq bo'lishi uchun","Chet o'yiqli va doim ham 90° emas","Shunday tezroq"],e:"Toza baza olish uchun 10–15 mm kesiladi."}},
  {a:0,ru:{q:"Сколько закладывать на пропил между деталями?",o:["Около 4 мм","0 мм","20 мм"],e:"Ширина основной пилы 3,2–4,4 мм."},uz:{q:"Detallar orasidagi arra iziga qancha qo'yish kerak?",o:["Taxminan 4 mm","0 mm","20 mm"],e:"Asosiy arra eni 3,2–4,4 mm."}},
  {a:2,ru:{q:"Снизу у деталей сколы ламината. Причина?",o:["Плохая рулетка","Слишком толстый лист","Подрезной диск сбит или тупой"],e:"Подрезной диск надрезает ламинат снизу перед основной пилой."},uz:{q:"Detallar pastida laminat o'yilgan. Sababi?",o:["Yomon ruletka","List juda qalin","Podrezka disk siljigan yoki o'tmas"],e:"Podrezka disk asosiy arradan oldin pastki laminatni kesib qo'yadi."}},
  {a:1,ru:{q:"Как проверить, что деталь прямоугольная?",o:["На глаз","Сравнить диагонали","Взвесить"],e:"У прямоугольника диагонали равны."},uz:{q:"Detal to'g'ri to'rtburchak ekanini qanday tekshirish mumkin?",o:["Ko'z bilan","Diagonallarni solishtirish","Tortib ko'rish"],e:"To'g'ri to'rtburchakda diagonallar teng."}}]},

 table:{head:{ru:["Кромка","Где","Как клеят"],uz:["Kromka","Qayerda","Qanday yopishtiriladi"]},rows:{
  ru:[["ПВХ / ABS 2 мм","Передние торцы корпуса, полки, столешницы","Кромкооблицовочный станок или ручной кромочник с клеем"],["ПВХ / ABS 0,4–1 мм","Задние и скрытые торцы","Станок, ручной кромочник"],["Меламиновая с клеем","Дешёвая мебель, ремонт","Утюгом, держится хуже, боится воды и ударов"],["Без кромки","Только торцы, которые никогда не видно и не бывают во влаге","Лучше всё равно закрыть 0,4 мм"]],

 warnB:{ru:"Горячий клей и нож.",uz:"Issiq yelim va pichoq."},warn:{ru:"Клей в станке 200 °C — обжигает сразу. Кромочный нож ведите от себя.",uz:"Stanokdagi yelim 200 °C — darhol kuydiradi. Kromka pichog'ini o'zingizdan uzoqqa yurgizing."},
 steps:{ru:["Проверьте по деталировке, какие торцы и какой кромкой клеить. Отметьте их на детали.","Торец должен быть чистым и ровным, без сколов и пыли — иначе кромка отойдёт.","Разогрейте клей до рабочей температуры (180–210 °C, смотрите паспорт клея).","Отрежьте кромку с запасом 2–3 см на каждый торец и прикатайте с усилием.","Снимите свесы по длине и торцам, на кромке 2 мм сделайте радиус 2 мм.","Проверьте: нет щели, клея на ламинате и «волны» на кромке. Остатки клея снимите очистителем."],
       uz:["Detalirovka bo'yicha qaysi toretslarga va qanday kromka yopishtirishni tekshiring. Detalda belgilang.","Torets toza va tekis, o'yiq va changsiz bo'lishi kerak — aks holda kromka ko'chadi.","Yelimni ish haroratigacha qizdiring (180–210 °C, yelim pasportiga qarang).","Kromkani har toretsga 2–3 sm zaxira bilan kesing va kuch bilan bosib yurgizing.","Uzunlik va toretslardagi ortiqchani oling, 2 mm kromkada 2 mm radius qiling.","Tekshiring: tirqish, laminatda yelim va kromkada «to'lqin» yo'q. Yelim qoldig'ini tozalagich bilan oling."]},
 tip:{ru:"Кромку считают так: сумма длин всех кромкуемых торцов + 3 см на каждый торец + 10 % запаса. Калькулятор во вкладке «Калькулятор» считает это сам по деталировке.",uz:"Kromka shunday hisoblanadi: kromkalanadigan barcha toretslar uzunligi yig'indisi + har toretsga 3 sm + 10 % zaxira. «Kalkulyator» bo'limi buni detalirovka bo'yicha o'zi hisoblaydi."},
 quiz:[
  {a:2,ru:{q:"Какую кромку клеят на передний торец полки?",o:["Меламин","Никакую","ПВХ или ABS 2 мм"],e:"Передний торец видно и по нему бьют — нужна толстая кромка."},uz:{q:"Tokchaning old toretsiga qanday kromka yopishtiriladi?",o:["Melamin","Hech qanday","PVX yoki ABS 2 mm"],e:"Old torets ko'rinadi va unga uriladi — qalin kromka kerak."}},
  {a:0,ru:{q:"Почему кромка отходит через неделю?",o:["Холодный клей, пыльный или кривой торец","Слишком толстая ЛДСП","Много света"],e:"Клей должен быть горячим, а торец чистым."},uz:{q:"Nega kromka bir haftada ko'chadi?",o:["Sovuq yelim, changli yoki qiyshiq torets","LDSP juda qalin","Yorug'lik ko'p"],e:"Yelim issiq, torets toza bo'lishi kerak."}},

  {a:1,ru:{q:"Нужно ли кромковать торцы у мойки?",o:["Нет, их не видно","Да, иначе ЛДСП набухнет от воды","Только краской"],e:"Влага через голый торец за месяц раздувает ДСП."},uz:{q:"Rakovina yonidagi toretslarni kromkalash kerakmi?",o:["Yo'q, ular ko'rinmaydi","Ha, aks holda LDSP suvdan shishadi","Faqat bo'yoq bilan"],e:"Ochiq toretsdan namlik bir oyda DSP ni shishiradi."}}]},

 table:{head:{ru:["Крепёж","Отверстия (ЛДСП 16)","Где"],uz:["Mahkamlagich","Teshiklar (LDSP 16)","Qayerda"]},rows:{
  ru:[["Конфирмат 7 × 50","Пласть Ø7 сквозное, торец Ø5 × 50–55 мм, центр 8 мм от края","Корпус: боковины, дно, крыша. Отступ 50 мм от краёв, далее через 250–300 мм"],["Шкант Ø8 × 30","Пласть Ø8 × 12 мм, торец Ø8 × 20 мм","Направляет детали, вместе с клеем или эксцентриком"],["Эксцентрик (минификс)","Пласть Ø15 × 13 мм + шток в торец","Скрытое соединение без шляпок снаружи"],["Полкодержатель","Ø5 × 10–12 мм, шаг 32 мм","Съёмные полки, 4 шт на полку"],["Петля","Чашка Ø35 × 12–13 мм в фасад","Урок 4-го разряда"]],
  uz:[["Konfirmat 7 × 50","Plast Ø7 teshik, torets Ø5 × 50–55 mm, markaz chetdan 8 mm","Korpus: yon devorlar, tub, tom. Chetlardan 50 mm, keyin har 250–300 mm"],["Shkant Ø8 × 30","Plast Ø8 × 12 mm, torets Ø8 × 20 mm","Detallarni yo'naltiradi, yelim yoki ekssentrik bilan"],["Ekssentrik (minifiks)","Plast Ø15 × 13 mm + toretsga shtok","Tashqarida qalpoqsiz yashirin ulanish"],["Tokcha ushlagich","Ø5 × 10–12 mm, qadam 32 mm","Olinadigan tokchalar, har tokchaga 4 dona"],["Petlya","Fasadga kosacha Ø35 × 12–13 mm","4-razryad darsi"]]}},
 steps:{ru:["Разметьте отверстия от одной базы (переднего края и низа детали), а не от каждого края по-разному.","В пласти боковины сверлите Ø7 насквозь, подложив обрезок снизу — без него вылетит скол.","В торце дна сверлите Ø5 строго по центру толщины (8 мм для ЛДСП 16) и перпендикулярно. Помогает кондуктор.","Глубина торцевого отверстия на 5 мм больше длины резьбы, чтобы конфирмат не упёрся.","Под полки сверлите ряды Ø5 с шагом 32 мм на одинаковой высоте на обеих боковинах.","Проверьте одну пару деталей на стыковку, прежде чем сверлить всю партию."],
       uz:["Teshiklarni har chetdan har xil emas, bitta bazadan (detalning old cheti va pastidan) belgilang.","Yon devor plastida Ø7 ni ostiga qoldiq qo'yib teshib o'ting — aks holda o'yiq chiqadi.","Tub toretsida Ø5 ni qat'iy qalinlik markazida (16 mm LDSP uchun 8 mm) va tik parmalang. Konduktor yordam beradi.","Torets teshigi chuqurligi rezba uzunligidan 5 mm ko'p, konfirmat tirab qolmasligi uchun.","Tokchalar uchun ikkala yon devorda bir xil balandlikda 32 mm qadam bilan Ø5 qatorlar parmalang.","Butun partiyani parmalashdan oldin bir juft detalni ulab tekshiring."]},
 tip:{ru:"Кондуктор для конфирмата (металлический шаблон) стоит недорого и спасает от главного брака — отверстия «вбок», когда конфирмат выходит через ламинат.",uz:"Konfirmat uchun konduktor (metall shablon) arzon turadi va asosiy nuqsondan — konfirmat laminatdan chiqib ketadigan «qiyshiq» teshikdan saqlaydi."},
 quiz:[
  {a:0,ru:{q:"Какие отверстия под конфирмат 7 × 50?",o:["Ø7 в пласти, Ø5 в торце","Ø5 везде","Ø10 в торце"],e:"Шейка конфирмата 7 мм, резьба в ДСП держится в Ø5."},uz:{q:"Konfirmat 7 × 50 uchun qanday teshiklar?",o:["Plastda Ø7, toretsda Ø5","Hamma joyda Ø5","Toretsda Ø10"],e:"Konfirmat bo'yni 7 mm, rezba DSP da Ø5 da ushlaydi."}},
  {a:1,ru:{q:"Шаг отверстий под полкодержатели в мебельной системе?",o:["50 мм","32 мм","100 мм"],e:"Система 32 мм — стандарт мебельной фурнитуры."},uz:{q:"Mebel tizimida tokcha ushlagich teshiklari qadami?",o:["50 mm","32 mm","100 mm"],e:"32 mm tizimi — mebel furniturasi standarti."}},
  {a:2,ru:{q:"Конфирмат вышел через ламинат сбоку. Причина?",o:["Слабый шуруповёрт","Короткий конфирмат","Отверстие в торце не по центру или под углом"],e:"Сверлить строго по центру и перпендикулярно, лучше по кондуктору."},uz:{q:"Konfirmat yon tomondan laminatdan chiqib ketdi. Sababi?",o:["Kuchsiz shurupovyort","Qisqa konfirmat","Torets teshigi markazda emas yoki qiya"],e:"Qat'iy markazda va tik parmalash kerak, konduktor bilan yaxshi."}},
  {a:1,ru:{q:"Зачем подкладывать обрезок под пласть при сквозном сверлении?",o:["Чтобы было тише","Чтобы не было скола на выходе сверла","Чтобы сверло не нагревалось"],e:"Сверло выбивает ламинат на выходе, подкладка держит его."},uz:{q:"Teshib o'tganda plast ostiga qoldiq nima uchun qo'yiladi?",o:["Shovqin kam bo'lishi uchun","Parma chiqishida o'yiq bo'lmasligi uchun","Parma qizimasligi uchun"],e:"Parma chiqishda laminatni urib chiqaradi, taglik uni ushlaydi."}}]},

 t:{ru:"Сборка корпуса",uz:"Korpusni yig'ish"},s:{ru:"Порядок, диагонали, задняя стенка",uz:"Tartib, diagonallar, orqa devor"},

  rect(90,20,180,14)+rect(90,186,180,14)+rect(90,34,14,152)+rect(256,34,14,152)+rect(104,110,152,10)+

  tx(180,226,R(l,'Задняя стенка ХДФ на гвозди через 100–150 мм','Orqa devor XDF har 100–150 mm da mixga'),{s:11,c:AC,w:700})+

 steps:{ru:["Разложите детали на чистом ровном полу или верстаке на картон, лицом вверх — чтобы не поцарапать.","Прикрутите дно и крышу к одной боковине, потом поставьте вторую боковину.","Конфирматы закручивайте шуруповёртом на малом усилии и дотягивайте шестигранником 4 мм. Перетянули — резьба в ДСП сорвана.","Измерьте две диагонали корпуса. Разница больше 2 мм — подбейте угол, пока не станут равны.","Не отпуская формы, прибейте заднюю стенку ХДФ гвоздями или скобами через 100–150 мм по периметру.","Поставьте полкодержатели, полки, проверьте, что корпус стоит без качания."],
       uz:["Detallarni toza tekis polda yoki verstakda kartonga yuzini tepaga qilib qo'ying — tirnalmasligi uchun.","Tub va tomni bitta yon devorga burang, keyin ikkinchi yon devorni qo'ying.","Konfirmatlarni shurupovyortda kichik kuchda burang va 4 mm olti qirrali kalit bilan oxirigacha torting. Ortiqcha tortsangiz — DSP dagi rezba buziladi.","Korpusning ikkita diagonalini o'lchang. Farq 2 mm dan ko'p — teng bo'lguncha burchakni urib to'g'rilang.","Shaklni qo'yib yubormay, XDF orqa devorni perimetr bo'ylab har 100–150 mm da mix yoki skoba bilan qoqing.","Tokcha ushlagichlar, tokchalarni qo'ying, korpus chayqalmay turishini tekshiring."]},
 tip:{ru:"Сорвали резьбу конфирмата — не крутите толще «на авось». Вставьте шкант Ø8 на клей, дайте высохнуть и сверлите заново, или перенесите отверстие на 15–20 мм.",uz:"Konfirmat rezbasi buzildi — «balki» deb yo'g'onini burmang. Yelimga Ø8 shkant qo'ying, qurisin va qayta parmalang yoki teshikni 15–20 mm ga ko'chiring."},
 quiz:[
  {a:1,ru:{q:"Как проверить, что корпус собран без перекоса?",o:["Покачать рукой","Сравнить диагонали","Посмотреть сбоку"],e:"Равные диагонали = прямые углы."},uz:{q:"Korpus qiyshaymasdan yig'ilganini qanday tekshirish mumkin?",o:["Qo'l bilan chayqatib","Diagonallarni solishtirib","Yon tomondan qarab"],e:"Teng diagonallar = to'g'ri burchaklar."}},
  {a:0,ru:{q:"Что фиксирует корпус ровным после сборки?",o:["Задняя стенка, прибитая по периметру","Полки","Ручки"],e:"ХДФ работает как диагональная связь."},uz:{q:"Yig'ishdan keyin korpusni nima tekis qotiradi?",o:["Perimetr bo'ylab qoqilgan orqa devor","Tokchalar","Tutqichlar"],e:"XDF diagonal bog'lovchi bo'lib ishlaydi."}},
  {a:2,ru:{q:"Почему конфирмат дотягивают шестигранником?",o:["Так красивее","Шуруповёрт сломается","Шуруповёртом легко перетянуть и сорвать резьбу в ДСП"],e:"ДСП держит резьбу, только если не перетянуть."},uz:{q:"Nega konfirmat olti qirrali kalit bilan oxirigacha tortiladi?",o:["Chiroyliroq","Shurupovyort buziladi","Shurupovyort bilan ortiqcha tortib, DSP dagi rezbani buzish oson"],e:"DSP rezbani faqat ortiqcha tortilmasa ushlaydi."}},
  {a:1,ru:{q:"Резьба конфирмата сорвана. Что правильно?",o:["Закрутить конфирмат потолще","Шкант на клей и сверлить заново или сместить отверстие","Залить суперклеем и закрутить сразу"],e:"Новое отверстие в целом материале держит как новое."},uz:{q:"Konfirmat rezbasi buzildi. To'g'risi nima?",o:["Yo'g'onroq konfirmat burash","Yelimga shkant va qayta parmalash yoki teshikni siljitish","Superyelim quyib darhol burash"],e:"Butun materialdagi yangi teshik yangidek ushlaydi."}}]},

 table:{head:{ru:["Высота двери","Петель","Если дверь тяжёлая (зеркало, массив)"],uz:["Eshik balandligi","Petlya","Eshik og'ir bo'lsa (oyna, massiv)"]},rows:{

 steps:{ru:["Выберите тип петли по двери: накладная, полунакладная (две двери на одну стойку) или вкладная; угол 110° обычно, 165° — для угловых шкафов.","Разметьте центры чашек: 80–120 мм от верха и низа, остальные — равномерно между ними, не напротив полки.","Сверлом Форстнера Ø35 сверлите чашку на глубину 12–13 мм (по паспорту петли), край чашки в 4–6 мм от края фасада.","Вставьте петлю, прикрутите чашку саморезами 3,5 × 16, приложите фасад к корпусу и разметьте монтажные планки.","Прикрутите планки к боковине (обычно 37 мм от переднего края, по системе 32), защёлкните петли.","Отрегулируйте три винта: зазор между дверями 2–3 мм, высота дверей в линию, прижим к корпусу."],
       uz:["Eshikka qarab petlya turini tanlang: nakladnoy, yarim nakladnoy (bitta tirgakka ikki eshik) yoki ichki; odatda 110°, burchak shkaflar uchun 165°.","Kosacha markazlarini belgilang: yuqori va pastdan 80–120 mm, qolganlari — ular orasida teng, tokcha ro'parasida emas.","Ø35 Forstner parmasi bilan kosachani 12–13 mm chuqurlikda (petlya pasporti bo'yicha) parmalang, kosacha cheti fasad chetidan 4–6 mm da.","Petlyani qo'ying, kosachani 3,5 × 16 shurup bilan burang, fasadni korpusga qo'yib, montaj plankalarini belgilang.","Plankalarni yon devorga burang (odatda old chetdan 37 mm, 32 tizimi bo'yicha), petlyalarni ilib qo'ying.","Uchta vintni rostlang: eshiklar orasidagi tirqish 2–3 mm, eshiklar balandligi bir chiziqda, korpusga bosilishi."]},
 tip:{ru:"Сверлите чашку медленно и с упором (глубиномер на сверле). Насквозь просверлённый фасад уже не спасти — только переделывать.",uz:"Kosachani sekin va tirak bilan parmalang (parmada chuqurlik cheklagich). Teshilib ketgan fasadni qutqarib bo'lmaydi — faqat qayta qilish."},
 quiz:[
  {a:1,ru:{q:"Сколько петель на дверь высотой 1800 мм?",o:["2","4","8"],e:"1600–2000 мм — 4 петли, тяжёлая дверь — 5."},uz:{q:"1800 mm balandlikdagi eshikka nechta petlya?",o:["2","4","8"],e:"1600–2000 mm — 4 petlya, og'ir eshik — 5."}},
  {a:0,ru:{q:"Диаметр чашки стандартной мебельной петли?",o:["35 мм","20 мм","50 мм"],e:"Сверло Форстнера Ø35."},uz:{q:"Standart mebel petlyasi kosachasining diametri?",o:["35 mm","20 mm","50 mm"],e:"Forstner parmasi Ø35."}},
  {a:2,ru:{q:"Две двери закрывают одну общую стойку. Какая петля?",o:["Накладная","Вкладная","Полунакладная"],e:"Каждая дверь закрывает половину торца стойки."},uz:{q:"Ikki eshik bitta umumiy tirgakni yopadi. Qaysi petlya?",o:["Nakladnoy","Ichki","Yarim nakladnoy"],e:"Har bir eshik tirgak toretsining yarmini yopadi."}},
  {a:1,ru:{q:"Двери не в линию по высоте. Что делать?",o:["Перевесить двери","Отрегулировать винтами петель","Подпилить фасад"],e:"У петли три регулировки: вбок, по высоте, по глубине."},uz:{q:"Eshiklar balandligi bir chiziqda emas. Nima qilish kerak?",o:["Eshiklarni qayta osish","Petlya vintlari bilan rostlash","Fasadni egovlash"],e:"Petlyada uchta rostlash bor: yonga, balandlikka, chuqurlikka."}}]},

 steps:{ru:["Измерьте проём между боковинами в свету (внутри) и глубину корпуса.","Возьмите направляющие длиной кратно 50 мм, не длиннее глубины корпуса минус 10 мм (корпус 560 → направляющие 500 или 550).","Посчитайте ширину ящика по таблице: для шариковых — проём минус 26 мм. Всегда сверяйтесь с инструкцией конкретной фурнитуры.","Разметьте линии крепления на обеих боковинах на одной высоте от низа — лучше по шаблону.","Прикрутите корпусную часть к боковинам, ящичную — к бортам ящика, вставьте ящик.","Проверьте ход: ящик идёт легко, без перекоса, фасад ящика выставлен по зазорам 2–3 мм."],
       uz:["Yon devorlar orasidagi ichki oraliqni va korpus chuqurligini o'lchang.","Uzunligi 50 mm ga karrali, korpus chuqurligi minus 10 mm dan uzun bo'lmagan yo'naltiruvchi oling (korpus 560 → 500 yoki 550).","Tortma enini jadval bo'yicha hisoblang: sharikli uchun — oraliq minus 26 mm. Doim aniq furnitura yo'riqnomasini tekshiring.","Ikkala yon devorda pastdan bir xil balandlikda mahkamlash chiziqlarini belgilang — shablon bilan yaxshi.","Korpus qismini yon devorlarga, tortma qismini tortma bortlariga burang, tortmani kiriting.","Yurishni tekshiring: tortma oson, qiyshaymasdan yuradi, tortma fasadi 2–3 mm tirqishlar bo'yicha to'g'rilangan."]},
 tip:{ru:"Направляющие на разной высоте — главная причина, почему ящик «заедает». Ставьте их от одной базы (низа корпуса) или по деревянной планке-шаблону.",uz:"Har xil balandlikdagi yo'naltiruvchilar — tortma «tiqilib qolishi»ning asosiy sababi. Ularni bitta bazadan (korpus pastidan) yoki yog'och planka-shablon bo'yicha qo'ying."},
 quiz:[
  {a:1,ru:{q:"Проём 564 мм, шариковые направляющие. Ширина ящика?",o:["564 мм","538 мм","500 мм"],e:"564 − 26 = 538 мм."},uz:{q:"Oraliq 564 mm, sharikli yo'naltiruvchi. Tortma eni?",o:["564 mm","538 mm","500 mm"],e:"564 − 26 = 538 mm."}},
  {a:0,ru:{q:"Корпус глубиной 560 мм. Какие направляющие подойдут?",o:["500 или 550 мм","600 мм","700 мм"],e:"Не длиннее глубины минус 10 мм."},uz:{q:"Korpus chuqurligi 560 mm. Qanday yo'naltiruvchi to'g'ri keladi?",o:["500 yoki 550 mm","600 mm","700 mm"],e:"Chuqurlik minus 10 mm dan uzun emas."}},
  {a:2,ru:{q:"Какие направляющие дают полное выдвижение ящика?",o:["Роликовые","Никакие","Шариковые телескопические и скрытые"],e:"Роликовые выдвигаются примерно на 3/4."},uz:{q:"Qaysi yo'naltiruvchilar tortmani to'liq chiqaradi?",o:["Rolikli","Hech biri","Sharikli teleskop va yashirin"],e:"Rolikli taxminan 3/4 ga chiqadi."}},
  {a:1,ru:{q:"Ящик заедает и идёт с перекосом. Частая причина?",o:["Тяжёлые вещи","Направляющие стоят на разной высоте","Цвет фасада"],e:"Размечайте от одной базы или по шаблону."},uz:{q:"Tortma tiqiladi va qiyshayib yuradi. Ko'p uchraydigan sabab?",o:["Og'ir narsalar","Yo'naltiruvchilar har xil balandlikda","Fasad rangi"],e:"Bitta bazadan yoki shablon bo'yicha belgilang."}}]},

 warnB:{ru:"Газ, вода и электричество.",uz:"Gaz, suv va elektr."},warn:{ru:"Газовую плиту подключает только газовая служба. Перед сверлением стены найдите проводку и трубы детектором.",uz:"Gaz plitasini faqat gaz xizmati ulaydi. Devorni parmalashdan oldin detektor bilan simlar va quvurlarni toping."},
 steps:{ru:["Найдите лазером самую высокую точку пола вдоль кухни — от неё выставляются все нижние базы.","Соберите корпуса, поставьте на ножки и выставьте их в один уровень по лазеру. Стяните соседние корпуса между собой стяжками.","Навесные шкафы вешайте на монтажную шину или регулируемые навесы. Дюбели — под материал стены (кирпич, бетон, газоблок).","Уложите столешницу. Вырез под мойку и варочную панель делайте лобзиком по шаблону, торцы выреза промажьте силиконовым герметиком.","Поставьте фасады, отрегулируйте петли и ящики, наклейте плинтус и цоколь.","Сдайте работу: все двери и ящики работают, зазоры ровные, нет мусора и пыли."],
       uz:["Lazer bilan oshxona bo'ylab polning eng baland nuqtasini toping — barcha pastki bazalar shundan to'g'rilanadi.","Korpuslarni yig'ing, oyoqchaga qo'ying va lazer bo'yicha bir tekislikka to'g'rilang. Qo'shni korpuslarni styajka bilan bir-biriga torting.","Osma shkaflarni montaj shinasiga yoki rostlanadigan ilgaklarga iling. Dyubellar — devor materialiga qarab (g'isht, beton, gazoblok).","Stoleshnitsani qo'ying. Rakovina va varochniy panel uchun o'yiqni shablon bo'yicha lobzik bilan qiling, o'yiq toretslarini silikon germetik bilan surting.","Fasadlarni qo'ying, petlya va tortmalarni rostlang, plintus va tsokolni yopishtiring.","Ishni topshiring: barcha eshik va tortmalar ishlaydi, tirqishlar tekis, axlat va chang yo'q."]},
 tip:{ru:"Не загерметизированный вырез под мойку — самая частая причина, почему через год столешница вздувается. Силикон на торцы выреза — обязательно.",uz:"Germetiklanmagan rakovina o'yig'i — bir yildan keyin stoleshnitsa shishishining eng ko'p sababi. O'yiq toretslariga silikon — majburiy."},
 quiz:[
  {a:2,ru:{q:"От какой точки пола выставляют нижние базы кухни?",o:["От самой низкой","От середины","От самой высокой"],e:"Иначе на высоком месте база не встанет под общий уровень."},uz:{q:"Oshxona pastki bazalari polning qaysi nuqtasidan to'g'rilanadi?",o:["Eng pastidan","O'rtasidan","Eng balandidan"],e:"Aks holda baland joyda baza umumiy tekislikka tushmaydi."}},
  {a:0,ru:{q:"Обычное расстояние от столешницы до низа навесных шкафов?",o:["550–650 мм","200 мм","1000 мм"],e:"Удобно работать и не биться головой."},uz:{q:"Stoleshnitsadan osma shkaflar pastigacha odatiy masofa?",o:["550–650 mm","200 mm","1000 mm"],e:"Ishlash qulay va boshni urmaysiz."}},
  {a:1,ru:{q:"Что сделать с торцами выреза под мойку?",o:["Ничего","Промазать силиконовым герметиком","Покрасить"],e:"Иначе вода попадёт в ДСП и столешница вздуется."},uz:{q:"Rakovina o'yig'i toretslari bilan nima qilish kerak?",o:["Hech narsa","Silikon germetik bilan surtish","Bo'yash"],e:"Aks holda suv DSP ga kiradi va stoleshnitsa shishadi."}},
  {a:1,ru:{q:"Кто подключает газовую плиту?",o:["Мебельщик","Только газовая служба","Хозяин сам"],e:"Это не работа сборщика мебели."},uz:{q:"Gaz plitasini kim ulaydi?",o:["Mebelchi","Faqat gaz xizmati","Uy egasi o'zi"],e:"Bu mebel yig'uvchining ishi emas."}}]},

 svg:l=>svg(

 table:{head:{ru:["Что","Ориентир"],uz:["Nima","Taxminan"]},rows:{
  ru:[["Глубина шкафа-купе","600–650 мм (плечики ~450–500 мм + двери)"],["Нахлёст дверей","Ширина профиля-ручки, обычно 25–40 мм — по системе (Aristo, Raumplus и др.)"],["Штанга для одежды","Короткие вещи — 1000 мм высоты отделения, длинные — 1500–1700 мм"],["Длина штанги без опоры","До 1000 мм, длиннее — средняя опора"],["Полки для белья","Шаг 300–400 мм, глубина как у шкафа"],["Обувь","Наклонные полки или сетки, высота отделения 150–200 мм"]],
  uz:[["Kupe shkaf chuqurligi","600–650 mm (ilgich ~450–500 mm + eshiklar)"],["Eshiklar ustma-ust kirishi","Profil-tutqich eni, odatda 25–40 mm — tizim bo'yicha (Aristo, Raumplus va b.)"],["Kiyim shtangasi","Qisqa kiyim — bo'lim balandligi 1000 mm, uzun — 1500–1700 mm"],["Tayanchsiz shtanga uzunligi","1000 mm gacha, uzunroq — o'rtada tayanch"],["Ich kiyim tokchalari","Qadam 300–400 mm, chuqurlik shkafnikidek"],["Poyabzal","Qiya tokcha yoki setka, bo'lim balandligi 150–200 mm"]]}},
 steps:{ru:["Замерьте нишу: ширину и высоту в трёх местах, возьмите меньший размер. Пол и потолок проверьте уровнем.","Выберите систему дверей и возьмите её таблицу: высота двери = высота проёма минус зазор по системе.","Посчитайте ширину двери: (проём + нахлёст × (n − 1)) ÷ n. Калькулятор во вкладке «Калькулятор».","Спланируйте наполнение с клиентом: штанги, полки, ящики, обувь. Ящики ставьте так, чтобы их не задевала дверь купе.","Верхнюю направляющую крепите строго по уровню, нижнюю — точно под ней (отвесом или лазером).","Повесьте двери, отрегулируйте нижние ролики: двери идут легко и стоят без щели к боковинам."],
       uz:["Joyni o'lchang: en va balandlikni uch joyda, eng kichigini oling. Pol va shiftni shovun bilan tekshiring.","Eshik tizimini tanlang va uning jadvalini oling: eshik balandligi = oraliq balandligi minus tizim bo'yicha tirqish.","Eshik enini hisoblang: (oraliq + ustma-ust × (n − 1)) ÷ n. «Kalkulyator» bo'limida.","Mijoz bilan ichki to'ldirishni rejalashtiring: shtangalar, tokchalar, tortmalar, poyabzal. Tortmalarni kupe eshigi tegmaydigan qilib qo'ying.","Yuqori yo'naltiruvchini qat'iy shovun bo'yicha, pastkisini aniq uning ostiga (shoqul yoki lazer bilan) mahkamlang.","Eshiklarni iling, pastki roliklarni rostlang: eshiklar oson yuradi va yon devorlarga tirqishsiz turadi."]},
 tip:{ru:"Внутренние ящики в купе — частая ошибка: их ставят за дверью, и ящик упирается в профиль. Отступите от края проёма на ширину профиля + 10 мм или поставьте ящики в середину створки.",uz:"Kupe ichidagi tortmalar — ko'p uchraydigan xato: ularni eshik orqasiga qo'yishadi va tortma profilga tiralib qoladi. Oraliq chetidan profil eni + 10 mm chekining yoki tortmalarni tavaqa o'rtasiga qo'ying."},
 quiz:[
  {a:1,ru:{q:"Проём 1800 мм, 2 двери, нахлёст 30 мм. Ширина двери?",o:["900 мм","915 мм","885 мм"],e:"(1800 + 30) ÷ 2 = 915 мм."},uz:{q:"Oraliq 1800 mm, 2 eshik, ustma-ust 30 mm. Eshik eni?",o:["900 mm","915 mm","885 mm"],e:"(1800 + 30) ÷ 2 = 915 mm."}},
  {a:0,ru:{q:"Минимальная удобная глубина шкафа-купе для плечиков?",o:["600 мм","350 мм","400 мм"],e:"Плечики 450–500 мм плюс место под двери."},uz:{q:"Ilgichlar uchun kupe shkafning qulay eng kam chuqurligi?",o:["600 mm","350 mm","400 mm"],e:"Ilgich 450–500 mm va eshiklar uchun joy."}},
  {a:2,ru:{q:"Ниша шире вверху на 15 мм, чем внизу. Какой размер брать?",o:["Верхний","Средний","Меньший (нижний)"],e:"Изделие должно войти в самом узком месте."},uz:{q:"Joy yuqorida pastdan 15 mm kengroq. Qaysi o'lchamni olish kerak?",o:["Yuqorisini","O'rtasini","Kichigini (pastkisini)"],e:"Buyum eng tor joyga sig'ishi kerak."}},
  {a:1,ru:{q:"Штанга 1400 мм без опоры — что будет?",o:["Ничего","Прогнётся под одеждой","Станет крепче"],e:"Без опоры — до 1000 мм."},uz:{q:"Tayanchsiz 1400 mm shtanga — nima bo'ladi?",o:["Hech narsa","Kiyim ostida egiladi","Mustahkamroq bo'ladi"],e:"Tayanchsiz — 1000 mm gacha."}}]},

 table:{head:{ru:["Что замерить","Зачем"],uz:["Nimani o'lchash","Nima uchun"]},rows:{
  ru:[["Ширину и высоту в 3 местах, диагонали","Стены и пол почти всегда кривые"],["Розетки, выключатели, трубы, счётчики","Вырезы в задней стенке и боковинах"],["Плинтус, батарея, подоконник, наличники","Мешают поставить корпус вплотную"],["Открывание окон и дверей рядом","Чтобы дверь шкафа не билась о ручку окна"],["Материал стен","Какие дюбели и можно ли вешать тяжёлые шкафы"],["Пожелания клиента и фото помещения","Проект без переделок"]],
  uz:[["En va balandlikni 3 joyda, diagonallar","Devor va pol deyarli doim qiyshiq"],["Rozetkalar, o'chirgichlar, quvurlar, hisoblagichlar","Orqa devor va yon devorlardagi o'yiqlar"],["Plintus, batareya, deraza tokchasi, nalichniklar","Korpusni zich qo'yishga xalaqit beradi"],["Yaqindagi deraza va eshiklar ochilishi","Shkaf eshigi deraza tutqichiga urilmasligi uchun"],["Devor materiali","Qanday dyubel va og'ir shkaf osish mumkinmi"],["Mijoz istaklari va xona rasmi","Qayta ishlashsiz loyiha"]]}},
 steps:{ru:["Приезжайте вовремя с лазерным дальномером, рулеткой, уровнем, блокнотом и образцами декоров.","Нарисуйте план от руки и пишите размеры сразу на нём. Ширину, высоту — в трёх местах, плюс диагонали.","Отметьте всё, что мешает: розетки, трубы, батареи, плинтус, вентиляцию. Сфотографируйте каждую стену.","Обсудите с клиентом наполнение, декор, фурнитуру, бюджет и сроки.","Сделайте проект в программе (Базис-Мебельщик, PRO100, K3-Мебель или подобной): 3D-картинка для клиента и деталировка для цеха.","Согласуйте проект и смету письменно (подпись или сообщение в Telegram) до раскроя."],
       uz:["Lazer o'lchagich, ruletka, shovun, bloknot va dekor namunalari bilan vaqtida keling.","Rejani qo'lda chizing va o'lchamlarni darhol unga yozing. En, balandlik — uch joyda, va diagonallar.","Xalaqit beradigan hamma narsani belgilang: rozetka, quvur, batareya, plintus, ventilyatsiya. Har bir devorni suratga oling.","Mijoz bilan ichki to'ldirish, dekor, furnitura, byudjet va muddatni muhokama qiling.","Dasturda loyiha qiling (Bazis-Mebelshik, PRO100, K3-Mebel yoki shunga o'xshash): mijoz uchun 3D rasm va sex uchun detalirovka.","Kesishdan oldin loyiha va smetani yozma kelishing (imzo yoki Telegramda xabar)."]},
 tip:{ru:"Делайте изделие на 10–20 мм меньше ниши по ширине и высоте, а щель закрывайте планкой-доборником. Корпус «впритык» в кривую нишу не встанет.",uz:"Buyumni joydan en va balandlik bo'yicha 10–20 mm kichik qiling, tirqishni dobor-planka bilan yoping. «Zich» korpus qiyshiq joyga sig'maydi."},
 quiz:[
  {a:0,ru:{q:"Сколько раз мерить ширину ниши?",o:["В трёх местах: верх, середина, низ","Один раз посередине","Не мерить, взять из проекта дома"],e:"Стены почти всегда «гуляют»."},uz:{q:"Joy enini necha marta o'lchash kerak?",o:["Uch joyda: yuqori, o'rta, past","Bir marta o'rtada","O'lchamaslik, uy loyihasidan olish"],e:"Devorlar deyarli doim «yuradi»."}},
  {a:1,ru:{q:"Зачем делать шкаф на 10–20 мм меньше ниши?",o:["Экономия ЛДСП","Чтобы встал в кривую нишу, щель закрыть доборником","Так красивее"],e:"Доборная планка подрезается по стене."},uz:{q:"Nega shkafni joydan 10–20 mm kichik qilish kerak?",o:["LDSP tejash","Qiyshiq joyga sig'ishi uchun, tirqishni dobor bilan yopish","Chiroyliroq"],e:"Dobor planka devorga qarab kesiladi."}},
  {a:2,ru:{q:"Когда согласовывать проект с клиентом?",o:["После монтажа","Не нужно","До раскроя, письменно"],e:"Потом переделка — за ваш счёт."},uz:{q:"Loyihani mijoz bilan qachon kelishish kerak?",o:["Montajdan keyin","Kerak emas","Kesishdan oldin, yozma"],e:"Keyin qayta qilish — sizning hisobingizdan."}},
  {a:1,ru:{q:"Что обязательно отметить на замере?",o:["Цвет обоев","Розетки, трубы, батареи, плинтус","Марку телевизора"],e:"Под них делают вырезы или меняют размеры."},uz:{q:"O'lchashda nimani albatta belgilash kerak?",o:["Gulqog'oz rangi","Rozetka, quvur, batareya, plintus","Televizor markasi"],e:"Ular uchun o'yiq qilinadi yoki o'lchamlar o'zgartiriladi."}}]},

{id:'d3',lv:3,min:7,nowarn:true,calc:true,
 t:{ru:"Смета, цена и сдача заказа",uz:"Smeta, narx va buyurtmani topshirish"},s:{ru:"Из чего цена, предоплата, гарантия",uz:"Narx nimadan iborat, avans, kafolat"},
 svg:l=>svg(
  [[20,R(l,'ЛДСП','LDSP'),'38%'],[90,R(l,'Фасады','Fasad'),'22%'],[160,R(l,'Фурнитура','Furnitura'),'18%'],[230,R(l,'Кромка, крепёж','Kromka'),'5%'],[300,R(l,'Работа','Ish'),'17%']]
  .map(([x,a,p],i)=>{const h=[110,66,54,18,52][i];return rect(x,170-h,50,h,i==4?WOOD2:WOOD)+tx(x+25,186,a,{s:10,w:600})+tx(x+25,164-h,p,{s:11,w:700,c:AC})}).join('')+
  tx(180,216,R(l,'Цена = материалы + работа + доставка/монтаж + прибыль','Narx = materiallar + ish + yetkazish/montaj + foyda'),{s:11,w:700})+

 table:{head:{ru:["Статья","Как считать"],uz:["Modda","Qanday hisoblash"]},rows:{
  ru:[["ЛДСП","Листы по карте раскроя × цена листа (не по м² детали!)"],["Распил и кромка","Если в цеху-партнёре — по их прайсу за метр реза и кромки"],["Фасады","МДФ/акрил/пластик — по м² у поставщика фасадов"],["Фурнитура","Петли, направляющие, ручки, ножки, подъёмники — по списку"],["Работа","Сборка, монтаж, доставка, подъём на этаж"],["Прибыль и риски","Обычно 15–30 % сверху: брак, переделки, налоги"]],
  uz:[["LDSP","Kesish xaritasi bo'yicha listlar × list narxi (detal m² bo'yicha emas!)"],["Kesish va kromka","Hamkor sexda bo'lsa — ularning kesish va kromka metri narxi bo'yicha"],["Fasadlar","MDF/akril/plastik — fasad yetkazuvchisida m² bo'yicha"],["Furnitura","Petlya, yo'naltiruvchi, tutqich, oyoqcha, ko'targich — ro'yxat bo'yicha"],["Ish","Yig'ish, montaj, yetkazish, qavatga ko'tarish"],["Foyda va xatarlar","Odatda ustiga 15–30 %: nuqson, qayta qilish, soliqlar"]]}},
 steps:{ru:["Посчитайте материалы по деталировке: сколько листов, метров кромки, какой фурнитуры. Калькулятор во вкладке «Калькулятор».","Добавьте фасады, работу, доставку, монтаж и вывоз мусора.","Заложите прибыль и запас на риски 15–30 %. Цену пишите одной суммой, а расшифровку держите у себя.","Возьмите предоплату 50–70 % на материалы и пропишите сроки и что входит в цену (договор или сообщение).","На сдаче проверьте с клиентом каждую дверь и ящик, уберите мусор, сфотографируйте работу для портфолио.","Дайте письменную гарантию (обычно 12–24 месяца) и правила ухода: не мочить торцы, регулировка петель."],
       uz:["Detalirovka bo'yicha materiallarni hisoblang: nechta list, necha metr kromka, qanday furnitura. «Kalkulyator» bo'limida.","Fasadlar, ish, yetkazish, montaj va axlat olib ketishni qo'shing.","Foyda va xatarlar uchun 15–30 % qo'ying. Narxni bitta summa bilan yozing, tafsilotini o'zingizda saqlang.","Materiallar uchun 50–70 % avans oling, muddat va narxga nima kirishini yozing (shartnoma yoki xabar).","Topshirishda mijoz bilan har bir eshik va tortmani tekshiring, axlatni oling, ishni portfolio uchun suratga oling.","Yozma kafolat (odatda 12–24 oy) va parvarish qoidalarini bering: toretslarni ho'llamaslik, petlyalarni rostlash."]},
 tip:{ru:"ЛДСП считайте целыми листами по карте раскроя, а не по площади деталей: обрезки остаются у вас. Ошибка «по м²» съедает всю прибыль с заказа.",uz:"LDSP ni detallar maydoni bo'yicha emas, kesish xaritasi bo'yicha butun listlarda hisoblang: qoldiqlar sizda qoladi. «m² bo'yicha» xato buyurtmaning butun foydasini yeb qo'yadi."},

      const cls=isDone?'done open':open?'open':'locked';
      const right=isDone?`<span class="go" aria-label="${L.done}">✓</span>`:open?'<span class="go">›</span>':lockI();
      const sub=!open&&!isDone&&isPaid(x)?L.paid:tr(x.s);
      h+=open||isDone?`<button class="item ${cls}" type="button" data-id="${x.id}">`:`<div class="item ${cls}">`;
      h+=`<span class="n">${i+1}</span><span class="tx"><b>${tr(x.t)}</b><span>${sub}</span></span>${right}${open||isDone?'</button>':'</div>'}`;
    });
    const can=lvDone(lv),passed=grades.has(lv),n=byLv(lv).length*2;
    h+=can?`<button class="item exam ${passed?'done':''} open" type="button" data-ex="${lv}">`:`<div class="item exam locked">`;
    h+=`<span class="n">★</span><span class="tx"><b>${L.exT(g.n)}</b><span>${passed?L.exDone:can?L.exS(needEx(n),n):L.exLock}</span></span>${passed?'<span class="go">✓</span>':can?'<span class="go">›</span>':lockI()}${can?'</button>':'</div>'}`;
    h+='</div></section>';
  });
  h+=`<button class="link" id="reset" type="button">${L.reset}</button></main>`;
  app.innerHTML=h;
  document.querySelectorAll('[data-id]').forEach(b=>b.onclick=()=>{S.id=b.dataset.id;go('lesson')});
  document.querySelectorAll('[data-ex]').forEach(b=>b.onclick=()=>startExam(+b.dataset.ex));
  const c=$('#cert');if(c)c.onclick=openCert;
  const r=$('#reset');r.onclick=()=>{if(r.dataset.c){done=new Set();grades=new Set();store.set('done',[]);store.set('grades',[]);render()}else{r.dataset.c=1;r.textContent=lang==='ru'?'Нажмите ещё раз, чтобы сбросить':'Tozalash uchun yana bosing'}};
}

function openCert(){
  const g=topGrade();if(g<0)return;
  const topics={ru:[],uz:[]};
  LESSONS.filter(x=>x.lv<=g).forEach(x=>{topics.ru.push(`${GRADES[x.lv].n} р. — ${x.t.ru}`);topics.uz.push(`${GRADES[x.lv].n}-r. — ${x.t.uz}`)});
  if(window.KasbCert&&window.KasbCert.open){window.KasbCert.open({prefix:PFX,lang,prof:{ru:'Мебельщик (станочник, сборщик корпусной мебели)',uz:'Mebelchi (stanokchi, korpus mebel yig\'uvchisi)'},grade:GRADES[g].n,topics,sources:SOURCES,url:'kasbpro.uz/mebel/',start:'mebel'});return}
  const m=$('#certmsg');if(m)m.textContent=U().certSoon;
}

function lesson(){
  const L=U();const x=LESSONS.find(y=>y.id===S.id);const list=byLv(x.lv);const n=list.indexOf(x)+1;
  let h=header(`<div class="row"><button class="back" id="back" type="button">${L.all}</button>${langSw()}</div><h1 class="ttl">${tr(x.t)}</h1><p>${L.lvl(L.gr(GRADES[x.lv].n),n,x.min)}</p>`)+'<main class="wrap">';
  if(x.svg)h+=`<div class="card diagram"><div class="sv">${x.svg(lang)}</div></div>`;
  if(!x.nowarn)h+=`<div class="warn"><span aria-hidden="true">⚠</span><div><b>${x.warnB?tr(x.warnB):L.warnB}</b> ${x.warn?tr(x.warn):L.warn}</div></div>`;
  if(x.table){h+=`<div class="card tbl"><table><thead><tr>${tr(x.table.head).map(c=>`<th>${c}</th>`).join('')}</tr></thead><tbody>${tr(x.table.rows).map(r=>`<tr>${r.map(c=>`<td>${c}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`}
  h+=`<div class="card stack"><h3>${L.stepsT}</h3><ol class="steps">${tr(x.steps).map(s=>`<li><span>${s}</span></li>`).join('')}</ol><p class="tip"><b>${L.tipT}:</b> ${tr(x.tip)}</p></div>`;
  if(x.calc)h+=`<button class="btn ghost" id="calc" type="button">${L.openCalc}</button>`;
  h+=`<button class="btn" id="start" type="button">${L.start(x.quiz.length)}</button></main>`;
  app.innerHTML=h;
  $('#back').onclick=()=>go('home');
  $('#start').onclick=()=>{S.exam=null;S.qs=x.quiz;S.qi=0;S.score=0;S.picked=null;go('quiz')};
  const c=$('#calc');if(c)c.onclick=()=>{S.tab=1;go('home')};
}

function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function startExam(lv){S.exam=lv;S.qs=shuffle(byLv(lv).flatMap(x=>shuffle(x.quiz).slice(0,2)));S.qi=0;S.score=0;S.picked=null;go('quiz')}

function quiz(){
  const L=U();const ex=S.exam!==null;const x=ex?null:LESSONS.find(y=>y.id===S.id);const QZ=S.qs;const item=QZ[S.qi];const Q=tr(item);const p=S.picked;
  const title=ex?L.exT(GRADES[S.exam].n):`${L.qt}: ${tr(x.t)}`;const sub=ex?L.exS(needEx(QZ.length),QZ.length):L.qsub(need(QZ.length),QZ.length);
  const opts=Q.o.map((o,i)=>{let c='opt';if(p!==null){if(i===item.a)c+=' right';else if(i===p)c+=' wrong'}return `<button class="${c}" data-i="${i}" type="button" ${p!==null?'disabled':''}>${o}</button>`}).join('');
  app.innerHTML=header(`<div class="row"><button class="back" id="back" type="button">${ex?L.all:L.toL}</button>${langSw()}</div><h1 class="ttl">${title}</h1><p>${sub}</p>`)+`<main class="wrap">
   <div class="progress"><div class="q-top"><span>${L.qn(S.qi+1,QZ.length)}</span><span>${L.ok(S.score)}</span></div><div class="meter"><i style="width:${(S.qi+(p!==null?1:0))/QZ.length*100}%"></i></div></div>
   <p class="q">${Q.q}</p><div class="opts">${opts}</div>
   ${p!==null?`<p class="expl">${p===item.a?`<b class="okc">${L.right}</b> `:`<b class="badc">${L.wrong}</b> `}${Q.e}</p><button class="btn" id="next" type="button">${S.qi<QZ.length-1?L.next:L.res}</button>`:''}
  </main>`;
  $('#back').onclick=()=>go(ex?'home':'lesson');
  document.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{S.picked=+b.dataset.i;if(S.picked===item.a)S.score++;render()});
  const n=$('#next');if(n)n.onclick=()=>{if(S.qi<QZ.length-1){S.qi++;S.picked=null;go('quiz')}else{
    if(ex){if(S.score>=needEx(QZ.length)){grades.add(S.exam);store.set('grades',[...grades])}}
    else if(S.score>=need(QZ.length)){done.add(x.id);store.set('done',[...done])}
    go('result')}};
}

function result(){
  const L=U();const n=S.qs.length;
  if(S.exam!==null){const g=GRADES[S.exam],pass=S.score>=needEx(n);
    app.innerHTML=header(`<div class="row"><div><h1>${L.res}</h1><p>${L.exT(g.n)}</p></div>${langSw()}</div>`)+`<main class="wrap"><div class="card result">
     ${pass?medal(g.n,true,72):''}<div class="score">${S.score} / ${n}</div><h3>${pass?L.exPass(g.n):L.failT}</h3>${pass?'':`<p class="expl">${L.exFail(needEx(n),n)}</p>`}</div>
     ${pass?`<button class="btn" id="cert" type="button">${L.cert}</button><p class="note" id="certmsg">${L.certNote}</p>`:`<button class="btn" id="retry" type="button">${L.retry}</button>`}
     <button class="btn ghost" id="home" type="button">${L.home}</button></main>`;
    $('#home').onclick=()=>go('home');
    const c=$('#cert');if(c)c.onclick=openCert;
    const r=$('#retry');if(r)r.onclick=()=>startExam(S.exam);
    return}
  const x=LESSONS.find(y=>y.id===S.id);const pass=S.score>=need(n);
  const list=byLv(x.lv);const nx=list[list.indexOf(x)+1];const exReady=pass&&!nx&&lvDone(x.lv)&&!grades.has(x.lv);
  app.innerHTML=header(`<div class="row"><div><h1>${L.res}</h1><p>${tr(x.t)}</p></div>${langSw()}</div>`)+`<main class="wrap"><div class="card result">
   <div class="score">${S.score} / ${n}</div><h3>${pass?L.passT:L.failT}</h3>
   <p class="expl">${pass?(nx?L.passNext(tr(nx.t)):L.passLast):L.fail(need(n),n)}</p></div>
   ${pass&&nx?`<button class="btn" id="nextL" type="button">${L.nextL}</button>`:''}
   ${exReady?`<button class="btn" id="toEx" type="button">${L.toExam}</button>`:''}
   ${pass?'':`<button class="btn" id="retry" type="button">${L.retry}</button>`}
   <button class="btn ghost" id="home" type="button">${L.home}</button></main>`;
  $('#home').onclick=()=>go('home');
  const r=$('#retry');if(r)r.onclick=()=>{S.qi=0;S.score=0;S.picked=null;go('quiz')};
  const nl=$('#nextL');if(nl)nl.onclick=()=>{S.id=nx.id;go('lesson')};
  const te=$('#toEx');if(te)te.onclick=()=>startExam(x.lv);
}

/* calculators: sheet cutting + edging, fittings, sliding doors, price */
const fmt=(n,d=0)=>n.toFixed(d).replace('.',',').replace('-','−');
const money=n=>Math.round(n).toLocaleString('ru-RU').replace(/,/g,' ');
const numv=v=>+String(v).replace(',','.')||0;
const seg=(k,opts)=>`<div class="seg" role="group">${opts.map((o,i)=>`<button type="button" data-seg="${k}" data-v="${i}" aria-pressed="${S.calc[k]===i}">${o}</button>`).join('')}</div>`;
const fld=(id,lab,v,step=1)=>`<label class="fld" for="${id}">${lab}<input id="${id}" type="number" inputmode="decimal" min="0" step="${step}" value="${v}"></label>`;
const cell=(t,v)=>`<div><span>${t}</span><b>${v}</b></div>`;

// shelf (strip) packing: strips run along the sheet length; parts placed left to right inside a strip
function pack(parts,SL,SW,kerf,trim,rot){
  const W0=SL-2*trim,H0=SW-2*trim;let items=[],big=0;
  parts.forEach(([l,w,q])=>{l=numv(l);w=numv(w);q=Math.round(numv(q));if(!(l>0&&w>0&&q>0))return;for(let i=0;i<q;i++)items.push({l,w})});
  items=items.filter(it=>{const fits=(it.l<=W0&&it.w<=H0)||(rot&&it.w<=W0&&it.l<=H0);if(!fits)big++;return fits});
  items.sort((a,b)=>Math.max(b.l,b.w)-Math.max(a.l,a.w)||b.l*b.w-a.l*a.w);
  const sheets=[];
  const opts=it=>{const o=[{w:it.l,h:it.w}];if(rot&&it.l!==it.w)o.push({w:it.w,h:it.l});return o.filter(o=>o.w<=W0&&o.h<=H0)};
  items.forEach(it=>{let placed=false;const os=opts(it);
    for(const sh of sheets){for(const st of sh.strips){let best=null;for(const o of os){if(o.h<=st.h&&st.x+o.w<=W0+1e-6&&(!best||st.h-o.h<st.h-best.h))best=o}
      if(best){sh.rects.push({x:st.x,y:st.y,w:best.w,h:best.h});st.x+=best.w+kerf;placed=true;break}}
      if(placed)break;
      // new strip on this sheet: choose orientation with the smaller height that fits
      const o=os.filter(o=>sh.y+o.h<=H0+1e-6).sort((a,b)=>a.h-b.h)[0];
      if(o){const st={y:sh.y,h:o.h,x:o.w+kerf};sh.strips.push(st);sh.rects.push({x:0,y:sh.y,w:o.w,h:o.h});sh.y+=o.h+kerf;placed=true;break}}
    if(!placed){const o=os.sort((a,b)=>b.w-a.w)[0];const sh={strips:[{y:0,h:o.h,x:o.w+kerf}],rects:[{x:0,y:0,w:o.w,h:o.h}],y:o.h+kerf};sheets.push(sh)}});
  return {sheets,big,W0,H0,count:items.length,area:items.reduce((s,it)=>s+it.l*it.w,0)};
}
const EDGE_N=[0,1,2,3,4];
function edgeLen([l,w,q,e]){l=numv(l);w=numv(w);q=numv(q);const L=[0,l,2*l,2*l+w,2*l+2*w][e]||0;return q*(L+EDGE_N[e]*30)}
function sheetSvg(sh,i,P,SL,SW,trim){
  const k=320/SL,H=SW*k;let r=`<rect x="0" y="0" width="${SL*k}" height="${H}" fill="color-mix(in srgb,var(--accent) 10%,var(--surface))" stroke="var(--fg)" stroke-width="1"/>`;
  sh.rects.forEach(p=>{r+=`<rect x="${(p.x+trim)*k}" y="${(p.y+trim)*k}" width="${p.w*k}" height="${p.h*k}" fill="${WOOD}" stroke="var(--fg)" stroke-width=".8"/>`;
    if(p.w*k>34&&p.h*k>12)r+=`<text x="${(p.x+trim+p.w/2)*k}" y="${(p.y+trim+p.h/2)*k+3.5}" text-anchor="middle" font-size="9" fill="var(--fg)">${Math.round(p.w)}×${Math.round(p.h)}</text>`});
  return `<figure class="sheet"><figcaption>${U().sheet(i+1)}</figcaption><svg viewBox="-1 -1 ${SL*k+2} ${H+2}" role="img" aria-label="${U().sheet(i+1)}">${r}</svg></figure>`}

function partsRows(){const L=U();return S.parts.map((p,i)=>`<div class="prow" data-row="${i}">
  <input aria-label="${L.pL}" data-p="0" type="number" inputmode="numeric" min="0" value="${p[0]}">
  <input aria-label="${L.pW}" data-p="1" type="number" inputmode="numeric" min="0" value="${p[1]}">
  <input aria-label="${L.pQ}" data-p="2" type="number" inputmode="numeric" min="0" value="${p[2]}">
  <select aria-label="${L.pE}" data-p="3">${L.pEdges.map((t,j)=>`<option value="${j}"${p[3]==j?' selected':''}>${t}</option>`).join('')}</select>
  <button type="button" class="pdel" data-del="${i}" aria-label="${L.pDel}">×</button></div>`).join('')}

function calcBlock(){const L=U();const c=S.calc;
  return `<div class="card stack"><div><h3>${L.pT}</h3><p class="expl">${L.pSub}</p></div>
  <div class="phead"><span>${L.pL}</span><span>${L.pW}</span><span>${L.pQ}</span><span>${L.pE}</span><span></span></div>
  <div id="prows">${partsRows()}</div><button class="btn ghost" id="padd" type="button">${L.pAdd}</button>
  <div class="pair">${fld('sl',L.sL,c.sl)}${fld('sw',L.sW,c.sw)}</div>
  <div class="pair">${fld('sk',L.sK,c.sk,0.1)}${fld('st',L.sT,c.st)}</div>
  <div class="fld">${L.sRot}${seg('rot',L.sRots)}</div>
  <div class="out" id="out1"></div><div id="sheets" class="sheets"></div><p class="expl">${L.pNote}</p></div>
  <div class="card stack"><div><h3>${L.hT}</h3><p class="expl">${L.hSub}</p></div>
  <div class="pair">${fld('hh',L.hH,c.hh)}${fld('hn',L.hN,c.hn)}</div>
  <div class="fld">${L.hHeavy}${seg('hv',L.hHeavys)}</div>
  <div class="pair">${fld('cn',L.cN,c.cn)}${fld('cf',L.cF,c.cf)}</div>
  <div class="pair">${fld('cd',L.cD,c.cd)}${fld('cs',L.cS,c.cs)}</div>
  <div class="pair">${fld('dn',L.dN,c.dn)}${fld('da',L.dA,c.da)}</div>
  <div class="fld">${L.dT}${seg('dt',L.dTs)}</div>
  <div class="out" id="out2"></div><p class="expl">${L.hNote}</p></div>
  <div class="card stack"><div><h3>${L.kT}</h3><p class="expl">${L.kSub}</p></div>
  <div class="pair">${fld('ka',L.kA,c.ka)}${fld('ko',L.kO,c.ko)}</div>
  <div class="fld">${L.kN}${seg('kn',['2','3','4'])}</div>
  <div class="out two" id="out3"></div><p class="expl">${L.kNote}</p></div>
  <div class="card stack"><div><h3>${L.cT}</h3><p class="expl">${L.cSub}</p></div>
  <div class="pair">${fld('psh',L.cSheetP+', '+L.sum,c.psh,1000)}${fld('ped',L.cEdgeP+', '+L.sum,c.ped,100)}</div>
  <div class="pair">${fld('pfit',L.cFit+', '+L.sum,c.pfit,1000)}${fld('pfac',L.cFac+', '+L.sum,c.pfac,1000)}</div>
  <div class="pair">${fld('pwork',L.cWork+', '+L.sum,c.pwork,1000)}${fld('pprof',L.cProf,c.pprof)}</div>
  <div class="out money" id="out4"></div><p class="expl">${L.cNote}</p></div>`}

let last={sheets:0,edge:0};
function paintCalc(){const L=U();const c=S.calc;
  // 1. cutting + edging
  const SL=numv(c.sl),SW=numv(c.sw),kerf=numv(c.sk),trim=numv(c.st);
  const r=SL>0&&SW>0?pack(S.parts,SL,SW,kerf,trim,c.rot===1):{sheets:[],big:0,count:0,area:0,W0:1,H0:1};
  const ns=r.sheets.length,use=ns?r.area/(ns*r.W0*r.H0)*100:0;
  const edge=S.parts.reduce((s,p)=>s+edgeLen(p),0)/1000*1.1;last={sheets:ns,edge};
  $('#out1').innerHTML=cell(L.rSheets,ns||'—')+cell(L.rUse,ns?fmt(use)+' %':'—')+cell(L.rEdge,edge?fmt(edge,1):'—')+cell(L.rParts,r.count||'—')+cell(L.rArea,r.area?fmt(r.area/1e6,2)+' м²':'—')+(r.big?`<div class="wide bad"><span>${L.rBig}</span><b>${r.big}</b></div>`:'');
  $('#sheets').innerHTML=r.sheets.slice(0,6).map((sh,i)=>sheetSvg(sh,i,null,SL,SW,trim)).join('');
  // 2. fittings
  const hh=numv(c.hh),hn=numv(c.hn);const per=hh<=0?0:hh<=900?2:hh<=1600?3:hh<=2000?4:hh<=2400?5:6;const hinges=hn*(per+(c.hv&&per?1:0));
  const cd=numv(c.cd),pj=cd<=400?2:cd<=600?3:4;const conf=numv(c.cn)*numv(c.cf)*2*pj;const polk=numv(c.cs)*4;
  const dn=numv(c.dn),dw=numv(c.da)-(c.dt?25:26);const glen=Math.floor((cd-10)/50)*50;
  $('#out2').innerHTML=cell(L.rHinge,hinges||'—')+cell(L.rConf,conf||'—')+cell(L.rPolk,polk||'—')+cell(L.rDw,dn&&dw>0?dw+' '+L.mm:'—')+cell(L.rGuide,dn&&glen>=250?glen+' '+L.mm:'—')+cell(L.rPair,dn||'—');
  // 3. sliding doors
  const n=[2,3,4][c.kn],ka=numv(c.ka),ko=numv(c.ko);const dwd=ka>0?(ka+ko*(n-1))/n:0;
  $('#out3').innerHTML=cell(L.rDoor,dwd?fmt(dwd,1)+' '+L.mm:'—')+cell(L.rOver,n-1);
  // 4. price
  const cost=ns*numv(c.psh)+edge*numv(c.ped)+numv(c.pfit)+numv(c.pfac)+numv(c.pwork);
  const price=Math.ceil(cost*(1+numv(c.pprof)/100)/10000)*10000;
  $('#out4').innerHTML=cell(L.rCost,cost?money(cost):'—')+cell(L.rPrice,price?money(price):'—')+cell(L.rPre,price?money(price*0.6):'—');
}
function saveParts(){store.set('parts',S.parts)}
function bindParts(){
  document.querySelectorAll('.prow [data-p]').forEach(inp=>{const ev=inp.tagName==='SELECT'?'onchange':'oninput';inp[ev]=e=>{const i=+inp.closest('.prow').dataset.row,k=+inp.dataset.p;S.parts[i][k]=k===3?+e.target.value:e.target.value;saveParts();paintCalc()}});
  document.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>{S.parts.splice(+b.dataset.del,1);saveParts();$('#prows').innerHTML=partsRows();bindParts();paintCalc()});
}
function bindCalc(){
  const on=(id,k)=>{$(id).oninput=e=>{S.calc[k]=e.target.value;paintCalc()}};
  ['sl','sw','sk','st','hh','hn','cn','cf','cd','cs','dn','da','ka','ko','psh','ped','pfit','pfac','pwork','pprof'].forEach(k=>on('#'+k,k));
  document.querySelectorAll('[data-seg]').forEach(b=>b.onclick=()=>{const k=b.dataset.seg;S.calc[k]=+b.dataset.v;
    document.querySelectorAll(`[data-seg="${k}"]`).forEach(x=>x.setAttribute('aria-pressed',x===b));paintCalc()});
  $('#padd').onclick=()=>{S.parts.push([600,400,1,1]);saveParts();$('#prows').innerHTML=partsRows();bindParts();paintCalc();const rows=document.querySelectorAll('.prow');rows[rows.length-1].querySelector('input').focus()};
  bindParts();paintCalc()}

function bindCommon(){
  document.querySelectorAll('.lang button').forEach(b=>b.onclick=()=>{lang=b.dataset.l;store.set('lang',lang);document.documentElement.lang=lang;render()});
  document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{S.tab=+b.dataset.tab;render()});
}
function render(){({home,lesson,quiz,result})[S.screen]();bindCommon()}
function go(s){S.screen=s;render();window.scrollTo(0,0)}
document.documentElement.lang=lang;
go('home');

</script>

 steps:{ru:["Главный инструмент кондитера — <b>весы</b>. Стакан муки весит по-разному, а в выпечке ошибка 20 г уже видна.","Миксер (лучше планетарный или ручной от 500 Вт), венчик и силиконовая лопатка для вмешивания.","Разъёмная форма или кольцо 16–24 см, пергамент или силиконовый коврик.","Кондитерский мешок и насадки: 1M (открытая звезда), 2D (закрытая звезда), круглые 8–12 мм.","Прямой и угловой шпатель, скребок и поворотный столик — для ровного торта.","Термометр для духовки: многие духовки врут на 10–30 °C."],
       uz:["Qandolatchining asosiy asbobi — <b>tarozi</b>. Bir stakan un har xil og'irlikda bo'ladi, pishiriqda esa 20 g xato ham ko'rinadi.","Mikser (planetar yoki 500 Vt dan qo'l mikseri), ko'pirtirgich va aralashtirish uchun silikon kurakcha.","Ajraladigan qolip yoki 16–24 sm halqa, pergament yoki silikon gilamcha.","Qandolat qopi va nasadkalar: 1M (ochiq yulduz), 2D (yopiq yulduz), dumaloq 8–12 mm.","To'g'ri va burchakli shpatel, qirg'ich va aylanadigan stolcha — tekis tort uchun.","Duxovka termometri: ko'p duxovkalar 10–30 °C ga adashadi."]},
 tip:{ru:"Купите простые электронные весы до 5 кг (от 60–100 тыс. сум). Это первая покупка, которая сразу улучшит выпечку.",uz:"5 kg gacha oddiy elektron tarozi oling (60–100 ming so'mdan). Bu pishiriqni darrov yaxshilaydigan birinchi xarid."},

 table:{head:{ru:["Продукт","Что делает и как выбрать"],uz:["Mahsulot","Nima qiladi va qanday tanlash"]},rows:{
  ru:[["Мука высшего сорта","Каркас изделия. Для нежного бисквита часть муки (до 20 %) заменяют крахмалом"],["Сахар / пудра","Сладость, объём, румяная корочка. Пудра — для кремов и песочного теста"],["Яйца","Связывают, дают объём. Для взбивания — комнатной температуры"],["Сливочное масло 82,5 %","Вкус и рассыпчатость. Спред и маргарин крем не держат"],["Сливки 33–35 %","Для взбивания и ганаша. Ниже 30 % не взбиваются"],["Разрыхлитель / сода","Пузырьки газа. Соде нужна кислота: кефир, сметана, какао, лимон"],["Желатин","Стабилизирует муссы и кремы. Замачивают 1 : 6 водой, не кипятят"]],
  uz:[["Oliy navli un","Mahsulot karkasi. Nozik biskvit uchun unning bir qismi (20 % gacha) kraxmal bilan almashtiriladi"],["Shakar / upa","Shirinlik, hajm, qizarish. Upa — kremlar va qumoq xamir uchun"],["Tuxum","Bog'laydi, hajm beradi. Ko'pirtirish uchun — xona haroratida"],["Sariyog' 82,5 %","Ta'm va ushalovchanlik. Sprend va margarin kremni ushlamaydi"],["Qaymoq 33–35 %","Ko'pirtirish va ganash uchun. 30 % dan pasti ko'pirmaydi"],["Qabartirgich / soda","Gaz pufakchalari. Sodaga kislota kerak: kefir, smetana, kakao, limon"],["Jelatin","Mus va kremlarni barqaror qiladi. 1 : 6 suvda ivitiladi, qaynatilmaydi"]]}},
 steps:{ru:["Яйца и масло достают из холодильника заранее, за 1–2 часа (кроме песочного теста — там масло холодное).","Муку <b>просеивают</b>: она насыщается воздухом, уходят комочки.","Соль нужна и в сладком: щепотка делает вкус ярче.","Сливки для взбивания, наоборот, должны быть холодными — и миска тоже.","Разрыхлитель смешивают с мукой, а не с яйцами, иначе реакция пройдёт раньше времени.","Какао-порошок — без сахара (алкализованный темнее). Какао-напиток с сахаром для выпечки не подходит."],
       uz:["Tuxum va sariyog' muzlatgichdan oldindan, 1–2 soat oldin olinadi (qumoq xamirdan tashqari — unda sariyog' sovuq).","Un <b>elanadi</b>: havoga to'yinadi, kesakchalar yo'qoladi.","Shirinlikda ham tuz kerak: bir chimdim ta'mni yorqinroq qiladi.","Ko'pirtiriladigan qaymoq esa sovuq bo'lishi kerak — idish ham.","Qabartirgich tuxum bilan emas, un bilan aralashtiriladi, aks holda reaksiya erta o'tadi.","Kakao kukuni — shakarsiz (alkalizatsiyalangani to'qroq). Shakarli kakao-ichimlik pishiriqqa yaramaydi."]},
 tip:{ru:"Если крем не взбивается — проверьте жирность сливок на упаковке. Нужно 33 % и больше, и всё должно быть холодным.",uz:"Krem ko'pirmasa — qadoqdagi qaymoq yog'liligini tekshiring. 33 % va undan yuqori kerak, hammasi sovuq bo'lishi lozim."},
 quiz:[
  {a:1,ru:{q:"Какие сливки взбиваются в крем?",o:["10 %","33–35 %","20 %"],e:"Ниже 30 % сливки не взбиваются."},uz:{q:"Qanday qaymoq kremga ko'piradi?",o:["10 %","33–35 %","20 %"],e:"30 % dan past qaymoq ko'pirmaydi."}},
  {a:0,ru:{q:"Что нужно соде, чтобы она сработала?",o:["Кислота","Сахар","Мороз"],e:"Кефир, сметана, какао, лимонный сок."},uz:{q:"Soda ishlashi uchun nima kerak?",o:["Kislota","Shakar","Sovuq"],e:"Kefir, smetana, kakao, limon sharbati."}},
  {a:2,ru:{q:"Зачем просеивать муку?",o:["Чтобы была тяжелее","Это не нужно","Воздух и нет комочков"],e:"Просеянная мука легче вмешивается."},uz:{q:"Nega unni elash kerak?",o:["Og'irroq bo'lishi uchun","Shart emas","Havo va kesakchasiz"],e:"Elangan un osonroq aralashadi."}},
  {a:1,ru:{q:"Почему крем на спреде получается плохим?",o:["Спред слишком дорогой","Спред не держит форму крема","Спред слишком сладкий"],e:"Нужно настоящее масло 82,5 %."},uz:{q:"Nega sprendli krem yomon chiqadi?",o:["Sprend juda qimmat","Sprend krem shaklini ushlamaydi","Sprend juda shirin"],e:"Haqiqiy 82,5 % sariyog' kerak."}}]},

 steps:{ru:["Духовку включают заранее на 180 °C. Дно формы 20–22 см застилают пергаментом, бортики <b>не смазывают</b> — тесто цепляется и поднимается.","Яйца с сахаром взбивают 8–10 минут до светлой пышной массы, которая увеличилась в 3 раза и стекает «лентой».","Муку (можно 100 г муки + 20 г крахмала) просеивают и вмешивают лопаткой в 2–3 приёма движениями снизу вверх.","Сразу в форму и в духовку: 30–35 минут. Первые 20 минут дверцу не открывают — бисквит опадёт.","Готовность — деревянной шпажкой: сухая, без липкого теста.","Остужают на решётке, вынимают из формы, заворачивают в плёнку на 6–8 часов. Отдохнувший бисквит меньше крошится."],
       uz:["Duxovka oldindan 180 °C ga yoqiladi. 20–22 sm qolip tagiga pergament to'shaladi, chetlari <b>moylanmaydi</b> — xamir ilinib ko'tariladi.","Tuxum shakar bilan 8–10 daqiqa ko'pirtiriladi — 3 barobar oshgan, «lenta» bo'lib oqadigan och, ko'pchigan massa bo'lguncha.","Un (100 g un + 20 g kraxmal ham mumkin) elanadi va kurakcha bilan 2–3 bosqichda pastdan yuqoriga aralashtiriladi.","Darrov qolipga va duxovkaga: 30–35 daqiqa. Dastlabki 20 daqiqa eshik ochilmaydi — biskvit cho'kadi.","Tayyorligi — yog'och cho'p bilan: quruq, yopishqoq xamirsiz.","Panjarada sovitiladi, qolipdan olinadi, 6–8 soatga plyonkaga o'raladi. Dam olgan biskvit kamroq ushaladi."]},
 tip:{ru:"Бисквит опал — чаще всего открыли дверцу раньше времени, мало взбили яйца или долго мешали муку. Вышла горка — духовка слишком горячая.",uz:"Biskvit cho'kdi — ko'pincha eshik erta ochilgan, tuxum kam ko'pirtirilgan yoki un uzoq aralashtirilgan. Do'ng chiqdi — duxovka juda issiq."},

  {a:0,ru:{q:"Как вмешивать муку в бисквит?",o:["Лопаткой снизу вверх","Миксером на полной скорости 5 минут","Руками"],e:"Иначе пузырьки лопнут и бисквит будет резиновым."},uz:{q:"Biskvitga unni qanday aralashtirish kerak?",o:["Kurakcha bilan pastdan yuqoriga","Mikserda to'liq tezlikda 5 daqiqa","Qo'l bilan"],e:"Aks holda pufakchalar yoriladi va biskvit rezinadek bo'ladi."}},
  {a:2,ru:{q:"Почему бисквит опал?",o:["Много муки","Мало сахара","Открыли духовку в первые 20 минут"],e:"Холодный воздух — и бисквит садится."},uz:{q:"Nega biskvit cho'kdi?",o:["Un ko'p","Shakar kam","Dastlabki 20 daqiqada duxovka ochildi"],e:"Sovuq havo — va biskvit cho'kadi."}},

 steps:{ru:["Холодное масло кубиками перетирают с мукой и сахаром (пудрой) в крошку.","Добавляют яйцо и соль, быстро собирают в ком. Долго не месят — тесто «затянется» и станет жёстким.","Ком плющат в лепёшку, заворачивают в плёнку и убирают в холодильник на 30–60 минут.","Раскатывают между двумя листами пергамента в пласт 3–4 мм, укладывают в форму, накалывают вилкой.","<b>Слепая выпечка</b>: сверху пергамент и груз (фасоль), 180 °C 15 минут, потом без груза ещё 5–10 минут до золотистого цвета.","Остывшую корзинку заполняют кремом и ягодами. Влажную начинку — только перед подачей."],
       uz:["Sovuq sariyog' kubiklari un va shakar (upa) bilan ushoq bo'lguncha ishqalanadi.","Tuxum va tuz qo'shiladi, tez bir bo'lakka yig'iladi. Uzoq qorilmaydi — xamir «tortilib» qattiq bo'ladi.","Bo'lak yassilanadi, plyonkaga o'raladi va 30–60 daqiqaga muzlatgichga qo'yiladi.","Ikki varaq pergament orasida 3–4 mm qatlam qilib yoyiladi, qolipga yotqiziladi, vilka bilan teshiladi.","<b>Ko'r pishirish</b>: ustiga pergament va yuk (loviya), 180 °C 15 daqiqa, keyin yuksiz yana 5–10 daqiqa oltin rangga kirguncha.","Sovigan savatcha krem va rezavorlar bilan to'ldiriladi. Nam ichlik — faqat dasturxonga tortishdan oldin."]},
 tip:{ru:"Тесто липнет к рукам и рвётся — оно согрелось. Уберите на 15 минут в холодильник и продолжайте.",uz:"Xamir qo'lga yopishib, yirtilyapti — u isib ketgan. 15 daqiqaga muzlatgichga qo'ying va davom eting."},
 quiz:[
  {a:0,ru:{q:"Что значит «1-2-3» в песочном тесте?",o:["Сахар 1 : масло 2 : мука 3","Мука 1 : яйца 2 : сахар 3","Три часа в холодильнике"],e:"Например, 100 г сахара, 200 г масла, 300 г муки."},uz:{q:"Qumoq xamirda «1-2-3» nimani bildiradi?",o:["Shakar 1 : sariyog' 2 : un 3","Un 1 : tuxum 2 : shakar 3","Muzlatgichda uch soat"],e:"Masalan, 100 g shakar, 200 g sariyog', 300 g un."}},
  {a:2,ru:{q:"Каким должно быть масло для песочного теста?",o:["Растопленным","Тёплым, мягким","Холодным"],e:"Холодное масло даёт рассыпчатость."},uz:{q:"Qumoq xamir uchun sariyog' qanday bo'lishi kerak?",o:["Eritilgan","Iliq, yumshoq","Sovuq"],e:"Sovuq sariyog' ushalovchanlik beradi."}},
  {a:1,ru:{q:"Зачем груз при слепой выпечке?",o:["Для запаха","Чтобы корзинка не вздулась и бортики не сползли","Чтобы быстрее остыла"],e:"Груз держит форму корзинки."},uz:{q:"Ko'r pishirishda yuk nima uchun?",o:["Hid uchun","Savatcha ko'pchimasligi va chetlari sirpanmasligi uchun","Tezroq sovishi uchun"],e:"Yuk savatcha shaklini ushlab turadi."}},
  {a:0,ru:{q:"Песочное тесто стало жёстким. Почему?",o:["Долго месили","Мало вымешивали","Положили соль"],e:"Песочное тесто собирают быстро, не вымешивая."},uz:{q:"Qumoq xamir qattiq bo'lib qoldi. Nega?",o:["Uzoq qorildi","Kam qorildi","Tuz solindi"],e:"Qumoq xamir qorilmasdan, tez yig'iladi."}}]},

 t:{ru:"Кремы для тортов",uz:"Tort kremlari"},s:{ru:"Крем-чиз, масляный, заварной, сливки",uz:"Krem-chiz, sariyog'li, qaynatilgan, qaymoq"},
 table:{head:{ru:["Крем","Состав","Для чего"],uz:["Krem","Tarkibi","Nima uchun"]},rows:{
  ru:[["Крем-чиз","Сливочный сыр 300 г, сливки 33 % 100 г, пудра 60–80 г","Начинка и выравнивание, держит форму"],["Масляный","Масло 82,5 % 200 г, сгущёнка 150–200 г","Самый стойкий, под мастику, для цветов"],["Заварной","Молоко 500 г, желтки 4, сахар 120 г, крахмал 40 г, масло 30 г","Эклеры, наполеон, прослойка. Не для покрытия"],["Взбитые сливки","Сливки 33 % 500 г, пудра 50 г","Лёгкие торты, капкейки. Держатся недолго"]],
  uz:[["Krem-chiz","Qaymoqli pishloq 300 g, 33 % qaymoq 100 g, upa 60–80 g","Ichlik va tekislash, shaklni ushlaydi"],["Sariyog'li","82,5 % sariyog' 200 g, quyultirilgan sut 150–200 g","Eng chidamli, mastika ostiga, gullar uchun"],["Qaynatilgan","Sut 500 g, 4 sarig', shakar 120 g, kraxmal 40 g, sariyog' 30 g","Ekler, napoleon, qatlam. Qoplash uchun emas"],["Ko'pirtirilgan qaymoq","33 % qaymoq 500 g, upa 50 g","Yengil tortlar, kapkeyklar. Uzoq turmaydi"]]}},
 steps:{ru:["<b>Крем-чиз</b>: сыр и сливки — холодные, прямо из холодильника. Сначала сливки с пудрой до мягких пиков, потом сыр на малой скорости.","Перебили крем-чиз — он становится жидким или идёт крупкой. Взбивайте только до гладкости, 1–3 минуты.","<b>Масляный</b>: масло комнатной температуры взбивают до белизны 5–7 минут, сгущёнку вливают по ложке.","<b>Заварной</b>: желтки, сахар и крахмал растирают, вливают горячее молоко, варят до загустения и 1 минуту после закипания, помешивая.","Готовый заварной крем накрывают плёнкой «в контакт» и быстро остужают. Масло добавляют в горячий.","Цвет: гелевые красители по капле. Водные краски разжижают крем."],
       uz:["<b>Krem-chiz</b>: pishloq va qaymoq — sovuq, to'g'ri muzlatgichdan. Avval qaymoq upa bilan yumshoq cho'qqilarga, keyin pishloq past tezlikda.","Krem-chiz ortiqcha ko'pirtirilsa — suyuq bo'ladi yoki donador chiqadi. Faqat silliq bo'lguncha, 1–3 daqiqa ko'pirtiring.","<b>Sariyog'li</b>: xona haroratidagi sariyog' 5–7 daqiqa oqarguncha ko'pirtiriladi, quyultirilgan sut qoshiqlab quyiladi.","<b>Qaynatilgan</b>: sarig', shakar va kraxmal ezildi, issiq sut quyiladi, quyuqlashguncha va qaynagandan keyin 1 daqiqa aralashtirib pishiriladi.","Tayyor qaynatilgan krem plyonka bilan «kontaktda» yopiladi va tez sovitiladi. Sariyog' issiqligida qo'shiladi.","Rang: gelli bo'yoqlar tomchilab. Suvli bo'yoqlar kremni suyultiradi."]},
 tip:{ru:"Для торта под мастику или в жару выбирайте масляный крем или ганаш. Крем на сливках в тепле поплывёт.",uz:"Mastika ostidagi yoki issiqdagi tort uchun sariyog'li krem yoki ganash tanlang. Qaymoqli krem issiqda oqib ketadi."},
 quiz:[
  {a:1,ru:{q:"Какими должны быть сыр и сливки для крем-чиза?",o:["Тёплыми","Холодными","Замороженными"],e:"Холодные ингредиенты — стабильный крем."},uz:{q:"Krem-chiz uchun pishloq va qaymoq qanday bo'lishi kerak?",o:["Iliq","Sovuq","Muzlatilgan"],e:"Sovuq ingredientlar — barqaror krem."}},
  {a:0,ru:{q:"Какой крем самый стойкий, под мастику?",o:["Масляный","Взбитые сливки","Заварной"],e:"Масляный крем держит форму и в тепле."},uz:{q:"Qaysi krem eng chidamli, mastika ostiga?",o:["Sariyog'li","Ko'pirtirilgan qaymoq","Qaynatilgan"],e:"Sariyog'li krem issiqda ham shaklini ushlaydi."}},
  {a:2,ru:{q:"Крем-чиз стал жидким. Вероятная причина?",o:["Мало взбивали","Положили пудру","Перебили"],e:"Взбивают только до гладкости."},uz:{q:"Krem-chiz suyulib qoldi. Ehtimoliy sabab?",o:["Kam ko'pirtirilgan","Upa solingan","Ortiqcha ko'pirtirilgan"],e:"Faqat silliq bo'lguncha ko'pirtiriladi."}},
  {a:1,ru:{q:"Каким красителем красить крем?",o:["Водным","Гелевым","Акварелью"],e:"Гелевые дают яркий цвет и не разжижают."},uz:{q:"Kremni qanday bo'yoq bilan bo'yash kerak?",o:["Suvli","Gelli","Akvarel"],e:"Gelli bo'yoq yorqin rang beradi va suyultirmaydi."}}]},

 steps:{ru:["Отдохнувший бисквит режут на 3 коржа ниткой или ножом-струной, срезают верхнюю корочку.","Коржи пропитывают сиропом (сахар и вода 1 : 1, можно с соком): 20–30 мл на корж 20 см, без луж.","Сборку делают в кольце с ацетатной лентой: корж, по краю — бортик из крема, внутри — крем и начинка.","Влажную начинку (конфи, ягоды) кладут не до края — иначе она выступит сквозь крем.","Торт в кольце охлаждают 4–6 часов, лучше ночь. Так он становится плотным и не «едет».","Выравнивание: тонкий слой крема (закрывает крошки), 20–30 минут в холодильник, затем второй слой скребком на поворотном столике."],
       uz:["Dam olgan biskvit ip yoki pichoq-tor bilan 3 ta korjga kesiladi, ustki qobig'i olinadi.","Korjlar sirop bilan shimdiriladi (shakar va suv 1 : 1, sharbat bilan ham mumkin): 20 sm korjga 20–30 ml, ko'lmaksiz.","Asetat lentali halqada yig'iladi: korj, chetiga — krem cheti, ichiga — krem va ichlik.","Nam ichlik (konfi, rezavor) chetigacha qo'yilmaydi — aks holda krem orqali chiqadi.","Halqadagi tort 4–6 soat, yaxshisi bir kecha sovitiladi. Shunda zich bo'ladi va «siljimaydi».","Tekislash: yupqa krem qatlami (ushoqlarni yopadi), 20–30 daqiqa muzlatgichga, keyin aylanadigan stolchada qirg'ich bilan ikkinchi qatlam."]},
 tip:{ru:"Ровный торт делает холод. Не спешите: каждый раз, когда крем начинает мазаться, торт на 15–20 минут в холодильник.",uz:"Tekis tortni sovuq yaratadi. Shoshilmang: har safar krem surkala boshlasa, tortni 15–20 daqiqaga muzlatgichga qo'ying."},
 quiz:[
  {a:1,ru:{q:"Зачем нужен бортик из крема по краю коржа?",o:["Для красоты внутри","Чтобы начинка не вытекла","Чтобы сэкономить крем"],e:"Бортик держит влажную начинку внутри."},uz:{q:"Korj chetidagi krem cheti nima uchun?",o:["Ichki chiroy uchun","Ichlik oqib chiqmasligi uchun","Kremni tejash uchun"],e:"Chet nam ichlikni ichida ushlab turadi."}},
  {a:0,ru:{q:"Что такое первый тонкий слой крема?",o:["Он закрывает крошки перед финишным слоем","Это лишнее","Слой для надписи"],e:"После него торт охлаждают."},uz:{q:"Birinchi yupqa krem qatlami nima?",o:["Yakuniy qatlamdan oldin ushoqlarni yopadi","Bu ortiqcha","Yozuv uchun qatlam"],e:"Undan keyin tort sovitiladi."}},
  {a:2,ru:{q:"Сколько пропитки на корж 20 см?",o:["300 мл","Совсем не нужно","20–30 мл"],e:"Много пропитки — торт поплывёт."},uz:{q:"20 sm korjga qancha shimdirish kerak?",o:["300 ml","Umuman kerak emas","20–30 ml"],e:"Shimdirish ko'p bo'lsa — tort oqib ketadi."}},
  {a:1,ru:{q:"Сколько охлаждать собранный торт в кольце?",o:["5 минут","4–6 часов или ночь","Не нужно"],e:"Плотный холодный торт легко выровнять."},uz:{q:"Halqadagi yig'ilgan tortni qancha sovitish kerak?",o:["5 daqiqa","4–6 soat yoki bir kecha","Kerak emas"],e:"Zich sovuq tortni tekislash oson."}}]},

  ru:[["Тёмный, выравнивание торта","2 : 1"],["Тёмный, начинка и капли","1 : 1"],["Молочный, выравнивание","3 : 1"],["Белый, выравнивание","3 : 1 (капли — 2,5 : 1)"]],

 steps:{ru:["Для конфет, плиток и декора шоколад <b>темперируют</b>, иначе он застынет серым и мягким.","Проверка: капля на ноже за 3–5 минут застывает с блеском — шоколад готов.","Ганаш: сливки нагревают до первых пузырьков (не кипятят), заливают рубленый шоколад, ждут 1 минуту и перемешивают от центра.","Ганаш для выравнивания ставят на ночь при комнатной температуре — к утру он как паста.","Капли (дрип): ганаш 1 : 1 при 30–32 °C на хорошо охлаждённый торт. Пробуйте сначала одну каплю.","Попала вода и шоколад «заварился» комками — для темперирования он уже не годится, но пойдёт в выпечку."],
       uz:["Konfet, plitka va bezak uchun shokolad <b>temperlanadi</b>, aks holda kulrang va yumshoq qotadi.","Tekshirish: pichoqdagi tomchi 3–5 daqiqada yaltirab qotadi — shokolad tayyor.","Ganash: qaymoq birinchi pufakchalargacha isitiladi (qaynatilmaydi), maydalangan shokoladga quyiladi, 1 daqiqa kutiladi va markazdan aralashtiriladi.","Tekislash uchun ganash bir kechaga xona haroratida qoldiriladi — ertalabga pastaga o'xshaydi.","Tomchilar (drip): 30–32 °C dagi 1 : 1 ganash yaxshi sovitilgan tortga. Avval bitta tomchini sinab ko'ring.","Suv tushib, shokolad kesak bo'lib «qaynab qoldi» — temperlashga yaramaydi, lekin pishiriqqa ketadi."]},
 tip:{ru:"Белый шоколад капризнее всех: перегреете выше 45 °C — он свернётся. Грейте короткими подходами.",uz:"Oq shokolad eng injiq: 45 °C dan oshirsangiz — ivib qoladi. Qisqa-qisqa isiting."},
 quiz:[
  {a:1,ru:{q:"Как темперируют тёмный шоколад?",o:["Кипятят 5 минут","45–50 → 27–28 → 31–32 °C","Сразу в холодильник"],e:"Растопить, остудить, чуть подогреть."},uz:{q:"Qora shokolad qanday temperlanadi?",o:["5 daqiqa qaynatiladi","45–50 → 27–28 → 31–32 °C","Darrov muzlatgichga"],e:"Eritish, sovitish, biroz isitish."}},
  {a:0,ru:{q:"Пропорция тёмного ганаша для выравнивания?",o:["2 : 1","1 : 3","1 : 1"],e:"2 части шоколада на 1 часть сливок."},uz:{q:"Tekislash uchun qora ganash nisbati?",o:["2 : 1","1 : 3","1 : 1"],e:"2 qism shokoladga 1 qism qaymoq."}},
  {a:2,ru:{q:"Для капель (дрип) ганаш должен быть…",o:["Горячим 70 °C","Холодным из холодильника","30–32 °C на холодный торт"],e:"Горячий растопит крем, холодный не стечёт."},uz:{q:"Tomchilar (drip) uchun ganash qanday bo'lishi kerak?",o:["70 °C issiq","Muzlatgichdan sovuq","Sovuq tortga 30–32 °C"],e:"Issiq kremni eritadi, sovuq oqmaydi."}},
  {a:1,ru:{q:"Что испортит шоколад при растапливании?",o:["Сахар","Капля воды","Сливки после растапливания"],e:"Вода — и шоколад сворачивается комками."},uz:{q:"Eritishda shokoladni nima buzadi?",o:["Shakar","Bir tomchi suv","Eritgandan keyin qaymoq"],e:"Suv — va shokolad kesak bo'lib qoladi."}}]},

 steps:{ru:["Вода 125 г, молоко 125 г, масло 100 г, щепотка соли и 5 г сахара доводят до кипения.","Всю муку (150 г) всыпают сразу и энергично мешают. Проваривают 1–2 минуты, пока на дне не появится плёнка.","Тесто остужают до 60 °C, потом по одному вбивают яйца — всего 4–5 шт. (около 250 г).","Готовность: тесто блестит и стекает с лопатки «ласточкиным хвостом» — треугольником.","Отсаживают насадкой 12–16 мм полоски 12–14 см, с расстоянием — эклеры растут в 2 раза.","200 °C 10–15 минут, потом 170 °C 20–25 минут. Дверцу не открывать. Остывшие эклеры заполняют заварным кремом и покрывают глазурью."],
       uz:["Suv 125 g, sut 125 g, sariyog' 100 g, bir chimdim tuz va 5 g shakar qaynaguncha isitiladi.","Hamma un (150 g) birdan solinadi va tez aralashtiriladi. Tagida plyonka paydo bo'lguncha 1–2 daqiqa qaynatiladi.","Xamir 60 °C gacha sovitiladi, keyin tuxumlar bittadan qo'shiladi — jami 4–5 ta (taxminan 250 g).","Tayyorligi: xamir yaltiraydi va kurakchadan «qaldirg'och dumi» — uchburchak bo'lib oqadi.","12–16 mm nasadka bilan 12–14 sm tasmalar oraliq bilan siqiladi — eklerlar 2 barobar o'sadi.","200 °C da 10–15 daqiqa, keyin 170 °C da 20–25 daqiqa. Eshik ochilmaydi. Sovigan eklerlar qaynatilgan krem bilan to'ldirilib, glazur bilan qoplanadi."]},
 tip:{ru:"Яйца бывают разные — последнее добавляйте по частям и смотрите на «хвост». Жидкое тесто растечётся и не поднимется.",uz:"Tuxumlar har xil bo'ladi — oxirgisini qismlab qo'shing va «dum»ga qarang. Suyuq xamir yoyilib ketadi va ko'tarilmaydi."},
 quiz:[
  {a:0,ru:{q:"Зачем проваривать муку 1–2 минуты?",o:["Чтобы тесто заварилось и ушла лишняя влага","Для цвета","Это не нужно"],e:"На дне появляется плёнка — тесто готово к яйцам."},uz:{q:"Unni 1–2 daqiqa qaynatish nima uchun?",o:["Xamir qaynab, ortiqcha namlik ketishi uchun","Rang uchun","Shart emas"],e:"Tagida plyonka paydo bo'ladi — xamir tuxumga tayyor."}},
  {a:2,ru:{q:"Когда добавлять яйца в заварное тесто?",o:["Сразу в кипящее","До муки","Когда остынет до 60 °C"],e:"В горячем тесте яйца свернутся."},uz:{q:"Qaynatma xamirga tuxum qachon qo'shiladi?",o:["Darrov qaynayotganiga","Undan oldin","60 °C gacha soviganda"],e:"Issiq xamirda tuxum pishib qoladi."}},
  {a:1,ru:{q:"Почему эклеры осели?",o:["Много крема","Открыли духовку во время выпечки","Мало сахара"],e:"Пар держит эклер, пока корочка не застынет."},uz:{q:"Nega eklerlar cho'kdi?",o:["Krem ko'p","Pishirish paytida duxovka ochildi","Shakar kam"],e:"Qobiq qotguncha eklerni bug' ushlab turadi."}},
  {a:1,ru:{q:"Как понять, что тесто нужной густоты?",o:["Оно стоит как камень","Стекает с лопатки «ласточкиным хвостом»","Оно жидкое как вода"],e:"Блестящий треугольник на лопатке."},uz:{q:"Xamir kerakli quyuqlikda ekanini qanday bilish mumkin?",o:["Toshdek turadi","Kurakchadan «qaldirg'och dumi» bo'lib oqadi","Suvdek suyuq"],e:"Kurakchada yaltiroq uchburchak."}}]},

 t:{ru:"Пересчёт рецепта под форму и гостей",uz:"Retseptni qolip va mehmonlarga qayta hisoblash"},s:{ru:"Площадь формы, вес торта на гостя",uz:"Qolip yuzasi, mehmonga tort og'irligi"},
 svg:l=>svg(
  circ(90,110,54,'#fbe3ea')+tx(90,106,'18 см',{s:14,w:700})+tx(90,124,R(l,'254 см²','254 sm²'),{s:11,c:'var(--muted)'})+
  circ(250,110,72,'#f7c9d7')+tx(250,106,'24 см',{s:14,w:700})+tx(250,124,R(l,'452 см²','452 sm²'),{s:11,c:'var(--muted)'})+
  tx(180,212,R(l,'452 ÷ 254 = 1,78 → всё умножаем на 1,78','452 ÷ 254 = 1,78 → hammasini 1,78 ga ko\'paytiramiz'),{s:12,w:600})+
  tx(180,232,R(l,'4 яйца × 1,78 ≈ 7 яиц (или 380 г яичной массы)','4 tuxum × 1,78 ≈ 7 tuxum (yoki 380 g tuxum massasi)'),{s:10,c:'var(--muted)'}),
  R(l,"Форма 18 сантиметров площадью 254 и форма 24 сантиметра площадью 452, коэффициент 1,78","18 santimetrli 254 yuzali va 24 santimetrli 452 yuzali qolip, koeffitsiyent 1,78"),245),
 table:{head:{ru:["Форма, высота 10–12 см","Вес торта","Гостей"],uz:["Qolip, balandligi 10–12 sm","Tort og'irligi","Mehmonlar"]},rows:{
  ru:[["16 см","1,2–1,5 кг","8–10"],["18 см","1,8–2 кг","12–14"],["20 см","2,2–2,5 кг","15–17"],["22 см","2,8–3 кг","19–20"],["24 см","3,5 кг","23–25"]],
  uz:[["16 sm","1,2–1,5 kg","8–10"],["18 sm","1,8–2 kg","12–14"],["20 sm","2,2–2,5 kg","15–17"],["22 sm","2,8–3 kg","19–20"],["24 sm","3,5 kg","23–25"]]}},
 steps:{ru:["Рецепт пересчитывают по <b>площади</b>, а не по диаметру. Форма 24 см больше формы 18 см не в 1,3, а в 1,78 раза.","Коэффициент = (новый диаметр ÷ старый)². Для прямоугольной формы — длина × ширина.","Все продукты умножают на коэффициент. Яйца удобнее считать в граммах: одно яйцо ≈ 50 г.","Если торт будет выше, умножьте ещё на отношение высот.","Время выпечки в большой форме растёт, температуру лучше снизить на 10 °C. Проверяйте шпажкой.","На гостя кладут 120–150 г торта, на детский праздник — около 100 г. Калькулятор подскажет вес и форму."],
       uz:["Retsept diametr bo'yicha emas, <b>yuza</b> bo'yicha qayta hisoblanadi. 24 sm qolip 18 sm qolipdan 1,3 emas, 1,78 barobar katta.","Koeffitsiyent = (yangi diametr ÷ eski)². To'rtburchak qolip uchun — uzunlik × kenglik.","Barcha mahsulotlar koeffitsiyentga ko'paytiriladi. Tuxumni grammda hisoblash qulay: bitta tuxum ≈ 50 g.","Tort balandroq bo'lsa, balandliklar nisbatiga ham ko'paytiring.","Katta qolipda pishirish vaqti oshadi, haroratni 10 °C pasaytirish yaxshi. Cho'p bilan tekshiring.","Har mehmonga 120–150 g tort, bolalar bayramiga — taxminan 100 g. Kalkulyator og'irlik va qolipni aytib beradi."]},
 tip:{ru:"Торт больше 3,5 кг лучше делать в два яруса: одноярусный высокий торт тяжело резать и перевозить.",uz:"3,5 kg dan katta tortni ikki qavat qilish yaxshi: baland bir qavatli tortni kesish va tashish qiyin."},
 quiz:[
  {a:1,ru:{q:"Рецепт на форму 18 см, нужна 24 см. Во сколько раз больше продуктов?",o:["1,3","1,78","2,5"],e:"(24 ÷ 18)² = 1,78."},uz:{q:"Retsept 18 sm qolipga, 24 sm kerak. Mahsulot necha barobar ko'p?",o:["1,3","1,78","2,5"],e:"(24 ÷ 18)² = 1,78."}},
  {a:0,ru:{q:"По чему правильно пересчитывать рецепт?",o:["По площади формы","По диаметру","По цвету формы"],e:"Объём теста зависит от площади дна."},uz:{q:"Retseptni nima bo'yicha qayta hisoblash to'g'ri?",o:["Qolip yuzasi bo'yicha","Diametr bo'yicha","Qolip rangi bo'yicha"],e:"Xamir hajmi tag yuzasiga bog'liq."}},
  {a:2,ru:{q:"Сколько торта класть на одного взрослого гостя?",o:["30 г","500 г","120–150 г"],e:"20 гостей × 150 г = 3 кг."},uz:{q:"Bitta katta yoshli mehmonga qancha tort hisoblanadi?",o:["30 g","500 g","120–150 g"],e:"20 mehmon × 150 g = 3 kg."}},
  {a:1,ru:{q:"Форма 20 см, нужна 16 см. Коэффициент?",o:["0,8","0,64","1,25"],e:"(16 ÷ 20)² = 0,64."},uz:{q:"Qolip 20 sm, 16 sm kerak. Koeffitsiyent?",o:["0,8","0,64","1,25"],e:"(16 ÷ 20)² = 0,64."}}]},

{id:'a2',lv:2,min:8,nowarn:true,calc:true,
 t:{ru:"Себестоимость и цена торта",uz:"Tort tannarxi va narxi"},s:{ru:"Продукты, упаковка, работа, цена за кг",uz:"Mahsulot, qadoq, mehnat, kilogramm narxi"},
 table:{head:{ru:["Статья","Пример, торт 2 кг"],uz:["Modda","Misol, 2 kg tort"]},rows:{
  ru:[["Продукты по рецепту","180 000 сум"],["Коробка, подложка, топпер","25 000 сум"],["Газ, свет, вода, пергамент (+10 %)","20 500 сум"],["Работа: 5 часов × 30 000","150 000 сум"],["Итого — цена","≈ 376 000 → 380 000 сум"],["Цена за кг","190 000 сум"]],
  uz:[["Retsept bo'yicha mahsulot","180 000 so'm"],["Quti, taglik, topper","25 000 so'm"],["Gaz, svet, suv, pergament (+10 %)","20 500 so'm"],["Mehnat: 5 soat × 30 000","150 000 so'm"],["Jami — narx","≈ 376 000 → 380 000 so'm"],["Kilogramm narxi","190 000 so'm"]]}},
 steps:{ru:["Распишите рецепт по граммам и посчитайте каждый продукт: цена за кг × граммы ÷ 1000.","Добавьте упаковку: коробка, подложка, лента, топпер, свечи, если они входят в цену.","Прибавьте около 10 % на газ, свет, воду, пергамент и мелочи.","Посчитайте <b>свою работу</b>: все часы — покупки, выпечка, сборка, декор, мытьё. Ставку за час выберите честно.","Цена = продукты + упаковка + 10 % + работа. Разделите на вес — получите цену за кг для прайса.","Сложный декор, фигурки и срочные заказы — дороже. Берите предоплату 30–50 % при заказе."],
       uz:["Retseptni grammlab yozing va har bir mahsulotni hisoblang: kilogramm narxi × gramm ÷ 1000.","Qadoqni qo'shing: quti, taglik, lenta, topper, sham — agar narxga kirsa.","Gaz, svet, suv, pergament va mayda-chuydaga taxminan 10 % qo'shing.","<b>O'z mehnatingizni</b> hisoblang: barcha soatlar — xarid, pishirish, yig'ish, bezak, yuvish. Soatbay stavkani halol tanlang.","Narx = mahsulot + qadoq + 10 % + mehnat. Og'irlikka bo'ling — prays uchun kilogramm narxi chiqadi.","Murakkab bezak, figuralar va shoshilinch buyurtmalar — qimmatroq. Buyurtmada 30–50 % oldindan to'lov oling."]},
 tip:{ru:"Не продавайте по цене продуктов: торт без оплаты вашего времени — это работа в убыток. Калькулятор посчитает цену за кг.",uz:"Mahsulot narxida sotmang: vaqtingiz to'lanmagan tort — zarariga ishlash. Kalkulyator kilogramm narxini hisoblaydi."},
 quiz:[
  {a:2,ru:{q:"Что чаще всего забывают включить в цену торта?",o:["Муку","Сахар","Свою работу и упаковку"],e:"Время кондитера — тоже часть цены."},uz:{q:"Tort narxiga ko'pincha nimani qo'shish unutiladi?",o:["Un","Shakar","O'z mehnati va qadoq"],e:"Qandolatchining vaqti — ham narxning bir qismi."}},
  {a:0,ru:{q:"Масло 120 000 сум/кг, нужно 250 г. Сколько стоит?",o:["30 000 сум","12 000 сум","250 000 сум"],e:"120 000 × 250 ÷ 1000 = 30 000."},uz:{q:"Sariyog' 120 000 so'm/kg, 250 g kerak. Qancha turadi?",o:["30 000 so'm","12 000 so'm","250 000 so'm"],e:"120 000 × 250 ÷ 1000 = 30 000."}},
  {a:1,ru:{q:"Торт 2 кг стоит 380 000 сум. Цена за кг?",o:["760 000 сум","190 000 сум","38 000 сум"],e:"380 000 ÷ 2 = 190 000."},uz:{q:"2 kg tort 380 000 so'm. Kilogramm narxi?",o:["760 000 so'm","190 000 so'm","38 000 so'm"],e:"380 000 ÷ 2 = 190 000."}},
  {a:1,ru:{q:"Какую предоплату обычно берут за торт на заказ?",o:["Не берут","30–50 %","200 %"],e:"Предоплата защищает от отмены заказа в последний день."},uz:{q:"Buyurtma tort uchun odatda qancha oldindan to'lov olinadi?",o:["Olinmaydi","30–50 %","200 %"],e:"Oldindan to'lov oxirgi kuni bekor qilishdan himoya qiladi."}}]},

 svg:l=>svg(
  `<g transform="translate(60 70)">${[0,1,2,3,4].map(i=>`<circle r="${30-i*6}" fill="none" stroke="${PINK}" stroke-width="7" opacity="${.5+i*.1}"/>`).join('')}</g>`+tx(60,130,R(l,'1M — розочка','1M — gulcha'),{w:600})+tx(60,146,R(l,'от центра по спирали','markazdan spiral'),{s:9,c:'var(--muted)'})+

 steps:{ru:["Розочка насадкой 1M: держите мешок вертикально, начните из центра и ведите спираль наружу, в конце ослабьте нажим.","Цвет — гелевыми красителями. Яркий цвет со временем темнеет: красный и чёрный окрашивайте за 1–2 часа до работы.","Мастика ложится только на плотное покрытие — масляный крем или ганаш. На сливках и крем-чизе она «поплывёт».","Торт в мастике в холодильнике может «заплакать» каплями влаги. Достаньте и дайте обсохнуть, не вытирайте.","Ягоды моют и полностью обсушивают на полотенце. Мокрые ягоды пускают сок в крем.","Живые цветы — только без химии, стебли оборачивают плёнкой или вставляют в трубочки. Ядовитые цветы (например, ландыш, гортензия) — нельзя."],
       uz:["1M nasadka bilan gulcha: qopni tik ushlang, markazdan boshlab tashqariga spiral qiling, oxirida bosishni bo'shating.","Rang — gelli bo'yoqlar bilan. Yorqin rang vaqt o'tib to'qlashadi: qizil va qorani ishdan 1–2 soat oldin bo'yang.","Mastika faqat zich qoplamaga yotadi — sariyog'li krem yoki ganash. Qaymoq va krem-chizda u «oqib» ketadi.","Mastikali tort muzlatgichda namlik tomchilari bilan «yig'lashi» mumkin. Oling va qurishini kuting, artmang.","Rezavorlar yuviladi va sochiqda to'liq quritiladi. Nam rezavorlar kremga sharbat chiqaradi.","Tirik gullar — faqat kimyosiz, poyalari plyonkaga o'raladi yoki naychalarga solinadi. Zaharli gullar (masalan, marvaridgul, gortenziya) — mumkin emas."]},
 tip:{ru:"Сначала потренируйтесь на тарелке: 10 розочек на тарелке — и на торте рука уже уверенная. Крем потом можно собрать обратно.",uz:"Avval likopchada mashq qiling: likopchada 10 ta gulcha — tortda qo'l allaqachon ishonchli. Kremni keyin qayta yig'ish mumkin."},
 quiz:[
  {a:1,ru:{q:"На какой крем можно класть мастику?",o:["Взбитые сливки","Масляный крем или ганаш","Заварной крем"],e:"Мастике нужно плотное покрытие."},uz:{q:"Mastikani qaysi kremga qo'yish mumkin?",o:["Ko'pirtirilgan qaymoq","Sariyog'li krem yoki ganash","Qaynatilgan krem"],e:"Mastikaga zich qoplama kerak."}},
  {a:0,ru:{q:"Как делают розочку насадкой 1M?",o:["Из центра по спирали наружу","Точками по кругу","Прямой линией"],e:"В конце ослабляют нажим."},uz:{q:"1M nasadka bilan gulcha qanday qilinadi?",o:["Markazdan tashqariga spiral","Aylana bo'ylab nuqtalar","To'g'ri chiziq"],e:"Oxirida bosish bo'shatiladi."}},
  {a:2,ru:{q:"Что сделать с ягодами перед декором?",o:["Положить мокрыми","Обвалять в муке","Помыть и полностью обсушить"],e:"Мокрые ягоды пускают сок в крем."},uz:{q:"Bezakdan oldin rezavorlar bilan nima qilinadi?",o:["Nam holda qo'yish","Unga belash","Yuvib, to'liq quritish"],e:"Nam rezavorlar kremga sharbat chiqaradi."}},
  {a:1,ru:{q:"Почему красный крем красят заранее?",o:["Так дешевле","Цвет со временем темнеет","Иначе он кислый"],e:"За 1–2 часа цвет «дойдёт»."},uz:{q:"Nega qizil krem oldindan bo'yaladi?",o:["Arzonroq","Rang vaqt o'tib to'qlashadi","Aks holda nordon bo'ladi"],e:"1–2 soatda rang «yetiladi»."}}]},

{id:'a4',lv:2,min:7,nowarn:true,

const pk=k=>(k==='lang'?'ep_':'kd_')+k;

const byLv=lv=>LESSONS.filter(x=>x.lv===lv);
const isPaid=x=>PAYWALL&&x.lv>0;
function isOpen(x){if(isPaid(x))return false;const list=byLv(x.lv);const i=list.indexOf(x);return i===0||done.has(list[i-1].id)}
const need=n=>Math.ceil(n*0.75);

const bolt='<svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20h16M5 20v-6h14v6M5 16.5q2.3 1.5 4.7 0t4.6 0 4.7 0M7 14v-3h10v3M12 11V8" fill="none" stroke="var(--accent-ink)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M12 3.5q1.6 1.8 0 3.2-1.6-1.4 0-3.2z" fill="var(--accent-ink)"/></svg>';

const langSw=()=>`<div class="lang" role="group" aria-label="Til / Язык"><button type="button" data-l="ru" aria-pressed="${lang==='ru'}">RU</button><button type="button" data-l="uz" aria-pressed="${lang==='uz'}">UZ</button></div>`;
const swatch={};

function header(inner){return `<header class="bar">${inner}</header>`}
function tabs(){const L=U();return `<nav class="tabs" role="tablist">${L.tabs.map((t,i)=>`<button type="button" role="tab" aria-selected="${S.tab===i}" data-tab="${i}">${t}</button>`).join('')}</nav>`}

function home(){
  const L=U();const total=LESSONS.length;const d=LESSONS.filter(x=>done.has(x.id)).length;
  let h=header(`${window.KASB_HUB?`<a class="hub" href="${window.KASB_HUB}">‹ Kasb Pro</a>`:''}<div class="row"><div class="brand"><div class="logo">${bolt}</div><div><h1>${L.brand}</h1><p>${L.tag}</p></div></div>${langSw()}</div>`)+tabs();
  if(S.tab===1){app.innerHTML=h+`<main class="wrap">${calcBlock()}</main>`;bindCalc();return}
  h+=`<main class="wrap"><div class="progress"><div class="t"><span>${L.prog}</span><b>${L.of(d,total)}</b></div><div class="meter"><i style="width:${d/total*100}%"></i></div></div><a class="game" href="igra/"><span class="gi">🎂</span><span class="tx"><b>${lang==='uz'?'O\'yin «Tortni yig\'»':'Игра «Собери торт»'}</b><span class="s">${lang==='uz'?'2 daqiqa: buyurtma tortlarni xatosiz yig\'ing':'2 минуты: собери торты на заказ без ошибок'}</span></span><span class="go">›</span></a>`;
  [0,1,2].forEach(lv=>{
    const chip=lv===0||!PAYWALL?'':`<span class="chip pro">${L.pro}</span>`;
    h+=`<section class="level"><h2>${L.lv[lv]} ${lv===0&&PAYWALL?`<span class="chip free">${L.free}</span>`:chip}</h2><div class="list">`;
    byLv(lv).forEach((x,i)=>{
      const open=isOpen(x),isDone=done.has(x.id);
      const cls=isDone?'done open':open?'open':'locked';
      const right=isDone?`<span class="go" aria-label="${L.done}">✓</span>`:open?'<span class="go">›</span>':lockI();
      const sub=!open&&!isDone?(isPaid(x)?L.paid:tr(x.s)):tr(x.s);
      h+=open||isDone?`<button class="item ${cls}" type="button" data-id="${x.id}">`:`<div class="item ${cls}">`;
      h+=`<span class="n">${i+1}</span><span class="tx"><b>${tr(x.t)}</b><span>${sub}</span></span>${right}${open||isDone?'</button>':'</div>'}`;
    });
    h+='</div></section>';
  });
  h+=`<button class="link" id="reset" type="button">${L.reset}</button></main>`;
  app.innerHTML=h;
  document.querySelectorAll('[data-id]').forEach(b=>b.onclick=()=>{S.id=b.dataset.id;go('lesson')});
  const r=$('#reset');r.onclick=()=>{if(r.dataset.c){done=new Set();store.set('done',[]);render()}else{r.dataset.c=1;r.textContent=lang==='ru'?'Нажмите ещё раз, чтобы сбросить':'Tozalash uchun yana bosing'}};
}

function lesson(){
  const L=U();const x=LESSONS.find(y=>y.id===S.id);const list=byLv(x.lv);const n=list.indexOf(x)+1;
  let h=header(`<div class="row"><button class="back" id="back" type="button">${L.all}</button>${langSw()}</div><h1 class="ttl">${tr(x.t)}</h1><p>${L.lvl(L.lv[x.lv],n,x.min)}</p>`)+'<main class="wrap">';
  if(x.svg){h+=`<div class="card diagram"><div class="sv">${x.svg(lang)}</div>`;
    if(x.legend)h+=`<div class="legend">${x.legend.map(k=>`<span><i class="sw" style="background:${swatch[k]}"></i>${L.leg[k]}</span>`).join('')}</div>`;h+='</div>'}
  if(!x.nowarn)h+=`<div class="warn"><span aria-hidden="true">⚠</span><div><b>${x.warnB?tr(x.warnB):L.warnB}</b> ${x.warn?tr(x.warn):L.warn}</div></div>`;
  if(x.table){h+=`<div class="card tbl"><table><thead><tr>${tr(x.table.head).map(c=>`<th>${c}</th>`).join('')}</tr></thead><tbody>${tr(x.table.rows).map(r=>`<tr>${r.map(c=>`<td>${c}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`}
  h+=`<div class="card stack"><h3>${L.stepsT}</h3><ol class="steps">${tr(x.steps).map(s=>`<li><span>${s}</span></li>`).join('')}</ol><p class="tip"><b>${L.tipT}:</b> ${tr(x.tip)}</p></div>`;
  if(x.calc)h+=`<button class="btn ghost" id="calc" type="button">${L.openCalc}</button>`;
  h+=`<button class="btn" id="start" type="button">${L.start(x.quiz.length)}</button></main>`;
  app.innerHTML=h;
  $('#back').onclick=()=>go('home');
  $('#start').onclick=()=>{S.qi=0;S.score=0;S.picked=null;go('quiz')};
  const c=$('#calc');if(c)c.onclick=()=>{S.tab=1;go('home')};
}

function quiz(){
  const L=U();const x=LESSONS.find(y=>y.id===S.id);const QZ=x.quiz;const item=QZ[S.qi];const Q=tr(item);const p=S.picked;
  const opts=Q.o.map((o,i)=>{let c='opt';if(p!==null){if(i===item.a)c+=' right';else if(i===p)c+=' wrong'}return `<button class="${c}" data-i="${i}" type="button" ${p!==null?'disabled':''}>${o}</button>`}).join('');
  app.innerHTML=header(`<div class="row"><button class="back" id="back" type="button">${L.toL}</button>${langSw()}</div><h1 class="ttl">${L.qt}: ${tr(x.t)}</h1><p>${L.qsub(need(QZ.length),QZ.length)}</p>`)+`<main class="wrap">
   <div class="progress"><div class="q-top"><span>${L.qn(S.qi+1,QZ.length)}</span><span>${L.ok(S.score)}</span></div><div class="meter"><i style="width:${(S.qi+(p!==null?1:0))/QZ.length*100}%"></i></div></div>
   <p class="q">${Q.q}</p><div class="opts">${opts}</div>
   ${p!==null?`<p class="expl">${p===item.a?`<b class="okc">${L.right}</b> `:`<b class="badc">${L.wrong}</b> `}${Q.e}</p><button class="btn" id="next" type="button">${S.qi<QZ.length-1?L.next:L.res}</button>`:''}
  </main>`;
  $('#back').onclick=()=>go('lesson');
  document.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{S.picked=+b.dataset.i;if(S.picked===item.a)S.score++;render()});
  const n=$('#next');if(n)n.onclick=()=>{if(S.qi<QZ.length-1){S.qi++;S.picked=null;go('quiz')}else{const pass=S.score>=need(QZ.length);if(pass){done.add(x.id);store.set('done',[...done])}go('result')}};
}

function result(){
  const L=U();const x=LESSONS.find(y=>y.id===S.id);const n=x.quiz.length;const pass=S.score>=need(n);
  const list=byLv(x.lv);const nx=list[list.indexOf(x)+1];
  app.innerHTML=header(`<div class="row"><div><h1>${L.res}</h1><p>${tr(x.t)}</p></div>${langSw()}</div>`)+`<main class="wrap"><div class="card result">
   <div class="score">${S.score} / ${n}</div><h3>${pass?L.passT:L.failT}</h3>
   <p class="expl">${pass?(nx?L.passNext(tr(nx.t)):L.passLast):L.fail(need(n),n)}</p></div>
   ${pass&&nx?`<button class="btn" id="nextL" type="button">${L.nextL}</button>`:''}
   ${pass?'':`<button class="btn" id="retry" type="button">${L.retry}</button>`}
   <button class="btn ghost" id="home" type="button">${L.home}</button></main>`;
  $('#home').onclick=()=>go('home');
  const r=$('#retry');if(r)r.onclick=()=>{S.qi=0;S.score=0;S.picked=null;go('quiz')};
  const nl=$('#nextL');if(nl)nl.onclick=()=>{S.id=nx.id;go('lesson')};
}

const big=n=>Math.round(n).toLocaleString('ru-RU').replace(/\s/g,' ');
const numv=v=>+String(v).replace(',','.')||0;
const seg=(k,opts)=>`<div class="seg" role="group">${opts.map((o,i)=>`<button type="button" data-seg="${k}" data-v="${i}" aria-pressed="${S.calc[k]===i}">${o}</button>`).join('')}</div>`;
const fld=(id,lab,v,step=1)=>`<label class="fld" for="${id}">${lab}<input id="${id}" type="number" inputmode="decimal" min="0" step="${step}" value="${v}"></label>`;
const cell=(t,v,c='')=>`<div${c?` class="${c}"`:''}><span>${t}</span><b>${v}</b></div>`;
// base recipes: form diameter (cm) and grams
const RECIPES=[
 {d:20,items:[['egg',200],['sugar',120],['flour',100],['starch',20]]},
 {d:22,items:[['flour',150],['butter',100],['sugar',50],['yolk',20]]},
 {d:20,items:[['cheese',600],['cream',200],['powder',140]]},
 {d:20,items:[['choc',300],['cream',150]]}];
const RINGS=[14,16,18,20,22,24,26,28,30];
// cake weight (g) from diameter at 11 cm height, ~0.7 g/cm³ — matches the lesson table
const diaFor=w=>{const d=2*Math.sqrt(w/(0.7*11*Math.PI));return RINGS.find(r=>r>=d-0.6)||30};
function calcBlock(){const L=U();const c=S.calc;
  return `<div class="card stack"><div><h3>${L.rT}</h3><p class="expl">${L.rSub}</p></div>
  <div class="fld">${L.rec}${seg('rec',L.recO)}</div>
  <div class="pair">${fld('cd',L.myD,c.d)}<p class="expl" id="rb" style="align-self:end;margin:0 0 12px"></p></div>
  <div class="out" id="out1"></div><p class="expl">${L.rNote}</p></div>
  <div class="card stack"><div><h3>${L.wT}</h3><p class="expl">${L.wSub}</p></div>
  <div class="pair">${fld('cg',L.guests,c.g)}<div></div></div>
  <div class="fld">${L.por}${seg('por',L.porO.map((o,i)=>`${o} ${[100,150,200][i]} ${L.g}`))}</div>
  <div class="out" id="out2"></div><p class="expl">${L.wNote}</p></div>
  <div class="card stack"><div><h3>${L.cT}</h3><p class="expl">${L.cSub}</p></div>
  <div class="pair">${fld('cpr',L.prod,c.prod,1000)}${fld('cpk',L.pack,c.pack,1000)}</div>
  <div class="pair">${fld('cwt',L.wt,c.wt,0.1)}${fld('chr',L.hrs,c.hrs,0.5)}</div>
  <div class="pair">${fld('crt',L.rate,c.rate,1000)}<div></div></div>
  <div class="out" id="out3"></div><p class="expl" id="cv"></p><p class="expl">${L.cNote}</p></div>`}
const gk=(g,L)=>g>=1000?`${fmt(g/1000,2)} ${L.kg}`:`${fmt(Math.round(g))} ${L.g}`;
function paintCalc(){const L=U();const c=S.calc;const ru=lang==='ru';
  // recipe scaling by area
  const R0=RECIPES[c.rec];const d=Math.max(0,numv(c.d));const k=d>0?(d/R0.d)**2:0;
  $('#rb').textContent=L.base(R0.d);
  $('#out1').innerHTML=cell(L.k,d?fmt(k,2):'—')+R0.items.map(([n,g])=>{const v=g*k;
    if(n==='egg')return cell(L.ing.egg,d?`${fmt(Math.max(1,Math.round(v/50)))} ${L.pcs}`:'—')+'';
    if(n==='yolk')return cell(L.ing.yolk,d?`${fmt(Math.max(1,Math.round(v/20)))} ${L.pcs}`:'—');
    return cell(L.ing[n],d?gk(v,L):'—')}).join('')+(R0.items[0][0]==='egg'&&d?cell(ru?'Яйца, вес':'Tuxum, vazni',gk(200*k,L)):'');
  // cake by guests
  const g=Math.max(0,numv(c.g));const w=g*[100,150,200][c.por];
  let form='—',tiers='1';
  if(w>0){if(w<=3600){form=`${diaFor(w)} ${L.cm}`}else{const a=diaFor(w*0.62),b=diaFor(w*0.38);form=`${a} + ${b} ${L.cm}`;tiers='2'}}
  $('#out2').innerHTML=cell(L.w,w?gk(w,L):'—')+cell(L.form,form)+cell(L.tiers,w?tiers:'—');
  // cost and price
  const prod=Math.max(0,numv(c.prod)),pack=Math.max(0,numv(c.pack)),wt=Math.max(0,numv(c.wt)),hrs=Math.max(0,numv(c.hrs)),rate=Math.max(0,numv(c.rate));
  const cost=(prod+pack)*1.1;const price=cost+hrs*rate>0?Math.ceil((cost+hrs*rate)/5000)*5000:0;
  $('#out3').innerHTML=cell(L.cp,cost?big(cost):'—')+cell(L.price,price?big(price):'—')+cell(L.pkg,price&&wt?big(price/wt):'—');
  const v=$('#cv');
  if(price&&hrs*rate===0){v.textContent=ru?'Вы не посчитали свою работу. Укажите часы и ставку — иначе торт продаётся в убыток.':'Mehnatingiz hisoblanmadi. Soat va stavkani kiriting — aks holda tort zarariga sotiladi.';v.className='expl badc'}
  else if(price){v.textContent=ru?`Продавайте торт примерно за ${big(price)} сум. Ваша работа в цене: ${big(hrs*rate)} сум.`:`Tortni taxminan ${big(price)} so'mga soting. Narxdagi mehnatingiz: ${big(hrs*rate)} so'm.`;v.className='expl okc'}
  else v.textContent='';
}
function bindCalc(){
  const on=(id,k)=>{$(id).oninput=e=>{S.calc[k]=e.target.value;paintCalc()}};
  on('#cd','d');on('#cg','g');on('#cpr','prod');on('#cpk','pack');on('#cwt','wt');on('#chr','hrs');on('#crt','rate');
  document.querySelectorAll('[data-seg]').forEach(b=>b.onclick=()=>{const k=b.dataset.seg;S.calc[k]=+b.dataset.v;
    document.querySelectorAll(`[data-seg="${k}"]`).forEach(x=>x.setAttribute('aria-pressed',x===b));paintCalc()});
  paintCalc()}

function bindCommon(){
  document.querySelectorAll('.lang button').forEach(b=>b.onclick=()=>{lang=b.dataset.l;store.set('lang',lang);document.documentElement.lang=lang;render()});
  document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{S.tab=+b.dataset.tab;render()});
}
function render(){({home,lesson,quiz,result})[S.screen]();bindCommon()}
function go(s){S.screen=s;render();window.scrollTo(0,0)}
document.documentElement.lang=lang;
go('home');

</script>
</body>
</html>

mascot(mood){return ustaArt(mood,{helmet:'#8f6ef5',helmetDark:'#6a4ad6',shirt:'#1b1f45',soot:false,
  badge:`<circle cx="70" cy="38" r="9" fill="#fff" opacity=".9"/><circle cx="70" cy="38" r="3.5" fill="#8f6ef5"/><path d="M79 38h14" stroke="#fff" stroke-width="3" stroke-linecap="round"/>`,
  fx1:`<g class="bolt" stroke="#b18cff" stroke-width="3" stroke-linecap="round"><path d="M10 70l20 6M8 92l22-2M130 70l-20 6M132 92l-22-2"/></g><g class="bolt" fill="#fff" stroke="#8f6ef5" stroke-width="1.5"><path d="M20 120l4-8 4 8-8-4 8 0z"/></g>`,
  fx2:`<g fill="#c4392f"><rect x="2" y="4" width="46" height="22" rx="6"/><text x="25" y="20" font-size="13" font-weight="700" text-anchor="middle" fill="#fff" font-family="Golos Text,system-ui">LOS</text></g><text x="118" y="30" font-size="26" font-weight="700" fill="#8f6ef5">?</text>`})},
draw(G){
  const S=G.scene,ps=S.pieces,n=ps.length,x0=24,x1=316,step=(x1-x0)/(n-1),cy=104;
  const pos=i=>x0+step*i;
  let loss=0,started=!!G.placed.olt;ps.forEach(p=>{if(G.placed[p.id])loss+=p.loss});
  const lvl=3-loss;let s='';
  // line segments
  for(let i=0;i<n-1;i++){const on=G.placed[ps[i].id]&&G.placed[ps[i+1].id];
    s+=on?`<path d="M${pos(i)} ${cy}H${pos(i+1)}" stroke="var(--accent)" stroke-width="4" class="flow"/>`
      :`<path d="M${pos(i)} ${cy}H${pos(i+1)}" stroke="var(--rail)" stroke-width="2" stroke-dasharray="3 5" opacity=".7"/>`}
  ps.forEach((p,i)=>{const x=pos(i),st=G.placed[p.id],cur=G.task&&G.task.m===p.id&&!G.complete;
    if(st)s+=`<g${G.justPlaced===p.id?' class="newmod"':''}>${this.glyph(p,x,cy,st)}</g>`;
    else s+=`<rect${cur?' class="slot"':''} x="${x-18}" y="${cy-18}" width="36" height="36" rx="8" fill="var(--plate)" stroke="${cur?'var(--accent)':'var(--rail)'}" stroke-width="${cur?2.5:1.2}" stroke-dasharray="5 4"/>`;
    s+=`<text x="${x}" y="${cy+34}" font-size="9.5" font-weight="600" text-anchor="middle" fill="${st?'var(--fg)':'var(--muted)'}">${tr(p.lab)}</text>`;
    if(st&&p.loss)s+=`<text x="${x}" y="${cy+46}" font-size="9" text-anchor="middle" fill="var(--bad)">−${String(p.loss).replace('.',',')}</text>`});
  // signal meter: 0 … −30 dBm (left is strong); OLT +3 drawn at the left edge
  const mx=v=>34+(Math.min(3,Math.max(-30,v))-3)/(-33)*272;
  const col=lvl>=-24?'var(--ok)':lvl>=-27?'var(--warn)':'var(--bad)';
  const L=GAME.UI[lang];
  s+=`<rect x="34" y="34" width="272" height="10" rx="5" fill="var(--box)"/>`;
  s+=`<rect x="${mx(-24)}" y="34" width="${mx(-27)-mx(-24)}" height="10" fill="var(--warn)" opacity=".45"/><rect x="${mx(-27)}" y="34" width="${306-mx(-27)}" height="10" rx="0" fill="var(--bad)" opacity=".4"/>`;
  s+=`<text x="${mx(-27)}" y="56" font-size="8.5" text-anchor="middle" fill="var(--muted)">−27</text><text x="34" y="56" font-size="8.5" fill="var(--muted)">+3</text>`;
  if(started)s+=`<circle cx="${mx(lvl)}" cy="39" r="7" fill="${col}" stroke="var(--surface)" stroke-width="2"/>`;
  s+=`<text x="170" y="24" font-size="13" font-weight="700" text-anchor="middle" fill="${started?col:'var(--muted)'}" font-family="Golos Text,system-ui">${L.sig}${G.placed.ont?' '+L.onont:''}: ${started?fmt(lvl)+' '+L.dbm:'—'}${G.placed.ont&&lvl>=-24?' ✓':''}</text>`;
  return `<svg viewBox="0 0 340 168" role="img" aria-label="${tr(S.name)}"><rect x="1" y="1" width="338" height="166" rx="12" fill="var(--surface)" stroke="var(--line)"/>${s}</svg>`},
glyph(p,x,y,st){const help=st==='help',ring=help?'var(--warn)':'var(--devline)';
  const box=(w,h,f)=>`<rect x="${x-w/2}" y="${y-h/2}" width="${w}" height="${h}" rx="5" fill="${f||'var(--dev)'}" stroke="${ring}" stroke-width="${help?2.5:1.5}"/>`;
  switch(p.k){
  case 'olt':return box(34,32,'#1b1f45')+[0,1,2].map(i=>`<rect x="${x-12}" y="${y-11+i*8}" width="24" height="5" rx="1.5" fill="#3a4170"/><circle cx="${x+9}" cy="${y-8.5+i*8}" r="1.6" fill="#3dbb72"/>`).join('');
  case 'cab':return `<g fill="none" stroke="var(--fg)" stroke-width="4" opacity=".85"><circle cx="${x}" cy="${y}" r="14"/><circle cx="${x}" cy="${y}" r="8"/></g>`+(help?`<circle cx="${x}" cy="${y}" r="17" fill="none" stroke="var(--warn)" stroke-width="2"/>`:'');
  case 'spl':return box(34,16)+`<rect x="${x-10}" y="${y-3}" width="20" height="6" rx="3" fill="#cfd6dd" stroke="#8d969f"/><path d="M${x-17} ${y}h7M${x+10} ${y}h7" stroke="var(--accent)" stroke-width="2"/>`;
  case 'muf':return `<ellipse cx="${x}" cy="${y}" rx="18" ry="13" fill="#2b3640" stroke="${ring}" stroke-width="${help?2.5:1}"/><rect x="${x-10}" y="${y-3}" width="20" height="6" rx="3" fill="#cfd6dd"/>`;
  case 'sp':return `<path d="M${x-16} ${y}L${x+14} ${y-15}V${y+15}Z" fill="var(--dev)" stroke="${ring}" stroke-width="${help?2.5:1.5}" stroke-linejoin="round"/>`+[-10,-4,2,8].map(d=>`<path d="M${x+14} ${y+d}h5" stroke="var(--accent)" stroke-width="1.6"/>`).join('');
  case 'con':return `<rect x="${x-15}" y="${y-7}" width="13" height="14" rx="2" fill="#1f9a4c" stroke="${ring}"/><rect x="${x+2}" y="${y-7}" width="13" height="14" rx="2" fill="#1f9a4c" stroke="${ring}"/><rect x="${x-2}" y="${y-3}" width="4" height="6" fill="#cfd6dd"/>`;
  case 'otdr':return box(34,28,'#f2c916')+`<rect x="${x-12}" y="${y-9}" width="24" height="14" rx="2" fill="#14202b"/><path d="M${x-11} ${y-6}l4 4h4l2-2 2 2h8" fill="none" stroke="#3dbb72" stroke-width="1.4"/>`;
  case 'ont':return `<path d="M${x-17} ${y-2}L${x} ${y-18}L${x+17} ${y-2}V${y+16}H${x-17}Z" fill="var(--dev)" stroke="${ring}" stroke-width="${help?2.5:1.5}" stroke-linejoin="round"/><rect x="${x-9}" y="${y+2}" width="18" height="8" rx="2" fill="#14202b"/><circle cx="${x-4}" cy="${y+6}" r="1.6" fill="#3dbb72"/><circle cx="${x+1}" cy="${y+6}" r="1.6" fill="#3dbb72"/>`;
  }return ''}
};

</script>
<script>
/* ---------- engine ---------- */
const U=()=>Object.assign({},COMMON[lang],GAME.UI[lang]);
let G=null,timer=null;
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
const NS=GAME.SCENES.length,ORD=()=>shuffle([...Array(NS).keys()]);
function newGame(){
  G={score:0,lives:3,combo:0,t:GAME_TIME,right:0,total:0,done:0,pn:0,order:ORD(),busy:false};
  loadScene();render();
  clearInterval(timer);let last=Date.now();
  timer=setInterval(()=>{const now=Date.now(),dt=(now-last)/1000;last=now;if(G.busy||document.hidden)return;
    G.t-=dt;if(G.t<=0){G.t=0;end('time')}else paintTime()},200)}
function loadScene(){
  if(G.pn>0&&G.pn%NS===0)G.order=ORD();
  G.scene=GAME.SCENES[G.order[G.pn%NS]];G.ti=0;G.complete=false;G.placed={};G.miss=0;G.justPlaced=null;nextTask(true)}
function nextTask(first){
  if(!first)G.ti++;
  if(G.ti>=G.scene.tasks.length){G.complete=true;G.done++;const bonus=G.miss?100:300;G.score+=bonus;
    toast(U().built(bonus));haptic('success');G.pn++;G.busy=true;render();
    setTimeout(()=>{if(!G||G.over)return;G.busy=false;loadScene();render()},1300);return}
  G.task=G.scene.tasks[G.ti];
  G.opts=shuffle(G.task.o.map((o,i)=>({o,ok:i===0})));G.shown=Date.now()}
const app=document.getElementById('app');
const $=s=>document.querySelector(s);
function bar(){const L=U();return `<header class="bar"><a href="../">${L.back}</a><div class="ttl">${GAME.icon} ${L.title}</div><div class="lang" role="group" aria-label="Til"><button type="button" data-l="ru" aria-pressed="${lang==='ru'}">RU</button><button type="button" data-l="uz" aria-pressed="${lang==='uz'}">UZ</button></div></header>`}
function bindBar(){document.querySelectorAll('[data-l]').forEach(b=>b.onclick=()=>{lang=b.dataset.l;store.set('ep_lang',JSON.stringify(lang));document.documentElement.lang=lang;render()})}
let screen='start',result=null;
function render(){document.documentElement.lang=lang;
  if(screen==='start')startScr();else if(screen==='game')gameScr();else endScr();bindBar()}
function startScr(){const L=U();const best=+store.get(GAME.bestKey)||0;
  const rules=L.rules(GAME.lifeIcon).concat([L.r3]);
  app.innerHTML=bar()+`<main class="wrap"><div class="hero">${GAME.mascot('ok')}</div><h1>${L.h1}</h1><p class="lead">${L.lead}</p>
  <div class="card"><ul class="rules">${rules.map(r=>`<li><span>${r[0]}</span><div>${r[1]}</div></li>`).join('')}</ul></div>
  ${best?`<div class="best">${L.best}: <b>${best}</b></div>`:''}
  <button class="btn" id="play" type="button">${L.play}</button><p class="small">${L.safe}</p></main>`;
  $('#play').onclick=()=>{screen='game';newGame()}}
function gameScr(){const L=U();const t=G.task;
  const opts=G.opts.map((x,i)=>`<button class="opt" type="button" data-i="${i}"><span>${tr(x.o)}</span></button>`).join('');
  app.innerHTML=bar()+`<main class="wrap" id="gw">
  <div class="hud"><span class="sc" id="sc">${G.score}</span><span class="lv" aria-label="lives">${[0,1,2].map(i=>`<i class="${i<G.lives?'':'off'}">${GAME.lifeIcon}</i>`).join('')}</span><span class="tm" id="tm"></span></div>
  <div class="tbar"><i id="tb"></i></div>
  <div class="pname"><span>${L.scene(G.done+1,tr(G.scene.name))}</span>${G.combo>1?`<span class="combo">${L.combo(Math.min(G.combo,5))}</span>`:''}</div>
  <div class="panel">${GAME.draw(G)}</div>
  ${G.complete?'':`<p class="q">${tr(t.q)}</p><div class="opts">${opts}</div>`}</main>`;
  G.justPlaced=null;paintTime();
  document.querySelectorAll('[data-i]').forEach(b=>b.onclick=()=>answer(+b.dataset.i,b))}
function paintTime(){const tm=$('#tm'),tb=$('#tb');if(!tm)return;const s=Math.ceil(G.t);
  tm.textContent=`${Math.floor(s/60)}:${String(s%60).padStart(2,'0')}`;tm.classList.toggle('low',s<=15);
  tb.style.width=(G.t/GAME_TIME*100)+'%';tb.classList.toggle('low',s<=15)}
function answer(i,btn){if(G.busy)return;const x=G.opts[i],t=G.task;G.total++;
  if(x.ok){G.right++;G.combo++;const fast=(Date.now()-G.shown)<5000;
    const pts=100+25*Math.min(G.combo-1,4)+(fast?50:0);G.score+=pts;
    if(t.m){G.placed[t.m]='ok';G.justPlaced=t.m}
    btn.classList.add('right');floatTxt('+'+pts);haptic('light');G.busy=true;
    setTimeout(()=>{if(G.over)return;G.busy=false;nextTask();render()},380)}
  else{G.combo=0;G.lives--;G.miss++;G.busy=true;
    if(t.m)G.placed[t.m]='help'; // steps go in order: the mentor fixes it (orange), you go on
    haptic('error');failFx(t)}}
function failFx(t){const L=U();const F=GAME.FX[t.fx]||Object.values(GAME.FX)[0];
  const f=document.createElement('div');f.className='flash f-'+F.flash;document.body.appendChild(f);setTimeout(()=>f.remove(),1000);
  const gw=$('#gw');if(gw)gw.classList.add('shake');
  const titles=F.titles[lang]||F.titles.ru;const title=titles[Math.random()*titles.length|0];
  const ov=document.createElement('div');ov.className='ov';
  ov.innerHTML=`<div class="sheet" role="alertdialog" aria-live="assertive"><div class="who">${GAME.mascot(F.mood)}<h2>${title}</h2></div>
  <p class="ans">${L.right} <b>${tr(t.o[0])}</b></p><p class="why">${tr(t.e)}</p><button class="btn" type="button" id="ovn">${L.next}</button></div>`;
  setTimeout(()=>{document.body.appendChild(ov);$('#ovn').focus()},350);
  ov.querySelector('#ovn').onclick=()=>{ov.remove();G.busy=false;if(G.lives<=0){end('lives');return}G.justPlaced=t.m||null;nextTask();render()}}
function floatTxt(s){const d=document.createElement('div');d.className='float';d.textContent=s;document.body.appendChild(d);setTimeout(()=>d.remove(),800)}
function toast(s){const d=document.createElement('div');d.className='toast';d.textContent=s;document.body.appendChild(d);setTimeout(()=>d.remove(),1300)}
function haptic(k){try{const h=tg&&tg.HapticFeedback;if(!h)return;if(k==='light')h.impactOccurred('light');else h.notificationOccurred(k)}catch(e){}}
function end(why){if(!G||G.over)return;G.over=true;clearInterval(timer);
  document.querySelectorAll('.ov').forEach(o=>o.remove());
  const prev=+store.get(GAME.bestKey)||0;const rec=G.score>prev;if(rec)store.set(GAME.bestKey,G.score);
  result={score:G.score,done:G.done,right:G.right,total:G.total,why,rec,best:Math.max(prev,G.score)};
  screen='end';render()}
function rankOf(s){return s<1200?0:s<2400?1:s<3600?2:3}
function endScr(){const L=U(),r=result;const acc=r.total?Math.round(r.right/r.total*100):0;
  app.innerHTML=bar()+`<main class="wrap"><div class="hero">${GAME.mascot(r.why==='lives'?'bad1':'ok')}</div>
  <h1>${r.why==='lives'?L.overLives:L.over}</h1>
  <div class="big">${r.score}</div><div class="center"><span class="rank">${L.ranks[rankOf(r.score)]}</span></div>
  ${r.rec&&r.score>0?`<p class="lead"><b>🏆 ${L.rec}</b></p>`:`<div class="best">${L.best}: <b>${r.best}</b></div>`}
  <div class="stats"><div><b>${r.score}</b><span>${L.score}</span></div><div><b>${r.done}</b><span>${L.doneW}</span></div><div><b>${acc}%</b><span>${L.acc}</span></div></div>
  <button class="btn tg" id="share" type="button">📤 ${L.share}</button>
  <button class="btn" id="again" type="button">${L.again}</button>
  <a class="btn ghost" href="../">📘 ${L.learn}</a></main>`;
  $('#again').onclick=()=>{screen='game';newGame()};
  $('#share').onclick=share}
function share(){const r=result;const url=`https://t.me/${BOT}?start=${GAME.start}`;
  const link=`https://t.me/share/url?url=${encodeURIComponent(url)}&text=${encodeURIComponent(U().shareText(r.score,r.done))}`;
  try{if(tg&&tg.initData&&tg.openTelegramLink){tg.openTelegramLink(link);return}}catch(e){}
  window.open(link,'_blank','noopener')}
render();
</script>

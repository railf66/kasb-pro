  ru:[["Портновские ножницы","Режут только ткань. Бумагой ножницы быстро тупятся — для неё отдельные"],["Сантиметровая лента","Мягкая, не растянутая. Старая лента врёт на 1–2 см"],["Мел, мыло, исчезающий маркер","Тонкая линия. Обмылок хорошо виден на тёмной ткани и легко уходит утюгом"],["Линейка 50–60 см, угольник, лекала","Чтобы чертить прямые и плавные линии (пройма, горловина, бок)"],["Булавки, ручные иглы, напёрсток","Булавки с шариком, тонкие — не оставляют дыр на шёлке"],["Утюг и проутюжильник","Тонкая хлопковая ткань сверху — чтобы не было блеска на шерсти и синтетике"]],

 steps:{ru:["Стол — не меньше 1,5 × 0,8 м, хорошее дневное освещение слева (для правши).","Ножницы держат так, чтобы нижнее лезвие лежало на столе: ткань не поднимается и не съезжает.","Булавки втыкают поперёк будущей строчки и вынимают до того, как к ним подойдёт игла.","Утюг ставят на пятку и выключают, когда уходите. Шнур не должен свисать там, где ходят.","Перед работой проверьте утюг на кусочке той же ткани: шёлк, синтетика и шерсть боятся высокой температуры.","Порядок на столе: обрезки сразу в коробку, мелкие детали — в отдельный пакет с подписью."],
       uz:["Stol — kamida 1,5 × 0,8 m, kunduzgi yorug'lik chapdan tushsin (o'naqay uchun).","Qaychini pastki tig'i stolda yotadigan qilib ushlang: mato ko'tarilmaydi va siljimaydi.","To'g'nag'ichlar bo'lajak chokka ko'ndalang qadaladi va igna yetib kelguncha olinadi.","Dazmol tovoniga qo'yiladi va ketayotganda o'chiriladi. Shnur odamlar yuradigan joyda osilib turmasin.","Ishdan oldin dazmolni xuddi shu matoning bo'lagida sinab ko'ring: ipak, sintetika va jun yuqori haroratdan qo'rqadi.","Stolda tartib: qiyqimlar darrov qutiga, mayda detallar — yozuvli alohida paketga."]},
 tip:{ru:"Лучшие вложения на старте — хорошие ножницы и новая сантиметровая лента. Остальное можно докупать постепенно.",uz:"Boshlanishda eng yaxshi sarmoya — yaxshi qaychi va yangi santimetr lenta. Qolganini asta-sekin sotib olish mumkin."},
 quiz:[
  {a:1,ru:{q:"Можно ли резать бумагу портновскими ножницами?",o:["Да, ничего не будет","Нет, они быстро затупятся","Только картон"],e:"Для бумаги держат отдельные ножницы."},uz:{q:"Bichish qaychisi bilan qog'oz kesish mumkinmi?",o:["Ha, hech narsa bo'lmaydi","Yo'q, tez o'tmaslashadi","Faqat karton"],e:"Qog'oz uchun alohida qaychi bo'ladi."}},
  {a:2,ru:{q:"Как правильно втыкать булавки перед строчкой?",o:["Вдоль строчки","Как получится","Поперёк строчки и вынимать до иглы"],e:"Так игла не сломается и ткань не сдвинется."},uz:{q:"Chok tikishdan oldin to'g'nag'ich qanday qadaladi?",o:["Chok bo'ylab","Qanday bo'lsa","Chokka ko'ndalang va igna yetguncha olinadi"],e:"Shunda igna sinmaydi va mato siljimaydi."}},
  {a:0,ru:{q:"Зачем проутюжильник при глажке шерсти?",o:["Чтобы не было блеска и подпалин","Чтобы быстрее","Он не нужен"],e:"Ткань-прокладка защищает лицевую сторону."},uz:{q:"Junni dazmollashda ustidan latta nima uchun?",o:["Yaltiroq dog' va kuyish bo'lmasligi uchun","Tezroq bo'lishi uchun","Kerak emas"],e:"Oraliq mato yuz tomonini himoya qiladi."}},
  {a:1,ru:{q:"Старая растянутая сантиметровая лента…",o:["Точнее новой","Может ошибаться на 1–2 см","Подходит для чертежа"],e:"Мерки и чертёж требуют точности — ленту меняют."},uz:{q:"Eski cho'zilgan santimetr lenta…",o:["Yangisidan aniqroq","1–2 sm xato ko'rsatishi mumkin","Chizma uchun mos"],e:"O'lchov va chizma aniqlik talab qiladi — lenta almashtiriladi."}}]},

 steps:{ru:["Клиентка стоит прямо, в тонкой одежде или белье, в обуви на том каблуке, с которым будет носить изделие.","Сначала завяжите на талии тонкую тесьму — это линия талии для всех длин.","Лента не провисает и не врезается. Палец под лентой — уже лишний сантиметр.","Обхваты (ОГ, ОТ, ОБ) записывают полностью, а в чертеже используют половину: Сг = ОГ/2, Ст = ОТ/2, Сб = ОБ/2.","Записывайте мерки сразу в тетрадь или телефон: имя, дата, телефон и все цифры.","Через 3–6 месяцев мерки постоянной клиентки снимайте заново — фигура меняется."],
       uz:["Mijoz to'g'ri turadi, yupqa kiyimda yoki ichki kiyimda, buyum bilan kiyadigan poshnali poyabzalda.","Avval belga ingichka tasma bog'lang — bu barcha uzunliklar uchun bel chizig'i.","Lenta osilib qolmasin va botmasin. Lenta ostidagi barmoq — ortiqcha bir santimetr.","Aylanalar (KA, BA, SA) to'liq yoziladi, chizmada esa yarmi olinadi: Yk = KA/2, Yb = BA/2, Ys = SA/2.","O'lchovlarni darhol daftar yoki telefonga yozing: ism, sana, telefon va barcha raqamlar.","Doimiy mijozning o'lchovini 3–6 oydan keyin qayta oling — qomat o'zgaradi."]},
 tip:{ru:"Прибавки на свободу облегания (на «дышать» и двигаться) к меркам не добавляют при снятии — их дают уже в чертеже.",uz:"Erkin turish uchun qo'shimchalar (nafas olish va harakat uchun) o'lchov olishda qo'shilmaydi — ular chizmada beriladi."},
 calc:true,
 quiz:[
  {a:2,ru:{q:"Где снимают обхват талии?",o:["На уровне пупка","По поясу джинсов","По самому узкому месту"],e:"Удобно сначала завязать тесьму на талии."},uz:{q:"Bel aylanasi qayerdan olinadi?",o:["Kindik balandligida","Jinsi kamari bo'yicha","Eng ingichka joy bo'yicha"],e:"Avval belga tasma bog'lab olish qulay."}},
  {a:0,ru:{q:"ОБ = 96 см. Чему равен полуобхват бёдер Сб?",o:["48 см","96 см","24 см"],e:"Сб = ОБ / 2."},uz:{q:"SA = 96 sm. Yarim son aylanasi Ys nechaga teng?",o:["48 sm","96 sm","24 sm"],e:"Ys = SA / 2."}},
  {a:1,ru:{q:"От какой точки меряют длину спины до талии?",o:["От макушки","От 7-го шейного позвонка","От лопатки"],e:"Это выступающая косточка у основания шеи."},uz:{q:"Belgacha orqa uzunligi qaysi nuqtadan o'lchanadi?",o:["Boshning tepasidan","7-bo'yin umurtqasidan","Kurakdan"],e:"Bu bo'yin asosidagi bo'rtib turgan suyak."}},
  {a:1,ru:{q:"Нужно ли добавлять прибавку при снятии мерки?",o:["Да, 5 см","Нет, прибавки дают в чертеже","Только к росту"],e:"Мерки снимают точно, а прибавки — на этапе построения."},uz:{q:"O'lchov olishda qo'shimcha qo'shish kerakmi?",o:["Ha, 5 sm","Yo'q, qo'shimchalar chizmada beriladi","Faqat bo'yga"],e:"O'lchov aniq olinadi, qo'shimchalar esa chizishda."}}]},

 table:{head:{ru:["Ткань","Свойства","Для чего"],uz:["Mato","Xususiyati","Nima uchun"]},rows:{
  ru:[["Хлопок (бязь, поплин, ситец)","Дышит, легко шить, садится при стирке","Блузки, детское, халаты — первый проект"],["Лён","Прохладный, мнётся, садится","Летние платья и брюки"],["Шерсть, костюмная","Тёплая, держит форму, гладят через проутюжильник","Юбки, брюки, жакеты"],["Шёлк, атлас","Скользит, сыпется, видны проколы","Нарядные платья — для опытных"],["Вискоза, штапель","Мягкая, струится, садится сильно","Лёгкие платья, блузки"],["Полиэстер, смесовые","Не мнётся, не садится, плавится от утюга","Форма, подкладка, повседневное"],["Трикотаж","Тянется, края не сыпятся","Нужна трикотажная игла и эластичная строчка"]],
  uz:[["Paxta (byaz, poplin, sitets)","Havo o'tkazadi, tikish oson, yuvganda kirishadi","Bluzka, bolalar kiyimi, xalat — birinchi ish"],["Zig'ir","Salqin, g'ijimlanadi, kirishadi","Yozgi ko'ylak va shimlar"],["Jun, kostyumbop","Issiq, shaklni ushlaydi, latta orqali dazmollanadi","Yubka, shim, jaket"],["Ipak, atlas","Sirpanadi, titiladi, igna izi ko'rinadi","Bayramona ko'ylak — tajribalilar uchun"],["Viskoza, shtapel","Yumshoq, oqib turadi, ko'p kirishadi","Yengil ko'ylak, bluzka"],["Poliester, aralash","G'ijimlanmaydi, kirishmaydi, dazmoldan eriydi","Forma, astar, kundalik kiyim"],["Trikotaj","Cho'ziladi, chetlari titilmaydi","Trikotaj ignasi va elastik chok kerak"]]}},
 steps:{ru:["Найдите кромку — плотный край ткани без бахромы. Долевая нить всегда идёт вдоль неё.","Если кромки нет: потяните ткань — долевая почти не тянется, поперёк тянется чуть больше, по косой — сильно.","Детали кроят так, чтобы стрелка долевой нити на выкройке была параллельна кромке. Иначе изделие перекосит.","Хлопок, лён и вискозу перед кроем декатируют: стирают или парят утюгом и сушат. Так ткань сядет до шитья, а не после.","Определите лицевую сторону: она ярче, глаже, рисунок чётче. На кромке часто есть проколы — их «выпуклая» сторона лицевая.","Отрежьте кусочек и проверьте на нём утюг, иглу и строчку, прежде чем шить изделие."],
       uz:["Chetni toping — mato qirrasidagi popuksiz zich qism. Bo'ylama ip doim unga parallel bo'ladi.","Chet bo'lmasa: matoni torting — bo'ylama deyarli cho'zilmaydi, ko'ndalang biroz ko'proq, qiyiq bo'yicha — kuchli.","Detallar andozadagi bo'ylama ip strelkasi chetga parallel bo'ladigan qilib bichiladi. Aks holda buyum qiyshayadi.","Paxta, zig'ir va viskoza bichishdan oldin dekatirovka qilinadi: yuviladi yoki dazmolda bug'lanib quritiladi. Shunda mato tikishdan oldin kirishadi, keyin emas.","Yuz tomonini aniqlang: u yorqinroq, silliqroq, naqsh aniqroq. Chetda ko'pincha teshikchalar bo'ladi — ularning bo'rtgan tomoni yuz tomoni.","Bir bo'lak kesib, unda dazmol, igna va chokni sinab ko'ring, keyin buyumni tiking."]},
 tip:{ru:"Для первого изделия берите однотонный плотный хлопок без рисунка: он не скользит, не сыплется и прощает ошибки.",uz:"Birinchi buyum uchun naqshsiz bir rangli zich paxta oling: u sirpanmaydi, titilmaydi va xatolarni kechiradi."},
 quiz:[
  {a:0,ru:{q:"Как идёт долевая нить?",o:["Параллельно кромке","Поперёк кромки","Под 45°"],e:"Долевая — вдоль кромки, почти не тянется."},uz:{q:"Bo'ylama ip qanday yo'nalgan?",o:["Chetga parallel","Chetga ko'ndalang","45° ostida"],e:"Bo'ylama — chet bo'ylab, deyarli cho'zilmaydi."}},
  {a:2,ru:{q:"В каком направлении ткань тянется сильнее всего?",o:["По долевой","По утку","По косой"],e:"Поэтому косую бейку используют для горловины и окантовки."},uz:{q:"Mato qaysi yo'nalishda eng ko'p cho'ziladi?",o:["Bo'ylama","Ko'ndalang","Qiyiq"],e:"Shuning uchun qiyiq bey bo'yin va chetlarni yopishda ishlatiladi."}},
  {a:1,ru:{q:"Зачем декатировать хлопок перед кроем?",o:["Чтобы был ярче","Чтобы ткань села до шитья","Это не нужно"],e:"Иначе готовое изделие сядет после первой стирки."},uz:{q:"Paxtani bichishdan oldin nima uchun dekatirovka qilinadi?",o:["Yorqinroq bo'lishi uchun","Mato tikishdan oldin kirishishi uchun","Kerak emas"],e:"Aks holda tayyor buyum birinchi yuvishda kirishadi."}},
  {a:1,ru:{q:"Какая ткань лучше всего для первого изделия?",o:["Шёлк","Плотный однотонный хлопок","Тонкий трикотаж"],e:"Он не скользит и легко шьётся."},uz:{q:"Birinchi buyum uchun qaysi mato eng yaxshi?",o:["Ipak","Zich bir rangli paxta","Yupqa trikotaj"],e:"U sirpanmaydi va oson tikiladi."}}]},

 steps:{ru:["Поднимите лапку — так открываются тарелочки натяжения, и нить ложится правильно.","Заправьте верхнюю нить по цифрам на корпусе: катушка → нитенаправитель → натяжение → нитепритягиватель (в верхнем положении) → игла.","Иглу заправляют с той стороны, где у неё длинный желобок (в бытовых машинах — спереди назад).","Вставьте шпульку, вытяните нижнюю нить: поверните маховик на себя, игла захватит её петлёй.","Начало и конец строчки закрепляют: 3–4 стежка назад. Сметочную строчку не закрепляют.","Проверьте строчку на двух слоях лоскута: переплетение нитей должно быть в середине, петель сверху и снизу нет."],
       uz:["Tovonchani ko'taring — shunda taranglik plastinkalari ochiladi va ip to'g'ri tushadi.","Yuqori ipni korpusdagi raqamlar bo'yicha o'tkazing: g'altak → yo'naltirgich → taranglik → ip tortgich (yuqori holatda) → igna.","Ignaga ip uzun ariqcha tomonidan o'tkaziladi (maishiy mashinalarda — oldindan orqaga).","Shpulkani qo'ying, pastki ipni chiqaring: maxovikni o'zingizga aylantiring, igna uni halqa bilan ilib oladi.","Chokning boshi va oxiri mahkamlanadi: 3–4 qadam orqaga. Vaqtinchalik chok mahkamlanmaydi.","Chokni ikki qavat bo'lakda sinang: iplar o'rtada chatishsin, ustida va ostida halqalar bo'lmasin."]},
 tip:{ru:"Петли снизу — почти всегда виновата верхняя нить: перезаправьте её при поднятой лапке. Иглу меняйте каждые 8 часов шитья или после каждого изделия из джинсы.",uz:"Pastda halqalar — deyarli doim yuqori ip aybdor: uni tovoncha ko'tarilgan holda qayta o'tkazing. Ignani har 8 soat tikishda yoki har bir jinsi buyumdan keyin almashtiring."},
 quiz:[
  {a:0,ru:{q:"Почему верхнюю нить заправляют при поднятой лапке?",o:["Открыты тарелочки натяжения","Так быстрее","Без разницы"],e:"При опущенной лапке нить не попадёт в натяжение — будут петли."},uz:{q:"Nega yuqori ip tovoncha ko'tarilganda o'tkaziladi?",o:["Taranglik plastinkalari ochiq bo'ladi","Tezroq","Farqi yo'q"],e:"Tovoncha tushirilganda ip tarangligiga tushmaydi — halqalar bo'ladi."}},
  {a:2,ru:{q:"Какая игла для джинсы?",o:["№ 60","№ 80","№ 100–110 Jeans"],e:"Тонкая игла на плотной ткани гнётся и ломается."},uz:{q:"Jinsi uchun qaysi igna?",o:["№ 60","№ 80","№ 100–110 Jeans"],e:"Zich matoda ingichka igna egiladi va sinadi."}},
  {a:1,ru:{q:"Снизу ткани появились петли. Что проверить первым?",o:["Шпульку выбросить","Заправку верхней нити","Купить новую машину"],e:"Чаще всего нить выскочила из натяжения."},uz:{q:"Mato ostida halqalar paydo bo'ldi. Avval nimani tekshirish kerak?",o:["Shpulkani tashlash","Yuqori ip o'tkazilishini","Yangi mashina olish"],e:"Ko'pincha ip tarangligidan chiqib ketgan bo'ladi."}},

 steps:{ru:["Сложите детали лицом к лицу, сравняйте срезы и сколите булавками поперёк.","Шейте по линии, ширина припуска обычно 1–1,5 см. Ориентир — линейка на игольной пластине.","Закрепите начало и конец строчки.","Обработайте срезы: оверлок, зигзаг по краю или подгибка. Без обработки ткань сыплется.","Каждый шов сразу приутюжьте: сначала как сшили, потом разутюжьте или заутюжьте.","Правило мастеров: «Прошила — прогладила». Утюг даёт половину красоты изделия."],
       uz:["Detallarni yuzma-yuz qo'ying, qirqimlarni tenglang va ko'ndalang to'g'nang.","Chiziq bo'yicha tiking, qo'shimcha kengligi odatda 1–1,5 sm. Mo'ljal — igna plastinkasidagi chizg'ich.","Chokning boshi va oxirini mahkamlang.","Qirqimlarni ishlang: overlok, chet bo'yicha zigzag yoki bukish. Ishlanmasa mato titiladi.","Har bir chokni darhol dazmollang: avval tikilgandek, keyin yoyib yoki bir tomonga.","Ustalar qoidasi: «Tikding — dazmolla». Buyum chiroyining yarmini dazmol beradi."]},

  ru:[["Ширина сетки","Сб + Пб = ОБ/2 + 1","48 + 1 = 49 см"],["Длина","Ди","60 см"],["Линия бёдер","18–20 см вниз от талии","19 см"],["Заднее полотнище","(Сб + Пб) / 2 − 1","23,5 см"],["Переднее полотнище","(Сб + Пб) / 2 + 1","25,5 см"],["Сумма вытачек Σ","(Сб + Пб) − (Ст + Пт), Пт = 0,5","49 − 35,5 = 13,5 см"],["Раствор: бок / зад / перед","0,5 Σ / 0,35 Σ / 0,15 Σ","6,75 / 4,7 / 2 см"],["Длина вытачек","зад 14–16 см, перед 8–10 см","15 / 9 см"]],
  uz:[["To'r kengligi","Ys + Qs = SA/2 + 1","48 + 1 = 49 sm"],["Uzunlik","BU","60 sm"],["Son chizig'i","Beldan 18–20 sm pastga","19 sm"],["Orqa bo'lak","(Ys + Qs) / 2 − 1","23,5 sm"],["Old bo'lak","(Ys + Qs) / 2 + 1","25,5 sm"],["Vitachkalar yig'indisi Σ","(Ys + Qs) − (Yb + Qb), Qb = 0,5","49 − 35,5 = 13,5 sm"],["Ochilishi: yon / orqa / old","0,5 Σ / 0,35 Σ / 0,15 Σ","6,75 / 4,7 / 2 sm"],["Vitachka uzunligi","orqa 14–16 sm, old 8–10 sm","15 / 9 sm"]]}},
 steps:{ru:["На бумаге постройте прямоугольник: ширина Сб + Пб, высота — длина юбки Ди.","Проведите линию бёдер на 18–20 см ниже линии талии.","Отложите от левого края ширину заднего полотнища и проведите вертикаль — это бок.","Посчитайте сумму вытачек Σ. Половину уберите в боковом шве (по 1/2 раствора на каждую сторону от бока), остальное — в вытачки сзади и спереди.","Боковой шов от талии до бёдер оформите плавной выпуклой линией по лекалу. Талию на боку поднимите на 1–1,5 см.","Вырежьте выкройку, подпишите детали, «сгиб» на середине переда и стрелку долевой нити."],
       uz:["Qog'ozda to'rtburchak chizing: kengligi Ys + Qs, balandligi — yubka uzunligi BU.","Bel chizig'idan 18–20 sm pastda son chizig'ini o'tkazing.","Chap chetdan orqa bo'lak kengligini o'lchab, vertikal o'tkazing — bu yon chok.","Vitachkalar yig'indisi Σ ni hisoblang. Yarmini yon chokka (yondan har tomonga ochilishning 1/2 qismi), qolganini orqa va old vitachkalarga bering.","Beldan songacha yon chokni lekalo bo'yicha silliq bo'rtiq chiziq bilan chizing. Yonda belni 1–1,5 sm ko'taring.","Andozani qirqing, detallarni yozing, old o'rtasiga «buklam» va bo'ylama ip strelkasini qo'ying."]},
 tip:{ru:"Калькулятор «Чертёж прямой юбки» сам посчитает все размеры по вашим меркам — откройте его и сверьте со своим чертежом.",uz:"«To'g'ri yubka chizmasi» kalkulyatori o'lchovlaringiz bo'yicha barcha o'lchamlarni o'zi hisoblaydi — oching va chizmangiz bilan solishtiring."},

 steps:{ru:["Сложите ткань лицом внутрь, кромка к кромке. Сгиб — сверху, кромки — снизу.","Сначала разложите крупные детали, потом мелкие в промежутки. Детали «на сгиб» прикладывают серединой к сгибу.","Проверьте долевую: расстояние от стрелки до кромки должно быть одинаковым на обоих концах стрелки.","Приколите выкройку булавками, обведите мелом контур, затем отложите припуски и проведите вторую линию.","Перенесите контрольные знаки: вытачки, надсечки для совмещения, линию талии. Надсечки — не глубже 0,5 см.","Режьте длинными движениями по линии припуска, не поднимая ткань со стола."],
       uz:["Matoni yuzini ichkariga qilib, chetni chetga qo'yib buklang. Buklam — tepada, chetlar — pastda.","Avval katta detallarni, keyin mayda detallarni bo'shliqlarga joylang. «Buklamga» detallar o'rtasi bilan buklamga qo'yiladi.","Bo'ylama ipni tekshiring: strelkadan chetgacha masofa strelkaning ikki uchida bir xil bo'lsin.","Andozani to'g'nang, bo'r bilan kontur chizing, keyin qo'shimchalarni o'lchab ikkinchi chiziq o'tkazing.","Nazorat belgilarini o'tkazing: vitachkalar, moslash uchun kertiklar, bel chizig'i. Kertik — 0,5 sm dan chuqur emas.","Matoni stoldan ko'tarmasdan qo'shimcha chizig'i bo'yicha uzun harakatlar bilan kesing."]},
 tip:{ru:"Сначала разложите все детали без резки и измерьте, сколько ткани ушло. Так заранее видно, хватит ли куска, и можно сэкономить 10–20 см.",uz:"Avval barcha detallarni kesmasdan joylang va qancha mato ketganini o'lchang. Shunda bo'lak yetishi oldindan ko'rinadi va 10–20 sm tejash mumkin."},
 calc:true,
 quiz:[
  {a:0,ru:{q:"Как раскладывают деталь «на сгиб»?",o:["Серединой к сгибу ткани","Серединой к кромке","Как удобнее"],e:"Получается одна цельная симметричная деталь."},uz:{q:"«Buklamga» detal qanday joylanadi?",o:["O'rtasi bilan mato buklamiga","O'rtasi bilan chetga","Qanday qulay bo'lsa"],e:"Bitta yaxlit simmetrik detal chiqadi."}},
  {a:2,ru:{q:"Какой припуск на низ юбки?",o:["0,5 см","1 см","3–4 см"],e:"Подгибка низа шире, чем у швов."},uz:{q:"Yubka etagiga qancha qo'shimcha?",o:["0,5 sm","1 sm","3–4 sm"],e:"Etak bukmasi choklarnikidan kengroq."}},

 table:{head:{ru:["Узел","Как сделать аккуратно"],uz:["Tugun","Qanday ozoda qilish"]},rows:{
  ru:[["Вытачка","Шить от широкой части к острию, последние 1–2 см — по самому сгибу. Нитки у острия завязать узелком, не закреплять назад"],["Потайная молния","Нужна специальная лапка. Вшивают до сшивания шва, строчка вплотную к зубцам"],["Пояс","Дублерин приклеить утюгом на всю деталь — пояс не мнётся и не тянется"],["Подгибка низа","Подогнуть 0,7–1 см, затем 3 см. Пришить потайными стежками или машинной строчкой"],["ВТО (глажка)","Вытачки заутюжить к середине, шов разутюжить, низ отпарить через проутюжильник"]],
  uz:[["Vitachka","Keng qismidan uchiga qarab tiking, oxirgi 1–2 sm — aynan buklam bo'yicha. Uchidagi iplarni tugun bilan bog'lang, orqaga mahkamlamang"],["Yashirin molniya","Maxsus tovoncha kerak. Chok tikilishidan oldin, chok tishlarga yaqin tikiladi"],["Kamar","Dublerinni butun detalga dazmolda yopishtiring — kamar g'ijimlanmaydi va cho'zilmaydi"],["Etakni bukish","0,7–1 sm, keyin 3 sm buking. Yashirin qo'l chok yoki mashina choki bilan tiking"],["Dazmollash","Vitachkalarni o'rtaga dazmollang, chokni yoying, etakni latta orqali bug'lang"]]}},
 steps:{ru:["Перенесите вытачки на ткань, сколите и простройте. Приутюжьте: задние и передние — к середине.","Обработайте оверлоком боковые срезы и средний шов сзади.","Вшейте потайную молнию в средний шов спинки, затем стачайте шов ниже молнии.","Сметайте боковые швы и примерьте юбку (урок «Примерка»). После исправлений — стачайте.","Продублируйте пояс, пришейте к юбке, обработайте концы, сделайте петлю и пуговицу или крючок.","Наметьте длину на клиентке, подогните низ и проведите окончательную ВТО всего изделия."],
       uz:["Vitachkalarni matoga o'tkazing, to'g'nang va tiking. Dazmollang: orqa va old vitachkalar — o'rtaga.","Yon qirqimlar va orqa o'rta chokni overlok bilan ishlang.","Orqaning o'rta chokiga yashirin molniyani tiking, keyin molniyadan pastki chokni tiking.","Yon choklarni vaqtinchalik tiking va yubkani kiydirib ko'ring («Kiyib ko'rish» darsi). Tuzatishdan keyin — tiking.","Kamarni dublerinlang, yubkaga tiking, uchlarini ishlang, ilgak-tugma yoki ilmoq qiling.","Uzunlikni mijozda belgilang, etakni buking va butun buyumni yakuniy dazmollang."]},
 tip:{ru:"Не сшивайте боковые швы начисто до примерки: в них — главный запас на подгонку. Именно поэтому припуск на бок 1,5–2 см.",uz:"Kiyib ko'rmasdan yon choklarni yakuniy tikmang: ularda moslash uchun asosiy zaxira bor. Shuning uchun yon qo'shimcha 1,5–2 sm."},
 quiz:[
  {a:1,ru:{q:"Как шить вытачку?",o:["От острия к широкой части","От широкой части к острию","С двух концов к середине"],e:"Тогда острие получается плавным, без «пузыря»."},uz:{q:"Vitachka qanday tikiladi?",o:["Uchidan keng qismiga","Keng qismidan uchiga","Ikki uchidan o'rtaga"],e:"Shunda uchi silliq chiqadi, «pufak» bo'lmaydi."}},
  {a:0,ru:{q:"Когда вшивают потайную молнию?",o:["До сшивания шва","После всех швов","После пояса"],e:"Её вшивают в открытый шов, потом стачивают шов ниже."},uz:{q:"Yashirin molniya qachon tikiladi?",o:["Chok tikilishidan oldin","Barcha choklardan keyin","Kamardan keyin"],e:"U ochiq chokka tikiladi, keyin pastki chok tikiladi."}},
  {a:2,ru:{q:"Зачем дублерин на поясе?",o:["Для цвета","Чтобы был мягче","Чтобы не мялся и не тянулся"],e:"Клеевой дублерин держит форму пояса."},uz:{q:"Kamarga dublerin nima uchun?",o:["Rang uchun","Yumshoqroq bo'lishi uchun","G'ijimlanmasligi va cho'zilmasligi uchun"],e:"Yelimli dublerin kamar shaklini ushlaydi."}},
  {a:1,ru:{q:"Что делают перед окончательным стачиванием боков?",o:["Режут пояс","Примерку","Стирают изделие"],e:"Боковые швы — запас на подгонку по фигуре."},uz:{q:"Yonlarni yakuniy tikishdan oldin nima qilinadi?",o:["Kamar kesiladi","Kiyib ko'rish","Buyum yuviladi"],e:"Yon choklar — qomatga moslash zaxirasi."}}]},

 steps:{ru:["Первая примерка — изделие сметано на крупный стежок, молния вшита или припуск заколот булавками.","Клиентка стоит прямо, перед зеркалом, в своей обуви. Сначала смотрите спереди, потом сбоку и сзади.","Ищите складки: они «показывают» на место, где тесно (тянущие) или где лишнее (висящие).","Все исправления делайте симметрично на обеих сторонах, если фигура симметрична. Отмечайте мелом или булавками.","Попросите клиентку сесть и сделать шаг — юбка не должна задираться и врезаться.","Перенесите изменения на выкройку, чтобы следующее изделие этой клиентке сидело сразу."],
       uz:["Birinchi kiyib ko'rish — buyum katta qadam bilan vaqtinchalik tikilgan, molniya tikilgan yoki qo'shimcha to'g'nalgan.","Mijoz oyna oldida, o'z poyabzalida to'g'ri turadi. Avval oldidan, keyin yon va orqadan qarang.","Burmalarni qidiring: ular tor joyni (tortuvchi) yoki ortiqcha joyni (osilgan) «ko'rsatadi».","Qomat simmetrik bo'lsa, barcha tuzatishlarni ikki tomonda bir xil qiling. Bo'r yoki to'g'nag'ich bilan belgilang.","Mijozdan o'tirib, qadam tashlashni so'rang — yubka ko'tarilmasin va botmasin.","O'zgarishlarni andozaga o'tkazing, shunda bu mijozga keyingi buyum darhol mos keladi."]},
 tip:{ru:"Складка всегда «указывает» на проблему: тянущая складка идёт к месту, где не хватает ткани, висящая — показывает лишнее.",uz:"Burma doim muammoni «ko'rsatadi»: tortuvchi burma mato yetmagan joyga boradi, osilgan burma — ortiqchani ko'rsatadi."},

  uz:[["Yon chokka","Klassik ko'ylak, bluzka — vitachka deyarli ko'rinmaydi"],["Bel chizig'iga","Belga mos lif, yig'ma bilan almashtirish mumkin"],["Relyefga (yelka yoki o'mizlikdan)","Relyeflar — ozg'in ko'rsatadi va qomatga yaxshi o'tiradi"],["Bo'yin o'ymasiga","Bo'yin yonida yig'ma yoki burmalar — bayramona model"],["Ikkiga bo'lish","Ikki kichik vitachka — to'liq ko'krakda yumshoq siluet"]]}},
 steps:{ru:["Основу лифа строят по меркам ОГ, ДТС, Шп, ширине спины и груди, высоте груди. Нагрудная вытачка забирает разницу между грудью и плечом.","Отметьте на выкройке центр груди — от него идут все вытачки.","Наметьте новое положение вытачки (например, на боку на 5–7 см ниже проймы) и проведите линию до центра груди.","Разрежьте по новой линии до центра, закройте старую вытачку — новая раскроется сама.","Острие вытачки не доводите до центра груди на 2–3 см, иначе будет «пузырь».","Обведите новую выкройку, сгладьте линии и подпишите. Старую основу сохраните — она база для всех моделей."],
       uz:["Lif asosi KA, OBU, Ye, orqa va ko'krak kengligi, ko'krak balandligi o'lchovlari bo'yicha chiziladi. Ko'krak vitachkasi ko'krak va yelka orasidagi farqni oladi.","Andozada ko'krak markazini belgilang — barcha vitachkalar undan chiqadi.","Vitachkaning yangi joyini belgilang (masalan, yonda o'mizlikdan 5–7 sm pastda) va ko'krak markazigacha chiziq o'tkazing.","Yangi chiziq bo'yicha markazgacha qirqing, eski vitachkani yoping — yangisi o'zi ochiladi.","Vitachka uchini ko'krak markaziga 2–3 sm yetkazmang, aks holda «pufak» bo'ladi.","Yangi andozani chizib oling, chiziqlarni silliqlang va yozing. Eski asosni saqlang — u barcha modellar uchun baza."]},
 tip:{ru:"Модельер не строит каждую модель с нуля: берёт проверенную основу клиентки и переводит вытачки, добавляет рельефы, складки и сборки.",uz:"Modelyer har bir modelni noldan chizmaydi: mijozning sinalgan asosini olib, vitachkalarni ko'chiradi, relyef, burma va yig'malar qo'shadi."},
 quiz:[
  {a:1,ru:{q:"Вокруг какой точки переводят нагрудную вытачку?",o:["Плечевой точки","Центра груди","Талии на боку"],e:"Все нагрудные вытачки направлены к центру груди."},uz:{q:"Ko'krak vitachkasi qaysi nuqta atrofida ko'chiriladi?",o:["Yelka nuqtasi","Ko'krak markazi","Yondagi bel"],e:"Barcha ko'krak vitachkalari ko'krak markaziga yo'nalgan."}},
  {a:0,ru:{q:"Меняется ли раствор вытачки при переводе?",o:["Нет, объём тот же","Да, в 2 раза","Всегда уменьшается"],e:"Меняется только место, а не объём."},uz:{q:"Ko'chirishda vitachka ochilishi o'zgaradimi?",o:["Yo'q, hajm o'sha","Ha, 2 marta","Doim kamayadi"],e:"Faqat joyi o'zgaradi, hajmi emas."}},
  {a:2,ru:{q:"Насколько не доводят острие до центра груди?",o:["Доводят точно","10 см","2–3 см"],e:"Иначе на груди будет острый «пузырь»."},uz:{q:"Vitachka uchi ko'krak markaziga qancha yetkazilmaydi?",o:["Aniq yetkaziladi","10 sm","2–3 sm"],e:"Aks holda ko'krakda o'tkir «pufak» bo'ladi."}},
  {a:1,ru:{q:"Что получится, если перевести вытачку в рельеф?",o:["Юбка-солнце","Приталенный силуэт, который стройнит","Рукав-фонарик"],e:"Рельефы — популярный приём для платьев и жакетов."},uz:{q:"Vitachka relyefga ko'chirilsa nima chiqadi?",o:["Quyosh yubka","Ozg'in ko'rsatuvchi belga mos siluet","Fonar yeng"],e:"Relyeflar — ko'ylak va jaketlar uchun ommabop usul."}}]},

  tx(180,200,R(l,'R — радиус талии (вырез в центре)','R — bel radiusi (markazdagi o\'yma)'),{s:11,w:600})+tx(180,218,R(l,'Ди — длина юбки, откладывают от выреза','BU — yubka uzunligi, o\'ymadan o\'lchanadi'),{s:11})+tx(180,236,R(l,'Чем больше круг, тем больше волн и ткани','Doira qancha katta bo\'lsa, to\'lqin va mato shuncha ko\'p'),{s:10,c:MU}),

 table:{head:{ru:["Юбка","Радиус талии R","Пример ОТ 68"],uz:["Yubka","Bel radiusi R","Misol BA 68"]},rows:{
  ru:[["Клёш в четверть круга","2 · ОТ / π ≈ ОТ × 0,637","43,3 см"],["Полусолнце","ОТ / π ≈ ОТ × 0,318","21,6 см"],["Солнце (полный круг)","ОТ / 2π ≈ ОТ × 0,159","10,8 см"],["Двойное солнце","ОТ / 4π ≈ ОТ × 0,08","5,4 см"]],
  uz:[["Chorak doira klyosh","2 · BA / π ≈ BA × 0,637","43,3 sm"],["Yarim quyosh","BA / π ≈ BA × 0,318","21,6 sm"],["Quyosh (to'liq doira)","BA / 2π ≈ BA × 0,159","10,8 sm"],["Qo'sh quyosh","BA / 4π ≈ BA × 0,08","5,4 sm"]]}},
 steps:{ru:["Посчитайте радиус R по таблице или в калькуляторе. Из ОТ можно вычесть 1–2 см: срез талии по косой немного растянется.","Сложите ткань (для солнца — вчетверо, для полусолнца — вдвое) и от угла сгиба отметьте дугу радиусом R.","От этой дуги отложите длину юбки Ди + 2 см на подгибку и проведите вторую дугу.","Если ширины ткани не хватает, юбку кроят из 2–4 клиньев со швами — это нормально.","Перед подгибкой повесьте юбку на сутки: косые участки вытянутся, потом выровняйте низ.","Низ клёша подшивают узко (0,5–1 см) — широкая подгибка на дуге не ляжет ровно."],
       uz:["R radiusini jadval yoki kalkulyatorda hisoblang. BA dan 1–2 sm ayirish mumkin: qiyiq bel qirqimi biroz cho'ziladi.","Matoni buklang (quyosh uchun — to'rt buklab, yarim quyosh uchun — ikki buklab) va buklam burchagidan R radiusli yoy belgilang.","Bu yoydan yubka uzunligi BU + etak uchun 2 sm o'lchab, ikkinchi yoyni o'tkazing.","Mato kengligi yetmasa, yubka 2–4 ta xanjardan choklar bilan bichiladi — bu normal.","Etakni bukishdan oldin yubkani bir kecha-kunduz osib qo'ying: qiyiq joylari cho'ziladi, keyin etakni tekislang.","Klyosh etagi ingichka bukiladi (0,5–1 sm) — yoyda keng bukma tekis yotmaydi."]},
 tip:{ru:"Солнце длиной 60 см и ОТ 68 даёт круг около 1,4 м в диаметре — почти вся ширина ткани 150 см. Длиннее — уже со швами или из двух полусолнц.",uz:"60 sm uzunlik va BA 68 dagi quyosh diametri taxminan 1,4 m doira beradi — 150 sm matoning deyarli butun kengligi. Uzunrog'i — choklar bilan yoki ikki yarim quyoshdan."},
 calc:true,
 quiz:[
  {a:2,ru:{q:"Формула радиуса талии для юбки-солнце?",o:["ОТ / π","2 · ОТ / π","ОТ / 2π"],e:"Окружность выреза = ОТ, значит R = ОТ / 2π."},uz:{q:"Quyosh yubka uchun bel radiusi formulasi?",o:["BA / π","2 · BA / π","BA / 2π"],e:"O'yma aylanasi = BA, demak R = BA / 2π."}},
  {a:0,ru:{q:"ОТ = 63 см. Примерный радиус для полусолнца?",o:["20 см","10 см","40 см"],e:"63 / 3,14 ≈ 20 см."},uz:{q:"BA = 63 sm. Yarim quyosh uchun taxminiy radius?",o:["20 sm","10 sm","40 sm"],e:"63 / 3,14 ≈ 20 sm."}},
  {a:1,ru:{q:"Зачем вешать юбку клёш на сутки перед подгибкой?",o:["Чтобы проветрить","Косые участки вытянутся, потом ровняют низ","Так требует ткань"],e:"Иначе низ станет неровным после носки."},uz:{q:"Klyosh yubka etagini bukishdan oldin nima uchun bir kun osiladi?",o:["Shamollatish uchun","Qiyiq joylar cho'ziladi, keyin etak tekislanadi","Mato shuni talab qiladi"],e:"Aks holda kiygandan keyin etak notekis bo'ladi."}},
  {a:2,ru:{q:"Какая подгибка низа у клёша?",o:["5 см","3–4 см","Узкая 0,5–1 см"],e:"На дуге широкая подгибка морщит."},uz:{q:"Klyosh etagi qanday bukiladi?",o:["5 sm","3–4 sm","Ingichka 0,5–1 sm"],e:"Yoyda keng bukma burishadi."}}]},

 table:{head:{ru:["Приём","Как работает"],uz:["Usul","Qanday ishlaydi"]},rows:{
  ru:[["Вертикальные линии","Рельефы, планка, длинные бусы — вытягивают и стройнят"],["Горизонтальные линии","Широкий пояс, кокетка, полоска поперёк — расширяют"],["Тёмный и матовый цвет","Уменьшает объём — для низа или проблемной зоны"],["Светлый, яркий, блестящий","Привлекает взгляд и добавляет объём"],["Пропорция 1 : 1,6 (золотое сечение)","Блузка и юбка не одинаковой длины — так гармоничнее"],["Один акцент","Яркий цвет, вышивка или рукав — что-то одно, остальное спокойнее"]],
  uz:[["Vertikal chiziqlar","Relyef, planka, uzun munchoq — cho'zadi va ozg'in ko'rsatadi"],["Gorizontal chiziqlar","Keng kamar, koketka, ko'ndalang yo'l — kengaytiradi"],["To'q va xira rang","Hajmni kamaytiradi — pastki qism yoki muammoli joy uchun"],["Och, yorqin, yaltiroq","Nigohni tortadi va hajm qo'shadi"],["1 : 1,6 nisbat (oltin kesim)","Bluzka va yubka bir xil uzunlikda emas — shunday uyg'unroq"],["Bitta urg'u","Yorqin rang, kashta yoki yeng — bittasi, qolgani tinchroq"]]}},
 steps:{ru:["Начните с идеи: для кого, по какому поводу, в какое время года. Соберите мудборд — 10–20 фото: модели, ткани, цвета.","Нарисуйте фигуру-шаблон («фигурина» 8–9 голов в высоту) и на ней 3–5 быстрых эскизов. Не бойтесь некрасивых — это поиск.","Выберите силуэт под фигуру клиентки: X подчёркивает талию, A скрывает широкие бёдра, H — для спортивной фигуры.","Подберите 2–3 цвета: один основной, один дополнительный, один акцент.","Сделайте технический эскиз спереди и сзади: швы, вытачки, застёжка, карманы. По нему потом строят выкройку.","Узбекские мотивы — икат (адрас, атлас), сюзане, вышивка — делают модель узнаваемой. Используйте их как акцент."],
       uz:["G'oyadan boshlang: kim uchun, qaysi munosabat bilan, yilning qaysi faslida. Mudbord to'plang — 10–20 ta rasm: modellar, matolar, ranglar.","Andoza qomat («figurina» 8–9 bosh balandlikda) chizing va unda 3–5 ta tez eskiz qiling. Chiroysizidan qo'rqmang — bu izlanish.","Mijoz qomatiga siluet tanlang: X belni ta'kidlaydi, A keng sonni yashiradi, H — sport qomat uchun.","2–3 rang tanlang: bitta asosiy, bitta qo'shimcha, bitta urg'u.","Old va orqadan texnik eskiz qiling: choklar, vitachkalar, ilgak, cho'ntaklar. Keyin u bo'yicha andoza chiziladi.","O'zbek naqshlari — ikat (adras, atlas), so'zana, kashta — modelni taniqli qiladi. Ularni urg'u sifatida ishlating."]},
 tip:{ru:"Сохраняйте все эскизы и фото готовых работ в одну папку. Через полгода это ваше портфолио для Instagram и Telegram-канала.",uz:"Barcha eskiz va tayyor ishlar rasmlarini bitta papkada saqlang. Yarim yildan keyin bu Instagram va Telegram kanal uchun portfoliongiz."},
 quiz:[
  {a:2,ru:{q:"Какой силуэт скрывает широкие бёдра?",o:["H — прямой","O — овал","A — трапеция"],e:"Трапеция расширяется книзу и уравновешивает бёдра."},uz:{q:"Qaysi siluet keng sonni yashiradi?",o:["H — to'g'ri","O — oval","A — trapetsiya"],e:"Trapetsiya pastga kengayadi va sonni muvozanatlaydi."}},
  {a:0,ru:{q:"Что зрительно стройнит?",o:["Вертикальные линии","Широкий яркий пояс","Горизонтальная полоска"],e:"Вертикали вытягивают фигуру."},uz:{q:"Nima ko'rinishda ozg'in qiladi?",o:["Vertikal chiziqlar","Keng yorqin kamar","Gorizontal yo'l"],e:"Vertikallar qomatni cho'zadi."}},
  {a:1,ru:{q:"Сколько ярких акцентов лучше в одной модели?",o:["Чем больше, тем лучше","Один","Ни одного"],e:"Один акцент — остальное спокойнее."},uz:{q:"Bitta modelda nechta yorqin urg'u yaxshi?",o:["Qancha ko'p, shuncha yaxshi","Bitta","Hech qancha"],e:"Bitta urg'u — qolgani tinchroq."}},
  {a:1,ru:{q:"Зачем технический эскиз?",o:["Для Instagram","Чтобы по нему построить выкройку: швы, вытачки, застёжка","Не нужен"],e:"Это «чертёж» модели для работы."},uz:{q:"Texnik eskiz nima uchun?",o:["Instagram uchun","U bo'yicha andoza chizish uchun: choklar, vitachkalar, ilgak","Kerak emas"],e:"Bu ish uchun modelning «chizmasi»."}}]},

  ru:[["Приём заказа","Эскиз или фото модели, ткань, мерки, срок, цена — всё записать"],["Предоплата","30–50 % — на ткань и фурнитуру, клиентка не передумает"],["Примерки","1–2 примерки, договориться о дате заранее"],["Сдача","Изделие отглажено, на плечиках, в чехле или пакете"],["После","Попросить отзыв и разрешение на фото для портфолио"]],

 steps:{ru:["Посчитайте свою ставку в час: сколько хотите зарабатывать в месяц ÷ сколько часов реально шьёте.","Засекайте время на каждом изделии хотя бы первые 2–3 раза — так вы узнаете реальные часы.","Цену называйте после того, как увидели модель и ткань. Шёлк, клетка, подклад и срочность — дороже.","Начните с простого: подшить брюки, заменить молнию, ушить платье. Ремонт одежды даёт постоянный поток клиентов.","Ведите Telegram-канал или Instagram: «до/после», процесс, готовые работы. Клиенты приходят по фото.","Сарафанное радио — главная реклама: аккуратная работа в срок приводит подруг и родственниц клиентки."],
       uz:["Soatlik stavkangizni hisoblang: oyiga qancha topmoqchisiz ÷ haqiqatda necha soat tikasiz.","Kamida birinchi 2–3 marta har bir buyumga ketgan vaqtni o'lchang — shunda haqiqiy soatlarni bilasiz.","Narxni model va matoni ko'rgandan keyin ayting. Ipak, katak, astar va shoshilinchlik — qimmatroq.","Oddiydan boshlang: shim etagini bukish, molniyani almashtirish, ko'ylakni toraytirish. Kiyim ta'miri doimiy mijoz oqimini beradi.","Telegram kanal yoki Instagram yuriting: «oldin/keyin», jarayon, tayyor ishlar. Mijozlar rasm bo'yicha keladi.","Og'zaki reklama — asosiy reklama: muddatida ozoda ish mijozning dugonalari va qarindoshlarini olib keladi."]},

const fmt=(n,d=0)=>n.toFixed(d).replace('.',',').replace('-','−');
const numv=v=>+String(v).replace(',','.')||0;
const seg=(k,opts)=>`<div class="seg" role="group">${opts.map((o,i)=>`<button type="button" data-seg="${k}" data-v="${i}" aria-pressed="${S.calc[k]===i}">${o}</button>`).join('')}</div>`;

const cell=(t,v)=>`<div><span>${t}</span><b>${v}</b></div>`;
const WID=[90,110,140,150];
function calcBlock(){const L=U();const c=S.calc;const wl=WID.map(w=>w+'');

  <div class="out" id="out4"></div><p class="expl">${L.pNote}</p></div>`}
const LET={40:'XXS',42:'XS',44:'S',46:'M',48:'L',50:'XL',52:'2XL',54:'3XL',56:'4XL',58:'5XL',60:'6XL'};
const sz=v=>v>0?Math.round(v/4)*2:0;
const meters=cmv=>`${fmt(Math.ceil(cmv/10)/10,1)} ${U().m}`;
function paintCalc(){const L=U();const c=S.calc;const cm=' '+L.cm;
  // 1. size: RU size = half chest girth rounded to even; bottom by hips (ОБ 96 ↔ 44)
  const og=numv(c.og),ob=numv(c.ob),h=numv(c.h);
  const top=sz(og),bot=ob>0?Math.round((ob-8)/4)*2:0;
  const hg=h>0?[146,152,158,164,170,176,182].reduce((a,b)=>Math.abs(b-h)<Math.abs(a-h)?b:a):0;
  $('#out1').innerHTML=cell(L.zTop,top||'—')+cell(L.zBot,bot||'—')+cell(L.zH,hg||'—')+cell(L.zInt,(LET[top]||'—')+' / '+(LET[bot]||'—'))+cell(L.zEu,(top?top-6:'—')+' / '+(bot?bot-6:'—'))+cell(L.zSg,og?fmt(og/2,1):'—');
  $('#zn').textContent=top&&bot?L.zNote(top,bot):'';
  // 2. straight skirt draft
  const st=numv(c.sot)/2,sb=numv(c.sob)/2,w=sb+1,sum=Math.max(0,w-(st+0.5));
  $('#out2').innerHTML=cell(L.kW,fmt(w,1))+cell(L.kB,fmt(w/2-1,1))+cell(L.kF,fmt(w/2+1,1))+cell(L.kS,fmt(sum,1))+cell(L.kSide,fmt(sum*0.5,1))+cell(L.kDB,fmt(sum*0.35,1)+' / '+fmt(sum*0.15,1));
  // 3. circle skirt: R by type, outer radius, fabric length on width W
  const ot=numv(c.fot),len=numv(c.fl),W=WID[c.fw];
  const R=ot>0?[2*ot/Math.PI,ot/Math.PI,ot/(2*Math.PI)][c.ft]:0;const Ro=R+len+2;
  let need=0;
  if(Ro>0){if(c.ft===0)need=Ro<=W?Ro:0;
    else if(c.ft===1)need=2*Ro<=W?Ro:Ro<=W?2*Ro:0;
    else need=2*Ro<=W?2*Ro:Ro<=W?2*Ro+Math.sqrt(4*Ro*Ro-W*W):0;}
  $('#out3').innerHTML=cell(L.fR,R?fmt(R,1):'—')+cell(L.fRo,Ro>2?fmt(Ro,1):'—')+cell(L.fBuy,need?meters(need+5):(Ro>2?L.fNo:'—'));
  // 4. fabric consumption for straight-cut garments
  const t=c.pt,pl=numv(c.pl),pr=numv(c.pr),g=numv(c.pob),Wp=WID[c.pw];
  let n=0,body=0,slv=0;
  if(pl>0&&g>0){
    n=Math.ceil((g+(t===1?44:t===0?12:14))/Wp);
    body=n*(pl+(t===1?8:6));
    slv=t>=2&&pr>0?pr+8:0;
  }
  const extra=t===0||t===1?10:15;const tot=body?body+slv+extra:0;
  $('#out4').innerHTML=cell(L.pPieces,n?'× '+n:'—')+cell(L.pSlv,slv?fmt(slv)+cm:'—')+cell(L.pBuy,tot?meters(tot):'—');
}

  document.querySelectorAll('[data-seg]').forEach(b=>b.onclick=()=>{const k=b.dataset.seg;S.calc[k]=+b.dataset.v;

 exPass:g=>`Tabriklaymiz! Siz «${gname(g,'uz')}» darajasidan o\'tdingiz.`,exFail:(k,n)=>`${n} tadan ${k} ta to\'g\'ri javob kerak. Darslarni takrorlang va yana urinib ko\'ring.`,
 reread:'Bu darslarni takrorlang:',nextG:g=>`«${gname(g,'uz')}» darajasiga o\'tish`,toExam:'Daraja imtihonini topshirish',getCert:'Guvohnoma olish'}}:{
ru:{mine:'Ваш уровень',none:`Пройдите уроки ${GRADE_NUM[0]}-го разряда и сдайте экзамен, чтобы получить первый значок.`,
 have:g=>`Подготовка к ${GRADE_NUM[g]}-му разряду пройдена`,cert:'Моё свидетельство',
 disc:(GCFG.basis&&GCFG.basis.ru)||'Это экспресс-подготовка по справочнику ЕТКС, а не официальный разряд. Разряд присваивает учебный центр или комиссия на работе.',
 exam:(g,k)=>`Экзамен: подготовка к ${GRADE_NUM[g]}-му разряду · ${k} вопросов`,exLock:'Экзамен откроется, когда пройдёте все уроки разряда',
 exDone:'Экзамен сдан · пересдать',passedChip:'сдано',exT:g=>`Экзамен: ${GRADE_NUM[g]}-й разряд`,exSub:(k,n)=>`Нужно ${k} верных из ${n}. Вопросы из всех уроков разряда.`,
 exPass:g=>`Поздравляем! Вы прошли подготовку к ${GRADE_NUM[g]}-му разряду.`,exFail:(k,n)=>`Нужно ${k} верных ответов из ${n}. Повторите уроки и попробуйте ещё раз.`,
 reread:'Повторите эти уроки:',nextG:g=>`Перейти к ${GRADE_NUM[g]}-му разряду`,toExam:'Сдать экзамен разряда',getCert:'Получить свидетельство'},

 have:g=>`${GRADE_NUM[g]}-razryadga tayyorgarlik o\'tildi`,cert:'Mening guvohnomam',
 disc:(GCFG.basis&&GCFG.basis.uz)||'Bu ETKS ma\'lumotnomasi bo\'yicha tezkor tayyorgarlik, rasmiy razryad emas. Razryadni o\'quv markazi yoki ishxonadagi komissiya beradi.',
 exam:(g,k)=>`Imtihon: ${GRADE_NUM[g]}-razryadga tayyorgarlik · ${k} ta savol`,exLock:'Imtihon razryadning barcha darslari o\'tilgandan keyin ochiladi',
 exDone:'Imtihon topshirildi · qayta topshirish',passedChip:'topshirildi',exT:g=>`Imtihon: ${GRADE_NUM[g]}-razryad`,exSub:(k,n)=>`${n} tadan ${k} ta to\'g\'ri javob kerak. Savollar razryadning barcha darslaridan.`,
 exPass:g=>`Tabriklaymiz! Siz ${GRADE_NUM[g]}-razryadga tayyorgarlikdan o\'tdingiz.`,exFail:(k,n)=>`${n} tadan ${k} ta to\'g\'ri javob kerak. Darslarni takrorlang va yana urinib ko\'ring.`,
 reread:'Bu darslarni takrorlang:',nextG:g=>`${GRADE_NUM[g]}-razryadga o\'tish`,toExam:'Razryad imtihonini topshirish',getCert:'Guvohnoma olish'}};
const G=()=>GX[lang];
const medal=(n,sz=44)=>`<svg class="medal" width="${sz}" height="${sz}" viewBox="0 0 48 48" aria-hidden="true"><path d="M15 2h7l4 14h-7zM33 2h-7l-4 14h7z" fill="var(--accent)"/><circle cx="24" cy="30" r="16" fill="#c9a227"/><circle cx="24" cy="30" r="12.5" fill="var(--navy)"/><text x="24" y="35.5" text-anchor="middle" font-size="15" font-weight="800" fill="#fff">${n}</text></svg>`;
const examN=g=>byLv(g).length*2;
function gradeCard(){const Gx=G();const t=topGrade();
  return `<div class="card lvcard">${t>=0?`<div class="lvrow">${medal(GRADE_NUM[t],52)}<div><span class="s">${Gx.mine}</span><b>${Gx.have(t)}</b></div></div><button class="btn" id="cert" type="button">${Gx.cert}</button>`:`<div class="lvrow">${medal('?',52)}<div><span class="s">${Gx.mine}</span><b>${Gx.none}</b></div></div>`}<p class="disc">${Gx.disc}</p></div>`}
function gradeHead(lv){return `${grades.has(lv)?medal(GRADE_NUM[lv],26):''}`}
function gradeChip(lv){return grades.has(lv)?`<span class="chip free">✓ ${G().passedChip}</span>`:''}
function examBtn(lv){if(isPaid(byLv(lv)[0]))return '';return gradeDone(lv)?`<button class="btn exam${grades.has(lv)?' ghost':''}" type="button" data-exam="${lv}">${grades.has(lv)?G().exDone:G().exam(lv,examN(lv))}</button>`:`<p class="exlock">🔒 ${G().exLock}</p>`}
function bindGrades(){document.querySelectorAll('[data-exam]').forEach(b=>b.onclick=()=>startExam(+b.dataset.exam));const ce=$('#cert');if(ce)ce.onclick=openCert}
function openCert(){const t=topGrade();if(t<0||!window.KasbCert)return;
  const topics={ru:[],uz:[]};LESSONS.filter(x=>grades.has(x.lv)&&x.lv<=t).forEach(x=>{topics.ru.push(x.t.ru);topics.uz.push(x.t.uz)});
  const o={prefix:pk('x').replace(/_x$/,''),lang,prof:GCFG.prof,grade:GRADE_NUM[t],topics,sources:GCFG.sources,url:GCFG.url,start:GCFG.start};
  if(GCFG.level){o.unit={ru:'УРОВЕНЬ',uz:'DARAJA'};o.did={ru:`прошёл(ла) сокращённый курс «${GCFG.prof.ru}», уровень «${gname(t,'ru')}»`,uz:`«${GCFG.prof.uz}» qisqartirilgan kursini o'tdi, daraja: «${gname(t,'uz')}»`};
    o.note={ru:'Неофициальный документ. Это короткий курс по уходу и первой помощи, а не медицинское образование и не допуск к работе медсестрой.',uz:'Norasmiy hujjat. Bu parvarish va birinchi yordam bo\'yicha qisqa kurs, tibbiy ta\'lim ham, hamshira bo\'lib ishlashga ruxsat ham emas.'};
    o.shareText={ru:`Я прошёл(ла) курс «${GCFG.prof.ru}» (уровень «${gname(t,'ru')}») в Kasb Pro. Попробуй тоже:`,uz:`Men Kasb Pro'da «${GCFG.prof.uz}» kursini o'tdim («${gname(t,'uz')}» darajasi). Sen ham sinab ko'r:`}}
  window.KasbCert.open(o)}

/* grade exam: 2 random questions from every lesson of the grade, pass = 80% */
const needEx=n=>Math.ceil(n*0.8);
const shuf=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
function startExam(g){const qs=[];byLv(g).forEach(x=>shuf(x.quiz.map((_,i)=>i)).slice(0,2).forEach(i=>qs.push({l:x.id,i})));
  S.ex={g,qs:shuf(qs),qi:0,score:0,picked:null,miss:new Set()};go('exam')}
function exam(){
  const L=U(),Gx=G();const E=S.ex;const it=E.qs[E.qi];const x=LESSONS.find(y=>y.id===it.l);const item=x.quiz[it.i];const Q=tr(item);const p=E.picked;const N=E.qs.length;
  const opts=Q.o.map((o,i)=>{let c='opt';if(p!==null){if(i===item.a)c+=' right';else if(i===p)c+=' wrong'}return `<button class="${c}" data-i="${i}" type="button" ${p!==null?'disabled':''}>${o}</button>`}).join('');
  app.innerHTML=header(`<div class="row"><button class="back" id="back" type="button">${L.all}</button>${langSw()}</div><h1 class="ttl">${Gx.exT(E.g)}</h1><p>${Gx.exSub(needEx(N),N)}</p>`)+`<main class="wrap">
   <div class="progress"><div class="q-top"><span>${L.qn(E.qi+1,N)}</span><span>${L.ok(E.score)}</span></div><div class="meter"><i style="width:${(E.qi+(p!==null?1:0))/N*100}%"></i></div></div>
   <p class="exfrom">${tr(x.t)}</p><p class="q">${Q.q}</p><div class="opts">${opts}</div>
   ${p!==null?`<p class="expl">${p===item.a?`<b class="okc">${L.right}</b> `:`<b class="badc">${L.wrong}</b> `}${Q.e}</p><button class="btn" id="next" type="button">${E.qi<N-1?L.next:L.res}</button>`:''}
  </main>`;
  $('#back').onclick=()=>go('home');
  document.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{E.picked=+b.dataset.i;if(E.picked===item.a)E.score++;else E.miss.add(x.id);render()});
  const n=$('#next');if(n)n.onclick=()=>{if(E.qi<N-1){E.qi++;E.picked=null;go('exam')}else{if(E.score>=needEx(N)){grades.add(E.g);store.set('grades',[...grades])}go('examRes')}};
}
function examRes(){
  const L=U(),Gx=G();const E=S.ex;const N=E.qs.length;const pass=E.score>=needEx(N);const num=GRADE_NUM[E.g];const ng=E.g+1<GRADE_NUM.length?E.g+1:null;
  const miss=LESSONS.filter(x=>E.miss.has(x.id));
  app.innerHTML=header(`<div class="row"><div><h1>${L.res}</h1><p>${Gx.exT(E.g)}</p></div>${langSw()}</div>`)+`<main class="wrap"><div class="card result">
   ${pass?`<div class="bigmedal">${medal(num,96)}</div>`:''}<div class="score">${E.score} / ${N}</div><h3>${pass?Gx.exPass(E.g):L.failT}</h3>
   ${pass?`<p class="expl">${Gx.disc}</p>`:`<p class="expl">${Gx.exFail(needEx(N),N)}</p>`}
   ${miss.length?`<p class="expl"><b>${Gx.reread}</b></p><div class="list">${miss.map(x=>`<button class="item open" type="button" data-id="${x.id}"><span class="tx"><b>${tr(x.t)}</b></span><span class="go">›</span></button>`).join('')}</div>`:''}</div>
   ${pass?`<button class="btn" id="cert" type="button">${Gx.getCert}</button>`:`<button class="btn" id="retry" type="button">${L.retry}</button>`}
   ${pass&&ng!==null?`<button class="btn ghost" id="ng" type="button">${Gx.nextG(ng)}</button>`:''}
   <button class="btn ghost" id="home" type="button">${L.home}</button></main>`;
  $('#home').onclick=()=>go('home');
  document.querySelectorAll('[data-id]').forEach(b=>b.onclick=()=>{S.id=b.dataset.id;go('lesson')});
  const r=$('#retry');if(r)r.onclick=()=>startExam(E.g);
  const c=$('#cert');if(c)c.onclick=openCert;
  const g=$('#ng');if(g)g.onclick=()=>{S.id=byLv(ng)[0].id;go('lesson')};
}
document.documentElement.lang=lang;
go('home');

</script>

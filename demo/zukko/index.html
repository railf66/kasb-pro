<style>
:root{--bg:#f4f6fb;--card:#fff;--text:#18202e;--muted:#667085;--line:#e4e7ee;--accent:#4f46e5;--accent2:#7c3aed;--ok:#12a150;--chip:#eef0ff}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0f1420;--card:#182032;--text:#eef1f7;--muted:#9aa4b8;--line:#2a3348;--chip:#232c46}}
:root[data-theme=dark]{--bg:#0f1420;--card:#182032;--text:#eef1f7;--muted:#9aa4b8;--line:#2a3348;--chip:#232c46}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-tap-highlight-color:transparent}
.wrap{max-width:560px;margin:0 auto;padding:0 16px 110px}
.hero{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;padding:22px 16px 18px;border-radius:0 0 22px 22px}
.hero .in{max-width:560px;margin:0 auto}
.top{display:flex;align-items:center;justify-content:space-between;gap:8px}
.logo{display:flex;align-items:center;gap:10px;font-weight:800;font-size:20px}
.logo i{width:38px;height:38px;border-radius:12px;background:rgba(255,255,255,.2);display:grid;place-items:center;font-style:normal;font-size:20px}
.langs{display:flex;gap:4px}
.langs button{border:0;border-radius:9px;padding:5px 8px;background:rgba(255,255,255,.18);color:#fff;font:600 13px system-ui;cursor:pointer}
.langs button.on{background:#fff;color:var(--accent)}
.hero p{margin:12px 0 0;opacity:.92}
.badges{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.badges span{background:rgba(255,255,255,.16);border-radius:20px;padding:4px 10px;font-size:13px}
.tabs{position:sticky;top:0;z-index:5;background:var(--bg);display:flex;gap:6px;padding:12px 0 10px;overflow-x:auto}
.tabs button{flex:1;white-space:nowrap;border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:12px;padding:9px 10px;font:600 14px system-ui;cursor:pointer}
.tabs button.on{background:var(--accent);border-color:var(--accent);color:#fff}
.filters{display:flex;gap:6px;overflow-x:auto;margin-bottom:10px;padding-bottom:2px}
.filters button{border:0;background:var(--chip);color:var(--text);border-radius:20px;padding:6px 12px;font:500 13px system-ui;white-space:nowrap;cursor:pointer}
.filters button.on{background:var(--accent);color:#fff}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:10px}
.c-head{display:flex;gap:12px;align-items:flex-start}
.ico{flex:none;width:44px;height:44px;border-radius:12px;background:var(--chip);display:grid;place-items:center;font-size:22px}
.c-head h3{margin:0;font-size:16px}
.c-head .age{color:var(--muted);font-size:13px;margin-top:2px}
.c-desc{margin:10px 0 8px;color:var(--text)}
.meta{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.meta span{font-size:12.5px;background:var(--chip);border-radius:8px;padding:3px 8px}
.c-foot{display:flex;align-items:center;justify-content:space-between;gap:10px}
.price{font-weight:800;font-size:17px}
.price small{font-weight:500;color:var(--muted);font-size:12px}
.btn{border:0;border-radius:12px;padding:10px 14px;background:var(--accent);color:#fff;font:700 14px system-ui;cursor:pointer}
.btn.wide{width:100%;padding:14px;font-size:16px}
.btn.ghost{background:var(--chip);color:var(--text)}
table{width:100%;border-collapse:collapse;font-size:14px}
td,th{padding:8px 6px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{color:var(--muted);font-weight:600;font-size:12.5px}
h2{font-size:16px;margin:4px 0 10px}
.muted{color:var(--muted);font-size:13px}
ul.plain{margin:0;padding-left:18px}
ul.plain li{margin:4px 0}
.sheet{position:fixed;inset:0;z-index:20;background:rgba(0,0,0,.45);display:none;align-items:flex-end;justify-content:center}
.sheet.open{display:flex}
.sheet .box{background:var(--card);width:100%;max-width:560px;border-radius:20px 20px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom));max-height:92vh;overflow:auto}
.box h3{margin:0 0 4px}
label{display:block;font-size:13px;color:var(--muted);margin:12px 0 4px}
input,select{width:100%;border:1px solid var(--line);background:var(--bg);color:var(--text);border-radius:12px;padding:12px;font:15px system-ui}
.row{display:flex;gap:8px}.row>*{flex:1}
.err{color:#d92d20;font-size:13px;min-height:18px;margin-top:8px}
.done{text-align:center;padding:16px 4px}
.done .big{font-size:48px}
.cta{position:fixed;left:0;right:0;bottom:0;padding:10px 16px calc(10px + env(safe-area-inset-bottom));background:linear-gradient(to top,var(--bg) 70%,transparent);z-index:4}
.cta .in{max-width:560px;margin:0 auto}
.hide{display:none}
</style>
</head>
<body>
<div class="hero"><div class="in">
  <div class="top">
    <div class="logo"><i>🎓</i>Zukko Academy</div>

  </div>
  <p data-t="tagline"></p>
  <div class="badges"><span data-t="b1"></span><span data-t="b2"></span><span data-t="b3"></span></div>

    <button data-tab="courses" class="on" data-t="tCourses"></button>
    <button data-tab="schedule" data-t="tSchedule"></button>
    <button data-tab="about" data-t="tAbout"></button>
  </div>
  <section id="courses">
    <div class="filters" id="filters"></div>
    <div id="list"></div>
  </section>
  <section id="schedule" class="hide"></section>
  <section id="about" class="hide"></section>
</div>
<div class="cta"><div class="in"><button class="btn wide" id="ctaBtn" data-t="cta"></button></div></div>

<div class="sheet" id="sheet"><div class="box">
  <div id="formView">
    <h3 data-t="fTitle"></h3>
    <div class="muted" data-t="fSub"></div>
    <label data-t="fCourse"></label><select id="fCourse"></select>
    <div class="row">
      <div><label data-t="fName"></label><input id="fName" autocomplete="name"></div>
      <div><label data-t="fAge"></label><input id="fAge" inputmode="numeric"></div>
    </div>
    <label data-t="fParent"></label><input id="fParent">
    <label data-t="fPhone"></label><input id="fPhone" type="tel" inputmode="tel" placeholder="+998 __ ___ __ __">
    <div class="row">
      <div><label data-t="fDay"></label><select id="fDay"></select></div>
      <div><label data-t="fTime"></label><select id="fTime"></select></div>
    </div>
    <div class="err" id="fErr"></div>
    <button class="btn wide" id="send" data-t="send"></button>
    <button class="btn wide ghost" id="cancel" style="margin-top:8px" data-t="cancel"></button>
  </div>
  <div id="doneView" class="done hide">
    <div class="big">✅</div>
    <h3 data-t="dTitle"></h3>
    <p id="dText"></p>
    <button class="btn wide" id="close" data-t="close"></button>
  </div>
</div></div>

    return '<div class="card"><div class="c-head"><div class="ico">'+x.ico+'</div><div><h3>'+esc(x.n[lang])+'</h3><div class="age">'+esc(x.a[lang])+'</div></div></div>'+
    '<div class="c-desc">'+esc(x.d[lang])+'</div><div class="meta">'+x.m[lang].map(function(m){return '<span>'+esc(m)+'</span>'}).join('')+'</div>'+
    '<div class="c-foot"><div class="price">'+(x.from?esc(t('from')):'')+fmt(x.price)+' <small>'+esc(t('sum'))+'</small></div><button class="btn" data-book="'+x.id+'">'+esc(t('trial'))+'</button></div></div>'}).join('');
  document.getElementById('schedule').innerHTML='<div class="card"><h2>'+esc(t('sTitle'))+'</h2><table><tr>'+t('sh').map(function(h){return '<th>'+esc(h)+'</th>'}).join('')+'</tr>'+
    t('sRows').map(function(r){return '<tr><td><b>'+esc(r[0])+'</b></td><td>'+esc(r[1])+'</td><td>'+esc(r[2])+'</td></tr>'}).join('')+'</table><p class="muted">'+esc(t('sKids'))+'</p></div>'+
    '<div class="card"><h2>'+esc(t('sDays'))+'</h2><p style="margin:0">'+esc(t('sDaysT'))+'</p></div>';
  document.getElementById('about').innerHTML='<div class="card"><h2>'+esc(t('aTitle'))+'</h2><ul class="plain">'+t('aList').map(function(i){return '<li>'+esc(i)+'</li>'}).join('')+'</ul></div>'+
    '<div class="card"><h2>'+esc(t('dTitle2'))+'</h2><ul class="plain">'+t('dList').map(function(i){return '<li>'+esc(i)+'</li>'}).join('')+'</ul></div><p class="muted" style="text-align:center">'+esc(t('demo'))+'</p>';
  var sel=document.getElementById('fCourse'),cur=sel.value;
  sel.innerHTML=C.map(function(x){return '<option value="'+x.id+'">'+esc(x.n[lang])+'</option>'}).join('');if(cur)sel.value=cur;
  var d=document.getElementById('fDay'),dv=d.selectedIndex;d.innerHTML=t('days').map(function(x,i){return '<option value="'+i+'">'+esc(x)+'</option>'}).join('');if(dv>=0)d.selectedIndex=dv;
  var tm=document.getElementById('fTime'),tv=tm.value;tm.innerHTML=TIMES.map(function(x){return '<option>'+x+'</option>'}).join('');if(tv)tm.value=tv;
}
document.getElementById('langs').onclick=function(e){var l=e.target.dataset.l;if(l){lang=l;render()}};
document.getElementById('tabs').onclick=function(e){var b=e.target.closest('button');if(!b)return;tab=b.dataset.tab;
  document.querySelectorAll('#tabs button').forEach(function(x){x.classList.toggle('on',x===b)});
  ['courses','schedule','about'].forEach(function(s){document.getElementById(s).classList.toggle('hide',s!==tab)});window.scrollTo(0,0)};
document.getElementById('filters').onclick=function(e){var c=e.target.dataset.c;if(c){cat=c;render()}};
var sheet=document.getElementById('sheet');
function openForm(id){document.getElementById('formView').classList.remove('hide');document.getElementById('doneView').classList.add('hide');
  document.getElementById('fErr').textContent='';if(id)document.getElementById('fCourse').value=id;
  var u=tg&&tg.initDataUnsafe&&tg.initDataUnsafe.user;var nm=document.getElementById('fName');if(u&&!nm.value&&u.first_name)nm.value=u.first_name;
  sheet.classList.add('open')}
function closeForm(){sheet.classList.remove('open')}
document.getElementById('list').onclick=function(e){var b=e.target.closest('[data-book]');if(b)openForm(b.dataset.book)};
document.getElementById('ctaBtn').onclick=function(){openForm()};
document.getElementById('cancel').onclick=closeForm;
document.getElementById('close').onclick=function(){closeForm();if(tg&&tg.initData)try{tg.close()}catch(e){}};
sheet.onclick=function(e){if(e.target===sheet)closeForm()};
document.getElementById('send').onclick=function(){
  var g=function(id){return document.getElementById(id).value.trim()};
  var err=document.getElementById('fErr');
  if(!g('fName')){err.textContent=t('eName');return}
  if(g('fPhone').replace(/\D/g,'').length<7){err.textContent=t('ePhone');return}
  var c=C.filter(function(x){return x.id===g('fCourse')})[0];
  var di=document.getElementById('fDay').selectedIndex;
  var u=(tg&&tg.initDataUnsafe&&tg.initDataUnsafe.user)||{};
  var f={course:c.n.ru,course_l:c.n[lang],name:g('fName'),age:g('fAge'),parent:g('fParent'),phone:g('fPhone'),
    day:T.ru.days[di],day_l:t('days')[di],time:g('fTime'),lang:lang,chat:P.get('chat')||u.id||'',username:u.username||'',tg_name:[u.first_name,u.last_name].filter(Boolean).join(' ')};
  var btn=this;btn.disabled=true;err.textContent='';
  var body=new URLSearchParams(f).toString();
  fetch(HOOK,{method:'POST',mode:'no-cors',headers:{'Content-Type':'application/x-www-form-urlencoded'},body:body}).then(function(){
    document.getElementById('dText').textContent=t('dText').replace('{n}',f.name).replace('{c}',f.course_l).replace('{d}',f.day_l).replace('{t}',f.time);
    document.getElementById('formView').classList.add('hide');document.getElementById('doneView').classList.remove('hide');
    if(tg&&tg.HapticFeedback)try{tg.HapticFeedback.notificationOccurred('success')}catch(e){}
  }).catch(function(){err.textContent=t('eSend')}).then(function(){btn.disabled=false});
};
render();
</script>
</body>
</html>

  {a:2,ru:{q:"На доске резали сырое мясо. Можно ли сразу резать на ней хлеб?",o:["Да, если вытереть","Да, хлеб потом всё равно жарят","Нет, нужна другая доска"],e:"Сырое и готовое — на разных досках."},uz:{q:"Taxtada xom go'sht kesildi. Darrov unda non kesish mumkinmi?",o:["Ha, artib qo'yilsa","Ha, non baribir qovuriladi","Yo'q, boshqa taxta kerak"],e:"Xom va tayyor — alohida taxtalarda."}},
  {a:0,ru:{q:"У повара понос и температура. Что правильно?",o:["Сообщить старшему и не работать с едой","Работать в перчатках","Выпить таблетку и работать"],e:"Больной повар может заразить всех гостей."},uz:{q:"Oshpazda ich ketishi va isitma bor. Nima to'g'ri?",o:["Kattaga aytish va ovqat bilan ishlamaslik","Qo'lqopda ishlash","Dori ichib ishlash"],e:"Kasal oshpaz barcha mehmonlarni yuqtirishi mumkin."}},
  {a:1,ru:{q:"Почему на кухне нельзя носить кольца?",o:["Они мешают держать нож","Под ними копятся микробы, и они могут упасть в еду","Так красивее"],e:"Украшения — это грязь и риск попадания в блюдо."},uz:{q:"Nega oshxonada uzuk taqib bo'lmaydi?",o:["Pichoq ushlashga xalaqit beradi","Ostida mikroblar to'planadi va ovqatga tushishi mumkin","Shunday chiroyliroq"],e:"Taqinchoqlar — kir va taomga tushish xavfi."}}]},

 steps:{ru:["Опасная зона — от +5 до +60 °C. Здесь микробы удваиваются каждые 20–30 минут.","В холодильнике <b>готовое — наверху, сырое — внизу</b>. Тогда сок от сырого мяса не капает на готовую еду.","FIFO — «первым пришёл, первым ушёл». Новые продукты ставят назад, старые — вперёд.","Каждую заготовку маркируют: что это, дата и время приготовления, до какого времени годна.","Размораживают в холодильнике, а не на столе. Повторно замораживать нельзя.","Большую кастрюлю супа или плова остужают быстрее: раскладывают в неглубокие гастроёмкости."],
       uz:["Xavfli zona — +5 dan +60 °C gacha. Bu yerda mikroblar har 20–30 daqiqada ikki barobar ko'payadi.","Muzlatgichda <b>tayyor — tepada, xom — pastda</b>. Shunda xom go'sht suvi tayyor ovqatga tommaydi.","FIFO — «birinchi kelgan, birinchi ketadi». Yangi mahsulot orqaga, eskisi oldinga qo'yiladi.","Har bir tayyorlama belgilanadi: nima, tayyorlangan sana va vaqt, qachongacha yaroqli.","Muzdan tushirish muzlatgichda, stolda emas. Qayta muzlatib bo'lmaydi.","Katta qozondagi sho'rva yoki oshni tezroq sovitish uchun sayoz gastroyemkostlarga soling."]},
 tip:{ru:"Купите щуп-термометр (от 30–50 тыс. сум). «На глаз» температуру не определить ни у мяса, ни у холодильника.",uz:"Shchup-termometr sotib oling (30–50 ming so'mdan). Go'shtning ham, muzlatgichning ham haroratini «ko'z bilan» aniqlab bo'lmaydi."},
 quiz:[
  {a:1,ru:{q:"Какой диапазон называют опасной зоной?",o:["−18…0 °C","+5…+60 °C","+70…+100 °C"],e:"В этой зоне микробы растут быстрее всего."},uz:{q:"Qaysi oraliq xavfli zona deyiladi?",o:["−18…0 °C","+5…+60 °C","+70…+100 °C"],e:"Bu zonada mikroblar eng tez o'sadi."}},
  {a:0,ru:{q:"Где в холодильнике хранить сырое мясо?",o:["На нижней полке","На верхней полке","Над салатами"],e:"Внизу — чтобы сок не капал на готовую еду."},uz:{q:"Muzlatgichda xom go'shtni qayerda saqlash kerak?",o:["Pastki tokchada","Yuqori tokchada","Salatlar ustida"],e:"Pastda — suvi tayyor ovqatga tommasligi uchun."}},
  {a:2,ru:{q:"Что значит FIFO?",o:["Сначала берут новые продукты","Хранить всё в морозилке","Первым пришёл — первым ушёл"],e:"Старые продукты расходуют первыми."},uz:{q:"FIFO nimani anglatadi?",o:["Avval yangi mahsulot olinadi","Hammasini muzlatkichda saqlash","Birinchi kelgan — birinchi ketadi"],e:"Eski mahsulotlar birinchi ishlatiladi."}},
  {a:1,ru:{q:"Как правильно разморозить мясо?",o:["На столе до утра","В холодильнике","В горячей воде"],e:"В холодильнике мясо не попадает в опасную зону."},uz:{q:"Go'shtni muzdan qanday to'g'ri tushiriladi?",o:["Ertalabgacha stolda","Muzlatgichda","Issiq suvda"],e:"Muzlatgichda go'sht xavfli zonaga tushmaydi."}}]},

 steps:{ru:["Доску ставят на влажное полотенце, чтобы не скользила.","Нож держат «щипком»: большой и указательный палец на лезвии у больстера, остальные — на рукояти.","Вторая рука — «коготь»: кончики пальцев подогнуты, нож идёт по костяшкам. Так пальцы не попадут под лезвие.","Режут движением вперёд-вниз, а не давят сверху.","Мусат только выпрямляет кромку — правьте каждый день. Точильный камень снимает металл — раз в 1–4 недели.","Нож моют руками и сразу вытирают. Посудомойка и мойка с водой портят нож и опасны."],
       uz:["Taxta sirpanmasligi uchun ho'l sochiq ustiga qo'yiladi.","Pichoq «chimdik» bilan ushlanadi: bosh va ko'rsatkich barmoq bolster yonida tig'da, qolganlari — dastada.","Ikkinchi qo'l — «panja»: barmoq uchlari bukilgan, pichoq bo'g'imlar bo'ylab yuradi. Shunda barmoqlar tig' ostiga tushmaydi.","Yuqoridan bosmasdan, oldinga-pastga harakat bilan kesiladi.","Musat faqat qirrani to'g'rilaydi — har kuni to'g'rilang. Charx toshi metallni oladi — 1–4 haftada bir marta.","Pichoq qo'lda yuviladi va darrov artiladi. Idish yuvish mashinasi va suvli rakovina pichoqni buzadi va xavfli."]},
 tip:{ru:"Острый нож безопаснее тупого: тупой соскальзывает с лука и помидора, и вы давите сильнее. Большинство порезов — от тупых ножей.",uz:"O'tkir pichoq o'tmas pichoqdan xavfsizroq: o'tmas pichoq piyoz va pomidordan sirpanadi, siz kuchliroq bosasiz. Ko'p kesilishlar — o'tmas pichoqdan."},
 quiz:[
  {a:2,ru:{q:"Как держать пальцы руки, которая придерживает продукт?",o:["Прямо, вытянуть вперёд","Под лезвием","Подогнуть «когтем»"],e:"Нож идёт по костяшкам, кончики пальцев спрятаны."},uz:{q:"Mahsulotni ushlab turgan qo'l barmoqlarini qanday tutish kerak?",o:["To'g'ri, oldinga cho'zib","Tig' ostida","«Panja» qilib bukib"],e:"Pichoq bo'g'imlar bo'ylab yuradi, barmoq uchlari yashiringan."}},
  {a:0,ru:{q:"Нож падает со стола. Что делать?",o:["Отступить и дать упасть","Поймать рукой","Подставить ногу"],e:"Падающий нож не ловят никогда."},uz:{q:"Pichoq stoldan tushyapti. Nima qilish kerak?",o:["Chekinib, tushishiga yo'l qo'yish","Qo'l bilan ushlash","Oyoqni tutish"],e:"Tushayotgan pichoq hech qachon ushlanmaydi."}},
  {a:1,ru:{q:"Для чего мусат?",o:["Снять много металла","Выпрямить кромку между заточками","Резать кости"],e:"Мусат правит, камень точит."},uz:{q:"Musat nima uchun?",o:["Ko'p metall olish","Charxlashlar orasida qirrani to'g'rilash","Suyak kesish"],e:"Musat to'g'rilaydi, tosh charxlaydi."}},
  {a:1,ru:{q:"Какой нож опаснее?",o:["Острый","Тупой","Одинаково"],e:"Тупой соскальзывает, и вы давите сильнее."},uz:{q:"Qaysi pichoq xavfliroq?",o:["O'tkir","O'tmas","Bir xil"],e:"O'tmas sirpanadi va siz kuchliroq bosasiz."}}]},

 steps:{ru:["Сначала сделайте у овоща <b>плоскую сторону</b>: срежьте ломтик и положите овощ на срез. Круглый овощ катается — так режут пальцы.","Режьте куски одного размера — тогда они приготовятся одновременно.","Кубик: сначала пласты нужной толщины, потом из них бруски, потом бруски поперёк.","Лук: срезать верх, корень оставить — он держит лук целым, пока режете.","Морковь для плова режут вручную брусками. Жёлтая морковь (сабзи) держит форму лучше.","Отходы складывайте в отдельный лоток, а не сдвигайте ножом-лезвием по доске — лезвие тупится."],
       uz:["Avval sabzavotda <b>tekis tomon</b> qiling: bir bo'lak kesib, sabzavotni kesilgan joyiga qo'ying. Yumaloq sabzavot dumalaydi — barmoqlar shunday kesiladi.","Bir xil o'lchamda to'g'rang — shunda bir vaqtda pishadi.","Kubik: avval kerakli qalinlikda qatlamlar, keyin bruschalar, keyin bruschalarni ko'ndalangiga.","Piyoz: tepasini kesing, ildizini qoldiring — u to'g'rayotganda piyozni butun tutadi.","Osh uchun sabzi qo'lda bruschalar qilib to'g'raladi. Sariq sabzi shaklini yaxshiroq saqlaydi.","Chiqindini alohida idishga soling, pichoq tig'i bilan taxtada surmang — tig' o'tmaslashadi."]},
 tip:{ru:"Скорость придёт сама. Сначала ровно и безопасно, потом быстро. Повара на тренировку берут мешок лука и режут его весь.",uz:"Tezlik o'zi keladi. Avval tekis va xavfsiz, keyin tez. Oshpazlar mashq uchun bir qop piyoz olib, hammasini to'g'raydi."},
 quiz:[
  {a:1,ru:{q:"Что сделать первым с круглым овощом?",o:["Резать сразу","Срезать бок, чтобы он лежал устойчиво","Натереть"],e:"Плоская сторона — овощ не катается."},uz:{q:"Yumaloq sabzavot bilan birinchi nima qilinadi?",o:["Darrov kesish","Barqaror yotishi uchun yon tomonini kesish","Qirg'ichdan o'tkazish"],e:"Tekis tomon — sabzavot dumalamaydi."}},
  {a:2,ru:{q:"Как режут морковь для плова?",o:["На тёрке","Кубиком 2 мм","Брусками 5–7 мм"],e:"Тёртая морковь разварится в кашу."},uz:{q:"Osh uchun sabzi qanday to'g'raladi?",o:["Qirg'ichda","2 mm kubik","5–7 mm bruschalar"],e:"Qirilgan sabzi bo'tqa bo'lib ketadi."}},
  {a:0,ru:{q:"Зачем резать куски одного размера?",o:["Чтобы приготовились одновременно","Только для красоты","Так быстрее мыть"],e:"Мелкие сгорят, крупные останутся сырыми."},uz:{q:"Nega bir xil o'lchamda to'g'rash kerak?",o:["Bir vaqtda pishishi uchun","Faqat chiroy uchun","Yuvish tezroq"],e:"Maydalari kuyadi, kattalari xom qoladi."}},
  {a:1,ru:{q:"Что такое брунуаз?",o:["Длинная соломка","Очень мелкий кубик 2–3 мм","Кольца"],e:"Брунуаз — самый мелкий кубик."},uz:{q:"Brunuaz nima?",o:["Uzun somoncha","Juda mayda kubik 2–3 mm","Halqalar"],e:"Brunuaz — eng mayda kubik."}}]},

 t:{ru:"Вес, брутто и нетто",uz:"Vazn, brutto va netto"},s:{ru:"Сколько уходит в отходы при очистке",uz:"Tozalashda qancha chiqindi ketadi"},
 table:{head:{ru:["Продукт","Отходы, примерно"],uz:["Mahsulot","Chiqindi, taxminan"]},rows:{
  ru:[["Картофель (молодой / к весне)","20 % / до 35–40 %"],["Морковь","20–25 %"],["Лук репчатый","16 %"],["Капуста белокочанная","20 %"],["Перец сладкий","25 %"],["Говядина на кости","25–30 % кости"],["Баранина на кости","30 % кости"],["Курица целая","30–35 % кости и кожи"]],
  uz:[["Kartoshka (yangi / bahorga)","20 % / 35–40 % gacha"],["Sabzi","20–25 %"],["Piyoz","16 %"],["Oq karam","20 %"],["Shirin qalampir","25 %"],["Suyakli mol go'shti","25–30 % suyak"],["Suyakli qo'y go'shti","30 % suyak"],["Butun tovuq","30–35 % suyak va teri"]]}},
 steps:{ru:["<b>Брутто</b> — вес продукта, как купили: с кожурой, костями, шелухой.","<b>Нетто</b> — вес после очистки, то, что пойдёт в котёл.","Нетто = брутто × (100 − % отходов) / 100. Например: 10 кг картофеля, 25 % отходов → 7,5 кг.","Мерить лучше весами, а не стаканами: стакан муки весит 130–160 г в зависимости от того, как насыпали.","Полезные мерки: столовая ложка соли ≈ 20–25 г, чайная ≈ 6–8 г; стакан 250 мл риса ≈ 200 г.","Записывайте, сколько реально уходит в отходы у ваших поставщиков, — так закупка будет точнее."],
       uz:["<b>Brutto</b> — mahsulotning sotib olingandagi vazni: po'sti, suyagi, qobig'i bilan.","<b>Netto</b> — tozalangandan keyingi vazn, qozonga tushadigani.","Netto = brutto × (100 − chiqindi %) / 100. Masalan: 10 kg kartoshka, 25 % chiqindi → 7,5 kg.","Stakan bilan emas, tarozida o'lchash yaxshi: bir stakan un qanday solinganiga qarab 130–160 g bo'ladi.","Foydali o'lchovlar: osh qoshiq tuz ≈ 20–25 g, choy qoshiq ≈ 6–8 g; 250 ml stakan guruch ≈ 200 g.","Yetkazib beruvchilaringizda chiqindi qancha ketishini yozib boring — xarid aniqroq bo'ladi."]},
 tip:{ru:"Когда покупаете, считайте цену за килограмм нетто, а не брутто. Дешёвая говядина с большой костью может выйти дороже.",uz:"Sotib olayotganda brutto emas, netto kilogrami narxini hisoblang. Katta suyakli arzon mol go'shti qimmatroqqa tushishi mumkin."},
 quiz:[
  {a:0,ru:{q:"Что такое нетто?",o:["Вес после очистки","Вес с упаковкой","Вес готового блюда"],e:"Нетто — то, что идёт в котёл."},uz:{q:"Netto nima?",o:["Tozalangandan keyingi vazn","Qadoq bilan vazn","Tayyor taom vazni"],e:"Netto — qozonga tushadigani."}},
  {a:1,ru:{q:"10 кг моркови, отходы 20 %. Сколько нетто?",o:["10 кг","8 кг","2 кг"],e:"10 × 0,8 = 8 кг."},uz:{q:"10 kg sabzi, chiqindi 20 %. Netto qancha?",o:["10 kg","8 kg","2 kg"],e:"10 × 0,8 = 8 kg."}},
  {a:2,ru:{q:"Чем точнее всего отмерить муку?",o:["Стаканом","Ложкой","Весами"],e:"Стакан муки весит по-разному."},uz:{q:"Unni eng aniq nima bilan o'lchash mumkin?",o:["Stakan","Qoshiq","Tarozi"],e:"Bir stakan un har xil og'irlikda bo'ladi."}},
  {a:1,ru:{q:"Почему весной у картофеля больше отходов?",o:["Он тяжелее","Кожура толще, больше глазков и порчи","Это не так"],e:"К весне отходы растут до 35–40 %."},uz:{q:"Nega bahorda kartoshkada chiqindi ko'p?",o:["U og'irroq","Po'sti qalin, ko'zchalar va buzilish ko'p","Bunday emas"],e:"Bahorga kelib chiqindi 35–40 % gacha oshadi."}}]},

 steps:{ru:["<b>Жарка:</b> сковорода и масло должны быть горячими до того, как положили продукт. Иначе мясо пустит сок и будет вариться, а не жариться.","Не перегружайте сковороду и казан. Жарьте партиями — так держится температура и образуется корочка.","<b>Тушение:</b> сначала обжарить, потом добавить немного жидкости, накрыть крышкой и держать на слабом огне.","<b>Фритюр:</b> продукт обсушить — вода в масле даёт брызги. Масло менять, когда темнеет, пенится и пахнет.","<b>Варка:</b> для бульона мясо кладут в холодную воду и снимают пену; для вкусного мяса — в кипящую.","Солите мясо при жарке в конце или прямо перед жаркой — заранее посоленное отдаёт сок."],
       uz:["<b>Qovurish:</b> mahsulot solinishidan oldin tova va yog' qizigan bo'lishi kerak. Aks holda go'sht suv chiqarib, qovurilmasdan qaynaydi.","Tova va qozonni to'ldirib yubormang. Partiyalab qovuring — harorat saqlanadi va qobiq hosil bo'ladi.","<b>Dimlash:</b> avval qovuriladi, keyin ozroq suyuqlik qo'shiladi, qopqoq yopiladi va past olovda tutiladi.","<b>Frityur:</b> mahsulotni quriting — yog'dagi suv sachratadi. Yog' qorayganda, ko'piklanganda va hid chiqarganda almashtiriladi.","<b>Qaynatish:</b> bulyon uchun go'sht sovuq suvga solinadi va ko'pigi olinadi; mazali go'sht uchun — qaynoq suvga.","Go'shtni qovurishda oxirida yoki qovurishdan oldin tuzlang — oldindan tuzlangani suv chiqaradi."]},
 tip:{ru:"Не доливайте свежее масло во фритюр со старым — старое быстро портит новое. Меняйте целиком.",uz:"Eski yog'li frityurga yangi yog' qo'shmang — eskisi yangisini tez buzadi. To'liq almashtiring."},
 quiz:[
  {a:1,ru:{q:"Горит масло на сковороде. Что делать?",o:["Залить водой","Выключить огонь и накрыть крышкой","Подуть"],e:"Вода вызывает огненный выброс."},uz:{q:"Tovada yog' yonyapti. Nima qilish kerak?",o:["Suv quyish","Olovni o'chirib, qopqoq bilan yopish","Puflash"],e:"Suv olovli otilish keltirib chiqaradi."}},
  {a:0,ru:{q:"Почему мясо в сковороде «варится», а не жарится?",o:["Сковорода холодная или перегружена","Мало соли","Слишком острый нож"],e:"Жарьте партиями на горячей сковороде."},uz:{q:"Nega tovada go'sht qovurilmasdan «qaynaydi»?",o:["Tova sovuq yoki to'lib ketgan","Tuz kam","Pichoq juda o'tkir"],e:"Qizigan tovada partiyalab qovuring."}},
  {a:2,ru:{q:"Какое масло нельзя для жарки?",o:["Рафинированное подсолнечное","Хлопковое рафинированное","Нерафинированное подсолнечное"],e:"Оно дымит уже около 110 °C."},uz:{q:"Qaysi yog' qovurishga yaramaydi?",o:["Rafinatsiyalangan kungaboqar","Rafinatsiyalangan paxta","Rafinatsiyalanmagan kungaboqar"],e:"U 110 °C atrofida tutay boshlaydi."}},
  {a:1,ru:{q:"Для прозрачного бульона мясо кладут…",o:["в кипяток","в холодную воду и снимают пену","на сковороду"],e:"В холодной воде белок выходит в пену, её снимают."},uz:{q:"Tiniq bulyon uchun go'sht solinadi…",o:["qaynoq suvga","sovuq suvga va ko'pigi olinadi","tovaga"],e:"Sovuq suvda oqsil ko'pikka chiqadi, u olinadi."}}]},

 steps:{ru:["Курицу и фарш недожаренными не подают никогда. Микробы были на поверхности, а при измельчении попали внутрь.","Целый кусок говядины или баранины снаружи стерилен после обжарки, поэтому стейк может быть розовым внутри.","После жарки мясо «отдыхает» 3–5 минут: сок распределяется, температура внутри ещё поднимается.","Шашлык: маринад — лук, соль, перец, зира; 4–12 часов в холодильнике. Уксус не обязателен, много уксуса делает мясо сухим.","Мангал: жарят на углях, без открытого огня. Пламя от капающего жира тушат брызгалкой с водой.","Режьте мясо поперёк волокон — так оно мягче."],
       uz:["Tovuq va qiymani chala qovurilgan holda hech qachon bermang. Mikroblar sirtda edi, maydalashda ichkariga tushdi.","Mol yoki qo'y go'shtining butun bo'lagi qovurilgandan keyin tashqaridan steril, shuning uchun steyk ichida pushti bo'lishi mumkin.","Qovurilgandan keyin go'sht 3–5 daqiqa «dam oladi»: suvi taqsimlanadi, ichki harorat yana ko'tariladi.","Kabob: marinad — piyoz, tuz, murch, zira; muzlatgichda 4–12 soat. Sirka shart emas, ko'p sirka go'shtni quruq qiladi.","Mangal: cho'g'da, ochiq olovsiz pishiriladi. Tomayotgan yog'dan chiqqan alanga suv purkagich bilan o'chiriladi.","Go'shtni tolalariga ko'ndalang kesing — shunda yumshoqroq."]},
 tip:{ru:"Маринад из-под сырого мяса не используют как соус. Если очень нужно — прокипятите его 2–3 минуты.",uz:"Xom go'sht marinadini sous sifatida ishlatmang. Juda kerak bo'lsa — 2–3 daqiqa qaynating."},
 quiz:[
  {a:2,ru:{q:"До какой температуры в центре жарить курицу?",o:["50 °C","63 °C","74 °C"],e:"Птица — 74 °C, без исключений."},uz:{q:"Tovuqni markazida qancha haroratgacha qovurish kerak?",o:["50 °C","63 °C","74 °C"],e:"Parranda — 74 °C, istisnosiz."}},
  {a:0,ru:{q:"Почему котлету из фарша нельзя подавать розовой, а стейк можно?",o:["В фарше микробы с поверхности попали внутрь","Фарш дешевле","Стейк солёный"],e:"У целого куска микробы только снаружи."},uz:{q:"Nega qiyma kotletini pushti berib bo'lmaydi, steykni esa mumkin?",o:["Qiymada sirtdagi mikroblar ichkariga tushgan","Qiyma arzonroq","Steyk sho'r"],e:"Butun bo'lakda mikroblar faqat tashqarida."}},
  {a:1,ru:{q:"Как правильно резать готовое мясо?",o:["Вдоль волокон","Поперёк волокон","Неважно"],e:"Поперёк — короткие волокна, мясо мягче."},uz:{q:"Tayyor go'shtni qanday to'g'ri kesiladi?",o:["Tolalar bo'ylab","Tolalarga ko'ndalang","Farqi yo'q"],e:"Ko'ndalang — tolalar qisqa, go'sht yumshoq."}},
  {a:1,ru:{q:"На мангале вспыхнул огонь от жира. Что делать?",o:["Добавить жира","Сбрызнуть водой из брызгалки","Оставить так"],e:"Шашлык жарят на углях, не на пламени."},uz:{q:"Mangalda yog'dan olov chiqdi. Nima qilish kerak?",o:["Yana yog' qo'shish","Purkagichdan suv sepish","Shunday qoldirish"],e:"Kabob olovda emas, cho'g'da pishiriladi."}}]},

 table:{head:{ru:["На 1 кг риса","Сколько"],uz:["1 kg guruchga","Qancha"]},rows:{
  ru:[["Мясо (баранина или говядина)","1 кг"],["Морковь жёлтая и красная","1 кг"],["Лук","200–300 г (2–3 шт.)"],["Масло (хлопковое) или курдюк","250–300 мл"],["Соль","1,5–2 ст. ложки (по вкусу)"],["Зира, барбарис","1 ст. ложка зиры, 1 ч. ложка барбариса"],["Чеснок, нут (по желанию)","2 головки, 200 г замоченного нута"],["Порций","6–7 (по 150 г сухого риса)"]],
  uz:[["Go'sht (qo'y yoki mol)","1 kg"],["Sariq va qizil sabzi","1 kg"],["Piyoz","200–300 g (2–3 dona)"],["Yog' (paxta) yoki dumba","250–300 ml"],["Tuz","1,5–2 osh qoshiq (ta'bga ko'ra)"],["Zira, zirk","1 osh qoshiq zira, 1 choy qoshiq zirk"],["Sarimsoq, no'xat (xohishga)","2 bosh, 200 g ivitilgan no'xat"],["Porsiya","6–7 (150 g quruq guruchdan)"]]}},
 steps:{ru:["Рис (девзира, лазер) промыть 5–7 раз до прозрачной воды и замочить в тёплой подсоленной воде на 1 час.","Масло в казане раскалить до лёгкого дымка. Обжарить мясо до корочки, потом лук до золотистого цвета.","Добавить морковь, не мешать 2–3 минуты, затем жарить до мягкости. Залить горячей водой, положить зиру, соль, нут — это <b>зирвак</b>. Томить 40–60 минут.","Зирвак попробовать: он должен быть чуть пересолен — рис заберёт соль.","Рис слить, выложить ровным слоем, <b>не мешать</b>. Залить водой через шумовку на 1,5–2 см выше риса. Огонь сильный.","Когда вода ушла в рис, собрать рис горкой, сделать шумовкой дырки до дна, вложить чеснок. Закрыть крышкой, огонь самый слабый, 20–30 минут."],
       uz:["Guruchni (devzira, lazer) suv tiniq bo'lguncha 5–7 marta yuving va iliq tuzli suvda 1 soat iviting.","Qozonda yog'ni yengil tutun chiqquncha qizdiring. Go'shtni qobiq hosil bo'lguncha, keyin piyozni oltin rangga qadar qovuring.","Sabzini soling, 2–3 daqiqa aralashtirmang, keyin yumshaguncha qovuring. Issiq suv quying, zira, tuz, no'xat soling — bu <b>zirvak</b>. 40–60 daqiqa dimlang.","Zirvakni tatib ko'ring: u biroz sho'rroq bo'lishi kerak — guruch tuzni oladi.","Guruch suvini to'kib, tekis qatlam qilib yoying, <b>aralashtirmang</b>. Kapgir orqali guruchdan 1,5–2 sm yuqori suv quying. Olov kuchli.","Suv guruchga singgach, guruchni tepalik qilib to'plang, kapgir bilan tubigacha teshiklar qiling, sarimsoq soling. Qopqoqni yoping, olov eng past, 20–30 daqiqa."]},
 tip:{ru:"Главные ошибки: тёртая морковь, мешать рис после закладки и мало масла. Плов на свадьбу на 100 человек — это примерно 15 кг риса (по 150 г на гостя).",uz:"Asosiy xatolar: qirilgan sabzi, guruch solingandan keyin aralashtirish va yog' kam. 100 kishilik to'y oshi — taxminan 15 kg guruch (har mehmonga 150 g)."},
 quiz:[
  {a:1,ru:{q:"Что такое зирвак?",o:["Сорт риса","Основа плова: мясо, лук, морковь и специи в бульоне","Соус к шашлыку"],e:"Зирвак томят до закладки риса."},uz:{q:"Zirvak nima?",o:["Guruch navi","Osh asosi: sho'rvadagi go'sht, piyoz, sabzi va ziravorlar","Kabob sousi"],e:"Zirvak guruch solinishidan oldin dimlanadi."}},
  {a:0,ru:{q:"Насколько выше риса наливают воду?",o:["На 1,5–2 см","На 10 см","Вода ниже риса"],e:"Девзира впитывает много, но лишняя вода сделает кашу."},uz:{q:"Suv guruchdan qancha yuqori quyiladi?",o:["1,5–2 sm","10 sm","Suv guruchdan past"],e:"Devzira ko'p shimadi, lekin ortiqcha suv bo'tqa qiladi."}},
  {a:2,ru:{q:"Сколько моркови на 1 кг риса в классике?",o:["200 г","500 г","1 кг"],e:"Классическая пропорция 1 : 1 : 1."},uz:{q:"Klassikada 1 kg guruchga qancha sabzi?",o:["200 g","500 g","1 kg"],e:"Klassik nisbat 1 : 1 : 1."}},
  {a:1,ru:{q:"Почему зирвак делают чуть пересоленным?",o:["Так дольше хранится","Рис потом заберёт соль","Чтобы пить воду"],e:"Без этого плов получится пресным."},uz:{q:"Nega zirvak biroz sho'rroq qilinadi?",o:["Shunday uzoq saqlanadi","Keyin guruch tuzni oladi","Suv ichish uchun"],e:"Busiz osh chuchuk chiqadi."}}]},

 table:{head:{ru:["Тесто на 1 кг муки","Состав"],uz:["1 kg unga xamir","Tarkibi"]},rows:{
  ru:[["Лагман (тянутый)","Вода 450–500 мл, соль 1 ч. л., шор (сода) ½ ч. л. в воде для смазки"],["Манты, чучвара","Вода 400–450 мл, яйцо 1 шт., соль 1 ч. л."],["Самса слоёная","Вода 450–500 мл, соль 1 ч. л., масло или маргарин для слоёв 150–200 г"],["Начинка для мантов/самсы","Мясо 1 кг, лук 0,7–1 кг, курдюк 200–300 г, зира, перец, соль ~20 г"]],
  uz:[["Lag'mon (cho'zma)","Suv 450–500 ml, tuz 1 choy q., surtish uchun suvda ½ choy q. shor (soda)"],["Manti, chuchvara","Suv 400–450 ml, tuxum 1 dona, tuz 1 choy q."],["Qatlamli somsa","Suv 450–500 ml, tuz 1 choy q., qatlamlar uchun 150–200 g yog' yoki margarin"],["Manti/somsa ichligi","Go'sht 1 kg, piyoz 0,7–1 kg, dumba 200–300 g, zira, murch, tuz ~20 g"]]}},
 steps:{ru:["Воду вливают в муку постепенно: мука разная, иногда нужно на 50 мл меньше или больше.","Тесто месят 10–15 минут до гладкости и оставляют «отдохнуть» под плёнкой 20–40 минут. Отдохнувшее тесто легче раскатать и не рвётся.","<b>Лагман:</b> тесто смазывают раствором шора и маслом, делят на жгуты, тянут и бьют о стол. Варят в подсоленной воде 2–3 минуты.","<b>Манты:</b> мясо и лук режут ножом мелким кубиком (не через мясорубку), курдюк — отдельно. Готовят на пару в мантоварке 40–45 минут.","<b>Самса:</b> тесто тонко раскатывают, смазывают маслом, сворачивают рулетом и режут на кружки. Тандыр или духовка 200–220 °C, 20–30 минут.","Сырой фарш и готовую выпечку на одном столе не держат."],
       uz:["Suv unga asta-sekin quyiladi: un har xil, ba'zan 50 ml kam yoki ko'p kerak.","Xamir silliq bo'lguncha 10–15 daqiqa qoriladi va plyonka ostida 20–40 daqiqa «dam olishga» qo'yiladi. Dam olgan xamir oson yoyiladi va yirtilmaydi.","<b>Lag'mon:</b> xamirga shor eritmasi va yog' surtiladi, arqonchalarga bo'linadi, cho'ziladi va stolga uriladi. Tuzli suvda 2–3 daqiqa qaynatiladi.","<b>Manti:</b> go'sht va piyoz pichoqda mayda kubik qilib to'g'raladi (go'sht maydalagichdan emas), dumba — alohida. Mantiqasqonda bug'da 40–45 daqiqa pishiriladi.","<b>Somsa:</b> xamir yupqa yoyiladi, yog' surtiladi, rulet qilib o'raladi va doirachalarga kesiladi. Tandir yoki duxovka 200–220 °C, 20–30 daqiqa.","Xom qiyma va tayyor pishiriqni bitta stolda saqlamang."]},
 tip:{ru:"Лук в начинке даёт сок — не жалейте его. Сухие манты чаще всего от того, что лука было мало или фарш прокрутили на мясорубке.",uz:"Ichlikdagi piyoz suv beradi — ayamang. Quruq manti ko'pincha piyoz kam bo'lgani yoki qiyma go'sht maydalagichdan o'tkazilganidan."},
 quiz:[
  {a:1,ru:{q:"Зачем тесту «отдыхать» 20–40 минут?",o:["Чтобы остыло","Чтобы легче раскатывалось и не рвалось","Чтобы подсохло"],e:"Клейковина расслабляется."},uz:{q:"Nega xamir 20–40 daqiqa «dam oladi»?",o:["Sovishi uchun","Oson yoyilishi va yirtilmasligi uchun","Qurishi uchun"],e:"Kleykovina bo'shashadi."}},
  {a:0,ru:{q:"Сколько готовят манты на пару?",o:["40–45 минут","5 минут","2 часа"],e:"Сырой фарш внутри должен полностью дойти до 71 °C и выше."},uz:{q:"Manti bug'da qancha pishiriladi?",o:["40–45 daqiqa","5 daqiqa","2 soat"],e:"Ichidagi xom qiyma to'liq 71 °C va undan yuqori bo'lishi kerak."}},
  {a:2,ru:{q:"Что добавляют в тесто для лагмана, чтобы оно тянулось?",o:["Сахар","Дрожжи","Шор (раствор соды)"],e:"Шор делает тесто эластичным."},uz:{q:"Lag'mon xamiri cho'zilishi uchun nima qo'shiladi?",o:["Shakar","Xamirturush","Shor (soda eritmasi)"],e:"Shor xamirni elastik qiladi."}},
  {a:1,ru:{q:"Почему манты получились сухими?",o:["Много лука","Мало лука или фарш через мясорубку","Много курдюка"],e:"Лук и рубленое мясо дают сок."},uz:{q:"Nega manti quruq chiqdi?",o:["Piyoz ko'p","Piyoz kam yoki qiyma go'sht maydalagichdan","Dumba ko'p"],e:"Piyoz va to'g'ralgan go'sht suv beradi."}}]},

 steps:{ru:["<b>Техкарта</b> — документ на каждое блюдо: продукты брутто и нетто, как готовить, выход порции, подача.","По техкарте блюдо всегда одинаковое, кто бы ни готовил. И по ней же считают себестоимость.","Чтобы получить 100 г готового мяса, нужно примерно 160 г сырого нетто (ужарка 38 %).","Выход порции записывают через дробь: например, лагман 350/100 — 350 г лапши с соусом и 100 г мяса.","Проверяйте техкарту контрольной проработкой: приготовьте, взвесьте всё на каждом этапе, поправьте цифры.","Калькулятор в приложении считает брутто, нетто и выход по вашим процентам."],
       uz:["<b>Texnologik karta</b> — har bir taom uchun hujjat: brutto va netto mahsulotlar, qanday tayyorlash, porsiya chiqishi, tortish.","Texnologik karta bo'yicha taom kim tayyorlamasin doim bir xil. Tannarx ham u bo'yicha hisoblanadi.","100 g tayyor go'sht olish uchun taxminan 160 g xom netto kerak (kamayish 38 %).","Porsiya chiqishi kasr bilan yoziladi: masalan, lag'mon 350/100 — 350 g sousli lag'mon va 100 g go'sht.","Texnologik kartani nazorat tayyorlash bilan tekshiring: tayyorlang, har bosqichda torting, raqamlarni to'g'rilang.","Ilovadagi kalkulyator foizlaringiz bo'yicha brutto, netto va chiqishni hisoblaydi."]},
 tip:{ru:"Без техкарты повар кладёт «на глаз», а кафе теряет 10–20 % продуктов незаметно для себя.",uz:"Texnologik kartasiz oshpaz «ko'z bilan» soladi, kafe esa sezmasdan mahsulotlarning 10–20 % ini yo'qotadi."},

 steps:{ru:["<b>Себестоимость порции</b> = сумма (вес брутто каждого продукта × цена за кг) ÷ число порций. Не забывайте масло, соль, специи, хлеб к блюду.","<b>Фудкост</b> — какая доля цены уходит на продукты. Для кафе в Узбекистане обычно 25–35 %.","<b>Наценка</b> = (цена − себестоимость) ÷ себестоимость. Фудкост 30 % — это наценка примерно 233 %.","Пересчитывайте себестоимость, когда растут цены на мясо и масло — раз в месяц или чаще.","Дорогие по продуктам блюда (шашлык) уравновешивают дешёвыми (салаты, чай, выпечка).","Калькулятор в приложении считает себестоимость порции и цену при нужном фудкосте."],
       uz:["<b>Porsiya tannarxi</b> = (har bir mahsulot brutto vazni × kg narxi) yig'indisi ÷ porsiyalar soni. Yog', tuz, ziravor, taomga non ham unutmang.","<b>Fudkost</b> — narxning qancha qismi mahsulotga ketadi. O'zbekistondagi kafelar uchun odatda 25–35 %.","<b>Ustama</b> = (narx − tannarx) ÷ tannarx. 30 % fudkost — taxminan 233 % ustama.","Go'sht va yog' narxi oshganda tannarxni qayta hisoblang — oyda bir marta yoki tez-tez.","Mahsulot bo'yicha qimmat taomlar (kabob) arzonlari (salat, choy, pishiriq) bilan muvozanatlanadi.","Ilovadagi kalkulyator porsiya tannarxini va kerakli fudkostda narxni hisoblaydi."]},
 tip:{ru:"Если вы повар и хотите стать шефом — умейте считать себестоимость. Владельцу кафе это важнее нового рецепта.",uz:"Oshpaz bo'lsangiz va shef bo'lmoqchi bo'lsangiz — tannarxni hisoblashni o'rganing. Kafe egasi uchun bu yangi retseptdan muhimroq."},
 quiz:[
  {a:1,ru:{q:"Себестоимость 15 000 сум, нужен фудкост 30 %. Какая цена?",o:["19 500 сум","50 000 сум","45 000 сум"],e:"15 000 ÷ 0,30 = 50 000."},uz:{q:"Tannarx 15 000 so'm, fudkost 30 % kerak. Narx qancha?",o:["19 500 so'm","50 000 so'm","45 000 so'm"],e:"15 000 ÷ 0,30 = 50 000."}},
  {a:0,ru:{q:"Что такое фудкост?",o:["Доля продуктов в цене блюда","Зарплата повара","Налог"],e:"Себестоимость ÷ цена × 100 %."},uz:{q:"Fudkost nima?",o:["Taom narxidagi mahsulot ulushi","Oshpaz maoshi","Soliq"],e:"Tannarx ÷ narx × 100 %."}},
  {a:2,ru:{q:"Что нужно включить в себестоимость плова?",o:["Только мясо и рис","Мясо, рис и морковь","Все продукты, включая масло, специи, чеснок"],e:"Масло в плове — заметная часть себестоимости."},uz:{q:"Osh tannarxiga nimani kiritish kerak?",o:["Faqat go'sht va guruch","Go'sht, guruch va sabzi","Barcha mahsulotlar, yog', ziravor, sarimsoq bilan"],e:"Oshda yog' — tannarxning sezilarli qismi."}},
  {a:1,ru:{q:"Цены на мясо выросли на 20 %. Что сделать?",o:["Ничего","Пересчитать себестоимость и цены","Уменьшить порцию тайно"],e:"Пересчёт — регулярная работа шефа."},uz:{q:"Go'sht narxi 20 % oshdi. Nima qilish kerak?",o:["Hech narsa","Tannarx va narxlarni qayta hisoblash","Porsiyani yashirincha kamaytirish"],e:"Qayta hisoblash — shefning muntazam ishi."}}]},

 steps:{ru:["<b>Мизанплас</b> («всё на своём месте») — до заказов нарезано, отмерено, разложено по гастроёмкостям рядом с плитой.","Лист заготовок: сколько чего нужно на смену, исходя из продаж прошлых дней. Лишняя заготовка — это выброшенные деньги.","Маркировка на каждой ёмкости: название, дата и время, кто сделал, до какого времени использовать.","Сроки хранения заготовок берите из норм заведения и СанПиН, а не «на нюх».","Сырой и горячий цех разделены. Сырые продукты не носят через зону раздачи.","В конце смены передайте следующему повару: что осталось, что заканчивается, что сломалось."],
       uz:["<b>Mizanplas</b> («hamma narsa o'z joyida») — buyurtmalargacha to'g'ralgan, o'lchangan, plita yonida gastroyemkostlarga terilgan.","Tayyorlamalar varag'i: o'tgan kunlar savdosiga qarab smenaga nimadan qancha kerak. Ortiqcha tayyorlama — tashlangan pul.","Har bir idishda belgi: nomi, sana va vaqt, kim qilgan, qachongacha ishlatish.","Tayyorlamalarni saqlash muddatini «hid bilan» emas, muassasa me'yorlari va SanPiNdan oling.","Xom va issiq sex ajratilgan. Xom mahsulotlar tarqatish zonasi orqali olib o'tilmaydi.","Smena oxirida keyingi oshpazga topshiring: nima qoldi, nima tugayapti, nima buzildi."]},
 tip:{ru:"Хороший повар в час пик не бегает: всё уже нарезано и стоит под рукой. Скорость делается до открытия.",uz:"Yaxshi oshpaz qizg'in paytda yugurmaydi: hammasi to'g'ralgan va qo'l ostida. Tezlik ochilishdan oldin yaratiladi."},
 quiz:[
  {a:0,ru:{q:"Что такое мизанплас?",o:["Подготовка всего до начала заказов","Вид соуса","Уборка после смены"],e:"«Всё на своём месте»."},uz:{q:"Mizanplas nima?",o:["Buyurtmalar boshlanishidan oldin hammasini tayyorlash","Sous turi","Smenadan keyin tozalash"],e:"«Hamma narsa o'z joyida»."}},
  {a:2,ru:{q:"Что пишут на маркировке заготовки?",o:["Только название","Цену","Название, дату и время, срок, кто сделал"],e:"Так видно, что использовать первым и что выбросить."},uz:{q:"Tayyorlama belgisiga nima yoziladi?",o:["Faqat nomi","Narxi","Nomi, sana va vaqt, muddat, kim qilgan"],e:"Shunda nimani birinchi ishlatish va nimani tashlash ko'rinadi."}},
  {a:1,ru:{q:"Как правильно идёт поток продуктов на кухне?",o:["Как удобно","В одну сторону: от сырого к готовому","Сырое через раздачу"],e:"Сырое не пересекается с готовым."},uz:{q:"Oshxonada mahsulot oqimi qanday to'g'ri yuradi?",o:["Qanday qulay bo'lsa","Bir tomonga: xomdan tayyorga","Xom tarqatish orqali"],e:"Xom tayyor bilan kesishmaydi."}},

 t:{ru:"Аллергены, журналы и проверки",uz:"Allergenlar, jurnallar va tekshiruvlar"},s:{ru:"Что спросит СЭС, как защитить гостя",uz:"SES nimani so'raydi, mehmonni qanday himoya qilish"},
 table:{head:{ru:["Аллерген","Где прячется"],uz:["Allergen","Qayerda yashirinadi"]},rows:{
  ru:[["Глютен (пшеница)","Тесто, лагман, панировка, соусы, загуститель"],["Орехи, арахис, кунжут","Выпечка, халва, посыпка на лепёшке, соусы"],["Молоко","Сливочное масло, каймак, сузьма, соусы"],["Яйца","Тесто для мантов, майонез, кляр"],["Рыба, креветки","Салаты, соусы"],["Соя, горчица, сельдерей","Соусы, маринады, приправы"]],
  uz:[["Glyuten (bug'doy)","Xamir, lag'mon, panirovka, souslar, quyultirgich"],["Yong'oq, yeryong'oq, kunjut","Pishiriq, holva, non ustidagi sepki, souslar"],["Sut","Sariyog', qaymoq, suzma, souslar"],["Tuxum","Manti xamiri, mayonez, klyar"],["Baliq, krevetka","Salatlar, souslar"],["Soya, xantal, selderey","Souslar, marinadlar, ziravorlar"]]}},
 steps:{ru:["Гость сказал «у меня аллергия» — передайте шефу и проверьте <b>все</b> ингредиенты, включая соусы и масло для жарки.","Для такого заказа — чистая доска, нож, сковорода и перчатки. Даже крошка ореха может вызвать тяжёлую реакцию.","Если не уверены, что в блюде нет аллергена, — честно скажите гостю. «Наверное, нет» — опасный ответ.","Журналы на кухне: температура холодильников (2 раза в день), бракеражный (проверка готовых блюд), здоровье сотрудников.","У каждого сотрудника — действующая медицинская книжка.","При проверке смотрят: маркировку и сроки, разделение сырого и готового, доски, чистоту, журналы, медкнижки."],
       uz:["Mehmon «menda allergiya bor» dedi — shefga yetkazing va <b>barcha</b> ingredientlarni, souslar va qovurish yog'i bilan birga tekshiring.","Bunday buyurtma uchun — toza taxta, pichoq, tova va qo'lqop. Hatto yong'oq ushog'i ham og'ir reaksiya chiqarishi mumkin.","Taomda allergen yo'qligiga ishonchingiz komil bo'lmasa — mehmonga rostini ayting. «Yo'q bo'lsa kerak» — xavfli javob.","Oshxonadagi jurnallar: muzlatgichlar harorati (kuniga 2 marta), brakeraj (tayyor taomlarni tekshirish), xodimlar salomatligi.","Har bir xodimda — amaldagi tibbiy daftarcha.","Tekshiruvda qaraladi: belgilash va muddatlar, xom va tayyorning ajratilishi, taxtalar, tozalik, jurnallar, tibbiy daftarchalar."]},
 tip:{ru:"Журналы заполняют каждый день, а не за неделю перед проверкой. Одинаковые цифры одной ручкой инспектор видит сразу.",uz:"Jurnallar tekshiruvdan bir hafta oldin emas, har kuni to'ldiriladi. Bitta ruchka bilan yozilgan bir xil raqamlarni inspektor darrov ko'radi."},
 quiz:[
  {a:1,ru:{q:"Гость с аллергией на орехи. Что главное?",o:["Убрать орехи сверху блюда","Проверить все ингредиенты и готовить на чистом инвентаре","Дать таблетку"],e:"Даже крошка может быть опасна."},uz:{q:"Mehmonda yong'oqqa allergiya. Asosiysi nima?",o:["Taom ustidagi yong'oqni olib tashlash","Barcha ingredientlarni tekshirib, toza jihozda tayyorlash","Dori berish"],e:"Hatto ushoq ham xavfli bo'lishi mumkin."}},
  {a:0,ru:{q:"Как часто записывают температуру холодильников?",o:["Каждый день, обычно 2 раза","Раз в месяц","Только перед проверкой"],e:"Журнал ведут ежедневно."},uz:{q:"Muzlatgichlar harorati qanchalik tez-tez yoziladi?",o:["Har kuni, odatda 2 marta","Oyda bir marta","Faqat tekshiruvdan oldin"],e:"Jurnal har kuni yuritiladi."}},
  {a:2,ru:{q:"Где может быть глютен?",o:["Только в хлебе","В мясе","В тесте, панировке и многих соусах"],e:"Мука часто прячется в соусах."},uz:{q:"Glyuten qayerda bo'lishi mumkin?",o:["Faqat nonda","Go'shtda","Xamir, panirovka va ko'p souslarda"],e:"Un ko'pincha souslarda yashirinadi."}},
  {a:1,ru:{q:"Вы не уверены, есть ли в соусе аллерген. Что ответить гостю?",o:["«Наверное, нет»","Честно сказать, что не уверены, и уточнить у шефа","Промолчать"],e:"Ошибка может стоить здоровья гостя."},uz:{q:"Sousda allergen borligiga ishonchingiz yo'q. Mehmonga nima deysiz?",o:["«Yo'q bo'lsa kerak»","Ishonchim yo'q deb rostini aytish va shefdan aniqlash","Indamaslik"],e:"Xato mehmon salomatligiga tushishi mumkin."}}]}

 cNote:'Narx 1 000 so\'mgacha yuqoriga yaxlitlangan. Barcha mahsulotlarni qo\'shing: yog\', ziravor, taomga non. Kafe uchun odatiy fudkost — 25–35 %.',
 reset:'Natijani tozalash',paid:'Pro versiyada mavjud'}};

// language is shared with the Kasb Pro hub and Электрик Pro (ep_lang); progress is ours (pv_)
const pk=k=>(k==='lang'?'ep_':'pv_')+k;
const store={get(k,d){try{const v=localStorage.getItem(pk(k));return v?JSON.parse(v):d}catch(e){return d}},set(k,v){try{localStorage.setItem(pk(k),JSON.stringify(v))}catch(e){}}};
let lang=store.get('lang','ru');
let done=new Set(store.get('done',[]));
let S={screen:'home',tab:0,id:null,qi:0,score:0,picked:null,calc:{ppl:10,pr:1,y:250,n:10,w:20,lo:35,cost:300000,cn:25,fc:30}};
const $=s=>document.querySelector(s);
const app=$('#app');
const U=()=>UI[lang];
const tr=o=>o&&(o[lang]??o.ru);
const tg=window.Telegram&&window.Telegram.WebApp;if(tg){try{tg.ready();tg.expand()}catch(e){}}

const byLv=lv=>LESSONS.filter(x=>x.lv===lv);
const isPaid=x=>PAYWALL&&x.lv>0;
function isOpen(x){if(isPaid(x))return false;const list=byLv(x.lv);const i=list.indexOf(x);return i===0||done.has(list[i-1].id)}
const need=n=>Math.ceil(n*0.75);

const bolt='<svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 14.5a4 4 0 0 1-.6-7.9A4.5 4.5 0 0 1 12 3.5a4.5 4.5 0 0 1 5.6 3.1A4 4 0 0 1 17 14.5V20H7z" fill="none" stroke="var(--accent-ink)" stroke-width="2" stroke-linejoin="round"/><path d="M7 17h10" stroke="var(--accent-ink)" stroke-width="2"/></svg>';
const lockI=()=>`<svg class="ic" width="18" height="18" viewBox="0 0 24 24" aria-label="${U().locked}"><rect x="5" y="11" width="14" height="10" rx="2" fill="none" stroke="currentColor" stroke-width="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3" fill="none" stroke="currentColor" stroke-width="2"/></svg>`;
const langSw=()=>`<div class="lang" role="group" aria-label="Til / Язык"><button type="button" data-l="ru" aria-pressed="${lang==='ru'}">RU</button><button type="button" data-l="uz" aria-pressed="${lang==='uz'}">UZ</button></div>`;
const swatch={};

function header(inner){return `<header class="bar">${inner}</header>`}
function tabs(){const L=U();return `<nav class="tabs" role="tablist">${L.tabs.map((t,i)=>`<button type="button" role="tab" aria-selected="${S.tab===i}" data-tab="${i}">${t}</button>`).join('')}</nav>`}

function home(){
  const L=U();const total=LESSONS.length;const d=LESSONS.filter(x=>done.has(x.id)).length;
  let h=header(`${window.KASB_HUB?`<a class="hub" href="${window.KASB_HUB}">‹ Kasb Pro</a>`:''}<div class="row"><div class="brand"><div class="logo">${bolt}</div><div><h1>${L.brand}</h1><p>${L.tag}</p></div></div>${langSw()}</div>`)+tabs();
  if(S.tab===1){app.innerHTML=h+`<main class="wrap">${calcBlock()}</main>`;bindCalc();return}
  h+=`<main class="wrap"><div class="progress"><div class="t"><span>${L.prog}</span><b>${L.of(d,total)}</b></div><div class="meter"><i style="width:${d/total*100}%"></i></div></div>`;
  [0,1,2].forEach(lv=>{
    const chip=lv===0||!PAYWALL?'':`<span class="chip pro">${L.pro}</span>`;
    h+=`<section class="level"><h2>${L.lv[lv]} ${lv===0&&PAYWALL?`<span class="chip free">${L.free}</span>`:chip}</h2><div class="list">`;
    byLv(lv).forEach((x,i)=>{
      const open=isOpen(x),isDone=done.has(x.id);
      const cls=isDone?'done open':open?'open':'locked';
      const right=isDone?`<span class="go" aria-label="${L.done}">✓</span>`:open?'<span class="go">›</span>':lockI();
      const sub=!open&&!isDone?(isPaid(x)?L.paid:tr(x.s)):tr(x.s);
      h+=open||isDone?`<button class="item ${cls}" type="button" data-id="${x.id}">`:`<div class="item ${cls}">`;
      h+=`<span class="n">${i+1}</span><span class="tx"><b>${tr(x.t)}</b><span>${sub}</span></span>${right}${open||isDone?'</button>':'</div>'}`;
    });
    h+='</div></section>';
  });
  h+=`<button class="link" id="reset" type="button">${L.reset}</button></main>`;
  app.innerHTML=h;
  document.querySelectorAll('[data-id]').forEach(b=>b.onclick=()=>{S.id=b.dataset.id;go('lesson')});
  const r=$('#reset');r.onclick=()=>{if(r.dataset.c){done=new Set();store.set('done',[]);render()}else{r.dataset.c=1;r.textContent=lang==='ru'?'Нажмите ещё раз, чтобы сбросить':'Tozalash uchun yana bosing'}};
}

function lesson(){
  const L=U();const x=LESSONS.find(y=>y.id===S.id);const list=byLv(x.lv);const n=list.indexOf(x)+1;
  let h=header(`<div class="row"><button class="back" id="back" type="button">${L.all}</button>${langSw()}</div><h1 class="ttl">${tr(x.t)}</h1><p>${L.lvl(L.lv[x.lv],n,x.min)}</p>`)+'<main class="wrap">';
  if(x.svg){h+=`<div class="card diagram"><div class="sv">${x.svg(lang)}</div>`;
    if(x.legend)h+=`<div class="legend">${x.legend.map(k=>`<span><i class="sw" style="background:${swatch[k]}"></i>${L.leg[k]}</span>`).join('')}</div>`;h+='</div>'}
  if(!x.nowarn)h+=`<div class="warn"><span aria-hidden="true">⚠</span><div><b>${x.warnB?tr(x.warnB):L.warnB}</b> ${x.warn?tr(x.warn):L.warn}</div></div>`;
  if(x.table){h+=`<div class="card tbl"><table><thead><tr>${tr(x.table.head).map(c=>`<th>${c}</th>`).join('')}</tr></thead><tbody>${tr(x.table.rows).map(r=>`<tr>${r.map(c=>`<td>${c}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`}
  h+=`<div class="card stack"><h3>${L.stepsT}</h3><ol class="steps">${tr(x.steps).map(s=>`<li><span>${s}</span></li>`).join('')}</ol><p class="tip"><b>${L.tipT}:</b> ${tr(x.tip)}</p></div>`;
  if(x.calc)h+=`<button class="btn ghost" id="calc" type="button">${L.openCalc}</button>`;
  h+=`<button class="btn" id="start" type="button">${L.start(x.quiz.length)}</button></main>`;
  app.innerHTML=h;
  $('#back').onclick=()=>go('home');
  $('#start').onclick=()=>{S.qi=0;S.score=0;S.picked=null;go('quiz')};
  const c=$('#calc');if(c)c.onclick=()=>{S.tab=1;go('home')};
}

function quiz(){
  const L=U();const x=LESSONS.find(y=>y.id===S.id);const QZ=x.quiz;const item=QZ[S.qi];const Q=tr(item);const p=S.picked;
  const opts=Q.o.map((o,i)=>{let c='opt';if(p!==null){if(i===item.a)c+=' right';else if(i===p)c+=' wrong'}return `<button class="${c}" data-i="${i}" type="button" ${p!==null?'disabled':''}>${o}</button>`}).join('');
  app.innerHTML=header(`<div class="row"><button class="back" id="back" type="button">${L.toL}</button>${langSw()}</div><h1 class="ttl">${L.qt}: ${tr(x.t)}</h1><p>${L.qsub(need(QZ.length),QZ.length)}</p>`)+`<main class="wrap">
   <div class="progress"><div class="q-top"><span>${L.qn(S.qi+1,QZ.length)}</span><span>${L.ok(S.score)}</span></div><div class="meter"><i style="width:${(S.qi+(p!==null?1:0))/QZ.length*100}%"></i></div></div>
   <p class="q">${Q.q}</p><div class="opts">${opts}</div>
   ${p!==null?`<p class="expl">${p===item.a?`<b class="okc">${L.right}</b> `:`<b class="badc">${L.wrong}</b> `}${Q.e}</p><button class="btn" id="next" type="button">${S.qi<QZ.length-1?L.next:L.res}</button>`:''}
  </main>`;
  $('#back').onclick=()=>go('lesson');
  document.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{S.picked=+b.dataset.i;if(S.picked===item.a)S.score++;render()});
  const n=$('#next');if(n)n.onclick=()=>{if(S.qi<QZ.length-1){S.qi++;S.picked=null;go('quiz')}else{const pass=S.score>=need(QZ.length);if(pass){done.add(x.id);store.set('done',[...done])}go('result')}};
}

function result(){
  const L=U();const x=LESSONS.find(y=>y.id===S.id);const n=x.quiz.length;const pass=S.score>=need(n);
  const list=byLv(x.lv);const nx=list[list.indexOf(x)+1];
  app.innerHTML=header(`<div class="row"><div><h1>${L.res}</h1><p>${tr(x.t)}</p></div>${langSw()}</div>`)+`<main class="wrap"><div class="card result">
   <div class="score">${S.score} / ${n}</div><h3>${pass?L.passT:L.failT}</h3>
   <p class="expl">${pass?(nx?L.passNext(tr(nx.t)):L.passLast):L.fail(need(n),n)}</p></div>
   ${pass&&nx?`<button class="btn" id="nextL" type="button">${L.nextL}</button>`:''}
   ${pass?'':`<button class="btn" id="retry" type="button">${L.retry}</button>`}
   <button class="btn ghost" id="home" type="button">${L.home}</button></main>`;
  $('#home').onclick=()=>go('home');
  const r=$('#retry');if(r)r.onclick=()=>{S.qi=0;S.score=0;S.picked=null;go('quiz')};
  const nl=$('#nextL');if(nl)nl.onclick=()=>{S.id=nx.id;go('lesson')};
}

/* calculators: plov for N people, how much to buy (brutto from yield), portion cost and price */
const fmt=(n,d=0)=>n.toFixed(d).replace('.',',').replace('-','−');
const big=n=>Math.round(n).toLocaleString('ru-RU').replace(/ /g,' ');
const numv=v=>+String(v).replace(',','.')||0;
const seg=(k,opts)=>`<div class="seg" role="group">${opts.map((o,i)=>`<button type="button" data-seg="${k}" data-v="${i}" aria-pressed="${S.calc[k]===i}">${o}</button>`).join('')}</div>`;
const fld=(id,lab,v,step=1)=>`<label class="fld" for="${id}">${lab}<input id="${id}" type="number" inputmode="decimal" min="0" step="${step}" value="${v}"></label>`;
const cell=(t,v)=>`<div><span>${t}</span><b>${v}</b></div>`;
function calcBlock(){const L=U();const c=S.calc;
  return `<div class="card stack"><div><h3>${L.pT}</h3><p class="expl">${L.pSub}</p></div>
  <div class="pair">${fld('cp1',L.ppl,c.ppl)}<div class="fld">${L.pr}${seg('pr',L.prO)}</div></div>
  <div class="out" id="out1"></div><p class="expl" id="pn"></p></div>
  <div class="card stack"><div><h3>${L.yT}</h3><p class="expl">${L.ySub}</p></div>
  <div class="pair">${fld('cy',L.y,c.y,10)}${fld('cn1',L.n,c.n)}</div>
  <div class="pair">${fld('cw',L.w,c.w)}${fld('clo',L.lo,c.lo)}</div>
  <div class="out" id="out2"></div><p class="expl">${L.yNote}</p></div>
  <div class="card stack"><div><h3>${L.cT}</h3><p class="expl">${L.cSub}</p></div>
  <div class="pair">${fld('cc',L.cost,c.cost,1000)}${fld('ccn',L.cn,c.cn)}</div>
  <div class="pair">${fld('cfc',L.fc,c.fc)}<div></div></div>
  <div class="out" id="out3"></div><p class="expl" id="cv"></p><p class="expl">${L.cNote}</p></div>`}
const kgf=(g,L)=>g>=1000?`${fmt(g/1000,g>=10000?1:2)} ${L.kg}`:`${fmt(Math.round(g/10)*10)} ${L.g}`;
function paintCalc(){const L=U();const c=S.calc;const ru=lang==='ru';
  // plov: rice per person 120/150/200 g dry
  const p=Math.max(0,numv(c.ppl));const r=p*[120,150,200][c.pr];const k=r/1000;
  $('#out1').innerHTML=cell(L.rice,kgf(r,L))+cell(L.meat,kgf(r,L))+cell(L.carrot,kgf(r,L))+cell(L.onion,kgf(r*0.25,L))+cell(L.oil,`${fmt(k*0.28,k*0.28<1?2:1)} ${L.l}`)+cell(L.salt,kgf(k*35,L))+cell(L.zira,kgf(k*8,L))+cell(L.garlic,`${fmt(Math.max(1,Math.round(k*2)))} ${L.heads}`)+cell(L.chick,kgf(r*0.2,L));
  $('#pn').textContent=r>0?L.pNote(fmt(Math.max(4,Math.ceil(k*8/2)*2))):'';
  // yield → netto → brutto
  const y=Math.max(0,numv(c.y))*Math.max(0,numv(c.n));const w=Math.min(95,Math.max(0,numv(c.w)))/100;const lo=Math.min(95,Math.max(0,numv(c.lo)))/100;
  const net=y/(1-lo),bru=net/(1-w);
  $('#out2').innerHTML=cell(L.ready,kgf(y,L))+cell(L.net,kgf(net,L))+cell(L.bru,kgf(bru,L));
  // cost and price
  const cost=Math.max(0,numv(c.cost)),n=Math.max(0,numv(c.cn)),fc=Math.min(100,Math.max(0,numv(c.fc)));
  const cp=n>0?cost/n:0;const price=fc>0?Math.ceil(cp/(fc/100)/1000)*1000:0;const mk=cp>0&&price>0?(price-cp)/cp*100:0;
  $('#out3').innerHTML=cell(L.cp,n>0?big(cp):'—')+cell(L.price,price?big(price):'—')+cell(L.mk,price&&cp?fmt(mk)+' %':'—');
  const v=$('#cv');
  if(cp>0&&price>0){v.textContent=fc>40?(ru?'Фудкост выше 40 % — кафе почти не зарабатывает на этом блюде. Проверьте порцию или цену.':'Fudkost 40 % dan yuqori — kafe bu taomdan deyarli daromad olmaydi. Porsiya yoki narxni tekshiring.'):fc<20?(ru?'Фудкост ниже 20 % — цена может оказаться высокой для гостя. Сравните с соседними кафе.':'Fudkost 20 % dan past — narx mehmon uchun baland bo\'lishi mumkin. Qo\'shni kafelar bilan solishtiring.'):(ru?`Продавайте порцию примерно за ${big(price)} сум.`:`Porsiyani taxminan ${big(price)} so'mga soting.`);v.className='expl '+(fc>40||fc<20?'badc':'okc')}else v.textContent='';
}
function bindCalc(){
  const on=(id,k)=>{$(id).oninput=e=>{S.calc[k]=e.target.value;paintCalc()}};
  on('#cp1','ppl');on('#cy','y');on('#cn1','n');on('#cw','w');on('#clo','lo');on('#cc','cost');on('#ccn','cn');on('#cfc','fc');
  document.querySelectorAll('[data-seg]').forEach(b=>b.onclick=()=>{const k=b.dataset.seg;S.calc[k]=+b.dataset.v;
    document.querySelectorAll(`[data-seg="${k}"]`).forEach(x=>x.setAttribute('aria-pressed',x===b));paintCalc()});
  paintCalc()}

function bindCommon(){
  document.querySelectorAll('.lang button').forEach(b=>b.onclick=()=>{lang=b.dataset.l;store.set('lang',lang);document.documentElement.lang=lang;render()});
  document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{S.tab=+b.dataset.tab;render()});
}
function render(){({home,lesson,quiz,result})[S.screen]();bindCommon()}
function go(s){S.screen=s;render();window.scrollTo(0,0)}
document.documentElement.lang=lang;
go('home');

</script>
</body>
</html>

scene(G){
  const P=G.panel,mods=P.src.filter(t=>t.m),n=mods.length;let s='';
  const frame=`<rect x="2" y="2" width="336" height="176" rx="12" fill="var(--box)"/><rect x="10" y="10" width="320" height="160" rx="8" fill="var(--plate)"/>`;
  const amps=P.kind==='pipe'?'TIG':P.thin?'60A':'150A';
  const inv=`<rect x="250" y="18" width="70" height="40" rx="6" fill="#2b333c"/><rect x="258" y="25" width="38" height="18" rx="2" fill="#0d1a10"/><text x="277" y="38.5" font-size="11" font-family="monospace" fill="#ffb347" text-anchor="middle">${amps}</text><circle cx="307" cy="34" r="7" fill="var(--accent)"/><path d="M307 34l3-4" stroke="#2b333c" stroke-width="2"/><rect x="258" y="47" width="54" height="5" rx="2" fill="#444f5a"/>`;
  const bead=(d,placed,cur,hot,i)=>placed?`<path${hot?' class="hot"':''} d="${d}" fill="none" stroke="#5f6a74" stroke-width="9" stroke-linecap="round"/><path d="${d}" fill="none" stroke="#d7dce1" stroke-width="2.5" stroke-dasharray="2 4"/>`
    :`<path${cur?' class="slot"':''} d="${d}" fill="none" stroke="${cur?'var(--accent)':'var(--rail)'}" stroke-width="${cur?3:1.5}" stroke-dasharray="4 4"/>`;
  if(P.kind==='pipe'){const cx=150,cy=96,r=58;
    s+=`<circle cx="${cx}" cy="${cy}" r="${r+12}" fill="#a7b0b9"/><circle cx="${cx}" cy="${cy}" r="${r-12}" fill="var(--plate)"/><circle cx="${cx}" cy="${cy}" r="${r-12}" fill="none" stroke="#7d8790" stroke-width="2"/>`;
    mods.forEach((t,i)=>{const a0=Math.PI/2+i*2*Math.PI/n+0.06,a1=Math.PI/2+(i+1)*2*Math.PI/n-0.06;
      const p=a=>`${(cx+r*Math.cos(a)).toFixed(1)} ${(cy+r*Math.sin(a)).toFixed(1)}`;
      s+=bead(`M${p(a0)}A${r} ${r} 0 0 1 ${p(a1)}`,G.placed.includes(t),t===G.task&&!G.complete,t===G.justPlaced,i)});
    s+=`<text x="${cx}" y="${cy+4}" font-size="11" text-anchor="middle" fill="var(--muted)">${G.placed.length}/${n}</text>`}
  else{const y=106,x0=24,x1=316,w=(x1-x0)/n,th=P.thin?10:22;
    s+=`<rect x="${x0-6}" y="${y-th-26}" width="${x1-x0+12}" height="26" fill="#a7b0b9" stroke="#7d8790"/><rect x="${x0-6}" y="${y+4}" width="${x1-x0+12}" height="${th+16}" fill="#9aa3ad" stroke="#7d8790"/>`;
    mods.forEach((t,i)=>s+=bead(`M${(x0+i*w+4).toFixed(1)} ${y}H${(x0+(i+1)*w-4).toFixed(1)}`,G.placed.includes(t),t===G.task&&!G.complete,t===G.justPlaced,i));
    s+=`<text x="${x0}" y="${y+th+40}" font-size="10" fill="var(--muted)">${P.thin?(lang==='uz'?'profil 2 mm':'профиль 2 мм'):(lang==='uz'?'metall 8 mm':'металл 8 мм')}</text>`}
  const spark=G.complete?'':`<g fill="#ffd75e">${[0,1,2,3,4].map(k=>`<circle cx="${236+k*6}" cy="${150-k*5}" r="1.6"/>`).join('')}</g>`;
  return `<svg viewBox="0 0 340 180" role="img" aria-label="${tr(P.name)}">${frame}${s}${inv}${spark}</svg>`}
};


const U=()=>CFG.UI[lang];
const PANELS=CFG.PANELS;

/* ---------- game state ---------- */
let G=null,timer=null;
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
const NP=PANELS.length,ORDER=[...Array(NP).keys()];
function newGame(){
  G={score:0,lives:3,combo:0,t:GAME_TIME,right:0,total:0,panels:0,pn:0,order:shuffle(ORDER),busy:false};
  loadPanel();render();
  clearInterval(timer);let last=Date.now();
  timer=setInterval(()=>{const now=Date.now(),dt=(now-last)/1000;last=now;if(G.busy||document.hidden)return;
    G.t-=dt;if(G.t<=0){G.t=0;end('time')}else paintTime()},200)}
function loadPanel(){
  if(G.pn>0&&G.pn%NP===0)G.order=shuffle(ORDER);
  const P=PANELS[G.order[G.pn%NP]];
  G.panel={name:P.name,kind:P.kind,src:P.tasks,tasks:shuffle(P.tasks)};G.ti=0;G.complete=false;G.placed=[];G.justPlaced=null;nextTask(true)}
function nextTask(first){
  if(!first)G.ti++;
  if(G.ti>=G.panel.tasks.length){G.complete=true;G.panels++;G.score+=300;toast(U().built);haptic('success');G.pn++;G.busy=true;
    render();setTimeout(()=>{if(!G||G.over)return;G.busy=false;loadPanel();render()},1300);return}
  G.task=G.panel.tasks[G.ti];
  G.opts=shuffle(G.task.o.map((o,i)=>({o,ok:i===0})));G.shown=Date.now()}

/* ---------- screens ---------- */
const app=document.getElementById('app');
const $=s=>document.querySelector(s);
function bar(){const L=U();return `<header class="bar"><a href="../">${L.back}</a><div class="ttl">${CFG.icon} ${L.title}</div><div class="lang" role="group" aria-label="Til"><button type="button" data-l="ru" aria-pressed="${lang==='ru'}">RU</button><button type="button" data-l="uz" aria-pressed="${lang==='uz'}">UZ</button></div></header>`}
function bindBar(){document.querySelectorAll('[data-l]').forEach(b=>b.onclick=()=>{lang=b.dataset.l;store.set('ep_lang',JSON.stringify(lang));document.documentElement.lang=lang;render()})}
let screen='start',result=null;
function render(){document.documentElement.lang=lang;
  if(screen==='start')startScr();else if(screen==='game')gameScr();else endScr();bindBar()}
function startScr(){const L=U();const best=+store.get(CFG.bestKey)||0;
  app.innerHTML=bar()+`<main class="wrap"><div class="hero">${CFG.mascot('ok')}</div><h1>${L.h1}</h1><p class="lead">${L.lead}</p>
  <div class="card"><ul class="rules">${L.r.map(r=>`<li><span>${r[0]}</span><div>${r[1]}</div></li>`).join('')}</ul></div>
  ${best?`<div class="best">${L.best}: <b>${best}</b></div>`:''}
  <button class="btn" id="play" type="button">${L.play}</button><p class="small">${L.safe}</p></main>`;
  $('#play').onclick=()=>{screen='game';newGame()}}
function gameScr(){const L=U();const t=G.task;
  const opts=G.opts.map((x,i)=>`<button class="opt" type="button" data-i="${i}"><span>${tr(x.o)}</span></button>`).join('');
  app.innerHTML=bar()+`<main class="wrap" id="gw">
  <div class="hud"><span class="sc" id="sc">${G.score}</span><span class="lv" aria-label="lives">${[0,1,2].map(i=>`<i class="${i<G.lives?'':'off'}">${CFG.life}</i>`).join('')}</span><span class="tm" id="tm"></span></div>
  <div class="tbar"><i id="tb"></i></div>
  <div class="pname"><span>${L.panel(G.complete?G.panels:G.panels+1,tr(G.panel.name))}</span>${G.combo>1?`<span class="combo">${L.combo(Math.min(G.combo,5))}</span>`:''}</div>
  <div class="panel">${CFG.scene(G)}</div>
  ${G.complete?'':`<p class="q">${tr(t.q)}</p><div class="opts">${opts}</div>`}</main>`;
  G.justPlaced=null;paintTime();
  document.querySelectorAll('[data-i]').forEach(b=>b.onclick=()=>answer(+b.dataset.i,b))}
function paintTime(){const tm=$('#tm'),tb=$('#tb');if(!tm)return;const s=Math.ceil(G.t);
  tm.textContent=`${Math.floor(s/60)}:${String(s%60).padStart(2,'0')}`;tm.classList.toggle('low',s<=15);
  tb.style.width=(G.t/GAME_TIME*100)+'%';tb.classList.toggle('low',s<=15)}
function answer(i,btn){if(G.busy)return;const x=G.opts[i],t=G.task;G.total++;
  if(x.ok){G.right++;G.combo++;const fast=(Date.now()-G.shown)<5000;
    const pts=100+25*Math.min(G.combo-1,4)+(fast?50:0);G.score+=pts;
    if(t.m){G.placed.push(t);G.justPlaced=t}
    btn.classList.add('right');floatTxt('+'+pts);haptic('light');G.busy=true;
    setTimeout(()=>{if(G.over)return;G.busy=false;nextTask();if(!G.complete)render()},380)}
  else{G.combo=0;G.lives--;G.busy=true;G.panel.tasks.push(t); // wrong task comes back later in this panel
    haptic('error');failFx(t)}}
function failFx(t){const L=U();const F=CFG.FX[t.fx]||CFG.FX[Object.keys(CFG.FX)[0]];
  const f=document.createElement('div');f.className='flash'+(F.strobe?' strobe':'');f.style.setProperty('--fc',F.color);document.body.appendChild(f);setTimeout(()=>f.remove(),1000);
  const gw=$('#gw');if(gw){gw.classList.add('shake')}
  const titles=F[lang]||F.ru;const title=titles[Math.random()*titles.length|0];
  const ov=document.createElement('div');ov.className='ov';
  ov.innerHTML=`<div class="sheet" role="alertdialog" aria-live="assertive"><div class="who">${CFG.mascot(F.mood)}<h2>${title}</h2></div>
  <p class="ans">${L.right} <b>${tr(t.o[0])}</b></p><p class="why">${tr(t.e)}</p><button class="btn" type="button" id="ovn">${L.next}</button></div>`;
  setTimeout(()=>{document.body.appendChild(ov);$('#ovn').focus()},350);
  ov.querySelector('#ovn').onclick=()=>{ov.remove();G.busy=false;if(G.lives<=0){end('lives');return}nextTask();if(!G.complete)render()}}
function floatTxt(s){const d=document.createElement('div');d.className='float';d.textContent=s;document.body.appendChild(d);setTimeout(()=>d.remove(),800)}
function toast(s){const d=document.createElement('div');d.className='toast';d.textContent=s;document.body.appendChild(d);setTimeout(()=>d.remove(),1200)}
function haptic(k){try{const h=tg&&tg.HapticFeedback;if(!h)return;if(k==='light')h.impactOccurred('light');else h.notificationOccurred(k)}catch(e){}}
function end(why){if(!G||G.over)return;G.over=true;clearInterval(timer);
  document.querySelectorAll('.ov').forEach(o=>o.remove());
  const prev=+store.get(CFG.bestKey)||0;const rec=G.score>prev;if(rec)store.set(CFG.bestKey,G.score);
  result={score:G.score,panels:G.panels,right:G.right,total:G.total,why,rec,best:Math.max(prev,G.score)};
  screen='end';render()}
function rankOf(s){return s<1200?0:s<2400?1:s<3600?2:3}
function endScr(){const L=U(),r=result;const acc=r.total?Math.round(r.right/r.total*100):0;
  app.innerHTML=bar()+`<main class="wrap"><div class="hero">${CFG.mascot(r.why==='lives'?CFG.FX[Object.keys(CFG.FX)[0]].mood:'ok')}</div>
  <h1>${r.why==='lives'?L.overLives:L.over}</h1>
  <div class="big">${r.score}</div><div class="center"><span class="rank">${L.ranks[rankOf(r.score)]}</span></div>
  ${r.rec&&r.score>0?`<p class="lead"><b>🏆 ${L.rec}</b></p>`:`<div class="best">${L.best}: <b>${r.best}</b></div>`}
  <div class="stats"><div><b>${r.score}</b><span>${L.score}</span></div><div><b>${r.panels}</b><span>${L.panels}</span></div><div><b>${acc}%</b><span>${L.acc}</span></div></div>
  <button class="btn tg" id="share" type="button">📤 ${L.share}</button>
  <button class="btn" id="again" type="button">${L.again}</button>
  <a class="btn ghost" href="../">📘 ${L.learn}</a></main>`;
  $('#again').onclick=()=>{screen='game';newGame()};
  $('#share').onclick=share}
function share(){const r=result;const url=`https://t.me/${BOT}?start=${CFG.start}`;
  const link=`https://t.me/share/url?url=${encodeURIComponent(url)}&text=${encodeURIComponent(U().shareText(r.score,r.panels))}`;
  try{if(tg&&tg.initData&&tg.openTelegramLink){tg.openTelegramLink(link);return}}catch(e){}
  window.open(link,'_blank','noopener')}
render();
</script>
</body>
</html>

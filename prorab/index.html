/* ===== Voice input (Web Speech API). Falls back to keyboard microphone. ===== */
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
let rec=null, recBtn=null;
function micBtn(id){return `<button type="button" class="mic" data-mic="${id}" aria-label="Сказать голосом"><svg width="20" height="20" viewBox="0 0 24 24"><rect x="9" y="3" width="6" height="11" rx="3" fill="currentColor"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></button>`}
function startMic(btn){
  const el=document.getElementById(btn.dataset.mic); if(!el)return;
  if(rec){rec.stop();return}
  if(!SR){toast('Нажмите значок микрофона на клавиатуре телефона');el.focus();return}
  try{
    rec=new SR(); rec.lang='ru-RU'; rec.interimResults=false; rec.continuous=false;
    recBtn=btn; btn.classList.add('on');
    rec.onresult=e=>{let t='';for(const r of e.results)t+=r[0].transcript;
      t=t.trim(); if(!t)return;
      if(el.tagName==='TEXTAREA'&&el.value.trim())el.value=el.value.replace(/\s*$/,'')+(/[.!?]$/.test(el.value.trim())?' ':'. ')+t.charAt(0).toUpperCase()+t.slice(1);
      else el.value=(el.value&&el.type!=='number'?el.value+' ':'')+t;
      el.dispatchEvent(new Event('input',{bubbles:true}))};
    rec.onerror=e=>{if(e.error==='not-allowed'||e.error==='service-not-allowed')toast('Нет доступа к микрофону. Нажмите микрофон на клавиатуре');else if(e.error==='no-speech')toast('Не расслышал, попробуйте ещё раз')};
    rec.onend=()=>{btn.classList.remove('on');rec=null};
    rec.start();
  }catch(e){btn.classList.remove('on');rec=null;toast('Нажмите значок микрофона на клавиатуре телефона');el.focus()}
}

  B.push({t:'gap'});
  B.push({t:'p',runs:[['Дата: ',1],[fdate(a.date)+' г.']]});
  B.push({t:'p',runs:[['Объекты: ',1],[or_(a.object,LINE)]]});
  B.push({t:'p',runs:[['Технический надзор: ',1],[or_(a.fromName,LINE)]]});
  (a.intro||'').split('\n').map(s=>s.trim()).filter(Boolean).forEach(s=>B.push({t:'p',ind:1,runs:[[s]]}));
  const items=a.items.filter(i=>(i.t||'').trim()||(i.x||'').trim());
  items.forEach((it,i)=>{B.push({t:'p',runs:[[(i+1)+'. '+(it.t||'').trim().toUpperCase(),1]],top:1});
    (it.x||'').split('\n').map(s=>s.trim()).filter(Boolean).forEach(s=>B.push({t:'p',ind:1,runs:[[s]]}))});
  if((a.concl||'').trim()){B.push({t:'p',runs:[[(items.length?(items.length+1)+'. ':'')+'ЗАКЛЮЧЕНИЕ ТЕХНИЧЕСКОГО НАДЗОРА',1]],top:1});
    a.concl.split('\n').map(s=>s.trim()).filter(Boolean).forEach(s=>B.push({t:'p',ind:1,runs:[[s]]}))}
  if((a.request||'').trim())B.push({t:'p',ind:1,runs:[[a.request.trim()]]});

  return B;
}

function actBlocks(a){
  if(a.type==='raport')return raportBlocks(a);

  B.push({t:'row',l:'г. '+or_(a.city,'__________'),r:fdate(a.date,true)});
  B.push({t:'p',runs:[['Объект: ',1],[or_(a.object,LINE)]]});
  if((a.address||'').trim())B.push({t:'p',runs:[['Адрес: ',1],[a.address.trim()]]});
  B.push({t:'p',runs:[['Заказчик: ',1],[or_(a.customer,LINE)]]});
  B.push({t:'p',runs:[[hid?'Лицо, осуществляющее строительство: ':'Подрядчик: ',1],[or_(a.contractor,LINE)]]});
  if(hid&&(a.subcontractor||'').trim())B.push({t:'p',runs:[['Лицо, выполнившее работы: ',1],[a.subcontractor.trim()]]});
  B.push({t:'p',runs:[['Комиссия в составе:',1]]});
  const mem=[[or_(a.custRepPos,'Представитель заказчика'),or_(a.custRep,LINE)],[or_(a.contrRepPos,'Представитель подрядчика'),or_(a.contrRep,LINE)]];
  mem.forEach(m=>B.push({t:'p',runs:[['— '+m[0]+': '],[m[1]]]}));
  (a.others||'').split('\n').map(s=>s.trim()).filter(Boolean).forEach(s=>B.push({t:'p',runs:[['— '+s]]}));
  B.push({t:'p',runs:[['произвела осмотр работ, выполненных '+or_(hid&&(a.subcontractor||'').trim()?a.subcontractor:a.contractor,'подрядчиком')+', и составила настоящий акт о нижеследующем:']]});
  let k=0; const num=()=>(++k)+'. ';
  const table=()=>works.length?{t:'table',head:['№','Наименование работ','Ед. изм.','Кол-во'],w:[22,'*',50,55],rows:works.map((w,i)=>[String(i+1),w.n.trim(),w.u,(w.q||'').trim()])}:null;
  if(hid){
    B.push({t:'p',runs:[[num()+'К освидетельствованию предъявлены следующие работы: ',1],[or_(a.hidden,works.length?'':LINE)]]});
    const tb=table(); if(tb)B.push(tb);
    B.push({t:'p',runs:[[num()+'Работы выполнены по проектной документации: ',1],[or_(a.project,LINE)]]});
    B.push({t:'p',runs:[[num()+'При выполнении работ применены: ',1],[or_(a.materials,LINE)]]});
    B.push({t:'p',runs:[[num()+'Предъявлены документы, подтверждающие соответствие работ: ',1],[docs.length?docs.join('; ')+'.':LINE]]});
    B.push({t:'p',runs:[[num()+'Даты: ',1],['начала работ — '+fdate(a.start)+', окончания работ — '+fdate(a.end)+'.']]});
    B.push({t:'p',runs:[[num()+'Работы выполнены в соответствии с: ',1],[[a.project?'проектной документацией':'',or_(a.norms,'')].filter(Boolean).join(', ')+'.']]});
    B.push({t:'p',runs:[[num()+'Разрешается производство последующих работ: ',1],[or_(a.next,LINE)]]});
    if((a.remarks||'').trim())B.push({t:'p',runs:[['Дополнительные сведения: ',1],[a.remarks.trim()]]});
  }else{
    B.push({t:'p',runs:[[num()+'К приёмке предъявлены следующие работы:',1]]});
    B.push(table()||{t:'p',runs:[[LINE+LINE]]});
    B.push({t:'p',runs:[[num()+'Работы выполнены по проекту (чертежам): ',1],[or_(a.project,'—')]]});
    B.push({t:'p',runs:[[num()+'Сроки выполнения работ: ',1],['начало — '+fdate(a.start)+', окончание — '+fdate(a.end)+'.']]});
    B.push({t:'p',runs:[[num()+'Применённые материалы: ',1],[or_(a.materials,'—')]]});
    B.push({t:'p',runs:[[num()+'Предъявлены документы: ',1],[docs.length?docs.join('; ')+'.':'—']]});
    B.push({t:'p',runs:[[num()+'Замечания: ',1],[or_(a.remarks,'замечаний нет.')]]});
    const dec={ok:'Работы выполнены в соответствии с проектом и требованиями '+or_(a.norms,'СНиП')+' и ПРИНИМАЮТСЯ.',
      fix:'Работы принимаются при условии устранения замечаний, указанных в п. '+k+', в срок до '+fdate(a.fixDate)+'.',
      no:'Работы НЕ ПРИНИМАЮТСЯ до устранения замечаний, указанных в п. '+k+'. После устранения работы предъявляются повторно.'}[a.decision];
    B.push({t:'p',runs:[['Решение комиссии: ',1],[dec]]});
  }
  B.push({t:'p',runs:[['Акт составлен в '+or_(a.copies,'2')+' экземплярах.'+(a.photos.length?' Приложение: фотофиксация, '+a.photos.length+' фото.':'')]]});
  B.push({t:'sign',title:hid?'Подписи членов комиссии:':'',rows:hid?
    [[or_(a.custRepPos,'Представитель заказчика'),a.custRep],[or_(a.contrRepPos,'Представитель подрядчика'),a.contrRep]]:
    [['Сдал: '+or_(a.contrRepPos,'представитель подрядчика'),a.contrRep],['Принял: '+or_(a.custRepPos,'представитель заказчика'),a.custRep]]});
  if((a.others||'').trim())B.push({t:'sign',rows:a.others.split('\n').map(s=>s.trim()).filter(Boolean).map(s=>[s,''])});
  if(a.photos.length)B.push({t:'photos',items:a.photos});
  return B;
}
function sigName(n){return '__________ / '+((n||'').trim()||'______________')+' /'}

function toHTML(B,withPhotos){
  return B.map(b=>{
    if(b.t==='h')return `<h4>${esc(b.text)}</h4>`;
    if(b.t==='gap')return '<p>&nbsp;</p>';
    if(b.t==='right')return `<p style="text-align:right;margin-left:40%">${b.lines.map(l=>b.bold?`<b>${esc(l)}</b>`:esc(l)).join('<br>')}</p>`;
    if(b.t==='c')return `<p class="c" style="text-align:center">${esc(b.text)}</p>`;
    if(b.t==='row')return `<div class="rw"><span>${esc(b.l)}</span><span>${esc(b.r)}</span></div>`;
    if(b.t==='p')return `<p${b.ind||b.top?` style="${b.ind?'text-indent:1.25cm;':''}${b.top?'margin-top:12px;':''}"`:''}>${b.runs.map(r=>r[1]?`<b>${esc(r[0])}</b>`:esc(r[0]).replace(/\n/g,'<br>')).join('')}</p>`;
    if(b.t==='table')return `<table><tr>${b.head.map(h=>`<th>${esc(h)}</th>`).join('')}</tr>${b.rows.map(r=>`<tr>${r.map((c,i)=>`<td${i!==1?' style="text-align:center"':''}>${esc(c)}</td>`).join('')}</tr>`).join('')}</table>`;
    if(b.t==='sign')return (b.title?`<p><b>${esc(b.title)}</b></p>`:'')+`<div class="sg">${b.rows.map(r=>`<span>${esc(r[0])}</span><span>${esc(sigName(r[1]))}</span>`).join('')}</div>`;
    if(b.t==='photos')return withPhotos?`<p style="margin-top:18px;text-align:center"><b>Приложение. Фотофиксация</b></p><div class="phs">${b.items.map((p,i)=>`<figure style="margin:0"><img src="${p.src}" alt=""><div>Фото ${i+1}${p.cap?'. '+esc(p.cap):''}</div></figure>`).join('')}</div>`:'';
    return '';
  }).join('');
}

/* ===== PDF (pdfmake with bundled Roboto: Cyrillic works) — loaded only when needed ===== */
function loadScript(src){return new Promise((ok,bad)=>{const s=document.createElement('script');s.src=src;s.onload=ok;s.onerror=bad;document.head.appendChild(s)})}
let pdfReady=null;
function ensurePdf(){if(window.pdfMake&&pdfMake.vfs)return Promise.resolve();
  pdfReady=pdfReady||loadScript('lib/pdfmake.min.js').then(()=>loadScript('lib/vfs_fonts.js'));
  return pdfReady.catch(e=>{pdfReady=null;throw e})}
function pdfDef(B){
  const content=[];
  B.forEach(b=>{
    if(b.t==='h')content.push({text:b.text,bold:true,alignment:'center',fontSize:13});
    else if(b.t==='gap')content.push({text:' ',margin:[0,4,0,4]});
    else if(b.t==='right')content.push({text:b.lines.join('\n'),bold:!!b.bold,alignment:'right',margin:[200,0,0,10]});
    else if(b.t==='c')content.push({text:b.text,alignment:'center',margin:[0,2,0,0]});
    else if(b.t==='row')content.push({columns:[{text:b.l},{text:b.r,alignment:'right'}],margin:[0,12,0,10]});
    else if(b.t==='p')content.push({text:b.runs.map(r=>({text:r[0],bold:!!r[1]})),leadingIndent:b.ind?28:0,margin:[0,b.top?8:0,0,5],alignment:'justify'});
    else if(b.t==='table')content.push({table:{headerRows:1,widths:b.w,body:[b.head.map(h=>({text:h,bold:true,alignment:'center',fillColor:'#eeeeee'}))].concat(b.rows.map(r=>r.map((c,i)=>({text:c,alignment:i===1?'left':'center'}))))},fontSize:10,margin:[0,2,0,8]});
    else if(b.t==='sign'){if(b.title)content.push({text:b.title,bold:true,margin:[0,8,0,2]});
      b.rows.forEach(r=>content.push({columns:[{text:r[0],width:'*'},{text:sigName(r[1]),width:'auto'}],margin:[0,10,0,0]}))}
    else if(b.t==='photos'){
      content.push({text:'Приложение к акту. Фотофиксация',bold:true,alignment:'center',pageBreak:'before',margin:[0,0,0,10]});
      const cells=b.items.map((p,i)=>({stack:[{image:p.src,fit:[240,180],alignment:'center'},{text:'Фото '+(i+1)+(p.cap?'. '+p.cap:''),fontSize:9,alignment:'center',margin:[0,3,0,10]}]}));
      const rows=[];for(let i=0;i<cells.length;i+=2)rows.push([cells[i],cells[i+1]||{text:''}]);
      content.push({table:{widths:['*','*'],body:rows,dontBreakRows:true},layout:'noBorders'});
    }
  });
  return {pageSize:'A4',pageMargins:[56,40,40,40],defaultStyle:{font:'Roboto',fontSize:11,lineHeight:1.15},content,
    footer:(p,n)=>n>1?{text:'стр. '+p+' из '+n,alignment:'right',fontSize:8,color:'#777',margin:[0,10,40,0]}:null,
    info:{title:docTitle(cur)}};
}
function fileName(a){return (a.type==='raport'?'Raport':a.type==='skrytye'?'Akt-skrytyh-rabot':'Akt-priemki')+'-'+String(a.num||'').replace(/[^\w.-]/g,'')+'_'+fdate(a.date)}
function docTitle(a){return (a.type==='raport'?'Рапорт':a.type==='skrytye'?'Акт скрытых работ':'Акт приёмки')+' № '+(a.num||'')+' '+fdate(a.date)}
function makePdfBlob(){return ensurePdf().then(()=>new Promise(ok=>pdfMake.createPdf(pdfDef(actBlocks(cur))).getBlob(ok)))}
function download(blob,name){const u=URL.createObjectURL(blob);const l=document.createElement('a');l.href=u;l.download=name;document.body.appendChild(l);l.click();l.remove();setTimeout(()=>URL.revokeObjectURL(u),60000)}
function wordBlob(){
  const html=`<html xmlns:o="urn:schemas-microsoft-com:office:office" xmlns:w="urn:schemas-microsoft-com:office:word" xmlns="http://www.w3.org/TR/REC-html40"><head><meta charset="utf-8"><title>${esc(docTitle(cur))}</title>
<!--[if gte mso 9]><xml><w:WordDocument><w:View>Print</w:View></w:WordDocument></xml><![endif]-->
<style>@page{size:21cm 29.7cm;margin:2cm 1.5cm 2cm 2.5cm}body{font-family:"Times New Roman";font-size:12pt}h4{text-align:center;margin:0;font-size:13pt}p{margin:0 0 5pt;text-align:justify}.rw{margin:10pt 0}table{border-collapse:collapse;width:100%}td,th{border:1px solid #000;padding:3pt 5pt;font-size:11pt}th{background:#eee}.sg td{border:0;padding:8pt 0 0}</style></head><body>${
    toHTML(actBlocks(cur),false).replace(/<div class="rw"><span>(.*?)<\/span><span>(.*?)<\/span><\/div>/,'<table class="sg" style="margin:10pt 0"><tr><td style="border:0">$1</td><td style="border:0;text-align:right">$2</td></tr></table>')
      .replace(/<div class="sg">(.*?)<\/div>/g,(m,inner)=>'<table class="sg">'+inner.replace(/<span>(.*?)<\/span><span>(.*?)<\/span>/g,'<tr><td>$1</td><td style="text-align:right">$2</td></tr>')+'</table>')
  }${cur.photos.length?'<p><i>Фотофиксация приложена к PDF-версии акта.</i></p>':''}</body></html>`;
  return new Blob(['﻿',html],{type:'application/msword'});
}

/* ===== Photos: compress to ~1280px JPEG so the act stays light ===== */
function addPhotos(files){
  [...files].forEach(f=>{
    const r=new FileReader();
    r.onload=()=>{const img=new Image();img.onload=()=>{
      const m=1280,s=Math.min(1,m/Math.max(img.width,img.height));const c=document.createElement('canvas');
      c.width=Math.round(img.width*s);c.height=Math.round(img.height*s);c.getContext('2d').drawImage(img,0,0,c.width,c.height);
      cur.photos.push({src:c.toDataURL('image/jpeg',.72),cap:''});autosave();draw(true)};img.src=r.result};
    r.readAsDataURL(f);
  });
}

/* ===== Transfer act to browser from Telegram (text only, via URL hash) ===== */
function b64(s){return btoa(unescape(encodeURIComponent(s))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'')}
function unb64(s){s=s.replace(/-/g,'+').replace(/_/g,'/');return decodeURIComponent(escape(atob(s)))}
function importFromHash(){
  const m=location.hash.match(/^#d=(.+)$/); if(!m)return;
  try{const a=JSON.parse(unb64(m[1]));if(a&&a.id&&TRADES[a.trade]){a.photos=a.photos||[];const i=acts.findIndex(x=>x.id===a.id);if(i<0)acts.unshift(a);else acts[i]=a;saveActs();cur=a;view='preview'}}catch(e){}
  try{history.replaceState(null,'',location.pathname)}catch(e){}
}

/* ===== Render + events ===== */
function draw(keepScroll){
  const y=window.scrollY;
  $('#app').innerHTML = view==='home'?renderHome():view==='form'?renderForm():renderPreview();
  window.scrollTo(0,keepScroll?y:0);
  if(tg){try{view==='home'?tg.BackButton.hide():tg.BackButton.show()}catch(e){}}
}
function go(v){ if(rec)rec.stop(); if(v!=='home'&&!cur)v='home'; view=v; if(v==='home')cur=null; draw(); }
if(tg){try{tg.BackButton.onClick(()=>go(view==='preview'?'form':'home'))}catch(e){}}

document.addEventListener('click',e=>{
  const t=e.target.closest('button,[data-open]'); if(!t)return;
  const d=t.dataset;
  if(d.mic){startMic(t);return}
  if(d.go){go(d.go);return}
  if(d.type){pick.type=d.type;draw(true);return}
  if(d.trade){cur=newAct(pick.type,d.trade);acts.unshift(cur);saveActs();go('form');return}
  if(d.open){cur=acts.find(a=>a.id===d.open);if(cur){cur.works=cur.works||[];cur.photos=cur.photos||[];go('preview')}return}
  if(d.copy){const s=acts.find(a=>a.id===d.copy);if(!s)return;const n=newAct(s.type,s.trade);
    ['city','object','address','customer','contractor','subcontractor','custRep','custRepPos','contrRep','contrRepPos','others','project','norms','copies','toPos','toOrg','toName','fromPos','fromName','intro','concl','request'].forEach(k=>n[k]=s[k]);
    cur=n;acts.unshift(n);saveActs();toast('Новый акт № '+n.num+' на тот же объект');go('form');return}
  if(d.del){const a=acts.find(x=>x.id===d.del);if(!a)return;
    if(t.dataset.confirm!=='1'){t.dataset.confirm='1';t.style.background='var(--bad)';t.style.color='#fff';toast('Нажмите ещё раз, чтобы удалить акт № '+a.num);setTimeout(()=>{t.dataset.confirm='';t.style.background='';t.style.color=''},3000);return}
    acts=acts.filter(x=>x.id!==d.del);saveActs();draw(true);return}
  if(!cur)return;
  if(d.ritem!=null){const it=rapItems(cur.trade)[+d.ritem];const j=cur.items.findIndex(x=>x.t===it[0]);
    if(j>=0)cur.items.splice(j,1);else cur.items.push({t:it[0],x:it[1]});autosave();draw(true);return}
  if(d.addri!=null){cur.items.push({t:'',x:''});autosave();draw(true);setTimeout(()=>{const el=$('#ri'+(cur.items.length-1));if(el)el.focus()},30);return}
  if(d.delri!=null){cur.items.splice(+d.delri,1);autosave();draw(true);return}
  if(d.work!=null){const w=TRADES[cur.trade].works[+d.work];cur.works.push({n:w[0],u:w[1],q:''});autosave();draw(true);
    setTimeout(()=>{const q=document.querySelector(`input[data-w="${cur.works.length-1}"][data-f="q"]`);if(q){q.focus();q.scrollIntoView({block:'center'})}},30);return}
  if(d.addwork!=null){cur.works.push({n:'',u:'м²',q:''});autosave();draw(true);setTimeout(()=>{const el=$('#w'+(cur.works.length-1));if(el)el.focus()},30);return}
  if(d.delw!=null){cur.works.splice(+d.delw,1);autosave();draw(true);return}
  if(d.hid!=null){const h=TRADES[cur.trade].hidden[+d.hid];cur.hidden=(cur.hidden||'').trim()?cur.hidden.trim().replace(/[.;]?$/,'; ')+h.charAt(0).toLowerCase()+h.slice(1):h;autosave();draw(true);return}
  if(d.doc!=null){const doc=TRADES[cur.trade].docs[+d.doc];const i=cur.docs.indexOf(doc);i<0?cur.docs.push(doc):cur.docs.splice(i,1);autosave();draw(true);return}
  if(d.dec){cur.decision=d.dec;autosave();draw(true);return}
  if(d.addph!=null){$('#phfile').click();return}
  if(d.delph!=null){cur.photos.splice(+d.delph,1);autosave();draw(true);return}
  if(d.pdf!=null){t.disabled=true;t.textContent='Готовлю…';
    makePdfBlob().then(b=>{download(b,fileName(cur)+'.pdf');toast('PDF сохранён в «Загрузки»')}).catch(()=>toast('Не удалось сделать PDF. Проверьте интернет')).finally(()=>{t.disabled=false;t.textContent='Скачать PDF'});return}
  if(d.word!=null){download(wordBlob(),fileName(cur)+'.doc');toast('Файл Word сохранён в «Загрузки»');return}
  if(d.share!=null){t.disabled=true;
    makePdfBlob().then(b=>{const f=new File([b],fileName(cur)+'.pdf',{type:'application/pdf'});
      if(navigator.canShare&&navigator.canShare({files:[f]}))return navigator.share({files:[f],title:docTitle(cur)});
      download(b,f.name)}).catch(err=>{if(err&&err.name!=='AbortError')toast('Не удалось отправить')}).finally(()=>t.disabled=false);return}
  if(d.browser!=null){const a=Object.assign({},cur,{photos:[]});const url=location.origin+location.pathname+'#d='+b64(JSON.stringify(a));
    try{tg.openLink(url)}catch(e){location.href=url}return}
});
document.addEventListener('input',e=>{
  const el=e.target; if(!cur)return;
  if(el.dataset.k){cur[el.dataset.k]=el.value;autosave();return}
  if(el.dataset.ri!=null){cur.items[+el.dataset.ri][el.dataset.f]=el.value;autosave();return}
  if(el.dataset.w!=null){cur.works[+el.dataset.w][el.dataset.f]=el.value;autosave();return}
  if(el.dataset.cap!=null){cur.photos[+el.dataset.cap].cap=el.value;autosave();return}
});
document.addEventListener('change',e=>{
  if(e.target.id==='phfile'){addPhotos(e.target.files);e.target.value='';return}
  const el=e.target; if(cur&&el.dataset.w!=null){cur.works[+el.dataset.w][el.dataset.f]=el.value;autosave()}
  if(cur&&el.dataset.k&&el.type==='date'){cur[el.dataset.k]=el.value;autosave()}
});

importFromHash();
window.addEventListener("hashchange",()=>{if(/^#d=/.test(location.hash)){importFromHash();draw()}});
draw();
</script>
<script src="../tg.js" defer></script>
</body>
</html>
